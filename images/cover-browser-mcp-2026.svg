<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a5a"/>
      <stop offset="1" stop-color="#2a1e4a"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>
  <rect width="900" height="4" fill="url(#topbar)"/>
  <rect y="379" width="900" height="4" fill="url(#topbar)"/>

  <!-- 左上角标签框 -->
  <rect x="40" y="34" width="260" height="30" rx="6" fill="#4f8cff" fill-opacity="0.12" stroke="#4f8cff" stroke-opacity="0.5"/>
  <text x="56" y="54" fill="#7dd3fc" font-size="14" font-weight="600">AI 行业观察 · 浏览器 MCP</text>

  <!-- 右上角年份徽章 -->
  <circle cx="838" cy="50" r="26" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.6"/>
  <text x="838" y="58" fill="#c4b5fd" font-size="22" font-weight="700" text-anchor="middle">26</text>

  <!-- 主标题 -->
  <text x="40" y="128" fill="#ffffff" font-size="30" font-weight="800">浏览器 MCP 元年</text>
  <!-- 副标题 -->
  <text x="40" y="162" fill="url(#sub)" font-size="18" font-weight="600">Safari 原生入场 · Chrome 开源领跑 · WebMCP 反向革命</text>

  <!-- 三行关键亮点 -->
  <text x="40" y="206" fill="#7dd3fc" font-size="13">▶ Safari MCP：17 工具 · 原生内置 · 本地隐私优先</text>
  <text x="40" y="230" fill="#c4b5fd" font-size="13">▶ Chrome DevTools MCP：开源领跑 · 覆盖 Chrome / Edge</text>
  <text x="40" y="254" fill="#86efac" font-size="13">▶ WebMCP：W3C 草案 · 让网站主动向 Agent 暴露能力</text>

  <!-- 标签栏 pills -->
  <g font-size="12">
    <rect x="40" y="286" width="66" height="26" rx="13" fill="none" stroke="#4f8cff" stroke-opacity="0.55"/>
    <text x="73" y="303" fill="#93c5fd" text-anchor="middle">MCP</text>
    <rect x="116" y="286" width="86" height="26" rx="13" fill="none" stroke="#a855f7" stroke-opacity="0.55"/>
    <text x="159" y="303" fill="#c4b5fd" text-anchor="middle">AI Agent</text>
    <rect x="212" y="286" width="72" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="248" y="303" fill="#7dd3fc" text-anchor="middle">浏览器</text>
    <rect x="294" y="286" width="86" height="26" rx="13" fill="none" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="337" y="303" fill="#86efac" text-anchor="middle">前端开发</text>
    <rect x="390" y="286" width="72" height="26" rx="13" fill="none" stroke="#fbbf24" stroke-opacity="0.55"/>
    <text x="426" y="303" fill="#fcd34d" text-anchor="middle">Safari</text>
  </g>

  <!-- 右侧概念示意图：浏览器窗口 + 工具连线 -->
  <g>
    <rect x="600" y="120" width="250" height="150" rx="10" fill="url(#win)" stroke="#4f8cff" stroke-opacity="0.35"/>
    <rect x="600" y="120" width="250" height="26" rx="10" fill="#4f8cff" fill-opacity="0.15"/>
    <circle cx="616" cy="133" r="4" fill="#ff5f57"/>
    <circle cx="630" cy="133" r="4" fill="#febc2e"/>
    <circle cx="644" cy="133" r="4" fill="#28c840"/>
    <rect x="662" y="127" width="160" height="12" rx="6" fill="#ffffff" fill-opacity="0.08"/>
    <!-- DOM / console lines -->
    <rect x="616" y="162" width="120" height="7" rx="3" fill="#7dd3fc" fill-opacity="0.7"/>
    <rect x="616" y="178" width="180" height="7" rx="3" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="616" y="194" width="150" height="7" rx="3" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="616" y="210" width="90" height="7" rx="3" fill="#86efac" fill-opacity="0.7"/>
    <rect x="616" y="226" width="130" height="7" rx="3" fill="#c4b5fd" fill-opacity="0.6"/>
    <!-- agent node -->
    <circle cx="560" cy="195" r="22" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.7"/>
    <text x="560" y="200" fill="#c4b5fd" font-size="16" font-weight="700" text-anchor="middle">AI</text>
    <line x1="582" y1="195" x2="600" y2="195" stroke="#a855f7" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- 底部分隔线 + 提示 + 水印 -->
  <line x1="40" y1="336" x2="860" y2="336" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="40" y="360" fill="#8b8bb0" font-size="12">调试闭环 · 跨浏览器测试 · 标准化红利 · 新的安全边界</text>
  <text x="860" y="360" fill="#6b6b90" font-size="12" text-anchor="end">公众号 · AI 行业观察</text>
</svg>
