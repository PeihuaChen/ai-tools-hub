<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="topbar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="topbar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="48" x2="900" y2="48"/>
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="0" y1="336" x2="900" y2="336"/>
    <line x1="60" y1="0" x2="60" y2="383"/>
    <line x1="120" y1="0" x2="120" y2="383"/>
    <line x1="180" y1="0" x2="180" y2="383"/>
    <line x1="240" y1="0" x2="240" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="420" y1="0" x2="420" y2="383"/>
    <line x1="480" y1="0" x2="480" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="660" y1="0" x2="660" y2="383"/>
    <line x1="720" y1="0" x2="720" y2="383"/>
    <line x1="780" y1="0" x2="780" y2="383"/>
    <line x1="840" y1="0" x2="840" y2="383"/>
  </g>

  <!-- top bar -->
  <rect x="0" y="0" width="300" height="4" fill="url(#topbar1)"/>
  <rect x="300" y="0" width="300" height="4" fill="url(#topbar2)"/>
  <rect x="600" y="0" width="300" height="4" fill="url(#topbar3)"/>
  <!-- bottom bar -->
  <rect x="0" y="379" width="300" height="4" fill="url(#topbar3)"/>
  <rect x="300" y="379" width="300" height="4" fill="url(#topbar2)"/>
  <rect x="600" y="379" width="300" height="4" fill="url(#topbar1)"/>

  <!-- label box -->
  <rect x="48" y="42" width="252" height="30" rx="6" fill="none" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="64" y="62" fill="#22d3ee" font-size="14" font-weight="600" letter-spacing="1">AI 行业观察 · 模型压缩</text>

  <!-- main title -->
  <text x="48" y="126" fill="#ffffff" font-size="31" font-weight="800">手机跑 27B 大模型？</text>
  <text x="48" y="166" fill="url(#sub)" font-size="19" font-weight="700">1-bit 量化落地指南与模型选型 2026</text>

  <!-- highlight lines -->
  <text x="48" y="212" fill="#22d3ee" font-size="13" font-weight="600">▍ 两大路线：原生训练 (BitNet/Falcon3) vs 后训练量化 (Bonsai/Unsloth)</text>
  <text x="48" y="236" fill="#a855f7" font-size="13" font-weight="600">▍ 27B 模型压到 3.9GB · 体积缩 10–30× · 能耗降 9–12×</text>
  <text x="48" y="260" fill="#f59e0b" font-size="13" font-weight="600">▍ bitnet.cpp / llama.cpp / MLX 部署框架 + 专用硬件展望</text>

  <!-- tags -->
  <g font-size="12" font-weight="600">
    <rect x="48" y="292" width="92" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="94" y="309" fill="#7dd3fc" text-anchor="middle">1.58-bit</text>
    <rect x="150" y="292" width="78" height="26" rx="13" fill="none" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="189" y="309" fill="#c4b5fd" text-anchor="middle">BitNet</text>
    <rect x="238" y="292" width="98" height="26" rx="13" fill="none" stroke="#ec4899" stroke-opacity="0.5"/>
    <text x="287" y="309" fill="#f9a8d4" text-anchor="middle">Bonsai 27B</text>
    <rect x="346" y="292" width="88" height="26" rx="13" fill="none" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="390" y="309" fill="#fcd34d" text-anchor="middle">端侧 AI</text>
    <rect x="444" y="292" width="88" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="488" y="309" fill="#7dd3fc" text-anchor="middle">Unsloth</text>
  </g>

  <!-- year badge -->
  <circle cx="838" cy="58" r="26" fill="none" stroke="#a855f7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="838" y="67" fill="#c4b5fd" font-size="22" font-weight="800" text-anchor="middle">26</text>

  <!-- right concept: phone with ternary weights -->
  <g transform="translate(660,120)">
    <rect x="0" y="0" width="150" height="200" rx="18" fill="url(#phone)" stroke="#334155" stroke-width="2"/>
    <rect x="12" y="16" width="126" height="168" rx="8" fill="#0a0a1e" stroke="#1e293b" stroke-width="1"/>
    <circle cx="75" cy="192" r="4" fill="#334155"/>
    <!-- ternary matrix on screen -->
    <g font-size="15" font-weight="700" text-anchor="middle">
      <text x="34" y="46" fill="#22d3ee">-1</text>
      <text x="75" y="46" fill="#475569">0</text>
      <text x="116" y="46" fill="#ec4899">+1</text>
      <text x="34" y="76" fill="#475569">0</text>
      <text x="75" y="76" fill="#ec4899">+1</text>
      <text x="116" y="76" fill="#22d3ee">-1</text>
      <text x="34" y="106" fill="#ec4899">+1</text>
      <text x="75" y="106" fill="#22d3ee">-1</text>
      <text x="116" y="106" fill="#475569">0</text>
      <text x="34" y="136" fill="#475569">0</text>
      <text x="75" y="136" fill="#22d3ee">-1</text>
      <text x="116" y="136" fill="#ec4899">+1</text>
    </g>
    <text x="75" y="170" fill="#a855f7" font-size="12" font-weight="700" text-anchor="middle">3.9 GB</text>
  </g>

  <!-- divider -->
  <line x1="48" y1="340" x2="852" y2="340" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <!-- footer -->
  <text x="48" y="362" fill="#64748b" font-size="12">技术路线 · 模型盘点 · 部署框架 · 落地场景 · 硬件展望</text>
  <text x="852" y="362" fill="#475569" font-size="12" text-anchor="end" font-weight="600">公众号 · AI行业观察</text>
</svg>
