<svg width="1080" height="1130" viewBox="0 0 1080 1130" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1130" fill="#f7f8fa"/>

  <!-- title -->
  <text x="60" y="80" font-size="60" font-weight="bold" fill="#111827">RSI 五级自主框架</text>
  <text x="60" y="140" font-size="32" fill="#4b5563">自主程度由低到高：从执行人类流程，到改进「改进能力」本身</text>

  <!-- ascending arrow on the left -->
  <line x1="88" y1="1078" x2="88" y2="230" stroke="#94a3b8" stroke-width="4"/>
  <polygon points="88,190 72,236 104,236" fill="#94a3b8"/>

  <!-- L5 -->
  <g>
    <rect x="130" y="190" width="890" height="160" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <circle cx="205" cy="270" r="44" fill="none" stroke="#b45309" stroke-width="3"/>
    <text x="205" y="284" font-size="38" font-weight="bold" fill="#b45309" text-anchor="middle">L5</text>
    <text x="290" y="254" font-size="42" font-weight="bold" fill="#b45309">递归元改进</text>
    <text x="290" y="318" font-size="32" fill="#4b5563">改进「改进能力」本身，形成复利循环</text>
  </g>

  <!-- L4 -->
  <g>
    <rect x="130" y="372" width="890" height="160" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <circle cx="205" cy="452" r="44" fill="none" stroke="#15803d" stroke-width="3"/>
    <text x="205" y="466" font-size="38" font-weight="bold" fill="#15803d" text-anchor="middle">L4</text>
    <text x="290" y="436" font-size="42" font-weight="bold" fill="#15803d">环境适应自主</text>
    <text x="290" y="500" font-size="32" fill="#4b5563">自主适配新任务与新环境</text>
  </g>

  <!-- L3 -->
  <g>
    <rect x="130" y="554" width="890" height="160" rx="16" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <circle cx="205" cy="634" r="44" fill="none" stroke="#0e7490" stroke-width="3"/>
    <text x="205" y="648" font-size="38" font-weight="bold" fill="#0e7490" text-anchor="middle">L3</text>
    <text x="290" y="618" font-size="42" font-weight="bold" fill="#0e7490">经验获取自主</text>
    <text x="290" y="682" font-size="32" fill="#4b5563">自主收集训练所需的经验数据</text>
  </g>

  <!-- L2 -->
  <g>
    <rect x="130" y="736" width="890" height="160" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="205" cy="816" r="44" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <text x="205" y="830" font-size="38" font-weight="bold" fill="#1d4ed8" text-anchor="middle">L2</text>
    <text x="290" y="800" font-size="42" font-weight="bold" fill="#1d4ed8">改进策略自主</text>
    <text x="290" y="864" font-size="32" fill="#4b5563">自主决定如何升级，而非照做</text>
  </g>

  <!-- L1 -->
  <g>
    <rect x="130" y="918" width="890" height="160" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <circle cx="205" cy="998" r="44" fill="none" stroke="#64748b" stroke-width="3"/>
    <text x="205" y="1012" font-size="38" font-weight="bold" fill="#334155" text-anchor="middle">L1</text>
    <text x="290" y="982" font-size="42" font-weight="bold" fill="#334155">改进执行自主</text>
    <text x="290" y="1046" font-size="32" fill="#4b5563">执行人类设计好的改进流程</text>
  </g>
</svg>
