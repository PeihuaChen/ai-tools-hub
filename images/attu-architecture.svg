<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1020" viewBox="0 0 1080 1020">
  <rect x="0" y="0" width="1080" height="1020" fill="#f7f8fa"/>

  <text x="540" y="90" font-size="56" font-weight="bold" fill="#111827" text-anchor="middle">Attu 3.0 部署结构</text>

  <!-- Row 1: client -->
  <rect x="290" y="130" width="500" height="160" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="540" y="190" font-size="44" font-weight="bold" fill="#1d4ed8" text-anchor="middle">浏览器 / 桌面应用</text>
  <text x="540" y="256" font-size="32" fill="#4b5563" text-anchor="middle">本地登录 · 多用户</text>

  <!-- Arrow 1 -->
  <line x1="540" y1="290" x2="540" y2="316" stroke="#94a3b8" stroke-width="3"/>
  <path d="M528 314 L552 314 L540 330 Z" fill="#94a3b8"/>

  <!-- Row 2: server -->
  <rect x="48" y="330" width="984" height="320" rx="16" fill="#f1f5f9" stroke="#d9e2ec" stroke-width="2"/>
  <text x="540" y="390" font-size="48" font-weight="bold" fill="#111827" text-anchor="middle">Attu Server</text>

  <rect x="76" y="420" width="293" height="200" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="222" y="505" font-size="40" font-weight="bold" fill="#6d28d9" text-anchor="middle">AI Agent</text>
  <text x="222" y="565" font-size="32" fill="#4b5563" text-anchor="middle">50+ 工具</text>

  <rect x="393" y="420" width="293" height="200" rx="14" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="540" y="505" font-size="40" font-weight="bold" fill="#0e7490" text-anchor="middle">SQLite</text>
  <text x="540" y="565" font-size="32" fill="#4b5563" text-anchor="middle">连接 · 会话</text>

  <rect x="710" y="420" width="293" height="200" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="857" y="505" font-size="40" font-weight="bold" fill="#b91c1c" text-anchor="middle">SSRF 防护</text>
  <text x="857" y="565" font-size="32" fill="#4b5563" text-anchor="middle">拦内网地址</text>

  <!-- Arrows 2 -->
  <line x1="204" y1="650" x2="204" y2="696" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8"/>
  <path d="M192 694 L216 694 L204 710 Z" fill="#94a3b8"/>
  <line x1="540" y1="650" x2="540" y2="696" stroke="#94a3b8" stroke-width="3"/>
  <path d="M528 694 L552 694 L540 710 Z" fill="#94a3b8"/>
  <line x1="876" y1="650" x2="876" y2="696" stroke="#94a3b8" stroke-width="3"/>
  <path d="M864 694 L888 694 L876 710 Z" fill="#94a3b8"/>

  <!-- Row 3 -->
  <rect x="48" y="710" width="312" height="200" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="204" y="795" font-size="40" font-weight="bold" fill="#b45309" text-anchor="middle">LLM 服务商</text>
  <text x="204" y="855" font-size="32" fill="#4b5563" text-anchor="middle">自带 API Key</text>

  <rect x="384" y="710" width="312" height="200" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="540" y="795" font-size="40" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Milvus 集群</text>
  <text x="540" y="855" font-size="32" fill="#4b5563" text-anchor="middle">多集群切换</text>

  <rect x="720" y="710" width="312" height="200" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="876" y="795" font-size="40" font-weight="bold" fill="#15803d" text-anchor="middle">对象存储</text>
  <text x="876" y="855" font-size="32" fill="#4b5563" text-anchor="middle">S3 · MinIO</text>

  <text x="540" y="975" font-size="32" fill="#6b7280" text-anchor="middle">备份走对象存储，Agent 只调你配置的模型</text>
</svg>
