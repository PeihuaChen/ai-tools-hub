<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="lfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#13263f"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#11998e"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#lfBg)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="95" x2="900" y2="95"/>
    <line x1="0" y1="190" x2="900" y2="190"/>
    <line x1="0" y1="285" x2="900" y2="285"/>
    <line x1="150" y1="0" x2="150" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="750" y1="0" x2="750" y2="383"/>
  </g>

  <!-- Decorative glow -->
  <circle cx="720" cy="120" r="120" fill="#00d2ff" opacity="0.05"/>
  <circle cx="780" cy="300" r="70" fill="#38ef7d" opacity="0.04"/>

  <!-- Right side: Trace tree visualization -->
  <g transform="translate(560, 70)">
    <!-- Root node -->
    <rect x="0" y="0" width="150" height="28" rx="6" fill="#1a3a5a" stroke="url(#traceGrad)" stroke-width="1.5"/>
    <text x="12" y="18" font-family="Courier New, monospace" font-size="11" fill="#7fdfff">trace: 用户请求</text>

    <!-- Child 1 -->
    <line x1="20" y1="28" x2="20" y2="50" stroke="#3a7bd5" stroke-width="1.5"/>
    <line x1="20" y1="50" x2="35" y2="50" stroke="#3a7bd5" stroke-width="1.5"/>
    <rect x="35" y="38" width="170" height="24" rx="5" fill="#16304d" stroke="#3a7bd5" stroke-width="1"/>
    <text x="45" y="54" font-family="Courier New, monospace" font-size="10" fill="#9fc4e8">llm_call · $0.038</text>

    <!-- Child 2 -->
    <line x1="20" y1="62" x2="20" y2="84" stroke="#3a7bd5" stroke-width="1.5"/>
    <line x1="20" y1="84" x2="35" y2="84" stroke="#3a7bd5" stroke-width="1.5"/>
    <rect x="35" y="72" width="170" height="24" rx="5" fill="#16304d" stroke="#38ef7d" stroke-width="1"/>
    <text x="45" y="88" font-family="Courier New, monospace" font-size="10" fill="#7de8a8">tool: query_db · 320ms</text>

    <!-- Child 3 (error) -->
    <line x1="20" y1="96" x2="20" y2="118" stroke="#3a7bd5" stroke-width="1.5"/>
    <line x1="20" y1="118" x2="35" y2="118" stroke="#3a7bd5" stroke-width="1.5"/>
    <rect x="35" y="106" width="170" height="24" rx="5" fill="#3d1f1f" stroke="#ff6b6b" stroke-width="1"/>
    <text x="45" y="122" font-family="Courier New, monospace" font-size="10" fill="#ff9090">tool: chart · retry×2</text>

    <!-- Child 4 -->
    <line x1="20" y1="130" x2="20" y2="152" stroke="#3a7bd5" stroke-width="1.5"/>
    <line x1="20" y1="152" x2="35" y2="152" stroke="#3a7bd5" stroke-width="1.5"/>
    <rect x="35" y="140" width="170" height="24" rx="5" fill="#16304d" stroke="#3a7bd5" stroke-width="1"/>
    <text x="45" y="156" font-family="Courier New, monospace" font-size="10" fill="#9fc4e8">llm_call · $0.024</text>

    <!-- Total -->
    <rect x="35" y="174" width="170" height="24" rx="5" fill="#0d2818" stroke="#38ef7d" stroke-width="1"/>
    <text x="45" y="190" font-family="Courier New, monospace" font-size="10" fill="#38ef7d">总计: $0.062 · 6.3s</text>
  </g>

  <!-- Left side: Title -->
  <text x="50" y="80" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Langfuse 实战</text>
  <text x="50" y="125" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="url(#traceGrad)">给AI Agent装上"黑匣子"</text>

  <!-- Subtitle -->
  <text x="50" y="160" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#7a9ab8">开源LLM可观测性平台完全指南</text>

  <!-- Four pillars -->
  <g transform="translate(50, 185)">
    <rect x="0" y="0" width="95" height="30" rx="15" fill="#1a3a5a" stroke="#00d2ff" stroke-width="0.8"/>
    <text x="47" y="20" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#7fdfff" text-anchor="middle">📊 追踪</text>

    <rect x="105" y="0" width="95" height="30" rx="15" fill="#1a3a5a" stroke="#38ef7d" stroke-width="0.8"/>
    <text x="152" y="20" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#7de8a8" text-anchor="middle">✓ 评估</text>

    <rect x="210" y="0" width="110" height="30" rx="15" fill="#1a3a5a" stroke="#00d2ff" stroke-width="0.8"/>
    <text x="265" y="20" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#7fdfff" text-anchor="middle">📝 提示词</text>

    <rect x="330" y="0" width="95" height="30" rx="15" fill="#1a3a5a" stroke="#38ef7d" stroke-width="0.8"/>
    <text x="377" y="20" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#7de8a8" text-anchor="middle">💰 成本</text>
  </g>

  <!-- Feature tags -->
  <g transform="translate(50, 230)">
    <text x="0" y="14" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#5a7a98">✓ 开源MIT  ✓ 自托管  ✓ 框架中立  ✓ 无锁定</text>
  </g>

  <!-- Framework badges -->
  <g transform="translate(50, 255)">
    <rect x="0" y="0" width="70" height="22" rx="4" fill="#13263f" stroke="#2a4a6a" stroke-width="0.8"/>
    <text x="35" y="15" font-family="Arial, sans-serif" font-size="10" fill="#8ab4d8" text-anchor="middle">LangGraph</text>

    <rect x="78" y="0" width="55" height="22" rx="4" fill="#13263f" stroke="#2a4a6a" stroke-width="0.8"/>
    <text x="105" y="15" font-family="Arial, sans-serif" font-size="10" fill="#8ab4d8" text-anchor="middle">CrewAI</text>

    <rect x="141" y="0" width="45" height="22" rx="4" fill="#13263f" stroke="#2a4a6a" stroke-width="0.8"/>
    <text x="163" y="15" font-family="Arial, sans-serif" font-size="10" fill="#8ab4d8" text-anchor="middle">Dify</text>

    <rect x="194" y="0" width="70" height="22" rx="4" fill="#13263f" stroke="#2a4a6a" stroke-width="0.8"/>
    <text x="229" y="15" font-family="Arial, sans-serif" font-size="10" fill="#8ab4d8" text-anchor="middle">WeKnora</text>

    <rect x="272" y="0" width="60" height="22" rx="4" fill="#13263f" stroke="#2a4a6a" stroke-width="0.8"/>
    <text x="302" y="15" font-family="Arial, sans-serif" font-size="10" fill="#8ab4d8" text-anchor="middle">OTEL</text>
  </g>

  <!-- Bottom -->
  <rect x="50" y="295" width="420" height="1" fill="#fff" opacity="0.07"/>
  <text x="50" y="320" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#506880">五大应用场景 · Docker部署 · 框架集成 · 企业案例</text>
  <text x="50" y="345" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#3a4a5a">AI知识宇宙 | 2026.06</text>
</svg>
