<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#2a2a5a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#2a2a55" stroke-width="1" opacity="0.35">
    <line x1="0" y1="64" x2="900" y2="64"/>
    <line x1="0" y1="128" x2="900" y2="128"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="256" x2="900" y2="256"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="750" y1="0" x2="750" y2="383"/>
  </g>

  <!-- top & bottom color bars -->
  <rect x="0" y="0" width="300" height="4" fill="#22d3ee"/>
  <rect x="300" y="0" width="300" height="4" fill="#6366f1"/>
  <rect x="600" y="0" width="300" height="4" fill="#a855f7"/>
  <rect x="0" y="379" width="450" height="4" fill="#6366f1"/>
  <rect x="450" y="379" width="450" height="4" fill="#22d3ee"/>

  <!-- tag box -->
  <rect x="40" y="34" width="250" height="30" rx="6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="56" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7dd3fc">AI 行业观察 · 智能体基础设施</text>

  <!-- year badge -->
  <circle cx="842" cy="52" r="24" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <text x="842" y="59" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#c4b5fd">26</text>

  <!-- title -->
  <text x="40" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">微软开源 Orchard</text>
  <text x="40" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="url(#sub)">把「训练环境」做成服务，让小模型逼近前沿智能体</text>

  <!-- highlights -->
  <text x="40" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5eead4">◆ 3B 激活参数 · SWE-bench Verified 73.0%，逼近大 10 倍的前沿系统</text>
  <text x="40" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#93c5fd">◆ Orchard Env：K8s 原生沙箱，比 E2B 快 2.7×、比托管服务省 10×</text>
  <text x="40" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c4b5fd">◆ harness 无关，一套环境跨 SWE / GUI / 助理三域复用</text>

  <!-- pill tags -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12">
    <rect x="40" y="292" width="92" height="26" rx="13" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <text x="86" y="309" text-anchor="middle" fill="#7dd3fc">Orchard Env</text>
    <rect x="142" y="292" width="76" height="26" rx="13" fill="none" stroke="#818cf8" stroke-width="1"/>
    <text x="180" y="309" text-anchor="middle" fill="#a5b4fc">SWE-bench</text>
    <rect x="228" y="292" width="88" height="26" rx="13" fill="none" stroke="#c084fc" stroke-width="1"/>
    <text x="272" y="309" text-anchor="middle" fill="#d8b4fe">Kubernetes</text>
    <rect x="326" y="292" width="70" height="26" rx="13" fill="none" stroke="#5eead4" stroke-width="1"/>
    <text x="361" y="309" text-anchor="middle" fill="#5eead4">Agentic RL</text>
    <rect x="406" y="292" width="66" height="26" rx="13" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <text x="439" y="309" text-anchor="middle" fill="#fcd34d">开源 MIT</text>
  </g>

  <!-- right concept: env service feeding 3 domains -->
  <g>
    <rect x="622" y="150" width="150" height="46" rx="8" fill="url(#node)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="697" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#e0e7ff">Orchard Env</text>
    <text x="697" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a5b4fc">reusable sandbox</text>

    <line x1="660" y1="196" x2="640" y2="240" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="697" y1="196" x2="697" y2="240" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="734" y1="196" x2="754" y2="240" stroke="#c084fc" stroke-width="1.5"/>

    <rect x="600" y="240" width="80" height="34" rx="6" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="640" y="261" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#67e8f9">SWE</text>
    <rect x="688" y="240" width="18" height="34" rx="0" fill="none"/>
    <rect x="655" y="278" width="84" height="34" rx="6" fill="none" stroke="#818cf8" stroke-width="1.2"/>
    <text x="697" y="299" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a5b4fc">GUI</text>
    <rect x="714" y="240" width="80" height="34" rx="6" fill="none" stroke="#c084fc" stroke-width="1.2"/>
    <text x="754" y="261" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#d8b4fe">Claw</text>
  </g>

  <!-- footer -->
  <line x1="40" y1="344" x2="860" y2="344" stroke="#2a2a55" stroke-width="1"/>
  <text x="40" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">环境层才是瓶颈 · 从沙箱到累积式智能体学习</text>
  <text x="860" y="366" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">公众号：AI 行业观察</text>
</svg>
