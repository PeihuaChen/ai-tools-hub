<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="48" x2="900" y2="48"/>
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="0" y1="336" x2="900" y2="336"/>
    <line x1="60" y1="0" x2="60" y2="383"/>
    <line x1="180" y1="0" x2="180" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="420" y1="0" x2="420" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/>
    <line x1="660" y1="0" x2="660" y2="383"/>
    <line x1="780" y1="0" x2="780" y2="383"/>
  </g>

  <!-- top / bottom color bars -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topbar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#topbar)"/>

  <!-- tag box -->
  <rect x="40" y="34" width="240" height="30" rx="6" fill="none" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="54" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7dd3fc" letter-spacing="0.5">AI 基础设施 · 向量数据库选型</text>

  <!-- year badge -->
  <circle cx="838" cy="50" r="24" fill="none" stroke="#a855f7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="838" y="57" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#c084fc">26</text>

  <!-- main title -->
  <text x="44" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="bold" fill="#ffffff">2026 开源向量库全景对比</text>
  <text x="44" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="url(#sub)">Milvus · Qdrant · Weaviate · pgvector 到底怎么选</text>

  <!-- highlights -->
  <text x="44" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5eead4">▸ Qdrant 延迟标杆 · Milvus 亿级分布式 · Weaviate 混合检索</text>
  <text x="44" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#93c5fd">▸ 回迁 Postgres：向量检索退化成一种索引类型</text>
  <text x="44" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d8b4fe">▸ 附商用方案成本对比 · 速查表 · 三步决策路径</text>

  <!-- pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12">
    <rect x="44" y="286" width="70" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="79" y="303" text-anchor="middle" fill="#a5f3fc">RAG</text>
    <rect x="122" y="286" width="86" height="26" rx="13" fill="none" stroke="#6366f1" stroke-opacity="0.5"/>
    <text x="165" y="303" text-anchor="middle" fill="#c7d2fe">pgvector</text>
    <rect x="216" y="286" width="78" height="26" rx="13" fill="none" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="255" y="303" text-anchor="middle" fill="#e9d5ff">HNSW</text>
    <rect x="302" y="286" width="104" height="26" rx="13" fill="none" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="354" y="303" text-anchor="middle" fill="#bae6fd">混合检索</text>
    <rect x="414" y="286" width="92" height="26" rx="13" fill="none" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="460" y="303" text-anchor="middle" fill="#c7d2fe">向量索引</text>
  </g>

  <!-- concept: vector node graph -->
  <g stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="700" y1="150" x2="770" y2="110"/>
    <line x1="700" y1="150" x2="785" y2="185"/>
    <line x1="700" y1="150" x2="720" y2="230"/>
    <line x1="770" y1="110" x2="840" y2="140"/>
    <line x1="785" y1="185" x2="840" y2="140"/>
    <line x1="785" y1="185" x2="810" y2="245"/>
    <line x1="720" y1="230" x2="810" y2="245"/>
  </g>
  <g fill="url(#node)">
    <circle cx="700" cy="150" r="9"/>
    <circle cx="770" cy="110" r="6"/>
    <circle cx="785" cy="185" r="7"/>
    <circle cx="720" cy="230" r="5"/>
    <circle cx="840" cy="140" r="6"/>
    <circle cx="810" cy="245" r="5"/>
  </g>

  <!-- footer -->
  <line x1="44" y1="340" x2="856" y2="340" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="44" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">专用库 vs 通用扩展 vs 商用托管 · 两头挤压，中间分化</text>
  <text x="856" y="362" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">公众号 · AI 行业观察</text>
</svg>
