<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="50%" stop-color="#161638"/>
      <stop offset="100%" stop-color="#0d0d25"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/><line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="180" y1="0" x2="180" y2="383"/><line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/><line x1="720" y1="0" x2="720" y2="383"/>
  </g>

  <!-- Top / bottom accent -->
  <rect x="0" y="0" width="225" height="4" fill="url(#cyan)"/>
  <rect x="225" y="0" width="225" height="4" fill="url(#green)"/>
  <rect x="450" y="0" width="225" height="4" fill="url(#purple)"/>
  <rect x="675" y="0" width="225" height="4" fill="url(#orange)"/>
  <rect x="0" y="379" width="225" height="4" fill="url(#cyan)"/>
  <rect x="225" y="379" width="225" height="4" fill="url(#green)"/>
  <rect x="450" y="379" width="225" height="4" fill="url(#purple)"/>
  <rect x="675" y="379" width="225" height="4" fill="url(#orange)"/>

  <!-- Right side: Humanoid robot silhouette + tech stack -->
  <g transform="translate(600, 60)">
    <!-- Robot silhouette (simplified humanoid) -->
    <g fill="none" stroke="url(#cyan)" stroke-width="2" opacity="0.9">
      <!-- Head -->
      <circle cx="80" cy="30" r="18"/>
      <!-- Eye visor -->
      <rect x="66" y="24" width="28" height="8" rx="4" fill="#22d3ee" opacity="0.3"/>
      <!-- Body -->
      <line x1="80" y1="48" x2="80" y2="110"/>
      <!-- Arms -->
      <line x1="80" y1="60" x2="50" y2="95"/>
      <line x1="80" y1="60" x2="110" y2="95"/>
      <!-- Legs -->
      <line x1="80" y1="110" x2="60" y2="155"/>
      <line x1="80" y1="110" x2="100" y2="155"/>
      <!-- Joints -->
      <circle cx="80" cy="60" r="4" fill="#0d0d25" stroke="url(#cyan)"/>
      <circle cx="50" cy="95" r="3" fill="#0d0d25" stroke="url(#green)"/>
      <circle cx="110" cy="95" r="3" fill="#0d0d25" stroke="url(#green)"/>
    </g>

    <!-- Tech stack labels on the right -->
    <g font-family="'Courier New',monospace" font-size="10">
      <line x1="130" y1="30" x2="155" y2="30" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="160" y="34" fill="#22d3ee">World Model</text>

      <line x1="115" y1="75" x2="155" y2="75" stroke="#10b981" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="160" y="79" fill="#34d399">Embodied Model</text>

      <line x1="105" y1="130" x2="155" y2="130" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="160" y="134" fill="#a78bfa">Simulation</text>
    </g>

    <!-- Sim-to-Real arrow -->
    <g transform="translate(50, 180)">
      <rect x="0" y="0" width="200" height="28" rx="6" fill="#161636" stroke="url(#orange)" stroke-width="1.5"/>
      <text x="12" y="18" font-family="'Courier New',monospace" font-size="10" fill="#fbbf24">Virtual → Sim-to-Real → Physical</text>
    </g>
  </g>

  <!-- Tag -->
  <g transform="translate(50, 28)">
    <rect x="0" y="0" width="210" height="30" rx="4" fill="#0a1a20" stroke="url(#cyan)" stroke-width="1"/>
    <text x="105" y="20" font-family="'Courier New',monospace" font-weight="bold" font-size="13" fill="#22d3ee" text-anchor="middle">AI 行业观察 · Physical AI</text>
  </g>

  <text x="50" y="110" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="30" font-weight="bold" fill="#ffffff">物理 AI 是什么</text>
  <text x="50" y="150" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="bold" fill="url(#cyan)">从世界模型到人形机器人，AI 下一个 40 万亿赛道</text>

  <!-- Key highlights -->
  <g transform="translate(50, 178)">
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="13" fill="#22d3ee">Cosmos 3 · GR00T · Omniverse · Isaac</text>
    <text x="0" y="22" font-family="'Courier New',monospace" font-size="13" fill="#34d399">Waymo $1260亿 · Figure $390亿 · Skild $140亿</text>
    <text x="0" y="44" font-family="'Courier New',monospace" font-size="13" fill="#f59e0b">中国具身智能写入国策 · 人形机器人量产元年</text>
  </g>

  <!-- Tags -->
  <g transform="translate(50, 252)">
    <rect x="0" y="0" width="64" height="24" rx="12" fill="#1e1e3a" stroke="#06b6d4" stroke-width="0.8"/>
    <text x="32" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#a5f3fc" text-anchor="middle">世界模型</text>

    <rect x="72" y="0" width="64" height="24" rx="12" fill="#1e1e3a" stroke="#10b981" stroke-width="0.8"/>
    <text x="104" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">人形机器人</text>

    <rect x="144" y="0" width="64" height="24" rx="12" fill="#1e1e3a" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="176" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">数字孪生</text>

    <rect x="216" y="0" width="64" height="24" rx="12" fill="#1e1e3a" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="248" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fde047" text-anchor="middle">自动驾驶</text>

    <rect x="288" y="0" width="64" height="24" rx="12" fill="#1e1e3a" stroke="#ef4444" stroke-width="0.8"/>
    <text x="320" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">中美对决</text>
  </g>

  <!-- Divider -->
  <rect x="50" y="294" width="460" height="1" fill="#fff" opacity="0.06"/>
  <text x="50" y="318" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#4a4f70">概念定义 · 技术栈拆解 · 四大场景 · 中美对比 · 挑战分析</text>
  <text x="50" y="351" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#33385a">公众号 - 最新AI知识宇宙 | 2026.06</text>

  <!-- Year badge -->
  <g transform="translate(835, 30)">
    <rect x="0" y="0" width="40" height="28" rx="4" fill="none" stroke="url(#cyan)" stroke-width="1.5"/>
    <text x="20" y="19" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#22d3ee" text-anchor="middle">26</text>
  </g>
</svg>
