<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <linearGradient id="pg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
    </linearGradient>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>
  <rect width="1200" height="640" fill="url(#pg4)"/>

  <text x="40" y="42" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#111827">RAG 多租户隔离的五个层级：隔离强度与成本的权衡</text>
  <text x="40" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#4b5563">隔离不是有和没有，而是一条连续谱。L1 / L2 都在应用层，不要当安全边界用</text>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <line x1="70" y1="580" x2="1150" y2="580" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a4)"/>
    <line x1="70" y1="580" x2="70" y2="110" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a4)"/>
    <text x="1120" y="604" text-anchor="end" font-size="12" fill="#6b7280">成本与运维复杂度 →</text>
    <text x="52" y="124" text-anchor="end" font-size="12" fill="#6b7280">隔离强度</text>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="96" y="470" width="196" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
    <text x="112" y="494" font-size="14" font-weight="bold" fill="#b91c1c">L1 元数据过滤</text>
    <text x="112" y="516" font-size="11" fill="#4b5563">同 collection + tenant_id</text>
    <text x="112" y="534" font-size="11" fill="#b91c1c">强度：弱（应用层）</text>
    <text x="112" y="554" font-size="11" fill="#4b5563">场景：内部工具、同信任域</text>

    <rect x="308" y="416" width="196" height="96" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
    <text x="324" y="440" font-size="14" font-weight="bold" fill="#b45309">L2 命名空间</text>
    <text x="324" y="462" font-size="11" fill="#4b5563">Pinecone namespace / 分区键</text>
    <text x="324" y="480" font-size="11" fill="#b91c1c">强度：弱到中，不是安全边界</text>
    <text x="324" y="500" font-size="11" fill="#4b5563">场景：多团队、低敏感度</text>

    <rect x="520" y="342" width="196" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="536" y="366" font-size="14" font-weight="bold" fill="#1d4ed8">L3 集合隔离</text>
    <text x="536" y="388" font-size="11" fill="#4b5563">每租户独立 collection + RBAC</text>
    <text x="536" y="406" font-size="11" fill="#1d4ed8">强度：中</text>
    <text x="536" y="426" font-size="11" fill="#15803d">场景：SaaS 标准方案（推荐）</text>

    <rect x="732" y="262" width="196" height="96" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
    <text x="748" y="286" font-size="14" font-weight="bold" fill="#6d28d9">L4 索引 / 实例隔离</text>
    <text x="748" y="308" font-size="11" fill="#4b5563">每租户独立 index 或实例</text>
    <text x="748" y="326" font-size="11" fill="#6d28d9">强度：强</text>
    <text x="748" y="346" font-size="11" fill="#4b5563">场景：金融、医疗、政企</text>

    <rect x="944" y="170" width="206" height="96" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
    <text x="960" y="194" font-size="14" font-weight="bold" fill="#15803d">L5 加密隔离</text>
    <text x="960" y="216" font-size="11" fill="#4b5563">每租户独立密钥，块 + 向量加密</text>
    <text x="960" y="234" font-size="11" fill="#15803d">强度：最强</text>
    <text x="960" y="254" font-size="11" fill="#4b5563">场景：强合规、跨境受限</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" fill="none">
    <path d="M292,500 L308,470"/>
    <path d="M504,440 L520,400"/>
    <path d="M716,370 L732,320"/>
    <path d="M928,290 L944,230"/>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="96" y="110" width="380" height="140" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.3"/>
    <text x="114" y="136" font-size="13" font-weight="bold" fill="#b91c1c">L1 / L2 的共同缺陷</text>
    <text x="114" y="162" font-size="11" fill="#4b5563">隔离依赖"查询条件构造正确"这一前提。</text>
    <text x="114" y="182" font-size="11" fill="#4b5563">一次查询疏漏、一个忘加过滤的调试接口，</text>
    <text x="114" y="202" font-size="11" fill="#4b5563">隔离就失效。</text>
    <text x="114" y="228" font-size="11" fill="#b91c1c">index 级 API key 可横穿全部 namespace，</text>
    <text x="114" y="246" font-size="11" fill="#b91c1c">租户之间没有密码学隔离</text>

    <rect x="496" y="110" width="420" height="140" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="514" y="136" font-size="13" font-weight="bold" fill="#1d4ed8">选型建议：按数据分级做混合策略</text>
    <text x="514" y="162" font-size="11" fill="#4b5563">L4 的代价常被低估：租户上千时，实例数线性增长</text>
    <text x="514" y="182" font-size="11" fill="#4b5563">会变成运维和成本灾难。</text>
    <text x="514" y="208" font-size="11" fill="#15803d">务实做法：高敏租户走 L4，普通租户走 L3，</text>
    <text x="514" y="226" font-size="11" fill="#15803d">而不是全量拉到同一层。</text>
    <text x="514" y="246" font-size="11" fill="#b45309">L5 上线前必须做端到端召回与延迟基准</text>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="96" y="596" width="1054" height="34" rx="8" fill="#f1f5f9" stroke="#d9e2ec" stroke-width="1.2"/>
    <text x="116" y="618" font-size="12" fill="#4b5563">分水岭功能：Weaviate v1.29.0 才提供集合级细粒度权限（此前只有 Admin / Read-Only 两档）　·　Qdrant v1.9.0+ 提供 JWT 集合级 token　·　Chroma 需靠外部代理补认证</text>
  </g>
</svg>
