<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>

  <!-- top / bottom bars -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topbar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#topbar)"/>

  <!-- tag box -->
  <rect x="54" y="42" width="248" height="30" rx="6" fill="none" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="70" y="62" fill="#7dd3fc" font-size="14" letter-spacing="0.5">AI 行业观察 · 文档解析</text>

  <!-- year badge -->
  <circle cx="838" cy="58" r="24" fill="none" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="838" y="65" fill="#c4b5fd" font-size="20" font-weight="700" text-anchor="middle">26</text>

  <!-- title -->
  <text x="54" y="128" fill="#ffffff" font-size="31" font-weight="800">MinerU 深度解析</text>
  <text x="54" y="166" fill="#ffffff" font-size="24" font-weight="700">1.2B 小模型，如何成为 Agent</text>
  <text x="54" y="198" fill="#ffffff" font-size="24" font-weight="700">与 RAG 的“文档之眼”</text>

  <!-- subtitle -->
  <text x="54" y="232" fill="url(#sub)" font-size="18" font-weight="600">解耦式 VLM · 由粗到细两阶段解析</text>

  <!-- highlights -->
  <text x="54" y="266" fill="#5eead4" font-size="13">▸ OmniDocBench 90.67，超越 GPT-4o / Gemini 2.5 Pro</text>
  <text x="54" y="288" fill="#93c5fd" font-size="13">▸ PDF / 扫描件 / 表格 / 公式 → Markdown · JSON</text>
  <text x="54" y="310" fill="#f0abfc" font-size="13">▸ 3.4.x 软件 + MinerU2.5 模型 + vLLM 加速</text>

  <!-- pills -->
  <g font-size="12">
    <rect x="54" y="326" width="78" height="24" rx="12" fill="none" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="93" y="342" fill="#bae6fd" text-anchor="middle">MinerU</text>
    <rect x="140" y="326" width="60" height="24" rx="12" fill="none" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="170" y="342" fill="#ddd6fe" text-anchor="middle">RAG</text>
    <rect x="208" y="326" width="70" height="24" rx="12" fill="none" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="243" y="342" fill="#fbcfe8" text-anchor="middle">VLM</text>
    <rect x="286" y="326" width="86" height="24" rx="12" fill="none" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="329" y="342" fill="#bbf7d0" text-anchor="middle">OpenDataLab</text>
    <rect x="380" y="326" width="72" height="24" rx="12" fill="none" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="416" y="342" fill="#fde68a" text-anchor="middle">AI Agent</text>
  </g>

  <!-- right concept diagram: document -> parser -> structured -->
  <g transform="translate(600,120)">
    <!-- raw doc -->
    <rect x="0" y="10" width="66" height="86" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <line x1="10" y1="26" x2="56" y2="26" stroke="#64748b" stroke-width="2"/>
    <line x1="10" y1="38" x2="56" y2="38" stroke="#64748b" stroke-width="2"/>
    <line x1="10" y1="50" x2="42" y2="50" stroke="#64748b" stroke-width="2"/>
    <rect x="10" y="60" width="46" height="20" fill="#334155"/>
    <text x="33" y="112" fill="#94a3b8" font-size="11" text-anchor="middle">PDF</text>

    <!-- arrow -->
    <path d="M78 53 H108" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ah)"/>

    <!-- parser core -->
    <rect x="112" y="26" width="70" height="54" rx="8" fill="none" stroke="url(#topbar)" stroke-width="2"/>
    <text x="147" y="49" fill="#c4b5fd" font-size="12" text-anchor="middle" font-weight="700">MinerU</text>
    <text x="147" y="65" fill="#7dd3fc" font-size="10" text-anchor="middle">2.5 VLM</text>

    <!-- arrow -->
    <path d="M186 53 H216" stroke="#ec4899" stroke-width="2" marker-end="url(#ah)"/>

    <!-- structured out -->
    <rect x="220" y="10" width="66" height="86" rx="4" fill="#0f2a24" stroke="#34d399" stroke-width="1.2"/>
    <text x="230" y="30" fill="#5eead4" font-size="10" font-family="monospace">{ }</text>
    <line x1="230" y1="42" x2="276" y2="42" stroke="#34d399" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="230" y1="54" x2="276" y2="54" stroke="#34d399" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="230" y="62" width="46" height="18" fill="none" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="253" y="112" fill="#6ee7b7" font-size="11" text-anchor="middle">MD · JSON</text>
  </g>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- footer -->
  <line x1="54" y1="360" x2="846" y2="360" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="54" y="374" fill="#64748b" font-size="11">原理 · 架构 · 评测 · 部署 · RAG/Agent 落地</text>
  <text x="846" y="374" fill="#475569" font-size="11" text-anchor="end">AI 行业观察</text>
</svg>
