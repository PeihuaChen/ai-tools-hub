<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#475569" stroke-opacity=".15"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>
  
  <!-- Top accent bars -->
  <rect width="300" height="3" fill="#38bdf8" y="0"/>
  <rect x="300" width="300" height="3" fill="#a78bfa" y="0"/>
  <rect x="600" width="300" height="3" fill="#22c55e" y="0"/>
  <rect width="300" height="3" fill="#f59e0b" y="380"/>
  <rect x="300" width="300" height="3" fill="#38bdf8" y="380"/>
  <rect x="600" width="300" height="3" fill="#a78bfa" y="380"/>
  
  <!-- Top left badge -->
  <rect x="32" y="20" width="220" height="26" rx="6" fill="#172554" stroke="#38bdf8" stroke-width="1"/>
  <text x="48" y="39" fill="#bae6fd" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">端侧 AI · 开放权重模型</text>
  
  <!-- Top right year -->
  <rect x="824" y="16" width="44" height="44" rx="22" fill="#201c4b" stroke="#a78bfa" stroke-width="2"/>
  <text x="846" y="47" text-anchor="middle" fill="#ddd6fe" font-size="24" font-weight="700" font-family="system-ui, -apple-system, sans-serif">26</text>
  
  <!-- Main title area (left side) - moved up slightly -->
  <text x="32" y="96" fill="#ffffff" font-size="26" font-weight="700" font-family="system-ui, -apple-system, sans-serif">一个底座，六种能力</text>
  <text x="32" y="124" fill="url(#accent)" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Liquid AI LFM3 端侧模型详解</text>
  
  <!-- Bullet points with better spacing -->
  <circle cx="42" cy="158" r="3.5" fill="#38bdf8"/>
  <text x="56" y="163" fill="#cbd5e1" font-size="12" font-weight="400" font-family="system-ui, -apple-system, sans-serif">1.7B 级共享底座，分化出六款专用模型</text>
  
  <circle cx="42" cy="182" r="3.5" fill="#a78bfa"/>
  <text x="56" y="187" fill="#cbd5e1" font-size="12" font-weight="400" font-family="system-ui, -apple-system, sans-serif">文本、视觉、音频、Omni 与结构化决策</text>
  
  <circle cx="42" cy="206" r="3.5" fill="#f59e0b"/>
  <text x="56" y="211" fill="#cbd5e1" font-size="12" font-weight="400" font-family="system-ui, -apple-system, sans-serif">端侧速度、内存、基准与商业许可证</text>
  
  <!-- Bottom tags (left side) -->
  <g font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">
    <rect x="32" y="236" width="68" height="21" rx="10" fill="#172554" stroke="#38bdf8" stroke-width="1"/>
    <text x="66" y="250" text-anchor="middle" fill="#bae6fd">LFM3</text>
    <rect x="108" y="236" width="68" height="21" rx="10" fill="#261946" stroke="#a78bfa" stroke-width="1"/>
    <text x="142" y="250" text-anchor="middle" fill="#ddd6fe">2B 级</text>
    <rect x="184" y="236" width="74" height="21" rx="10" fill="#073227" stroke="#22c55e" stroke-width="1"/>
    <text x="221" y="250" text-anchor="middle" fill="#bbf7d0">多模态</text>
    <rect x="266" y="236" width="68" height="21" rx="10" fill="#3b2408" stroke="#f59e0b" stroke-width="1"/>
    <text x="300" y="250" text-anchor="middle" fill="#fde68a">端侧</text>
  </g>
  
  <!-- Right side: Architecture diagram (shifted right and down for more space) -->
  <g transform="translate(520, 80)">
    <!-- "ONE BACKBONE" label -->
    <text x="130" y="-10" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600" letter-spacing="1.5" font-family="system-ui, -apple-system, sans-serif">ONE BACKBONE</text>
    
    <!-- Central LFM3 Base node - moved up -->
    <rect x="32" y="8" width="196" height="44" rx="10" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="130" y="36" text-anchor="middle" fill="#bae6fd" font-size="19" font-weight="700" font-family="system-ui, -apple-system, sans-serif">LFM3 Base</text>
    <text x="130" y="52" text-anchor="middle" fill="#64748b" font-size="9.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif">1.7B Shared Backbone</text>
    
    <!-- Branching lines from center bottom of base -->
    <g stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
      <!-- To row 1 (3 items) -->
      <path d="M130 52 V70 M130 70 L40 90 M130 70 L130 90 M130 70 L220 90"/>
      <!-- To row 2 (3 items) -->
      <path d="M130 52 V70 M130 70 L40 150 M130 70 L130 150 M130 70 L220 150"/>
    </g>
    
    <!-- Row 1: Text, Vision, Audio -->
    <g font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">
      <!-- 文本 -->
      <rect x="5" y="96" width="66" height="44" rx="8" fill="#172554" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="38" y="122" text-anchor="middle" fill="#bae6fd">文本</text>
      <text x="38" y="136" text-anchor="middle" fill="#64748b" font-size="8.5">LFM3-1.7B</text>
      
      <!-- 视觉 -->
      <rect x="100" y="96" width="66" height="44" rx="8" fill="#261946" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="133" y="122" text-anchor="middle" fill="#ddd6fe">视觉</text>
      <text x="133" y="136" text-anchor="middle" fill="#64748b" font-size="8.5">LFM3-VL-2B</text>
      
      <!-- 音频 -->
      <rect x="195" y="96" width="66" height="44" rx="8" fill="#073227" stroke="#22c55e" stroke-width="1.5"/>
      <text x="228" y="122" text-anchor="middle" fill="#bbf7d0">音频</text>
      <text x="228" y="136" text-anchor="middle" fill="#64748b" font-size="8.5">LFM3-Audio-2B</text>
    </g>
    
    <!-- Row 2: Omni, d1, Decision -->
    <g font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">
      <!-- Omni -->
      <rect x="5" y="156" width="66" height="44" rx="8" fill="#3b2408" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="38" y="182" text-anchor="middle" fill="#fde68a">Omni</text>
      <text x="38" y="196" text-anchor="middle" fill="#64748b" font-size="8.5">LFM3-Omni-2B</text>
      
      <!-- d1 -->
      <rect x="100" y="156" width="66" height="44" rx="8" fill="#172554" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="133" y="182" text-anchor="middle" fill="#bae6fd">d1</text>
      <text x="133" y="196" text-anchor="middle" fill="#64748b" font-size="8.5">d1-2B</text>
      
      <!-- 决策 -->
      <rect x="195" y="156" width="66" height="44" rx="8" fill="#261946" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="228" y="182" text-anchor="middle" fill="#ddd6fe">决策</text>
      <text x="228" y="196" text-anchor="middle" fill="#64748b" font-size="8.5">d1-Omni-2B</text>
    </g>
  </g>
  
  <!-- Bottom divider and footer -->
  <path d="M32 340 H868" stroke="#334155" stroke-width="1"/>
  <text x="32" y="362" fill="#64748b" font-size="9.5" font-family="system-ui, -apple-system, sans-serif">共享底座 · 专用能力 · 本地部署</text>
  <text x="868" y="362" text-anchor="end" fill="#475569" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif">AI INSIGHT</text>
</svg>