<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#12122a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" rx="8"/>
  <text x="400" y="30" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-weight="700" font-size="18" fill="#fff" text-anchor="middle">AI Agent 分层架构全景图：MCP + A2A 互补协作</text>
  <line x1="200" y1="42" x2="600" y2="42" stroke="#3a7bd5" stroke-width="1" opacity="0.5"/>
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="740" height="68" rx="6" fill="#1a2a4a" stroke="#3a7bd5" stroke-width="1.5" opacity="0.7"/>
    <text x="15" y="22" font-family="'Courier New',Consolas,monospace" font-weight="700" font-size="12" fill="#3a7bd5">Agent Orchestration Layer</text>
    <text x="15" y="42" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#ccc">LangGraph / CrewAI / AutoGen / ADK / Semantic Kernel</text>
    <text x="15" y="58" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#666">任务调度、工作流定义、状态管理</text>
  </g>
  <line x1="400" y1="123" x2="400" y2="133" stroke="#3a7bd5" stroke-width="1" opacity="0.3"/>
  <g transform="translate(30, 133)">
    <rect x="0" y="0" width="740" height="68" rx="6" fill="#3a2a0a" stroke="#f7c948" stroke-width="1.5" opacity="0.7"/>
    <text x="15" y="22" font-family="'Courier New',Consolas,monospace" font-weight="700" font-size="12" fill="#f7c948">A2A Layer (Agent ↔ Agent)</text>
    <text x="15" y="42" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#ccc">任务委派 · 能力发现 · 跨组织协作 · 结果聚合</text>
    <text x="15" y="58" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#666">Agent间通信：对等协作、跨信任域、长时任务</text>
  </g>
  <line x1="400" y1="201" x2="400" y2="211" stroke="#f7c948" stroke-width="1" opacity="0.3"/>
  <g transform="translate(30, 211)">
    <rect x="0" y="0" width="740" height="68" rx="6" fill="#0a2a4a" stroke="#00d2ff" stroke-width="1.5" opacity="0.7"/>
    <text x="15" y="22" font-family="'Courier New',Consolas,monospace" font-weight="700" font-size="12" fill="#00d2ff">MCP Layer (Agent → Tools)</text>
    <text x="15" y="42" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#ccc">数据库 · API · 文件系统 · GitHub · Slack · Notion</text>
    <text x="15" y="58" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#666">工具接入：标准化接口、资源管理、提示模板</text>
  </g>
  <line x1="400" y1="279" x2="400" y2="289" stroke="#00d2ff" stroke-width="1" opacity="0.3"/>
  <g transform="translate(30, 289)">
    <rect x="0" y="0" width="740" height="68" rx="6" fill="#2a2a2a" stroke="#888" stroke-width="1.5" opacity="0.7"/>
    <text x="15" y="22" font-family="'Courier New',Consolas,monospace" font-weight="700" font-size="12" fill="#888">Transport Layer</text>
    <text x="15" y="42" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#ccc">HTTP / SSE / gRPC / Webhook / stdio / JSON-RPC 2.0</text>
    <text x="15" y="58" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#666">传输层：TLS加密、身份认证、连接管理</text>
  </g>
  <text x="400" y="392" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">生产级 Agent 系统 = 编排框架 + A2A 水平协作 + MCP 垂直工具 + 传输层</text>
</svg>