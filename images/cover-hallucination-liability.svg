  <circle cx="836" cy="49" r="21" fill="rgba(123,97,255,0.14)" stroke="#7b61ff" stroke-width="1.4"/>
  <text x="836" y="55" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#b9a6ff">26</text>

  <text x="40" y="120" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">AI 幻觉责任链</text>
  <text x="40" y="156" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="bold" fill="url(#sub)">从律师罚单到航司赔款，谁在为编造的政策买单</text>

  <text x="40" y="196" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#ff9f9f">约 1490 起裁决涉及 AI 幻觉材料，最大单笔律师罚款 11 万美元</text>
  <text x="40" y="220" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#ffd166">航司为机器人编造的政策赔款，法理定性为过失性虚假陈述</text>
  <text x="40" y="244" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6fe3ff">欧盟高风险义务延后 16 个月，保险却在加 AI 排除条款</text>

