  <!-- Year badge top-right -->
  <rect x="836" y="24" width="40" height="40" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
  <text x="856" y="50" font-family="system-ui,sans-serif" font-size="16" fill="#8b5cf6" text-anchor="middle" font-weight="bold">26</text>

