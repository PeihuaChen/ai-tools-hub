    <text x="24" y="15" font-family="system-ui,sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">TTS</text>
    <rect x="58" y="0" width="80" height="22" rx="11" fill="none" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="98" y="15" font-family="system-ui,sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle">语音合成</text>
    <rect x="148" y="0" width="68" height="22" rx="11" fill="none" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="182" y="15" font-family="system-ui,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">选型指南</text>
    <rect x="226" y="0" width="86" height="22" rx="11" fill="none" stroke="#10b981" stroke-width="0.8"/>
