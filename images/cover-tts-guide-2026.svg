    <rect x="20" y="10" width="4" height="60" rx="2" fill="#f59e0b"/>
    <rect x="30" y="5" width="4" height="70" rx="2" fill="#10b981"/>
    <rect x="40" y="15" width="4" height="50" rx="2" fill="#a78bfa"/>
    <rect x="50" y="22" width="4" height="36" rx="2" fill="#06b6d4"/>
    <rect x="60" y="28" width="4" height="24" rx="2" fill="#8b5cf6"/>
    <rect x="70" y="8" width="4" height="64" rx="2" fill="#f59e0b"/>
    <rect x="80" y="18" width="4" height="44" rx="2" fill="#10b981"/>
    <rect x="90" y="25" width="4" height="30" rx="2" fill="#a78bfa"/>
    <rect x="100" y="12" width="4" height="56" rx="2" fill="#06b6d4"/>
    <rect x="110" y="20" width="4" height="40" rx="2" fill="#8b5cf6"/>
    <rect x="120" y="30" width="4" height="20" rx="2" fill="#f59e0b"/>
    <rect x="130" y="15" width="4" height="50" rx="2" fill="#10b981"/>
    <rect x="140" y="22" width="4" height="36" rx="2" fill="#a78bfa"/>
    <rect x="150" y="5" width="4" height="70" rx="2" fill="#06b6d4"/>
    <rect x="160" y="28" width="4" height="24" rx="2" fill="#8b5cf6"/>
