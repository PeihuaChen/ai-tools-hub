  <text x="32" y="105" font-family="system-ui,sans-serif" font-size="28" fill="#ffffff" font-weight="bold">别再为 TTS 多花钱</text>
  <!-- Subtitle -->
  <text x="32" y="140" font-family="system-ui,sans-serif" font-size="18" fill="url(#subtitleGrad)">2026 年商用 + 开源语音合成选型指南</text>
  <text x="32" y="168" font-family="system-ui,sans-serif" font-size="15" fill="#94a3b8">含中文 / 英文 / 方言 / 小语种全维度对比</text>

  <!-- Key highlights -->
  <text x="32" y="210" font-family="system-ui,sans-serif" font-size="12.5" fill="#f59e0b">▎ 价格差 180 倍：$0.8 vs $100/百万字符，14 款模型全拆解</text>
  <text x="32" y="232" font-family="system-ui,sans-serif" font-size="12.5" fill="#10b981">▎ SIMBA 3.2 以 $6 登顶排行榜 #1，开源 Qwen3-TTS 逼近商用天花板</text>
  <text x="32" y="254" font-family="system-ui,sans-serif" font-size="12.5" fill="#a78bfa">▎ 方言 / 小语种实测：讯飞 10+ 方言、Azure 100+ 语言、MiniMax 40+ 语言</text>

