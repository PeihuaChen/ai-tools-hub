<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <text x="600" y="40" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#111827" text-anchor="middle">选型决策：你的下一个问题是哪一类？</text>
  <text x="600" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#4b5563" text-anchor="middle">两者不是替代关系而是分层关系，产物路径与工具名都不冲突，可以同时安装</text>

  <!-- root -->
  <rect x="440" y="88" width="320" height="52" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">你要问 AI 的下一个问题是什么？</text>
  <text x="600" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">先分清「结构问题」和「意图问题」</text>

  <path d="M520 140 L520 168 L250 168 L250 196" stroke="#94a3b8" stroke-width="1.6" fill="none"/>
  <path d="M244 190 L250 200 L256 190 Z" fill="#94a3b8"/>
  <path d="M600 140 L600 196" stroke="#94a3b8" stroke-width="1.6" fill="none"/>
  <path d="M594 190 L600 200 L606 190 Z" fill="#94a3b8"/>
  <path d="M680 140 L680 168 L950 168 L950 196" stroke="#94a3b8" stroke-width="1.6" fill="none"/>
  <path d="M944 190 L950 200 L956 190 Z" fill="#94a3b8"/>

  <!-- branch A -->
  <rect x="60" y="202" width="380" height="58" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="80" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#1d4ed8">结构问题</text>
  <text x="80" y="248" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1e40af">「改这个函数会炸哪里」「请求怎么走到数据库的」</text>

  <path d="M250 260 L250 288" stroke="#1d4ed8" stroke-width="1.6"/>
  <path d="M244 282 L250 292 L256 282 Z" fill="#1d4ed8"/>

  <rect x="60" y="294" width="380" height="222" rx="10" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="250" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">装 CodeGraph</text>
  <text x="80" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· 中大型仓库日常改代码，收益随规模放大</text>
  <text x="80" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· 要确定性：同样的代码永远同样的图</text>
  <text x="80" y="398" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· 要亚秒增量：agent 不停改文件，图不能过时</text>
  <text x="80" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· iOS / React Native / Expo 混合栈桥接更深</text>
  <text x="80" y="446" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· CI 里只跑受影响的测试（codegraph affected）</text>
  <text x="80" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· 机器很弱（2 核 VPS）或仓库巨大（内核级）</text>
  <text x="80" y="497" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#b91c1c">✗ 不懂文档 / ADR / 会议　✗ 索引不能团队共享</text>

  <!-- branch B -->
  <rect x="770" y="202" width="380" height="58" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="790" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#6d28d9">意图问题</text>
  <text x="790" y="248" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b21b6">「当初为什么这么设计」「这系统有哪几个子系统」</text>

  <path d="M950 260 L950 288" stroke="#6d28d9" stroke-width="1.6"/>
  <path d="M944 282 L950 292 L956 282 Z" fill="#6d28d9"/>

  <rect x="770" y="294" width="380" height="222" rx="10" fill="#f8fafc" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="960" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">装 Graphify</text>
  <text x="790" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· 知识不只在代码里：ADR / RFC / PDF / schema</text>
  <text x="790" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· 接手陌生项目：god nodes + 社区 + 图报告</text>
  <text x="790" y="398" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· 架构考古：# WHY: 注释与 ADR 引用是一等节点</text>
  <text x="790" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· 团队要共享一张图（进 Git / 共享 HTTP MCP）</text>
  <text x="790" y="446" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· 要导出到 Neo4j / Obsidian / Gephi / wiki</text>
  <text x="790" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">· PR 流程优化（prs --conflicts 合并顺序风险）</text>
  <text x="790" y="497" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#b91c1c">✗ 文档 pass 花 token 且可能静默丢　✗ 304 open issue</text>

  <!-- branch C: both -->
  <rect x="462" y="202" width="276" height="58" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.4"/>
  <text x="482" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d">两类问题你天天都遇到</text>
  <text x="482" y="248" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#166534">那就分层，两个一起装</text>

  <path d="M600 260 L600 288" stroke="#15803d" stroke-width="1.6"/>
  <path d="M594 282 L600 292 L606 282 Z" fill="#15803d"/>

  <rect x="462" y="294" width="276" height="222" rx="10" fill="#f8fafc" stroke="#15803d" stroke-width="1.6"/>
  <text x="600" y="322" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">分层组合</text>

  <rect x="482" y="338" width="236" height="62" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="600" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">结构快查层 · CodeGraph</text>
  <text x="600" y="380" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">确定性 · 零成本 · 亚秒增量</text>
  <text x="600" y="394" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">每次改代码都在用</text>

  <rect x="482" y="412" width="236" height="62" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="600" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#6d28d9" text-anchor="middle">知识汇聚层 · Graphify</text>
  <text x="600" y="454" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle">语义 · 跨模态 · 可共享</text>
  <text x="600" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle">接手项目和架构决策时用</text>

  <text x="600" y="497" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b45309" text-anchor="middle">注意：Graphify 用默认软提示，别开 strict 模式抢读文件</text>

  <!-- footer note -->
  <rect x="60" y="536" width="1090" height="58" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="80" y="560" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309">先测再信：图谱工具的收益是仓库规模与纠缠度的函数，不是常数</text>
  <text x="80" y="581" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#92400e">Graphify 官方数据：52 文件混合语料 71.5x，4 文件 5.4x，6 文件约 1x　·　CodeGraph 官方数据：VS Code 省 75%，Gin 省 41%，OkHttp 基本打平</text>
</svg>
