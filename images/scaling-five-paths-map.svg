<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a1e"/><stop offset="1" stop-color="#161638"/></linearGradient>
    <pattern id="g4" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
  </defs>
  <rect width="860" height="430" rx="12" fill="url(#m-bg)"/>
  <rect width="860" height="430" rx="12" fill="url(#g4)"/>
  <rect x="1" y="1" width="858" height="428" rx="12" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="430" y="42" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">五条突破路线：有效性 × 不确定性</text>
  <text x="430" y="68" fill="#94a3b8" font-size="13" text-anchor="middle">气泡越靠右越成熟，越靠上不确定性越高</text>

  <!-- axes -->
  <g transform="translate(90,360)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="-280" stroke="#475569" stroke-width="1.5"/>
    <text x="340" y="34" fill="#64748b" font-size="12" text-anchor="middle">当前有效性 / 成熟度 →</text>
    <text x="-34" y="-140" fill="#64748b" font-size="12" text-anchor="middle" transform="rotate(-90 -34 -140)">不确定性 →</text>

    <!-- bubbles: (x effectiveness, y uncertainty inverted) -->
    <!-- 推理时计算: high eff, low uncertainty -->
    <circle cx="560" cy="-40" r="44" fill="#3b82f6" fill-opacity="0.25" stroke="#60a5fa" stroke-width="2"/>
    <text x="560" y="-46" fill="#dbeafe" font-size="13" font-weight="700" text-anchor="middle">推理时</text>
    <text x="560" y="-28" fill="#dbeafe" font-size="13" font-weight="700" text-anchor="middle">计算</text>

    <!-- RL扩展: mid-high eff, mid uncertainty -->
    <circle cx="430" cy="-120" r="42" fill="#8b5cf6" fill-opacity="0.25" stroke="#a78bfa" stroke-width="2"/>
    <text x="430" y="-114" fill="#ede9fe" font-size="13" font-weight="700" text-anchor="middle">RL 扩展</text>

    <!-- 合成数据: mid eff, mid-high uncertainty -->
    <circle cx="330" cy="-160" r="40" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="2"/>
    <text x="330" y="-164" fill="#d1fae5" font-size="13" font-weight="700" text-anchor="middle">合成</text>
    <text x="330" y="-146" fill="#d1fae5" font-size="13" font-weight="700" text-anchor="middle">数据</text>

    <!-- Agentic: mid-high eff(product), high uncertainty -->
    <circle cx="470" cy="-205" r="42" fill="#ec4899" fill-opacity="0.25" stroke="#f472b6" stroke-width="2"/>
    <text x="470" y="-199" fill="#fce7f3" font-size="13" font-weight="700" text-anchor="middle">Agentic</text>

    <!-- 新架构: low eff, extreme uncertainty -->
    <circle cx="180" cy="-235" r="40" fill="#22d3ee" fill-opacity="0.22" stroke="#67e8f9" stroke-width="2"/>
    <text x="180" y="-239" fill="#cffafe" font-size="13" font-weight="700" text-anchor="middle">新架构</text>
    <text x="180" y="-221" fill="#cffafe" font-size="12" text-anchor="middle">持续学习</text>
  </g>

  <text x="430" y="416" fill="#64748b" font-size="12" text-anchor="middle">现实路径 = 推理时计算 + RL + 合成数据 叠加，新架构酝酿，Agentic 在应用层组织</text>
</svg>
