<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="50%" stop-color="#161638"/>
      <stop offset="100%" stop-color="#0d0d25"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/><line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="180" y1="0" x2="180" y2="383"/><line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/><line x1="720" y1="0" x2="720" y2="383"/>
  </g>

  <!-- Top / bottom accent -->
  <rect x="0" y="0" width="300" height="4" fill="url(#cyan)"/>
  <rect x="300" y="0" width="300" height="4" fill="url(#blue)"/>
  <rect x="600" y="0" width="300" height="4" fill="url(#red)"/>
  <rect x="0" y="379" width="300" height="4" fill="url(#cyan)"/>
  <rect x="300" y="379" width="300" height="4" fill="url(#blue)"/>
  <rect x="600" y="379" width="300" height="4" fill="url(#red)"/>

  <!-- Right: chat bubbles + agent action panel -->
  <g transform="translate(580, 76)">
    <!-- Bot bubble -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="120" height="34" rx="10" fill="#1e1e3a" stroke="url(#cyan)" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="7" fill="#22d3ee"/>
      <rect x="34" y="12" width="70" height="4" rx="2" fill="#3b4a6b"/>
      <rect x="34" y="21" width="50" height="4" rx="2" fill="#3b4a6b"/>
    </g>
    <!-- User bubble -->
    <g transform="translate(80,44)">
      <rect x="0" y="0" width="120" height="34" rx="10" fill="#241830" stroke="url(#red)" stroke-width="1.5"/>
      <rect x="14" y="12" width="70" height="4" rx="2" fill="#5b3b4b"/>
      <rect x="14" y="21" width="44" height="4" rx="2" fill="#5b3b4b"/>
      <circle cx="100" cy="17" r="7" fill="#f97316"/>
    </g>

    <!-- Agent action panel -->
    <g transform="translate(0,96)">
      <rect x="0" y="0" width="200" height="92" rx="12" fill="#161636" stroke="url(#blue)" stroke-width="2"/>
      <text x="14" y="22" font-family="'Courier New',monospace" font-size="11" fill="#8b5cf6">AGENT · 调用工具</text>
      <g font-family="'Courier New',monospace" font-size="10" fill="#a5b4d4">
        <circle cx="18" cy="40" r="3" fill="#22d3ee"/><text x="30" y="44">query_order()</text>
        <circle cx="18" cy="58" r="3" fill="#3b82f6"/><text x="30" y="62">update_address()</text>
        <circle cx="18" cy="76" r="3" fill="#f97316"/><text x="30" y="80">refund() → 人工</text>
      </g>
    </g>
  </g>

  <!-- Tag -->
  <g transform="translate(50, 28)">
    <rect x="0" y="0" width="150" height="30" rx="4" fill="#0a1a20" stroke="url(#cyan)" stroke-width="1"/>
    <text x="75" y="20" font-family="'Courier New',monospace" font-weight="bold" font-size="13" fill="#22d3ee" text-anchor="middle">AI 行业观察 · 全景</text>
  </g>

  <text x="50" y="108" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="bold" fill="#ffffff">智能客服 Agent 全景 2026</text>
  <text x="50" y="148" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="bold" fill="url(#cyan)">国内外厂商盘点 · 应用场景 · 成效避坑</text>

  <!-- Key highlights -->
  <g transform="translate(50, 178)">
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="13" fill="#22d3ee">从「会聊天」到「能办事」的范式切换</text>
    <text x="0" y="22" font-family="'Courier New',monospace" font-size="13" fill="#f97316">Klarna 省 4000 万 vs 74% 企业回滚</text>
    <text x="0" y="44" font-family="'Courier New',monospace" font-size="13" fill="#8b5cf6">Sierra · Agentforce · 网易七鱼 · 阿里</text>
  </g>

  <!-- Tags -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="64" height="24" rx="12" fill="#1e1e3a" stroke="#22d3ee" stroke-width="0.8"/>
    <text x="32" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#a5f3fc" text-anchor="middle">客服Agent</text>

    <rect x="72" y="0" width="64" height="24" rx="12" fill="#1e1e3a" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="104" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">大模型</text>

    <rect x="144" y="0" width="56" height="24" rx="12" fill="#1e1e3a" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="172" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">RAG</text>

    <rect x="208" y="0" width="64" height="24" rx="12" fill="#1e1e3a" stroke="#ef4444" stroke-width="0.8"/>
    <text x="240" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">成效真相</text>

    <rect x="280" y="0" width="64" height="24" rx="12" fill="#1e1e3a" stroke="#f97316" stroke-width="0.8"/>
    <text x="312" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fdba74" text-anchor="middle">中外对比</text>
  </g>

  <!-- Divider -->
  <rect x="50" y="292" width="460" height="1" fill="#fff" opacity="0.06"/>
  <text x="50" y="316" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#4a4f70">厂商盘点 · 应用场景 · 成效分析 · 选型避坑</text>
  <text x="50" y="349" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#33385a">公众号 - 最新AI知识宇宙 | 2026.06</text>

  <!-- Year badge -->
  <g transform="translate(835, 30)">
    <rect x="0" y="0" width="40" height="28" rx="4" fill="none" stroke="url(#cyan)" stroke-width="1.5"/>
    <text x="20" y="19" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#22d3ee" text-anchor="middle">26</text>
  </g>
</svg>
