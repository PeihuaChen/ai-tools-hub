<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1e"/>
      <stop offset="100%" style="stop-color:#161638"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="33%" style="stop-color:#7c3aed"/>
      <stop offset="66%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="bottomBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="33%" style="stop-color:#f59e0b"/>
      <stop offset="66%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50"/><line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="383"/><line x1="200" y1="0" x2="200" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/><line x1="400" y1="0" x2="400" y2="383"/>
    <line x1="500" y1="0" x2="500" y2="383"/><line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="700" y1="0" x2="700" y2="383"/><line x1="800" y1="0" x2="800" y2="383"/>
  </g>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topBar)"/>
  <!-- Bottom gradient bar -->
  <rect x="0" y="379" width="900" height="4" fill="url(#bottomBar)"/>

  <!-- Top-left label box -->
  <rect x="30" y="20" width="240" height="28" rx="4" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
  <text x="42" y="39" font-family="Arial, sans-serif" font-size="12" fill="#00d4ff" opacity="0.9">AI 基础设施 · 推理加速技术对比</text>

  <!-- Year badge top-right -->
  <rect x="840" y="20" width="36" height="28" rx="4" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="847" y="39" font-family="Arial Black, sans-serif" font-size="14" fill="#7c3aed" font-weight="bold">26</text>

  <!-- Main title -->
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="29" fill="#ffffff" font-weight="bold">DSpark 提速 85%、DFlash 加速 6x</text>
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="29" fill="#ffffff" font-weight="bold">推理加速两大技术路线怎么选？</text>

  <!-- Subtitle -->
  <text x="50" y="162" font-family="Arial, sans-serif" font-size="17" fill="url(#subtitleGrad)">投机解码双雄对决：置信度调度 vs 块扩散并行起草</text>

  <!-- Key highlights -->
  <text x="50" y="200" font-family="Arial, sans-serif" font-size="12.5" fill="#10b981">▸ DSpark：DeepSeek-V4 线上验证，置信度调度消除无效验证计算，吞吐提升 400%</text>
  <text x="50" y="222" font-family="Arial, sans-serif" font-size="12.5" fill="#f59e0b">▸ DFlash：NVIDIA Blackwell 官方方案，块扩散单次前向出整块 token，15x 吞吐</text>
  <text x="50" y="244" font-family="Arial, sans-serif" font-size="12.5" fill="#00d4ff">▸ DeepSpec 框架同时集成两者 + Eagle3，MIT 开源，支持 Qwen3/Gemma 4 等主流模型</text>

  <!-- Right side: conceptual diagram -->
  <!-- DSpark box -->
  <rect x="620" y="185" width="120" height="50" rx="6" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
  <text x="645" y="206" font-family="Arial, sans-serif" font-size="11" fill="#10b981">DSpark</text>
  <text x="637" y="224" font-family="Arial, sans-serif" font-size="9" fill="#8b9caf">置信度调度验证</text>

  <!-- DFlash box -->
  <rect x="760" y="185" width="110" height="50" rx="6" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
  <text x="787" y="206" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b">DFlash</text>
  <text x="772" y="224" font-family="Arial, sans-serif" font-size="9" fill="#8b9caf">块扩散并行起草</text>

  <!-- Arrow connecting -->
  <line x1="740" y1="210" x2="760" y2="210" stroke="#ffffff" stroke-width="1" opacity="0.4" stroke-dasharray="3,2"/>

  <!-- Target model box below -->
  <rect x="665" y="255" width="160" height="36" rx="6" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.6"/>
  <text x="693" y="277" font-family="Arial, sans-serif" font-size="10" fill="#7c3aed">Target LLM (验证层)</text>

  <!-- Arrows down -->
  <line x1="680" y1="235" x2="720" y2="255" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  <line x1="815" y1="235" x2="780" y2="255" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>

  <!-- Tag pills -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="72" height="22" rx="11" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="10" fill="#00d4ff">投机解码</text>

    <rect x="82" y="0" width="64" height="22" rx="11" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.6"/>
    <text x="92" y="15" font-family="Arial, sans-serif" font-size="10" fill="#7c3aed">DeepSeek</text>

    <rect x="156" y="0" width="56" height="22" rx="11" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
    <text x="166" y="15" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">NVIDIA</text>

    <rect x="222" y="0" width="68" height="22" rx="11" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6"/>
    <text x="232" y="15" font-family="Arial, sans-serif" font-size="10" fill="#10b981">推理加速</text>

    <rect x="300" y="0" width="64" height="22" rx="11" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.6"/>
    <text x="310" y="15" font-family="Arial, sans-serif" font-size="10" fill="#ec4899">Blackwell</text>

    <rect x="374" y="0" width="72" height="22" rx="11" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
    <text x="384" y="15" font-family="Arial, sans-serif" font-size="10" fill="#6366f1">MIT 开源</text>
  </g>

  <!-- Separator line -->
  <line x1="50" y1="325" x2="850" y2="325" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>

  <!-- Chapter hints -->
  <text x="50" y="345" font-family="Arial, sans-serif" font-size="11" fill="#8b9caf" opacity="0.7">技术原理 → 性能数据 → 正面对比 → 选型指南 → 行业展望</text>

  <!-- Watermark -->
  <text x="50" y="368" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" opacity="0.25">vxi.ai</text>
</svg>
