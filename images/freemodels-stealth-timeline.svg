<svg width="1080" height="960" viewBox="0 0 1080 960" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1080" height="960" fill="#f7f8fa"/>

  <text x="48" y="100" font-size="56" fill="#111827" font-weight="bold">匿名模型的免费期有多长</text>
  <text x="48" y="158" font-size="34" fill="#4b5563">条形长度按天数等比绘制</text>

  <text x="48" y="224" font-size="34" fill="#111827">Ox Alpha　8/20 上线，8/26 揭晓为 GLM-5.3-Flash</text>
  <rect x="48" y="244" width="72" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="140" y="276" font-size="34" fill="#15803d" font-weight="bold">6 天</text>

  <text x="48" y="374" font-size="34" fill="#111827">Space Bunny　9/23 上线，10/5 标注下线</text>
  <rect x="48" y="394" width="144" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="212" y="426" font-size="34" fill="#b45309" font-weight="bold">12 天，未获认领</text>

  <text x="48" y="524" font-size="34" fill="#111827">Fledge Alpha　10/1 上线，至今未揭晓</text>
  <rect x="48" y="544" width="84" height="40" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="132" y1="564" x2="196" y2="564" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="8"/>
  <text x="216" y="576" font-size="34" fill="#1d4ed8" font-weight="bold">7 天，进行中</text>

  <text x="48" y="674" font-size="34" fill="#111827">Owl Alpha　4/28 上线，6/30 美团揭晓为 LongCat-2.0</text>
  <rect x="48" y="694" width="756" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="824" y="726" font-size="34" fill="#15803d" font-weight="bold">63 天</text>

  <line x1="48" y1="790" x2="1032" y2="790" stroke="#d9e2ec" stroke-width="2"/>
  <text x="48" y="850" font-size="40" fill="#111827" font-weight="bold">7 次揭晓里，6 次在两周内</text>

  <rect x="48" y="890" width="28" height="28" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="90" y="916" font-size="32" fill="#4b5563">已揭晓</text>
  <rect x="268" y="890" width="28" height="28" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="310" y="916" font-size="32" fill="#4b5563">未获认领</text>
  <rect x="520" y="890" width="28" height="28" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="562" y="916" font-size="32" fill="#4b5563">进行中</text>
</svg>
