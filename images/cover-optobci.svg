<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="383" fill="url(#bg)"/>
  <g stroke="#2a2a55" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="383"/>
    <line x1="240" y1="0" x2="240" y2="383"/>
    <line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="480" y1="0" x2="480" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="720" y1="0" x2="720" y2="383"/>
    <line x1="840" y1="0" x2="840" y2="383"/>
  </g>

  <rect x="0" y="0" width="900" height="4" fill="url(#bar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#bar)"/>

  <!-- right concept graphic: neuron + light beam -->
  <g>
    <polygon points="640,40 860,40 790,180 700,180" fill="url(#beam)"/>
    <circle cx="745" cy="230" r="52" fill="none" stroke="#818cf8" stroke-width="3"/>
    <circle cx="745" cy="230" r="14" fill="#22d3ee"/>
    <g stroke="#22d3ee" stroke-width="2.5" fill="none">
      <path d="M 700 200 L 660 170"/>
      <path d="M 790 200 L 835 172"/>
      <path d="M 700 260 L 658 292"/>
      <path d="M 790 262 L 836 292"/>
      <path d="M 745 282 L 745 330"/>
    </g>
    <g fill="#f472b6">
      <circle cx="660" cy="170" r="7"/>
      <circle cx="835" cy="172" r="7"/>
      <circle cx="658" cy="292" r="7"/>
      <circle cx="836" cy="292" r="7"/>
      <circle cx="745" cy="330" r="7"/>
    </g>
  </g>

  <!-- top-left tag -->
  <rect x="40" y="34" width="240" height="40" rx="8" fill="#0e7490" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="160" y="61" font-size="19" fill="#67e8f9" text-anchor="middle">AI 行业观察 · 诺奖解读</text>

  <!-- year badge -->
  <rect x="812" y="34" width="52" height="40" rx="8" fill="#818cf8" fill-opacity="0.18" stroke="#818cf8" stroke-width="1.5"/>
  <text x="838" y="61" font-size="20" fill="#a5b4fc" text-anchor="middle" font-weight="bold">26</text>

  <!-- main title -->
  <text x="40" y="132" font-size="31" font-weight="bold" fill="#ffffff">用光开关神经元</text>
  <text x="40" y="168" font-size="18" fill="url(#sub)">2026 诺奖 × 脑机接口的下一站</text>

  <!-- highlights -->
  <text x="40" y="206" font-size="13" fill="#f8b4b4">01 · 医学奖授予光遗传学三人组，一束蓝光开关活体神经元</text>
  <text x="40" y="230" font-size="13" fill="#a5b4fc">02 · 从科研工具到复明临床：失明患者重新“看见”光</text>
  <text x="40" y="254" font-size="13" fill="#6ee7b7">03 · 脑机接口从“读脑”走向“写脑”，读写闭环才是下一站</text>

  <!-- pills -->
  <g font-size="13">
    <rect x="40" y="278" width="96" height="30" rx="15" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="88" y="298" fill="#67e8f9" text-anchor="middle">光遗传学</text>
    <rect x="146" y="278" width="96" height="30" rx="15" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <text x="194" y="298" fill="#a5b4fc" text-anchor="middle">脑机接口</text>
    <rect x="252" y="278" width="112" height="30" rx="15" fill="none" stroke="#f472b6" stroke-width="1.5"/>
    <text x="308" y="298" fill="#f9a8d4" text-anchor="middle">Deisseroth</text>
    <rect x="374" y="278" width="96" height="30" rx="15" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="422" y="298" fill="#fde68a" text-anchor="middle">复明临床</text>
  </g>

  <!-- bottom -->
  <line x1="40" y1="330" x2="560" y2="330" stroke="#2a2a55" stroke-width="1.5"/>
  <text x="40" y="356" font-size="13" fill="#94a3b8">从实验室的蓝光，到脑机接口的读写闭环 · 2026 诺奖季观察</text>
  <text x="860" y="356" font-size="13" fill="#64748b" text-anchor="end">微信公众号 · AI 行业观察</text>
</svg>
