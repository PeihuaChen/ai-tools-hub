<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a1e"/><stop offset="1" stop-color="#161638"/></linearGradient>
  </defs>
  <rect width="860" height="400" fill="url(#dbg)"/>
  <rect width="860" height="3" fill="#a855f7"/>

  <text x="40" y="44" font-size="20" font-weight="700" fill="#ffffff">世界模型增强通用智能体的两大范式</text>

  <!-- Paradigm 1 -->
  <rect x="40" y="72" width="380" height="290" rx="14" fill="#0e1430" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.6"/>
  <rect x="40" y="72" width="380" height="40" rx="14" fill="#0ea5e9" fill-opacity="0.16"/>
  <text x="62" y="98" font-size="16" font-weight="700" fill="#7dd3fc">范式 ① 解耦的环境模拟器</text>

  <text x="62" y="134" font-size="13" fill="#cbd2f5">当虚拟沙箱用 · 无需真实基建即可并行模拟数千环境</text>

  <!-- diagram p1 -->
  <rect x="70" y="152" width="120" height="44" rx="8" fill="none" stroke="#a855f7" stroke-opacity="0.7"/>
  <text x="130" y="179" text-anchor="middle" font-size="13" fill="#c8a8ff">策略智能体</text>
  <rect x="268" y="152" width="120" height="44" rx="8" fill="none" stroke="#22d3ee" stroke-opacity="0.7"/>
  <text x="328" y="172" text-anchor="middle" font-size="12" fill="#9beaf2">AgentWorld</text>
  <text x="328" y="188" text-anchor="middle" font-size="12" fill="#9beaf2">(模拟环境)</text>
  <g stroke="#6366f1" stroke-width="1.6" fill="#6366f1">
    <line x1="190" y1="166" x2="262" y2="166"/><polygon points="266,166 257,161 257,171"/>
    <line x1="262" y1="184" x2="194" y2="184"/><polygon points="190,184 199,179 199,189"/>
  </g>
  <text x="228" y="160" text-anchor="middle" font-size="10" fill="#8a90b8">动作</text>
  <text x="228" y="200" text-anchor="middle" font-size="10" fill="#8a90b8">预测观测</text>

  <text x="62" y="232" font-size="12.5" font-weight="600" fill="#7dd3fc">实测效果</text>
  <g font-size="12" fill="#aeb4d8">
    <text x="62" y="254">· WideSearch F1：34.02 → 50.31</text>
    <text x="62" y="276">· MCPMark：21.5 → 33.8</text>
    <text x="62" y="298">· Tool Decathlon：32.4 → 36.1</text>
    <text x="62" y="320">· Claw-Eval：65.4 → 69.7</text>
  </g>
  <text x="62" y="348" font-size="11" fill="#6ee7b7">可控注入对抗场景，泛化甚至超越真实环境训练</text>

  <!-- Paradigm 2 -->
  <rect x="440" y="72" width="380" height="290" rx="14" fill="#0e1430" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.6"/>
  <rect x="440" y="72" width="380" height="40" rx="14" fill="#ec4899" fill-opacity="0.16"/>
  <text x="462" y="98" font-size="16" font-weight="700" fill="#f9a8d4">范式 ② 统一的智能体基座</text>

  <text x="462" y="134" font-size="13" fill="#cbd2f5">当训练预热用 · 把"预判未来"内化为原生思考</text>

  <!-- diagram p2 -->
  <g font-size="11.5">
    <rect x="470" y="152" width="74" height="40" rx="8" fill="none" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="507" y="176" text-anchor="middle" fill="#9beaf2">状态+动作</text>
    <rect x="580" y="152" width="74" height="40" rx="8" fill="none" stroke="#a855f7" stroke-opacity="0.7"/>
    <text x="617" y="176" text-anchor="middle" fill="#c8a8ff">思考未来</text>
    <rect x="690" y="152" width="74" height="40" rx="8" fill="none" stroke="#f59e0b" stroke-opacity="0.7"/>
    <text x="727" y="176" text-anchor="middle" fill="#fbbf72">优化选择</text>
  </g>
  <g stroke="#6366f1" stroke-width="1.6" fill="#6366f1">
    <line x1="544" y1="172" x2="576" y2="172"/><polygon points="580,172 571,167 571,177"/>
    <line x1="654" y1="172" x2="686" y2="172"/><polygon points="690,172 681,167 681,177"/>
  </g>

  <text x="462" y="232" font-size="12.5" font-weight="600" fill="#f9a8d4">实测效果（含域外迁移）</text>
  <g font-size="12" fill="#aeb4d8">
    <text x="462" y="254">· SWE-Bench Verified：64.47 → 67.86</text>
    <text x="462" y="276">· Terminal-Bench 2.0：33.25 → 39.55</text>
    <text x="462" y="298">· BFCL v4（域外）：62.29 → 71.25</text>
    <text x="462" y="320">· Claw-Eval（域外）：53.60 → 64.88</text>
  </g>
  <text x="462" y="348" font-size="11" fill="#6ee7b7">环境预测准确率 69.9% → 78.3%，先预测再行动</text>
</svg>
