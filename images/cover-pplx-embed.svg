<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="48" x2="900" y2="48"/>
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="0" y1="336" x2="900" y2="336"/>
    <line x1="150" y1="0" x2="150" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="750" y1="0" x2="750" y2="383"/>
  </g>

  <rect x="0" y="0" width="900" height="4" fill="url(#topbar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#topbar)"/>

  <!-- right concept: query tokens MaxSim-matched to page tokens -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="660" y="94">Query</text>
    <text x="810" y="94">Page</text>
  </g>
  <!-- page outline -->
  <rect x="770" y="104" width="80" height="170" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#818cf8" stroke-opacity="0.5"/>
  <g fill="#818cf8" fill-opacity="0.55">
    <rect x="782" y="116" width="56" height="12" rx="2"/>
    <rect x="782" y="136" width="56" height="12" rx="2"/>
    <rect x="782" y="156" width="26" height="30" rx="2"/>
    <rect x="812" y="156" width="26" height="30" rx="2"/>
    <rect x="782" y="194" width="56" height="12" rx="2"/>
    <rect x="782" y="214" width="56" height="12" rx="2"/>
    <rect x="782" y="234" width="56" height="12" rx="2"/>
    <rect x="782" y="254" width="40" height="10" rx="2"/>
  </g>
  <!-- query tokens -->
  <g fill="#22d3ee" fill-opacity="0.85">
    <rect x="648" y="120" width="24" height="24" rx="4"/>
    <rect x="648" y="160" width="24" height="24" rx="4"/>
    <rect x="648" y="200" width="24" height="24" rx="4"/>
    <rect x="648" y="240" width="24" height="24" rx="4"/>
  </g>
  <!-- MaxSim links -->
  <g stroke="#34d399" stroke-width="1.6" stroke-opacity="0.8">
    <line x1="672" y1="132" x2="782" y2="142"/>
    <line x1="672" y1="172" x2="795" y2="171"/>
    <line x1="672" y1="212" x2="782" y2="220"/>
    <line x1="672" y1="252" x2="782" y2="240"/>
  </g>
  <g fill="#34d399">
    <circle cx="782" cy="142" r="3"/>
    <circle cx="795" cy="171" r="3"/>
    <circle cx="782" cy="220" r="3"/>
    <circle cx="782" cy="240" r="3"/>
  </g>
  <text x="755" y="300" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#86efac" text-anchor="middle">MaxSim · 128 维/token</text>

  <!-- year badge -->
  <circle cx="852" cy="40" r="19" fill="#1e293b" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="852" y="46" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#22d3ee" text-anchor="middle">26</text>

  <!-- tag box -->
  <rect x="48" y="44" width="230" height="30" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="63" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#67e8f9">AI 技术解析 · 多模态检索</text>

  <!-- title -->
  <text x="48" y="128" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#ffffff">PDF 不用 OCR 也能搜</text>
  <text x="48" y="168" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="url(#sub)">Perplexity pplx-embed-v2-late 原理、跑分与落地</text>

  <!-- highlights -->
  <text x="48" y="210" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#67e8f9">▸ 0.6B 与 9B 共享向量空间：大模型建索引，小模型做查询</text>
  <text x="48" y="234" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#86efac">▸ 页面直接当图片编码，PDF、幻灯片、扫描件免 OCR</text>
  <text x="48" y="258" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#fca5a5">▸ MADQA 92.4%，MIT 协议可商用，代价是索引随文档变长</text>

  <!-- pills -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">
    <rect x="48" y="284" width="90" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="93" y="301" fill="#67e8f9" text-anchor="middle">pplx-embed</text>
    <rect x="146" y="284" width="66" height="26" rx="13" fill="none" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="179" y="301" fill="#86efac" text-anchor="middle">晚交互</text>
    <rect x="220" y="284" width="76" height="26" rx="13" fill="none" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="258" y="301" fill="#c4b5fd" text-anchor="middle">ColBERT</text>
    <rect x="304" y="284" width="96" height="26" rx="13" fill="none" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="352" y="301" fill="#f9a8d4" text-anchor="middle">多模态 RAG</text>
    <rect x="408" y="284" width="56" height="26" rx="13" fill="none" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="436" y="301" fill="#fcd34d" text-anchor="middle">MIT</text>
  </g>

  <!-- footer -->
  <line x1="48" y1="336" x2="852" y2="336" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="48" y="360" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#64748b">模型概览 · 晚交互原理 · 共享向量空间 · 跑分强弱 · 竞品对比 · 落地指南</text>
  <text x="852" y="360" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#475569" text-anchor="end">公众号 · AI 行业观察</text>
</svg>
