<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgGrad2)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">Autoreason 效果 vs 模型能力（CodeContests Private-Test 通过率）</text>
  
  <!-- Chart area -->
  <rect x="100" y="50" width="600" height="300" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Y-axis labels -->
  <text x="90" y="350" text-anchor="end" fill="#888" font-size="10">0%</text>
  <text x="90" y="290" text-anchor="end" fill="#888" font-size="10">20%</text>
  <text x="90" y="230" text-anchor="end" fill="#888" font-size="10">40%</text>
  <text x="90" y="170" text-anchor="end" fill="#888" font-size="10">60%</text>
  <text x="90" y="110" text-anchor="end" fill="#888" font-size="10">80%</text>
  <text x="90" y="55" text-anchor="end" fill="#888" font-size="10">100%</text>
  
  <!-- Y-axis title -->
  <text x="30" y="200" text-anchor="middle" fill="#aaa" font-size="11" transform="rotate(-90, 30, 200)">通过率 (%)</text>
  
  <!-- Grid lines -->
  <line x1="100" y1="290" x2="700" y2="290" stroke="#333" stroke-width="0.5" stroke-dasharray="3"/>
  <line x1="100" y1="230" x2="700" y2="230" stroke="#333" stroke-width="0.5" stroke-dasharray="3"/>
  <line x1="100" y1="170" x2="700" y2="170" stroke="#333" stroke-width="0.5" stroke-dasharray="3"/>
  <line x1="100" y1="110" x2="700" y2="110" stroke="#333" stroke-width="0.5" stroke-dasharray="3"/>
  
  <!-- X-axis labels (models) -->
  <text x="180" y="370" text-anchor="middle" fill="#888" font-size="10">Llama 8B</text>
  <text x="300" y="370" text-anchor="middle" fill="#888" font-size="10">Gemini Flash</text>
  <text x="420" y="370" text-anchor="middle" fill="#888" font-size="10">Haiku 3.5</text>
  <text x="540" y="370" text-anchor="middle" fill="#888" font-size="10">Haiku 4.5</text>
  <text x="660" y="370" text-anchor="middle" fill="#888" font-size="10">Sonnet 4.6</text>
  
  <!-- X-axis subtitle -->
  <text x="400" y="390" text-anchor="middle" fill="#aaa" font-size="11">模型能力 →</text>
  
  <!-- Autoreason line (blue) -->
  <polyline points="180,335 300,305 420,230 540,170 660,110" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="180" cy="335" r="5" fill="#4a90d9"/>
  <circle cx="300" cy="305" r="5" fill="#4a90d9"/>
  <circle cx="420" cy="230" r="5" fill="#4a90d9"/>
  <circle cx="540" cy="170" r="5" fill="#4a90d9"/>
  <circle cx="660" cy="110" r="5" fill="#4a90d9"/>
  
  <!-- Single-pass line (gray) -->
  <polyline points="180,340 300,315 420,260 540,170 660,115" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="180" cy="340" r="4" fill="#888"/>
  <circle cx="300" cy="315" r="4" fill="#888"/>
  <circle cx="420" cy="260" r="4" fill="#888"/>
  <circle cx="540" cy="170" r="4" fill="#888"/>
  <circle cx="660" cy="115" r="4" fill="#888"/>
  
  <!-- Gain area (shaded between lines) -->
  <path d="M180,335 L300,305 L420,230 L540,170 L660,110 L660,115 L540,170 L420,260 L300,315 L180,340 Z" fill="#4a90d9" opacity="0.15"/>
  
  <!-- Annotations -->
  <!-- Peak gain at Haiku 3.5 -->
  <line x1="420" y1="230" x2="420" y2="260" stroke="#2ecc71" stroke-width="2"/>
  <text x="420" y="250" text-anchor="start" fill="#2ecc71" font-size="10" dx="8">+9pp 最大增益</text>
  
  <!-- No gain at Sonnet 4.6 -->
  <text x="660" y="100" text-anchor="middle" fill="#e74c3c" font-size="9">增益消失</text>
  
  <!-- Sweet spot annotation -->
  <rect x="350" y="270" width="140" height="25" rx="4" fill="#2ecc71" opacity="0.2" stroke="#2ecc71" stroke-width="1"/>
  <text x="420" y="287" text-anchor="middle" fill="#2ecc71" font-size="10" font-weight="bold">⭐ 最佳性价比区间</text>
  
  <!-- Legend -->
  <rect x="550" y="45" width="140" height="50" rx="6" fill="#1a1a2e" stroke="#333"/>
  <line x1="560" y1="62" x2="590" y2="62" stroke="#4a90d9" stroke-width="3"/>
  <text x="600" y="66" fill="#4a90d9" font-size="10">Autoreason</text>
  <line x1="560" y1="82" x2="590" y2="82" stroke="#888" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="600" y="86" fill="#888" font-size="10">单次生成</text>
</svg>