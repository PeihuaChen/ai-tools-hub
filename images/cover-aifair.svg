<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2a2a55" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="4" fill="url(#topbar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#topbar)"/>

  <!-- 左上角标签框 -->
  <rect x="48" y="40" width="236" height="34" rx="8" fill="#1d1d40" stroke="#34d399" stroke-width="1.5"/>
  <text x="66" y="63" font-size="16" fill="#6ee7b7" font-weight="bold">AI 行业观察 · 负责任 AI</text>

  <!-- 右上角年份徽章 -->
  <circle cx="838" cy="58" r="26" fill="#1d1d40" stroke="#a78bfa" stroke-width="2"/>
  <text x="838" y="66" font-size="24" fill="#a78bfa" font-weight="bold" text-anchor="middle">26</text>

  <!-- 主标题 -->
  <text x="48" y="132" font-size="40" fill="#ffffff" font-weight="bold">AI 公平性工具全解析</text>
  <!-- 副标题 -->
  <text x="48" y="170" font-size="19" fill="url(#title)" font-weight="bold">7 款开源偏见检测框架选型指南</text>

  <!-- 三行关键亮点 -->
  <text x="48" y="212" font-size="14" fill="#34d399">▪ 表格模型：Fairlearn 起步，AIF360 算法最全</text>
  <text x="48" y="238" font-size="14" fill="#22d3ee">▪ 大模型：LangFair 测用例，LangTest 跑 60+ 测试</text>
  <text x="48" y="264" font-size="14" fill="#f472b6">▪ 工具只给证据，不能证明「没有歧视」</text>

  <!-- 标签栏 pill -->
  <g font-size="13">
    <rect x="48" y="292" width="84" height="28" rx="14" fill="none" stroke="#34d399" stroke-width="1.2"/>
    <text x="90" y="311" fill="#6ee7b7" text-anchor="middle">Fairlearn</text>
    <rect x="142" y="292" width="72" height="28" rx="14" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="178" y="311" fill="#93c5fd" text-anchor="middle">AIF360</text>
    <rect x="224" y="292" width="80" height="28" rx="14" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="264" y="311" fill="#67e8f9" text-anchor="middle">Aequitas</text>
    <rect x="314" y="292" width="80" height="28" rx="14" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="354" y="311" fill="#c4b5fd" text-anchor="middle">LangFair</text>
    <rect x="404" y="292" width="72" height="28" rx="14" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="440" y="311" fill="#fcd34d" text-anchor="middle">AI Act</text>
  </g>

  <!-- 右侧概念示意：天平 + 分组柱状对比 -->
  <g stroke="#4b5b8a" stroke-width="2" fill="none">
    <line x1="710" y1="120" x2="710" y2="250"/>
    <line x1="630" y1="140" x2="790" y2="130"/>
    <line x1="630" y1="140" x2="610" y2="185"/>
    <line x1="630" y1="140" x2="650" y2="185"/>
    <line x1="790" y1="130" x2="770" y2="175"/>
    <line x1="790" y1="130" x2="810" y2="175"/>
  </g>
  <circle cx="710" cy="120" r="7" fill="#1d1d40" stroke="#a78bfa" stroke-width="2"/>
  <path d="M604 185 Q630 200 656 185" fill="#2a1f4d" stroke="#a78bfa" stroke-width="2"/>
  <path d="M764 175 Q790 190 816 175" fill="#0f3320" stroke="#34d399" stroke-width="2"/>
  <rect x="680" y="250" width="60" height="8" rx="3" fill="#1d1d40" stroke="#4b5b8a" stroke-width="1.5"/>
  <!-- 分组柱 -->
  <rect x="610" y="290" width="18" height="30" fill="#34d399" opacity="0.85"/>
  <rect x="632" y="300" width="18" height="20" fill="#f472b6" opacity="0.85"/>
  <rect x="690" y="284" width="18" height="36" fill="#34d399" opacity="0.85"/>
  <rect x="712" y="286" width="18" height="34" fill="#f472b6" opacity="0.85"/>
  <rect x="770" y="294" width="18" height="26" fill="#34d399" opacity="0.85"/>
  <rect x="792" y="306" width="18" height="14" fill="#f472b6" opacity="0.85"/>
  <line x1="600" y1="320" x2="820" y2="320" stroke="#4b5b8a" stroke-width="1.5"/>

  <!-- 底部分隔线 + 章节提示 + 水印 -->
  <line x1="48" y1="342" x2="852" y2="342" stroke="#2a2a55" stroke-width="1"/>
  <text x="48" y="366" font-size="13" fill="#8892b0">公平性定义 · 两条技术路线 · 七步审计流程 · 合规要求</text>
  <text x="852" y="366" font-size="12" fill="#5a6382" text-anchor="end">AI 行业观察</text>
</svg>
