  <!-- Tag -->
  <g transform="translate(50, 28)">
    <rect x="0" y="0" width="200" height="30" rx="4" fill="#0a1a20" stroke="url(#cyan)" stroke-width="1"/>
    <text x="100" y="20" font-family="'Courier New',monospace" font-weight="bold" font-size="13" fill="#22d3ee" text-anchor="middle">AI 开发平台 · 推理框架</text>
  </g>

  <text x="50" y="112" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="28" font-weight="bold" fill="#ffffff">大模型推理框架选型 2026</text>
  <text x="50" y="150" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="bold" fill="url(#cyan)">vLLM · SGLang · TensorRT-LLM · Ollama · Xinference</text>

  <!-- Key highlights -->
  <g transform="translate(50, 178)">
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="12" fill="#22d3ee">PagedAttention vs RadixAttention 核心技术拆解</text>
    <text x="0" y="20" font-family="'Courier New',monospace" font-size="12" fill="#34d399">引擎层 vs 平台层 · 五种场景明确推荐</text>
    <text x="0" y="40" font-family="'Courier New',monospace" font-size="12" fill="#f59e0b">H100 benchmark · SGLang 延迟低35% · 2.3x吞吐差</text>
  </g>

  <!-- Tags -->
  <g transform="translate(50, 248)">
    <rect x="0" y="0" width="48" height="24" rx="12" fill="#1e1e3a" stroke="#06b6d4" stroke-width="0.8"/>
    <text x="24" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#a5f3fc" text-anchor="middle">vLLM</text>

    <rect x="56" y="0" width="52" height="24" rx="12" fill="#1e1e3a" stroke="#10b981" stroke-width="0.8"/>
    <text x="82" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">SGLang</text>

    <rect x="116" y="0" width="52" height="24" rx="12" fill="#1e1e3a" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="142" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">TRT-LLM</text>

    <rect x="176" y="0" width="52" height="24" rx="12" fill="#1e1e3a" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="202" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fde047" text-anchor="middle">Ollama</text>

    <rect x="236" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#ef4444" stroke-width="0.8"/>
    <text x="270" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">Xinference</text>

    <rect x="312" y="0" width="64" height="24" rx="12" fill="#1e1e3a" stroke="#64748b" stroke-width="0.8"/>
    <text x="344" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">llama.cpp</text>
  </g>

  <!-- Divider -->
  <rect x="50" y="290" width="460" height="1" fill="#fff" opacity="0.06"/>
  <text x="50" y="314" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#4a4f70">核心技术 · 性能对比 · 场景推荐 · 2026趋势</text>
  <text x="50" y="349" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#33385a">公众号 - 最新AI知识宇宙 | 2026.06</text>

  <!-- Year badge -->
  <g transform="translate(835, 30)">
    <rect x="0" y="0" width="40" height="28" rx="4" fill="none" stroke="url(#cyan)" stroke-width="1.5"/>
    <text x="20" y="19" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#22d3ee" text-anchor="middle">26</text>
  </g>
</svg>
