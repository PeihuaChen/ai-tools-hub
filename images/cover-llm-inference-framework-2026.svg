<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="50%" stop-color="#161638"/>
      <stop offset="100%" stop-color="#0d0d25"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/><line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="180" y1="0" x2="180" y2="383"/><line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/><line x1="720" y1="0" x2="720" y2="383"/>
  </g>

  <!-- Top / bottom accent -->
  <rect x="0" y="0" width="180" height="4" fill="url(#cyan)"/>
  <rect x="180" y="0" width="180" height="4" fill="url(#green)"/>
  <rect x="360" y="0" width="180" height="4" fill="url(#purple)"/>
  <rect x="540" y="0" width="180" height="4" fill="url(#orange)"/>
  <rect x="720" y="0" width="180" height="4" fill="url(#red)"/>
  <rect x="0" y="379" width="180" height="4" fill="url(#cyan)"/>
  <rect x="180" y="379" width="180" height="4" fill="url(#green)"/>
  <rect x="360" y="379" width="180" height="4" fill="url(#purple)"/>
  <rect x="540" y="379" width="180" height="4" fill="url(#orange)"/>
  <rect x="720" y="379" width="180" height="4" fill="url(#red)"/>

  <!-- Right: Framework stack cards -->
  <g transform="translate(580, 60)">
    <!-- vLLM -->
    <g>
      <rect x="0" y="0" width="130" height="38" rx="8" fill="#1e1e3a" stroke="url(#cyan)" stroke-width="1.5"/>
      <circle cx="18" cy="19" r="6" fill="#22d3ee"/>
      <text x="32" y="23" font-family="'Courier New',monospace" font-size="12" font-weight="bold" fill="#e2e8f0">vLLM</text>
      <text x="82" y="23" font-family="'Courier New',monospace" font-size="9" fill="#64748b">生产标准</text>
    </g>
    <!-- SGLang -->
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="130" height="38" rx="8" fill="#1e1e3a" stroke="url(#green)" stroke-width="1.5"/>
      <circle cx="18" cy="19" r="6" fill="#34d399"/>
      <text x="32" y="23" font-family="'Courier New',monospace" font-size="12" font-weight="bold" fill="#e2e8f0">SGLang</text>
      <text x="92" y="23" font-family="'Courier New',monospace" font-size="9" fill="#64748b">Agent</text>
    </g>
    <!-- TensorRT-LLM -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="130" height="38" rx="8" fill="#1e1e3a" stroke="url(#purple)" stroke-width="1.5"/>
      <circle cx="18" cy="19" r="6" fill="#a78bfa"/>
      <text x="32" y="23" font-family="'Courier New',monospace" font-size="11" font-weight="bold" fill="#e2e8f0">TRT-LLM</text>
      <text x="94" y="23" font-family="'Courier New',monospace" font-size="9" fill="#64748b">极致</text>
    </g>
    <!-- Ollama -->
    <g transform="translate(140, 48)">
      <rect x="0" y="0" width="130" height="38" rx="8" fill="#1e1e3a" stroke="url(#orange)" stroke-width="1.5"/>
      <circle cx="18" cy="19" r="6" fill="#fbbf24"/>
      <text x="32" y="23" font-family="'Courier New',monospace" font-size="12" font-weight="bold" fill="#e2e8f0">Ollama</text>
      <text x="90" y="23" font-family="'Courier New',monospace" font-size="9" fill="#64748b">本地</text>
    </g>
    <!-- Xinference -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="130" height="38" rx="8" fill="#1e1e3a" stroke="url(#red)" stroke-width="1.5"/>
      <circle cx="18" cy="19" r="6" fill="#f97316"/>
      <text x="32" y="23" font-family="'Courier New',monospace" font-size="11" font-weight="bold" fill="#e2e8f0">Xinference</text>
      <text x="106" y="23" font-family="'Courier New',monospace" font-size="9" fill="#64748b">平台</text>
    </g>
    <!-- llama.cpp -->
    <g transform="translate(140, 96)">
      <rect x="0" y="0" width="130" height="38" rx="8" fill="#1e1e3a" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="18" cy="19" r="6" fill="#94a3b8"/>
      <text x="32" y="23" font-family="'Courier New',monospace" font-size="11" font-weight="bold" fill="#e2e8f0">llama.cpp</text>
      <text x="102" y="23" font-family="'Courier New',monospace" font-size="9" fill="#64748b">边缘</text>
    </g>

    <!-- Layer label -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="270" height="50" rx="8" fill="#161636" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" font-family="'Courier New',monospace" font-size="10" fill="#94a3b8">引擎层: PagedAttention vs RadixAttention</text>
      <text x="14" y="38" font-family="'Courier New',monospace" font-size="10" fill="#94a3b8">平台层: 多模型编排 + 统一 API</text>
    </g>
