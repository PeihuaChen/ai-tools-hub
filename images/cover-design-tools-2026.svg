<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="33%" stop-color="#8b5cf6"/>
      <stop offset="66%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bottomBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="33%" stop-color="#f59e0b"/>
      <stop offset="66%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="subtitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="383"/>
    <line x1="200" y1="0" x2="200" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="400" y1="0" x2="400" y2="383"/>
    <line x1="500" y1="0" x2="500" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="700" y1="0" x2="700" y2="383"/>
    <line x1="800" y1="0" x2="800" y2="383"/>
  </g>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topBar)"/>
  <!-- Bottom gradient bar -->
  <rect x="0" y="379" width="900" height="4" fill="url(#bottomBar)"/>

  <!-- Top-left label box -->
  <rect x="30" y="24" width="260" height="28" rx="4" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.8"/>
  <text x="42" y="43" font-family="sans-serif" font-size="12" fill="#06b6d4">AI 工具横评 · 设计工具选型指南</text>

  <!-- Year badge top-right -->
  <rect x="840" y="20" width="40" height="40" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="848" y="47" font-family="sans-serif" font-size="20" font-weight="bold" fill="#8b5cf6">26</text>

  <!-- Main title -->
  <text x="30" y="100" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">告别按 License 付费</text>
  <text x="30" y="138" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">6 款开源/免费设计工具深度横评</text>

  <!-- Subtitle -->
  <text x="30" y="172" font-family="sans-serif" font-size="17" fill="url(#subtitle)">Penpot · Lunacy · Excalidraw · Quant-UX · Plasmic · Graphite</text>

  <!-- Key highlights -->
  <text x="30" y="210" font-family="sans-serif" font-size="12" fill="#10b981">▸ Penpot 57k Star | 西班牙政府 €6.9M 融资 | MPL 2.0 开源 | 自托管 + AI Agent</text>
  <text x="30" y="232" font-family="sans-serif" font-size="12" fill="#f59e0b">▸ Figma 涨价至 $16-$90/人/月 | Adobe XD 停止开发 | 供应商锁定风险上升</text>
  <text x="30" y="254" font-family="sans-serif" font-size="12" fill="#06b6d4">▸ 完整功能矩阵 + 成本对比 + 数据主权分析 + 选型决策树 + 迁移指南</text>

  <!-- Tags row -->
  <g transform="translate(30, 278)">
    <rect x="0" y="0" width="72" height="24" rx="12" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <text x="12" y="16" font-family="sans-serif" font-size="10" fill="#c4b5fd">开源设计</text>
    <rect x="82" y="0" width="52" height="24" rx="12" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <text x="93" y="16" font-family="sans-serif" font-size="10" fill="#67e8f9">Penpot</text>
    <rect x="144" y="0" width="52" height="24" rx="12" fill="none" stroke="#10b981" stroke-width="1"/>
    <text x="154" y="16" font-family="sans-serif" font-size="10" fill="#6ee7b7">Lunacy</text>
    <rect x="206" y="0" width="86" height="24" rx="12" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <text x="218" y="16" font-family="sans-serif" font-size="10" fill="#fcd34d">数据主权</text>
    <rect x="302" y="0" width="70" height="24" rx="12" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <text x="312" y="16" font-family="sans-serif" font-size="10" fill="#67e8f9">AI Agent</text>
    <rect x="382" y="0" width="72" height="24" rx="12" fill="none" stroke="#10b981" stroke-width="1"/>
    <text x="393" y="16" font-family="sans-serif" font-size="10" fill="#6ee7b7">零成本</text>
  </g>

  <!-- Right side: conceptual diagram -->
  <g transform="translate(620, 80)">
    <!-- Central hub -->
    <circle cx="120" cy="90" r="30" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
    <text x="100" y="94" font-family="sans-serif" font-size="10" fill="#c4b5fd">Design</text>
    <!-- Nodes -->
    <circle cx="50" cy="40" r="18" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
    <text x="36" y="44" font-family="sans-serif" font-size="8" fill="#67e8f9">SVG</text>
    <circle cx="190" cy="40" r="18" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6"/>
    <text x="176" y="44" font-family="sans-serif" font-size="8" fill="#6ee7b7">CSS</text>
    <circle cx="50" cy="140" r="18" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
    <text x="38" y="144" font-family="sans-serif" font-size="8" fill="#fcd34d">Free</text>
    <circle cx="190" cy="140" r="18" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
    <text x="181" y="144" font-family="sans-serif" font-size="8" fill="#67e8f9">AI</text>
    <!-- Connections -->
    <line x1="68" y1="52" x2="92" y2="72" stroke="#4b5563" stroke-width="0.8" stroke-dasharray="3"/>
    <line x1="172" y1="52" x2="148" y2="72" stroke="#4b5563" stroke-width="0.8" stroke-dasharray="3"/>
    <line x1="68" y1="128" x2="92" y2="108" stroke="#4b5563" stroke-width="0.8" stroke-dasharray="3"/>
    <line x1="172" y1="128" x2="148" y2="108" stroke="#4b5563" stroke-width="0.8" stroke-dasharray="3"/>
  </g>

  <!-- Bottom section divider -->
  <line x1="30" y1="330" x2="870" y2="330" stroke="#374151" stroke-width="0.5"/>

  <!-- Bottom text -->
  <text x="30" y="352" font-family="sans-serif" font-size="11" fill="#6b7280">7 章完整指南 | 功能矩阵 · 成本对比 · 数据主权 · 选型决策树 · 迁移指南 · AI 生态</text>
  <text x="30" y="370" font-family="sans-serif" font-size="9" fill="#4b5563" opacity="0.7">xiaoi.ai</text>
</svg>
