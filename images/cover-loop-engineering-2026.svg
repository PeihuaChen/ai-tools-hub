<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="33%" stop-color="#7c3aed"/>
      <stop offset="66%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bottomBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="33%" stop-color="#f59e0b"/>
      <stop offset="66%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="subtitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topBar)"/>
  <!-- Bottom gradient bar -->
  <rect x="0" y="379" width="900" height="4" fill="url(#bottomBar)"/>

  <!-- Left label box -->
  <rect x="32" y="28" width="240" height="28" rx="4" fill="none" stroke="#00d4aa" stroke-opacity="0.6" stroke-width="1"/>
  <text x="42" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#00d4aa" opacity="0.9">AI 工程实践 · Loop Engineering</text>

  <!-- Year badge top-right -->
  <rect x="832" y="24" width="44" height="44" rx="6" fill="none" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="854" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#7c3aed" text-anchor="middle">26</text>

  <!-- Main title -->
  <text x="42" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2026 年中最热 AI 概念</text>
  <text x="42" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Loop Engineering</text>

  <!-- Subtitle -->
  <text x="42" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="url(#subtitle)">为何一天 650 万阅读量？从概念到落地全景拆解</text>

  <!-- Key highlights -->
  <text x="42" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#00d4aa" opacity="0.85">▸ 三级跳进化：Prompt → Context → Loop Engineering</text>
  <text x="42" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f59e0b" opacity="0.85">▸ 十大设计模式 + 五核心原语 + 成本控制策略</text>
  <text x="42" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7c3aed" opacity="0.85">▸ 国内外平台全景对比：Claude Code / Qwen Code / Dify / Coze Loop</text>

  <!-- Tags -->
  <rect x="42" y="290" width="90" height="24" rx="12" fill="none" stroke="#00d4aa" stroke-opacity="0.4"/>
  <text x="87" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#00d4aa" opacity="0.8" text-anchor="middle">循环工程</text>

  <rect x="142" y="290" width="80" height="24" rx="12" fill="none" stroke="#7c3aed" stroke-opacity="0.4"/>
  <text x="182" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7c3aed" opacity="0.8" text-anchor="middle">AI Agent</text>

  <rect x="232" y="290" width="95" height="24" rx="12" fill="none" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="279" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f59e0b" opacity="0.8" text-anchor="middle">Claude Code</text>

  <rect x="337" y="290" width="90" height="24" rx="12" fill="none" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="382" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#06b6d4" opacity="0.8" text-anchor="middle">Qwen Code</text>

  <rect x="437" y="290" width="65" height="24" rx="12" fill="none" stroke="#00d4aa" stroke-opacity="0.4"/>
  <text x="469" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#00d4aa" opacity="0.8" text-anchor="middle">Dify</text>

  <rect x="512" y="290" width="85" height="24" rx="12" fill="none" stroke="#7c3aed" stroke-opacity="0.4"/>
  <text x="554" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7c3aed" opacity="0.8" text-anchor="middle">设计模式</text>

  <!-- Right side: Loop diagram -->
  <!-- Circular loop arrows -->
  <circle cx="710" cy="175" r="72" fill="none" stroke="url(#loopGrad)" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Loop nodes -->
  <circle cx="710" cy="103" r="16" fill="#0a0a1e" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="710" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#00d4aa" text-anchor="middle">Goal</text>

  <circle cx="782" cy="175" r="16" fill="#0a0a1e" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="782" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle">Act</text>

  <circle cx="710" cy="247" r="16" fill="#0a0a1e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="710" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">Verify</text>

  <circle cx="638" cy="175" r="16" fill="#0a0a1e" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="638" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">Plan</text>

  <!-- Center text -->
  <text x="710" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.7">Agent</text>
  <text x="710" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.7">Loop</text>

  <!-- Arrows between nodes -->
  <path d="M 724 107 Q 760 120 778 160" fill="none" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.5" marker-end="none"/>
  <path d="M 778 190 Q 760 230 724 243" fill="none" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.5"/>
  <path d="M 696 243 Q 660 230 642 190" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
  <path d="M 642 160 Q 660 120 696 107" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Stop condition indicator -->
  <rect x="760" y="245" width="80" height="20" rx="3" fill="#0a0a1e" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
  <text x="800" y="259" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle" opacity="0.8">Stop ✓</text>

  <!-- Bottom separator + chapter hint -->
  <line x1="42" y1="335" x2="858" y2="335" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="42" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" opacity="0.35">概念起源 → 核心架构 → 设计模式 → 国内外对比 → 成本控制 → 实战指南</text>

  <!-- Watermark -->
  <text x="858" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff" opacity="0.2" text-anchor="end">AI 前线观察</text>
</svg>