<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#ffffff"/>

  <text x="600" y="42" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">智能体支付：中美两条路径对比</text>
  <text x="600" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">美国靠多方协议协商，慢但可复用；中国靠单一账户体系，快但封闭</text>

  <!-- ===== US column ===== -->
  <rect x="50" y="96" width="530" height="470" rx="14" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5"/>
