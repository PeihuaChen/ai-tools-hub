  <text x="76" y="172" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">参与方（多方博弈）</text>

  <rect x="76" y="186" width="112" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
