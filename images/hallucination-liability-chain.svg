<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620">
  <rect width="1160" height="620" fill="#ffffff"/>

  <text x="40" y="48" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#111827">AI 幻觉责任链：责任如何逐级向上传导</text>
  <text x="40" y="76" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4b5563">同一个技术缺陷，在五个层级上分别以罚单、诉讼、赔款、保费和立法的形式兑现</text>
  <line x1="40" y1="94" x2="1120" y2="94" stroke="#d9e2ec" stroke-width="1.5"/>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="40" y="120" width="1080" height="86" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
    <circle cx="80" cy="163" r="19" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="80" y="169" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">1</text>
    <text x="116" y="150" font-size="17" font-weight="bold" fill="#1d4ed8">个人层 · 专业人士自负其责</text>
    <text x="116" y="176" font-size="13" fill="#4b5563">律师提交虚构引证被处罚：从 500 美元到 11 万美元，案件被驳回。全球约 1490 起裁决涉及 AI 幻觉材料</text>
    <text x="116" y="196" font-size="12" fill="#6b7280">代价形态：纪律处分 + 罚款 + 客户实体权利灭失</text>
    <rect x="906" y="140" width="196" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="1004" y="158" text-anchor="middle" font-size="12" fill="#6b7280">最大单笔处罚</text>
    <text x="1004" y="178" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">11 万美元</text>
  </g>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="40" y="218" width="1080" height="86" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <circle cx="80" cy="261" r="19" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
    <text x="80" y="267" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">2</text>
    <text x="116" y="248" font-size="17" font-weight="bold" fill="#b45309">消费者层 · 人身风险进入诉讼</text>
    <text x="116" y="274" font-size="13" fill="#4b5563">2026 年 7 月，患者以「未经授权行医」起诉 ChatGPT，指控延误肺栓塞诊断（尚无判决，因果关系待判）</text>
    <text x="116" y="294" font-size="12" fill="#6b7280">机制风险：医疗问诊场景 17.3% 建议含已淘汰药物（Top-p 采样）</text>
    <rect x="906" y="238" width="196" height="46" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
    <text x="1004" y="256" text-anchor="middle" font-size="12" fill="#6b7280">诉讼状态</text>
    <text x="1004" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">首案 · 审理中</text>
  </g>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="40" y="316" width="1080" height="86" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.4"/>
    <circle cx="80" cy="359" r="19" fill="#ffffff" stroke="#15803d" stroke-width="1.4"/>
    <text x="80" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">3</text>
    <text x="116" y="346" font-size="17" font-weight="bold" fill="#15803d">企业层 · 你的机器人说的话你认账</text>
    <text x="116" y="372" font-size="13" fill="#4b5563">航司因客服机器人编造退款政策被判赔 812 加元，法理定性为过失性虚假陈述；AI 公司自己也被客服幻觉反噬</text>
    <text x="116" y="392" font-size="12" fill="#6b7280">商业代价：某先买后付平台复购联系率 +25%，全自动客服 18 个月内推翻</text>
    <rect x="906" y="336" width="196" height="46" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
    <text x="1004" y="354" text-anchor="middle" font-size="12" fill="#6b7280">法理定性</text>
    <text x="1004" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">过失性虚假陈述</text>
  </g>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="40" y="414" width="1080" height="86" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
    <circle cx="80" cy="457" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
    <text x="80" y="463" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">4</text>
    <text x="116" y="444" font-size="17" font-weight="bold" fill="#6d28d9">行业层 · 保险业的三重身份</text>
    <text x="116" y="470" font-size="13" fill="#4b5563">受害者（自家诉讼文书踩幻觉）· 施害者（自动化拒赔集体诉讼）· 定价者（推出 AI 责任险，同时加排除条款）</text>
    <text x="116" y="490" font-size="12" fill="#6b7280">治理数据：核保 Agent 引入对抗式自我批判，幻觉率 11.3% → 3.8%</text>
    <rect x="906" y="434" width="196" height="46" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
    <text x="1004" y="452" text-anchor="middle" font-size="12" fill="#6b7280">承保方动作</text>
    <text x="1004" y="472" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">加 AI 排除条款</text>
  </g>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="40" y="512" width="1080" height="86" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
    <circle cx="80" cy="555" r="19" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4"/>
    <text x="80" y="561" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">5</text>
    <text x="116" y="542" font-size="17" font-weight="bold" fill="#b91c1c">监管层 · 风险曲线与监管曲线背离</text>
    <text x="116" y="568" font-size="13" fill="#4b5563">欧盟高风险义务从 2026-08 推迟至 2027-12（延后 16 个月），仅保留透明度义务与执法权</text>
    <text x="116" y="588" font-size="12" fill="#6b7280">对照：美国保险监管 2026 年 7 月起进入实操检查，要求可证明的测试、监控与治理责任人</text>
    <rect x="906" y="532" width="196" height="46" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="1004" y="550" text-anchor="middle" font-size="12" fill="#6b7280">核心义务延期</text>
    <text x="1004" y="570" text-anchor="middle" font-size="17" font-weight="bold" fill="#b91c1c">16 个月</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.4" fill="none">
    <path d="M 580 206 L 580 218"/>
    <path d="M 580 304 L 580 316"/>
    <path d="M 580 402 L 580 414"/>
    <path d="M 580 500 L 580 512"/>
  </g>
  <g fill="#94a3b8">
    <path d="M 576 214 L 584 214 L 580 220 Z"/>
    <path d="M 576 312 L 584 312 L 580 318 Z"/>
    <path d="M 576 410 L 584 410 L 580 416 Z"/>
    <path d="M 576 508 L 584 508 L 580 514 Z"/>
  </g>
</svg>
