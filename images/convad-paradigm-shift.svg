<svg width="1080" height="720" viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="720" fill="#f7f8fa"/>

  <text x="540" y="74" font-size="52" font-weight="bold" fill="#111827" text-anchor="middle">两种广告范式的流程对比</text>

  <!-- LEFT panel: old model -->
  <rect x="48" y="130" width="480" height="548" rx="16" fill="#f1f5f9" stroke="#d9e2ec" stroke-width="2"/>
  <text x="288" y="188" font-size="40" font-weight="bold" fill="#6b7280" text-anchor="middle">旧模式：展示 + 跳转</text>

  <g>
    <rect x="76" y="222" width="424" height="70" rx="12" fill="#f8fafc" stroke="#d9e2ec" stroke-width="2"/>
    <text x="288" y="266" font-size="32" fill="#4b5563" text-anchor="middle">曝光横幅 / 信息流</text>

    <rect x="76" y="330" width="424" height="70" rx="12" fill="#f8fafc" stroke="#d9e2ec" stroke-width="2"/>
    <text x="288" y="374" font-size="32" fill="#4b5563" text-anchor="middle">点击广告</text>

    <rect x="76" y="438" width="424" height="70" rx="12" fill="#f8fafc" stroke="#d9e2ec" stroke-width="2"/>
    <text x="288" y="482" font-size="32" fill="#4b5563" text-anchor="middle">跳转落地页</text>

    <rect x="76" y="546" width="424" height="70" rx="12" fill="#f8fafc" stroke="#d9e2ec" stroke-width="2"/>
    <text x="288" y="590" font-size="32" fill="#4b5563" text-anchor="middle">网站内转化 · 易流失</text>
  </g>
  <g stroke="#94a3b8" stroke-width="3" fill="#94a3b8">
    <line x1="288" y1="294" x2="288" y2="326"/><path d="M280 318 L288 330 L296 318 Z"/>
    <line x1="288" y1="402" x2="288" y2="434"/><path d="M280 426 L288 438 L296 426 Z"/>
    <line x1="288" y1="510" x2="288" y2="542"/><path d="M280 534 L288 546 L296 534 Z"/>
  </g>

  <!-- RIGHT panel: new model -->
  <rect x="552" y="130" width="480" height="548" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="792" y="188" font-size="40" font-weight="bold" fill="#1d4ed8" text-anchor="middle">新模式：对话式广告</text>

  <g>
    <rect x="580" y="222" width="424" height="70" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="792" y="266" font-size="32" fill="#1d4ed8" text-anchor="middle">看到相关广告</text>

    <rect x="580" y="330" width="424" height="70" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="792" y="374" font-size="32" fill="#1d4ed8" text-anchor="middle">站内开启对话</text>

    <rect x="580" y="438" width="424" height="70" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="792" y="482" font-size="32" fill="#1d4ed8" text-anchor="middle">追问、比选、答疑</text>

    <rect x="580" y="546" width="424" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="792" y="590" font-size="32" font-weight="bold" fill="#1d4ed8" text-anchor="middle">准备好再成交</text>
  </g>
  <g stroke="#1d4ed8" stroke-width="3" fill="#1d4ed8">
    <line x1="792" y1="294" x2="792" y2="326"/><path d="M784 318 L792 330 L800 318 Z"/>
    <line x1="792" y1="402" x2="792" y2="434"/><path d="M784 426 L792 438 L800 426 Z"/>
    <line x1="792" y1="510" x2="792" y2="542"/><path d="M784 534 L792 546 L800 534 Z"/>
  </g>

  <text x="540" y="702" font-size="30" fill="#6b7280" text-anchor="middle">核心变化：答疑与成交从"离开平台"前移进同一段对话</text>
</svg>
