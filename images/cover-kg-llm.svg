<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="covBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1e"/>
      <stop offset="50%" style="stop-color:#12123a"/>
      <stop offset="100%" style="stop-color:#161638"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="33%" style="stop-color:#00f2fe"/>
      <stop offset="66%" style="stop-color:#43e97b"/>
      <stop offset="100%" style="stop-color:#38f9d7"/>
    </linearGradient>
    <linearGradient id="botBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#43e97b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#covBg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5" fill="none">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="383"/>
    <line x1="200" y1="0" x2="200" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="400" y1="0" x2="400" y2="383"/>
    <line x1="500" y1="0" x2="500" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="700" y1="0" x2="700" y2="383"/>
    <line x1="800" y1="0" x2="800" y2="383"/>
  </g>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topBar)"/>
  <!-- Bottom gradient bar -->
  <rect x="0" y="379" width="900" height="4" fill="url(#botBar)"/>

  <!-- Left label box -->
  <rect x="55" y="55" width="240" height="32" rx="6" fill="#4facfe" opacity="0.15" stroke="#4facfe" stroke-width="1"/>
  <text x="175" y="76" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#7fc4ff" text-anchor="middle">AI 行业观察 · 知识图谱 × 大模型</text>

  <!-- Main title -->
  <text x="55" y="138" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29" font-weight="bold" fill="#ffffff">大模型与知识图谱的双向奔赴</text>

  <!-- Subtitle -->
  <text x="55" y="176" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="url(#titleGrad)">从 GraphRAG 到图原生 Agent 的 2026 全景</text>

  <!-- Key highlights -->
  <g transform="translate(55, 206)">
    <rect x="0" y="0" width="185" height="30" rx="6" fill="#4facfe" opacity="0.12"/>
    <text x="12" y="20" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#7fc4ff">🔗 LLM 建图 · 图谱喂 Agent</text>

    <rect x="200" y="0" width="165" height="30" rx="6" fill="#43e97b" opacity="0.12"/>
    <text x="212" y="20" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#7fffb0">📊 图谱97% vs 向量36%</text>

    <rect x="380" y="0" width="150" height="30" rx="6" fill="#f093fb" opacity="0.12"/>
    <text x="392" y="20" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#f5b0fc">🧠 时序图谱记忆</text>
  </g>

  <!-- Tags -->
  <g transform="translate(55, 262)">
    <rect x="0" y="0" width="86" height="26" rx="13" fill="none" stroke="#4facfe" stroke-width="1"/>
    <text x="43" y="17" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#7fc4ff" text-anchor="middle">GraphRAG</text>

    <rect x="96" y="0" width="80" height="26" rx="13" fill="none" stroke="#43e97b" stroke-width="1"/>
    <text x="136" y="17" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#7fffb0" text-anchor="middle">KG-RAG</text>

    <rect x="186" y="0" width="72" height="26" rx="13" fill="none" stroke="#f093fb" stroke-width="1"/>
    <text x="222" y="17" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#f5b0fc" text-anchor="middle">Zep</text>

    <rect x="268" y="0" width="86" height="26" rx="13" fill="none" stroke="#764ba2" stroke-width="1"/>
    <text x="311" y="17" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#c9a0ff" text-anchor="middle">Graph-R1</text>

    <rect x="364" y="0" width="76" height="26" rx="13" fill="none" stroke="#00f2fe" stroke-width="1"/>
    <text x="402" y="17" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#7fe8ff" text-anchor="middle">Neo4j</text>
  </g>

  <!-- Right side: bidirectional LLM <-> KG illustration -->
  <g transform="translate(690, 155)">
    <!-- LLM node (top) -->
    <circle cx="0" cy="-58" r="26" fill="#4facfe" opacity="0.12" stroke="#4facfe" stroke-width="1.2"/>
    <text x="0" y="-54" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#7fc4ff" text-anchor="middle" font-weight="bold">LLM</text>

    <!-- KG graph (bottom) -->
    <g transform="translate(0, 55)">
      <line x1="0" y1="0" x2="-34" y2="24" stroke="#43e97b" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="0" x2="34" y2="24" stroke="#43e97b" stroke-width="1" opacity="0.5"/>
      <line x1="-34" y1="24" x2="34" y2="24" stroke="#43e97b" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#43e97b" stroke-width="1" opacity="0.5"/>
      <circle cx="0" cy="0" r="7" fill="#43e97b" opacity="0.8"/>
      <circle cx="-34" cy="24" r="6" fill="#38f9d7" opacity="0.8"/>
      <circle cx="34" cy="24" r="6" fill="#f093fb" opacity="0.8"/>
      <circle cx="0" cy="-18" r="5" fill="#764ba2" opacity="0.8"/>
      <text x="0" y="46" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#7fffb0" text-anchor="middle">知识图谱</text>
    </g>

    <!-- Bidirectional arrows -->
    <path d="M -14 -32 C -22 -8, -22 12, -14 30" fill="none" stroke="#4facfe" stroke-width="1.4" opacity="0.7" stroke-dasharray="4"/>
    <polygon points="-14,30 -19,22 -9,23" fill="#4facfe" opacity="0.7"/>
    <text x="-40" y="0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8" fill="#7fc4ff" text-anchor="middle">建图</text>

    <path d="M 14 30 C 22 12, 22 -8, 14 -32" fill="none" stroke="#43e97b" stroke-width="1.4" opacity="0.7" stroke-dasharray="4"/>
    <polygon points="14,-32 9,-24 19,-23" fill="#43e97b" opacity="0.7"/>
    <text x="42" y="0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8" fill="#7fffb0" text-anchor="middle">接地</text>
  </g>

  <!-- Year badge -->
  <g transform="translate(810, 55)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#4facfe" opacity="0.2" stroke="#4facfe" stroke-width="1"/>
    <text x="18" y="25" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#7fc4ff" text-anchor="middle">26</text>
  </g>

  <!-- Bottom info -->
  <rect x="55" y="308" width="500" height="1" fill="#fff" opacity="0.06"/>
  <text x="55" y="333" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#506070">GraphRAG 原理 · 准确率对比 · Agent 记忆 · 图原生 Agent · 落地避坑</text>
  <text x="55" y="356" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#404060">AI知识宇宙 | 2026.09</text>
</svg>
