<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="960" viewBox="0 0 1080 960">
  <rect x="0" y="0" width="1080" height="960" fill="#f7f8fa"/>

  <text x="540" y="100" font-size="60" font-weight="700" fill="#111827" text-anchor="middle">单向量 vs 晚交互</text>
  <text x="540" y="160" font-size="34" fill="#4b5563" text-anchor="middle">同一页 PDF，两种编码方式</text>

  <!-- left card: dense -->
  <rect x="48" y="210" width="476" height="610" rx="16" fill="#f8fafc" stroke="#d9e2ec" stroke-width="2"/>
  <text x="76" y="280" font-size="44" font-weight="700" fill="#1d4ed8">单向量 Dense</text>
  <!-- page -->
  <rect x="88" y="320" width="140" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#cbd5e1">
    <rect x="106" y="340" width="104" height="14" rx="3"/>
    <rect x="106" y="366" width="104" height="14" rx="3"/>
    <rect x="106" y="392" width="48" height="44" rx="3"/>
    <rect x="162" y="392" width="48" height="44" rx="3"/>
    <rect x="106" y="448" width="104" height="14" rx="3"/>
    <rect x="106" y="474" width="70" height="12" rx="3"/>
  </g>
  <!-- arrow -->
  <line x1="244" y1="410" x2="290" y2="410" stroke="#94a3b8" stroke-width="3"/>
  <path d="M290 400 L308 410 L290 420 Z" fill="#94a3b8"/>
  <!-- single vector -->
  <rect x="330" y="330" width="56" height="160" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <g stroke="#1d4ed8" stroke-width="2" stroke-opacity="0.5">
    <line x1="330" y1="362" x2="386" y2="362"/>
    <line x1="330" y1="394" x2="386" y2="394"/>
    <line x1="330" y1="426" x2="386" y2="426"/>
    <line x1="330" y1="458" x2="386" y2="458"/>
  </g>
  <text x="158" y="548" font-size="32" fill="#4b5563" text-anchor="middle">PDF 页面</text>
  <text x="358" y="548" font-size="32" fill="#4b5563" text-anchor="middle">向量</text>
  <text x="76" y="610" font-size="34" fill="#111827">整页压成 1 个向量</text>
  <text x="76" y="670" font-size="34" fill="#111827">细节被平均掉</text>
  <text x="76" y="770" font-size="34" font-weight="700" fill="#b91c1c">存储小 · 细节丢失</text>

  <!-- right card: late interaction -->
  <rect x="556" y="210" width="476" height="610" rx="16" fill="#f8fafc" stroke="#d9e2ec" stroke-width="2"/>
  <text x="584" y="280" font-size="44" font-weight="700" fill="#15803d">晚交互 MaxSim</text>
  <!-- query tokens -->
  <g fill="#ecfeff" stroke="#0e7490" stroke-width="2">
    <rect x="596" y="322" width="36" height="36" rx="6"/>
    <rect x="596" y="370" width="36" height="36" rx="6"/>
    <rect x="596" y="418" width="36" height="36" rx="6"/>
    <rect x="596" y="466" width="36" height="36" rx="6"/>
  </g>
  <!-- doc tokens -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="2">
    <rect x="820" y="320" width="24" height="24" rx="4"/>
    <rect x="820" y="352" width="24" height="24" rx="4"/>
    <rect x="820" y="384" width="24" height="24" rx="4"/>
    <rect x="820" y="416" width="24" height="24" rx="4"/>
    <rect x="820" y="448" width="24" height="24" rx="4"/>
    <rect x="820" y="480" width="24" height="24" rx="4"/>
  </g>
  <!-- best matches -->
  <g stroke="#15803d" stroke-width="3">
    <line x1="632" y1="340" x2="820" y2="364"/>
    <line x1="632" y1="388" x2="820" y2="332"/>
    <line x1="632" y1="436" x2="820" y2="460"/>
    <line x1="632" y1="484" x2="820" y2="428"/>
  </g>
  <g fill="#dcfce7" stroke="#15803d" stroke-width="2">
    <rect x="820" y="320" width="24" height="24" rx="4"/>
    <rect x="820" y="352" width="24" height="24" rx="4"/>
    <rect x="820" y="416" width="24" height="24" rx="4"/>
    <rect x="820" y="448" width="24" height="24" rx="4"/>
  </g>
  <text x="614" y="548" font-size="32" fill="#4b5563" text-anchor="middle">查询</text>
  <text x="832" y="548" font-size="32" fill="#4b5563" text-anchor="middle">文档</text>
  <text x="584" y="610" font-size="34" fill="#111827">每个 token 留 1 个向量</text>
  <text x="584" y="670" font-size="34" fill="#111827">逐词取最大再求和</text>
  <text x="584" y="770" font-size="34" font-weight="700" fill="#15803d">细节保留 · 存储变大</text>

  <text x="540" y="900" font-size="34" font-weight="700" fill="#0e7490" text-anchor="middle">pplx-embed-v2-late：每个 token 仅 128 维</text>
</svg>
