  <line x1="654" y1="215" x2="714" y2="207" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <line x1="654" y1="240" x2="714" y2="250" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>

