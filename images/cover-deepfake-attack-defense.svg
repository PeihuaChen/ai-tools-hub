<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1e"/>
      <stop offset="100%" style="stop-color:#161638"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4757"/>
      <stop offset="33%" style="stop-color:#ff6b81"/>
      <stop offset="66%" style="stop-color:#3742fa"/>
      <stop offset="100%" style="stop-color:#70a1ff"/>
    </linearGradient>
    <linearGradient id="bottomBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#70a1ff"/>
      <stop offset="33%" style="stop-color:#3742fa"/>
      <stop offset="66%" style="stop-color:#ff6b81"/>
      <stop offset="100%" style="stop-color:#ff4757"/>
    </linearGradient>
