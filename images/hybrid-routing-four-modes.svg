<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1010" viewBox="0 0 1080 1010">
  <rect x="0" y="0" width="1080" height="1010" fill="#f7f8fa"/>

  <text x="48" y="90" font-size="64" font-weight="bold" fill="#111827">四种路由模式的行为差异</text>
  <text x="48" y="190" font-size="34" fill="#4b5563">Firebase AI Logic Hybrid API 的 onDeviceConfig</text>

  <g>
    <rect x="48" y="240" width="478" height="260" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="76" y="302" font-size="40" font-weight="bold" fill="#1d4ed8">PREFER_ON_DEVICE</text>
    <text x="76" y="362" font-size="34" fill="#111827">首选：端侧模型</text>
    <text x="76" y="413" font-size="34" fill="#15803d">端侧不可用：回落云端</text>
    <text x="76" y="464" font-size="32" fill="#4b5563">适用：高频轻量任务</text>
  </g>

  <g>
    <rect x="554" y="240" width="478" height="260" rx="16" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <text x="582" y="302" font-size="40" font-weight="bold" fill="#0e7490">PREFER_IN_CLOUD</text>
    <text x="582" y="362" font-size="34" fill="#111827">首选：云端模型</text>
    <text x="582" y="413" font-size="34" fill="#15803d">离线时：回落端侧</text>
    <text x="582" y="464" font-size="32" fill="#4b5563">适用：质量优先任务</text>
  </g>

  <g>
    <rect x="48" y="528" width="478" height="260" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="76" y="590" font-size="40" font-weight="bold" fill="#15803d">ONLY_ON_DEVICE</text>
    <text x="76" y="650" font-size="34" fill="#111827">首选：端侧模型</text>
    <text x="76" y="701" font-size="34" fill="#b91c1c">不可用：直接抛异常</text>
    <text x="76" y="752" font-size="32" fill="#4b5563">适用：敏感数据处理</text>
  </g>

  <g>
    <rect x="554" y="528" width="478" height="260" rx="16" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
    <text x="582" y="590" font-size="40" font-weight="bold" fill="#b45309">ONLY_IN_CLOUD</text>
    <text x="582" y="650" font-size="34" fill="#111827">首选：云端模型</text>
    <text x="582" y="701" font-size="34" fill="#b91c1c">离线时：直接抛异常</text>
    <text x="582" y="752" font-size="32" fill="#4b5563">适用：重推理与工具调用</text>
  </g>

  <g>
    <rect x="48" y="820" width="984" height="150" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="76" y="876" font-size="36" font-weight="bold" fill="#b91c1c">敏感数据必须 ONLY_ON_DEVICE</text>
    <text x="76" y="932" font-size="36" fill="#111827">允许回落，就等于允许数据上云</text>
  </g>
</svg>
