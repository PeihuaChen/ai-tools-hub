    <rect x="460" y="278" width="76" height="26" rx="13" fill="none" stroke="#94a3b8" stroke-opacity="0.45"/>
    <text x="498" y="295" text-anchor="middle" fill="#cbd5e1">开源基建</text>
  </g>

