  <rect x="812" y="26" width="48" height="38" rx="8" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1"/>
  <text x="836" y="52" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="19" font-weight="bold" fill="#c4b5fd">26</text>

  <text x="40" y="128" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="31" font-weight="bold" fill="#ffffff">CUA-Lite 拆解</text>
  <text x="40" y="163" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="bold" fill="url(#sub)">沙箱 · 数据 · 评测 · 训练 —— 一个平台全收了</text>

  <text x="40" y="203" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#00d9ff">内存 4.1GB → 0.9GB、并行约 4.6 倍：Docker 取代 KVM 虚拟机</text>
