    <text x="844" y="210" text-anchor="end" font-size="11" fill="#64748b">lite.gym</text>

    <rect x="630" y="230" width="230" height="34" rx="8" fill="url(#chip4)" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="646" y="252" fill="#fcd34d">④ 训练</text>
    <text x="844" y="252" text-anchor="end" font-size="11" fill="#64748b">SFT + RL</text>

    <path d="M745 138V146M745 180V188M745 222V230" stroke="#475569" stroke-width="1.5"/>
