  <line x1="40" y1="326" x2="860" y2="326" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
  <text x="40" y="352" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#94a3b8">VM 税怎么砍 · 榜单里的中国模型 · 它在生态五层里的位置 · 三个必须先看的风险</text>
  <text x="860" y="352" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#475569">公众号：AI 行业观察</text>
