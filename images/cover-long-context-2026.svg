<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a20"/>
      <stop offset="50%" stop-color="#141435"/>
      <stop offset="100%" stop-color="#0c0c28"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/><line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="180" y1="0" x2="180" y2="383"/><line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/><line x1="720" y1="0" x2="720" y2="383"/>
  </g>

  <!-- Decorative -->
  <circle cx="750" cy="100" r="150" fill="#a855f7" opacity="0.05"/>
  <circle cx="680" cy="320" r="80" fill="#06b6d4" opacity="0.04"/>

  <!-- Top / bottom accent -->
  <rect x="0" y="0" width="900" height="4" fill="url(#purple)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#purple)"/>

  <!-- Right side: context window visualization -->
  <g transform="translate(580, 55)">
    <!-- Long scrolling document bars -->
    <g opacity="0.8">
      <rect x="0" y="0" width="260" height="12" rx="3" fill="#1e1e4a" stroke="#4338ca" stroke-width="0.8"/>
      <rect x="4" y="3" width="180" height="6" rx="2" fill="#6366f1" opacity="0.6"/>

      <rect x="0" y="18" width="260" height="12" rx="3" fill="#1e1e4a" stroke="#4338ca" stroke-width="0.8"/>
      <rect x="4" y="21" width="220" height="6" rx="2" fill="#6366f1" opacity="0.5"/>

      <rect x="0" y="36" width="260" height="12" rx="3" fill="#1e1e4a" stroke="#4338ca" stroke-width="0.8"/>
      <rect x="4" y="39" width="140" height="6" rx="2" fill="#6366f1" opacity="0.4"/>

      <rect x="0" y="54" width="260" height="12" rx="3" fill="#1e1e4a" stroke="#4338ca" stroke-width="0.8"/>
      <rect x="4" y="57" width="200" height="6" rx="2" fill="#a855f7" opacity="0.7"/>

      <rect x="0" y="72" width="260" height="12" rx="3" fill="#1e1e4a" stroke="#4338ca" stroke-width="0.8"/>
      <rect x="4" y="75" width="160" height="6" rx="2" fill="#6366f1" opacity="0.4"/>

      <rect x="0" y="90" width="260" height="12" rx="3" fill="#1e1e4a" stroke="#4338ca" stroke-width="0.8"/>
      <rect x="4" y="93" width="230" height="6" rx="2" fill="#6366f1" opacity="0.5"/>

      <rect x="0" y="108" width="260" height="12" rx="3" fill="#1e1e4a" stroke="#4338ca" stroke-width="0.8"/>
      <rect x="4" y="111" width="190" height="6" rx="2" fill="#6366f1" opacity="0.4"/>
    </g>

    <!-- Dots indicating more content -->
    <text x="130" y="140" font-family="monospace" font-size="14" fill="#6366f1" text-anchor="middle">· · · · ·</text>

    <!-- More bars -->
    <g opacity="0.7">
      <rect x="0" y="152" width="260" height="12" rx="3" fill="#1e1e4a" stroke="#4338ca" stroke-width="0.8"/>
      <rect x="4" y="155" width="210" height="6" rx="2" fill="#6366f1" opacity="0.5"/>

      <rect x="0" y="170" width="260" height="12" rx="3" fill="#1e1e4a" stroke="#4338ca" stroke-width="0.8"/>
      <rect x="4" y="173" width="170" height="6" rx="2" fill="#6366f1" opacity="0.4"/>
    </g>

    <!-- Token count label -->
    <rect x="60" y="195" width="140" height="26" rx="13" fill="#0a0a20" stroke="url(#teal)" stroke-width="1.2"/>
    <text x="130" y="213" font-family="'Courier New',monospace" font-size="12" font-weight="bold" fill="#22d3ee" text-anchor="middle">12,000,000 tokens</text>

    <!-- Equivalence -->
    <text x="130" y="240" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#6a7099" text-anchor="middle">≈ 120本书 / 900万字</text>
  </g>

  <!-- Left: Title area -->
  <!-- Badge -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="130" height="28" rx="4" fill="url(#purple)" opacity="0.9"/>
    <text x="65" y="19" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">超长上下文时代</text>
  </g>

  <text x="50" y="112" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="32" font-weight="bold" fill="#ffffff">1200万Token</text>
  <text x="50" y="155" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="bold" fill="url(#teal)">如何改变你的工作流</text>

  <!-- Subtitle -->
  <text x="50" y="190" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#7a7fa8">SubQ 1200万 · Gemini 200万 · Claude 100万</text>

  <!-- Feature tags -->
  <g transform="translate(50, 212)">
    <rect x="0" y="0" width="80" height="26" rx="13" fill="#1e1e4a" stroke="#a855f7" stroke-width="0.8"/>
    <text x="40" y="17" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#c4b5fd" text-anchor="middle">代码库</text>

    <rect x="90" y="0" width="80" height="26" rx="13" fill="#1e1e4a" stroke="#a855f7" stroke-width="0.8"/>
    <text x="130" y="17" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#c4b5fd" text-anchor="middle">法律</text>

    <rect x="180" y="0" width="80" height="26" rx="13" fill="#1e1e4a" stroke="#a855f7" stroke-width="0.8"/>
    <text x="220" y="17" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#c4b5fd" text-anchor="middle">学术</text>

    <rect x="270" y="0" width="80" height="26" rx="13" fill="#1e1e4a" stroke="url(#teal)" stroke-width="0.8"/>
    <text x="310" y="17" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#22d3ee" text-anchor="middle">vs RAG</text>
  </g>

  <!-- Key insight -->
  <text x="50" y="272" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#5a5f88">五大场景工作流 · 注意力衰减应对 · 成本决策框架</text>

  <!-- Divider -->
  <rect x="50" y="290" width="460" height="1" fill="#fff" opacity="0.06"/>

  <!-- Bottom text -->
  <text x="50" y="318" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#4a4f70">模型对比 · 实操模板 · 混合架构方案</text>
  <text x="50" y="348" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#33385a">公众号 - 最新AI知识宇宙 | 2026.06</text>

  <!-- Year badge -->
  <g transform="translate(835, 30)">
    <rect x="0" y="0" width="40" height="28" rx="4" fill="none" stroke="url(#purple)" stroke-width="1.5"/>
    <text x="20" y="19" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#a855f7" text-anchor="middle">26</text>
  </g>
</svg>
