<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="ppb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#15193a"/></linearGradient>
    <pattern id="ppg" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
  </defs>
  <rect width="860" height="360" rx="12" fill="url(#ppb)"/>
  <rect width="860" height="360" rx="12" fill="url(#ppg)"/>
  <rect x="1" y="1" width="858" height="358" rx="12" fill="none" stroke="#334155" stroke-width="2"/>

  <text x="430" y="38" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Oak 解决的四个 Git 痛点</text>
  <text x="430" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">左：Git 在 Agent 场景下的problem | 右：Oak 的解法</text>

  <!-- card 1 -->
  <g transform="translate(30,84)">
    <rect width="390" height="120" rx="10" fill="#1e1518" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="20" y="32" fill="#fca5a5" font-size="14" font-weight="700">① 读一个文件要等几分钟</text>
    <text x="20" y="58" fill="#cbd5e1" font-size="12">Git 必须先 clone 整个历史</text>
    <text x="20" y="78" fill="#cbd5e1" font-size="12">才能打开一个路径，大仓库死等几分钟</text>
    <line x1="20" y1="90" x2="370" y2="90" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="20" y="110" fill="#6ee7b7" font-size="12" font-weight="600">→ Oak 惰性挂载，文件首次读取时流式注入</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(440,84)">
    <rect width="390" height="120" rx="10" fill="#1e1518" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="20" y="32" fill="#fca5a5" font-size="14" font-weight="700">② Worktree 互相打架</text>
    <text x="20" y="58" fill="#cbd5e1" font-size="12">并行任务共享一个可损坏的 .git</text>
    <text x="20" y="78" fill="#cbd5e1" font-size="12">detached-HEAD 坑、状态互相污染</text>
    <line x1="20" y1="90" x2="370" y2="90" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="20" y="110" fill="#6ee7b7" font-size="12" font-weight="600">→ Oak 每任务独立 mount + branch，互不影响</text>
  </g>

  <!-- card 3 -->
  <g transform="translate(30,216)">
    <rect width="390" height="120" rx="10" fill="#1e1518" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="20" y="32" fill="#fca5a5" font-size="14" font-weight="700">③ Commit message 税</text>
    <text x="20" y="58" fill="#cbd5e1" font-size="12">每次提交都要写消息，烧 token 写</text>
    <text x="20" y="78" fill="#cbd5e1" font-size="12">"wip"、"fix" 这些没人会读的话</text>
    <line x1="20" y1="90" x2="370" y2="90" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="20" y="110" fill="#6ee7b7" font-size="12" font-weight="600">→ Oak 中间提交无消息，分支描述即真相</text>
  </g>

  <!-- card 4 -->
  <g transform="translate(440,216)">
    <rect width="390" height="120" rx="10" fill="#1e1518" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="20" y="32" fill="#fca5a5" font-size="14" font-weight="700">④ 大文件破坏一切</text>
    <text x="20" y="58" fill="#cbd5e1" font-size="12">4GB checkpoint 卡死 Git，LFS 需额外</text>
    <text x="20" y="78" fill="#cbd5e1" font-size="12">配额；改一个 tensor 重传整个文件</text>
    <line x1="20" y1="90" x2="370" y2="90" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="20" y="110" fill="#6ee7b7" font-size="12" font-weight="600">→ Oak 原生分块去重，只传变化的 chunk</text>
  </g>
</svg>
