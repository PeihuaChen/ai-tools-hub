  <text x="472" y="207" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">7维Provider评分</text>

  <line x1="525" y1="185" x2="545" y2="185" stroke="#aaa" stroke-width="1"/>
  <polygon points="543,181 550,185 543,189" fill="#aaa"/>

  <rect x="550" y="155" width="105" height="60" rx="6" fill="#f0e8fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="602" y="178" font-family="Arial, sans-serif" font-size="10" fill="#5b21b6" text-anchor="middle" font-weight="bold">✂️ Edit</text>
