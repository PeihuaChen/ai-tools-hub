  </defs>

  <!-- Background -->
  <rect width="860" height="420" rx="12" fill="url(#archBg)"/>
  <rect width="860" height="420" rx="12" fill="none" stroke="#d0d7e3" stroke-width="1"/>

  <!-- Title -->
