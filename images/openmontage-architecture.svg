  <text x="425" y="300" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">执行前成本预估 · 花费上限</text>
  <text x="425" y="314" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">单操作审批阈值 · 决策日志</text>

  <rect x="570" y="260" width="240" height="70" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
  <text x="690" y="283" font-family="Arial, sans-serif" font-size="11" fill="#1a56db" text-anchor="middle" font-weight="bold">✅ Post-render 自审</text>
  <text x="690" y="300" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">ffprobe验证 · 帧提取采样 · 音频电平</text>
  <text x="690" y="314" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">字幕检查 · 承诺兑现验证</text>

