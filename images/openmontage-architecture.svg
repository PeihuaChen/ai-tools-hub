  <!-- User prompt -->
  <rect x="30" y="55" width="220" height="50" rx="8" fill="#fff8e6" stroke="#e6a817" stroke-width="1.5"/>
  <text x="140" y="75" font-family="Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">👤 用户输入</text>
  <text x="140" y="93" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">"做一个60秒的黑洞解说视频"</text>

  <!-- Arrow -->
  <line x1="250" y1="80" x2="290" y2="80" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="288,75 298,80 288,85" fill="#999"/>

  <!-- AI Agent box -->
  <rect x="300" y="55" width="240" height="50" rx="8" fill="#e8f6fd" stroke="#2196f3" stroke-width="1.5"/>
  <text x="420" y="75" font-family="Arial, sans-serif" font-size="11" fill="#1565c0" text-anchor="middle">🤖 AI 编程助手（编排器）</text>
  <text x="420" y="93" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">Claude Code / Cursor / Copilot / Codex</text>

