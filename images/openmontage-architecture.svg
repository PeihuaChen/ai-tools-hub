  <text x="82" y="195" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">15-25次网络搜索</text>
  <text x="82" y="207" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">数据收集+事实核查</text>

