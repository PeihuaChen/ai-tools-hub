  <text x="165" y="300" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">交付承诺检查 · 幻灯片风险检测</text>
  <text x="165" y="314" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">渲染器治理 · 资产审批门</text>

  <rect x="310" y="260" width="230" height="70" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1"/>
