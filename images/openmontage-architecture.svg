  <text x="752" y="195" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Remotion / HyperFrames</text>
  <text x="752" y="207" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">→ 最终 MP4 输出</text>

