  <rect x="490" y="375" width="95" height="30" rx="4" fill="#e8f8f0" stroke="#27ae60" stroke-width="1"/>
  <text x="537" y="394" font-family="Arial, sans-serif" font-size="9" fill="#1e8449" text-anchor="middle">Analysis</text>

  <rect x="600" y="375" width="95" height="30" rx="4" fill="#e0f7f7" stroke="#00897b" stroke-width="1"/>
  <text x="647" y="394" font-family="Arial, sans-serif" font-size="9" fill="#00695c" text-anchor="middle">Subtitle</text>

  <rect x="710" y="375" width="95" height="30" rx="4" fill="#fff0f0" stroke="#e53935" stroke-width="1"/>
  <text x="757" y="394" font-family="Arial, sans-serif" font-size="9" fill="#c62828" text-anchor="middle">Avatar</text>
