<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1120" height="520" fill="#ffffff"/>

  <text x="40" y="46" fill="#111827" font-size="24" font-weight="700">RAG 混合检索流水线</text>
  <text x="40" y="72" fill="#4b5563" font-size="14">同一查询双路并行召回 → 融合排序 → 重排 → 交给大模型生成</text>

  <!-- Query -->
  <rect x="40" y="210" width="130" height="70" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="105" y="242" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">用户查询</text>
  <text x="105" y="264" fill="#4b5563" font-size="11" text-anchor="middle">Query</text>

  <!-- arrows to two retrievers -->
  <path d="M170 232 C 210 232, 210 160, 250 160" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <path d="M170 258 C 210 258, 210 330, 250 330" fill="none" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- BM25 sparse retriever -->
  <rect x="250" y="120" width="240" height="90" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="270" y="150" fill="#1d4ed8" font-size="16" font-weight="700">稀疏检索 · BM25</text>
  <text x="270" y="174" fill="#374151" font-size="12">倒排索引 · 关键词/精确匹配</text>
  <text x="270" y="194" fill="#6b7280" font-size="11">强项：编号 · 术语 · 罕见词</text>

  <!-- Dense retriever -->
  <rect x="250" y="290" width="240" height="90" rx="10" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="270" y="320" fill="#6d28d9" font-size="16" font-weight="700">稠密检索 · 向量</text>
  <text x="270" y="344" fill="#374151" font-size="12">Embedding · 语义相似度</text>
  <text x="270" y="364" fill="#6b7280" font-size="11">强项：同义 · 改写 · 概念</text>

  <!-- arrows to fusion -->
  <path d="M490 165 C 540 165, 540 230, 585 230" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <path d="M490 335 C 540 335, 540 270, 585 270" fill="none" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- Fusion -->
  <rect x="585" y="200" width="170" height="100" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="670" y="230" fill="#0e7490" font-size="16" font-weight="700" text-anchor="middle">融合排序</text>
  <text x="670" y="254" fill="#374151" font-size="12" text-anchor="middle">RRF (k=60)</text>
  <text x="670" y="274" fill="#374151" font-size="12" text-anchor="middle">或 加权 α 融合</text>
  <text x="670" y="292" fill="#6b7280" font-size="10" text-anchor="middle">按排名合并，绕开量纲不兼容</text>

  <!-- arrow -->
  <path d="M755 250 L 800 250" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <polygon points="800,244 812,250 800,256" fill="#94a3b8"/>

  <!-- Rerank -->
  <rect x="815" y="205" width="140" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="885" y="235" fill="#b45309" font-size="15" font-weight="700" text-anchor="middle">重排 Rerank</text>
  <text x="885" y="258" fill="#374151" font-size="11.5" text-anchor="middle">cross-encoder</text>
  <text x="885" y="276" fill="#6b7280" font-size="10.5" text-anchor="middle">可选，精度收益最大</text>

  <!-- LLM -->
  <rect x="815" y="360" width="265" height="80" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="947" y="392" fill="#15803d" font-size="16" font-weight="700" text-anchor="middle">大模型 LLM 生成</text>
  <text x="947" y="416" fill="#374151" font-size="12" text-anchor="middle">top-K 片段作为上下文，抑制幻觉</text>
  <path d="M885 295 C 885 340, 940 340, 947 358" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <polygon points="941,349 949,360 936,357" fill="#94a3b8"/>

  <!-- legend note (moved down to clear the Dense retriever box) -->
  <rect x="40" y="392" width="470" height="112" rx="10" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.2"/>
  <text x="60" y="418" fill="#111827" font-size="13" font-weight="700">为什么两路都要？</text>
  <text x="60" y="442" fill="#374151" font-size="12">· BM25 抓字面精确，向量抓语义联想，盲区互补</text>
  <text x="60" y="466" fill="#374151" font-size="12">· WANDS 基准：混合 NDCG 0.7497，比单路高约 7.4%</text>
  <text x="60" y="490" fill="#374151" font-size="12">· 冷启动用 RRF，有标注数据后调 α + 加 rerank</text>
</svg>
