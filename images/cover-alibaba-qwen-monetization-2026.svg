<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#1a1230"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridp" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#4b3b6b" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#gridp)"/>
  <rect width="900" height="383" fill="url(#grid)"/>

  <!-- top / bottom accent bars -->
  <rect x="0" y="0" width="300" height="4" fill="#fb923c"/>
  <rect x="300" y="0" width="300" height="4" fill="#fbbf24"/>
  <rect x="600" y="0" width="300" height="4" fill="#38bdf8"/>
  <rect x="0" y="379" width="450" height="4" fill="#fb923c"/>
  <rect x="450" y="379" width="450" height="4" fill="#38bdf8"/>

  <!-- tag box -->
  <rect x="48" y="40" width="240" height="34" rx="6" fill="#241a3a" stroke="#fb923c" stroke-opacity="0.6" stroke-width="1"/>
  <text x="64" y="62" font-size="15" fill="#fdba74" font-weight="600">AI 行业观察 · 商业化拆解</text>

  <!-- year badge -->
  <circle cx="838" cy="58" r="26" fill="#241a3a" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="838" y="65" font-size="22" fill="#7dd3fc" font-weight="700" text-anchor="middle">26</text>

  <!-- main title -->
  <text x="48" y="134" font-size="30" fill="#ffffff" font-weight="800">开源不赚钱，那阿里图什么？</text>
  <text x="48" y="174" font-size="20" font-weight="700" fill="url(#sub)">拆解通义千问"开源—云—电商 Agent"</text>
  <text x="48" y="202" font-size="20" font-weight="700" fill="url(#sub)">三级变现逻辑</text>

  <!-- highlight lines -->
  <text x="48" y="240" font-size="13" fill="#fdba74">▸ 开源 10 亿次下载，是最便宜的获客钩子</text>
  <text x="48" y="262" font-size="13" fill="#fcd34d">▸ 云收入连续 9 季三位数增长，才是真收银台</text>
  <text x="48" y="284" font-size="13" fill="#7dd3fc">▸ 镜像对比 AWS：全栈国家队 vs 中立瑞士</text>

  <!-- pills -->
  <g font-size="12" font-weight="600">
    <rect x="48" y="306" width="74" height="26" rx="13" fill="none" stroke="#fb923c" stroke-opacity="0.6"/>
    <text x="85" y="323" fill="#fdba74" text-anchor="middle">阿里巴巴</text>
    <rect x="130" y="306" width="64" height="26" rx="13" fill="none" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="162" y="323" fill="#fcd34d" text-anchor="middle">Qwen</text>
    <rect x="202" y="306" width="100" height="26" rx="13" fill="none" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="252" y="323" fill="#7dd3fc" text-anchor="middle">AWS Bedrock</text>
    <rect x="310" y="306" width="86" height="26" rx="13" fill="none" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="353" y="323" fill="#c4b5fd" text-anchor="middle">AI Agent</text>
  </g>

  <!-- right concept: three-level funnel -->
  <g transform="translate(632,108)" opacity="0.95">
    <polygon points="20,0 180,0 150,40 50,40" fill="#241a3a" stroke="#fb923c" stroke-opacity="0.8"/>
    <text x="100" y="26" font-size="13" fill="#fdba74" text-anchor="middle" font-weight="600">开源·造势</text>
    <polygon points="50,48 150,48 130,88 70,88" fill="#241a3a" stroke="#fbbf24" stroke-opacity="0.8"/>
    <text x="100" y="74" font-size="13" fill="#fcd34d" text-anchor="middle" font-weight="600">云·收钱</text>
    <polygon points="70,96 130,96 115,140 85,140" fill="#241a3a" stroke="#38bdf8" stroke-opacity="0.8"/>
    <text x="100" y="123" font-size="12" fill="#7dd3fc" text-anchor="middle" font-weight="600">Agent</text>
    <text x="100" y="162" font-size="11" fill="#94a3b8" text-anchor="middle">三级变现漏斗</text>
  </g>

  <!-- divider + footer -->
  <line x1="48" y1="356" x2="852" y2="356" stroke="#4b3b6b" stroke-opacity="0.5" stroke-width="1"/>
  <text x="48" y="372" font-size="11" fill="#8888aa">开源逻辑 · 云收银台 · 电商 Agent · AWS 对比</text>
  <text x="852" y="372" font-size="11" fill="#666688" text-anchor="end">公众号：AI工具箱</text>
</svg>
