<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="50%" stop-color="#161638"/>
      <stop offset="100%" stop-color="#0d0d25"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/><line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="180" y1="0" x2="180" y2="383"/><line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/><line x1="720" y1="0" x2="720" y2="383"/>
  </g>

  <!-- Top / bottom accent -->
  <rect x="0" y="0" width="300" height="4" fill="url(#green)"/>
  <rect x="300" y="0" width="300" height="4" fill="url(#purple)"/>
  <rect x="600" y="0" width="300" height="4" fill="url(#orange)"/>
  <rect x="0" y="379" width="300" height="4" fill="url(#green)"/>
  <rect x="300" y="379" width="300" height="4" fill="url(#purple)"/>
  <rect x="600" y="379" width="300" height="4" fill="url(#orange)"/>

  <!-- Right: Platform dashboard with 3 models -->
  <g transform="translate(580, 80)">
    <!-- Dashboard container -->
    <rect x="0" y="0" width="200" height="160" rx="12" fill="#1e1e3a" stroke="url(#green)" stroke-width="2.5"/>
    
    <!-- LLM card -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="160" height="32" rx="6" fill="#1a1a2e"/>
      <circle cx="20" cy="16" r="8" fill="#22d3ee"/>
      <text x="38" y="20" font-family="'Courier New',monospace" font-size="11" fill="#e2e8f0">Qwen3.6</text>
      <text x="125" y="20" font-family="Arial,sans-serif" font-size="9" fill="#a78bfa">LLM</text>
    </g>

    <!-- Embedding card -->
    <g transform="translate(20, 62)">
      <rect x="0" y="0" width="160" height="32" rx="6" fill="#1a1a2e"/>
      <circle cx="20" cy="16" r="8" fill="#8b5cf6"/>
      <text x="38" y="20" font-family="'Courier New',monospace" font-size="11" fill="#e2e8f0">bge-m3</text>
      <text x="125" y="20" font-family="Arial,sans-serif" font-size="9" fill="#f9a8d4">Embedding</text>
    </g>

    <!-- Rerank card -->
    <g transform="translate(20, 104)">
      <rect x="0" y="0" width="160" height="32" rx="6" fill="#1a1a2e"/>
      <circle cx="20" cy="16" r="8" fill="#f59e0b"/>
      <text x="38" y="20" font-family="'Courier New',monospace" font-size="11" fill="#e2e8f0">bge-reranker</text>
      <text x="125" y="20" font-family="Arial,sans-serif" font-size="9" fill="#fde047">Rerank</text>
    </g>
  </g>

  <!-- "All-in-One" tag -->
  <g transform="translate(50, 28)">
    <rect x="0" y="0" width="140" height="30" rx="4" fill="#1a1020" stroke="url(#green)" stroke-width="1"/>
    <text x="70" y="20" font-family="'Courier New',monospace" font-weight="bold" font-size="14" fill="#22d3ee" text-anchor="middle">All‑in‑One 平台</text>
  </g>

  <text x="50" y="108" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Xinference 部署与应用实战</text>
  <text x="50" y="148" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="bold" fill="url(#green)">一个平台搞定 LLM + Embedding + Rerank</text>

  <!-- Key highlights -->
  <g transform="translate(50, 175)">
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="13" fill="#22d3ee">OpenAI 兼容 API · 一行代码迁移</text>
    <text x="0" y="22" font-family="'Courier New',monospace" font-size="13" fill="#8b5cf6">2026 支持 DeepSeek V4 / Qwen3.6 / GLM-5.1</text>
    <text x="0" y="44" font-family="'Courier New',monospace" font-size="13" fill="#f59e0b">Docker / K8s / pip 四种部署方式</text>
  </g>

  <!-- Tags -->
  <g transform="translate(50, 248)">
    <rect x="0" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#10b981" stroke-width="0.8"/>
    <text x="34" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">OpenAI 兼容</text>

    <rect x="76" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="110" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">一键部署</text>

    <rect x="152" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#ec4899" stroke-width="0.8"/>
    <text x="186" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#f9a8d4" text-anchor="middle">多模态</text>

    <rect x="228" y="0" width="72" height="24" rx="12" fill="#1e1e3a" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="264" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fde047" text-anchor="middle">私有化RAG</text>

    <rect x="308" y="0" width="82" height="24" rx="12" fill="#1e1e3a" stroke="#22d3ee" stroke-width="0.8"/>
    <text x="349" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#a5f3fc" text-anchor="middle">Dify / FastGPT</text>
  </g>

  <!-- Divider -->
  <rect x="50" y="290" width="460" height="1" fill="#fff" opacity="0.06"/>
  <text x="50" y="315" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#4a4f70">部署实战 · 调用方式 · 私有化RAG · 避坑清单</text>
  <text x="50" y="348" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#33385a">公众号 - 最新AI知识宇宙 | 2026.06</text>

  <!-- Year badge -->
  <g transform="translate(835, 30)">
    <rect x="0" y="0" width="40" height="28" rx="4" fill="none" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="19" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#10b981" text-anchor="middle">26</text>
  </g>
</svg>
