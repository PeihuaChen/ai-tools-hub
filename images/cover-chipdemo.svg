<svg width="900" height="383" viewBox="0 0 900 383" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
    <linearGradient id="botbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3a5c"/>
      <stop offset="1" stop-color="#2a2050"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="4" fill="url(#topbar)"/>
  <rect y="379" width="900" height="4" fill="url(#botbar)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="750" y1="0" x2="750" y2="383"/>
  </g>

  <!-- tag box -->
  <rect x="48" y="36" width="270" height="30" rx="6" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-opacity="0.6"/>
  <text x="63" y="56" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#c4b5fd">AI 行业观察 · 芯片设计民主化</text>

  <!-- year badge -->
  <circle cx="838" cy="52" r="24" fill="#ff5ca8" fill-opacity="0.12" stroke="#ff5ca8" stroke-opacity="0.5"/>
  <text x="838" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ff9cca">26</text>

  <!-- title -->
  <text x="48" y="130" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">2 人 + AI，两周造出一颗芯片</text>
  <text x="48" y="172" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="url(#sub)">AI 正在把芯片设计从巨头手里"民主化"吗？</text>

  <!-- highlights -->
  <text x="48" y="218" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#5eead4">▸ Redwood：规格→硬件闭环仅 48 小时，能效达 Jetson 的 3.4 倍</text>
  <text x="48" y="242" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#a78bfa">▸ AlphaChip 强化学习布局 · Cadence/Synopsys agentic AI 提速 10X</text>
  <text x="48" y="266" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#ffb454">▸ 开源 EDA + RISC-V + Tiny Tapeout：门槛在塌，但先进制程仍是壁垒</text>

  <!-- pills -->
  <g font-family="Microsoft YaHei, sans-serif" font-size="12">
    <rect x="48" y="300" width="72" height="26" rx="13" fill="none" stroke="#00e5ff" stroke-opacity="0.5"/>
    <text x="84" y="317" text-anchor="middle" fill="#7fe9f5">EDA</text>
    <rect x="128" y="300" width="88" height="26" rx="13" fill="none" stroke="#7c5cff" stroke-opacity="0.5"/>
    <text x="172" y="317" text-anchor="middle" fill="#c4b5fd">RISC-V</text>
    <rect x="224" y="300" width="96" height="26" rx="13" fill="none" stroke="#5eead4" stroke-opacity="0.5"/>
    <text x="272" y="317" text-anchor="middle" fill="#8ff0dd">AlphaChip</text>
    <rect x="328" y="300" width="108" height="26" rx="13" fill="none" stroke="#ff5ca8" stroke-opacity="0.5"/>
    <text x="382" y="317" text-anchor="middle" fill="#ff9cca">Agentic AI</text>
    <rect x="444" y="300" width="112" height="26" rx="13" fill="none" stroke="#ffb454" stroke-opacity="0.5"/>
    <text x="500" y="317" text-anchor="middle" fill="#ffce8f">Tiny Tapeout</text>
  </g>

  <!-- decorative chip on right -->
  <g transform="translate(648,150)">
    <rect x="0" y="0" width="150" height="150" rx="12" fill="url(#chip)" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="42" y="42" width="66" height="66" rx="6" fill="#00e5ff" fill-opacity="0.08" stroke="#7c5cff" stroke-opacity="0.6"/>
    <text x="75" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#a78bfa">AI</text>
    <!-- pins -->
    <g stroke="#5eead4" stroke-opacity="0.7" stroke-width="3">
      <line x1="20" y1="-10" x2="20" y2="0"/><line x1="50" y1="-10" x2="50" y2="0"/>
      <line x1="80" y1="-10" x2="80" y2="0"/><line x1="110" y1="-10" x2="110" y2="0"/>
      <line x1="20" y1="150" x2="20" y2="160"/><line x1="50" y1="150" x2="50" y2="160"/>
      <line x1="80" y1="150" x2="80" y2="160"/><line x1="110" y1="150" x2="110" y2="160"/>
      <line x1="-10" y1="30" x2="0" y2="30"/><line x1="-10" y1="60" x2="0" y2="60"/>
      <line x1="-10" y1="90" x2="0" y2="90"/><line x1="-10" y1="120" x2="0" y2="120"/>
      <line x1="150" y1="30" x2="160" y2="30"/><line x1="150" y1="60" x2="160" y2="60"/>
      <line x1="150" y1="90" x2="160" y2="90"/><line x1="150" y1="120" x2="160" y2="120"/>
    </g>
  </g>

  <!-- footer -->
  <line x1="48" y1="346" x2="852" y2="346" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="48" y="368" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#8888aa">从 Redwood 到 Tiny Tapeout：AI 时代造芯门槛的塌陷与天花板</text>
  <text x="852" y="368" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#666688">公众号 · AI 行业观察</text>
</svg>
