<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="50%" stop-color="#161638"/>
      <stop offset="100%" stop-color="#0d0d25"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/><line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="180" y1="0" x2="180" y2="383"/><line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/><line x1="720" y1="0" x2="720" y2="383"/>
  </g>

  <!-- Top / bottom accent -->
  <rect x="0" y="0" width="450" height="4" fill="url(#red)"/>
  <rect x="450" y="0" width="450" height="4" fill="url(#blue)"/>
  <rect x="0" y="379" width="450" height="4" fill="url(#red)"/>
  <rect x="450" y="379" width="450" height="4" fill="url(#blue)"/>

  <!-- Right side: Robot silhouette -->
  <g transform="translate(640, 50)">
    <!-- Head -->
    <ellipse cx="80" cy="25" rx="22" ry="26" fill="none" stroke="url(#silver)" stroke-width="2"/>
    <rect x="70" y="15" width="20" height="4" rx="2" fill="#3b82f6" opacity="0.8"/>
    <!-- Neck -->
    <rect x="75" y="51" width="10" height="12" fill="none" stroke="url(#silver)" stroke-width="1.5"/>
    <!-- Torso -->
    <path d="M50 63 L110 63 L105 155 L55 155 Z" fill="none" stroke="url(#silver)" stroke-width="2"/>
    <!-- Core light -->
    <circle cx="80" cy="105" r="12" fill="#3b82f6" opacity="0.15"/>
    <circle cx="80" cy="105" r="6" fill="#3b82f6" opacity="0.4"/>
    <!-- Arms -->
    <line x1="50" y1="70" x2="25" y2="120" stroke="url(#silver)" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="120" x2="30" y2="160" stroke="url(#silver)" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="70" x2="135" y2="120" stroke="url(#silver)" stroke-width="2" stroke-linecap="round"/>
    <line x1="135" y1="120" x2="130" y2="160" stroke="url(#silver)" stroke-width="2" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="65" y1="155" x2="60" y2="220" stroke="url(#silver)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="220" x2="55" y2="270" stroke="url(#silver)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="95" y1="155" x2="100" y2="220" stroke="url(#silver)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="100" y1="220" x2="105" y2="270" stroke="url(#silver)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Feet -->
    <rect x="45" y="268" width="22" height="8" rx="4" fill="url(#silver)" opacity="0.6"/>
    <rect x="93" y="268" width="22" height="8" rx="4" fill="url(#silver)" opacity="0.6"/>
  </g>

  <!-- Left: Title -->
  <!-- China/US badges -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="60" height="28" rx="4" fill="url(#red)" opacity="0.9"/>
    <text x="30" y="19" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">中国</text>
    <text x="72" y="19" font-family="Arial,sans-serif" font-size="14" fill="#666">vs</text>
    <rect x="88" y="0" width="60" height="28" rx="4" fill="url(#blue)" opacity="0.9"/>
    <text x="118" y="19" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">美国</text>
  </g>

  <text x="50" y="110" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="32" font-weight="bold" fill="#ffffff">人形机器人 2026</text>
  <text x="50" y="152" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="bold" fill="url(#silver)">产量碾压 vs AI领先，谁会赢？</text>

  <!-- Key stats -->
  <g transform="translate(50, 175)">
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="13" fill="#ef4444">中国 85% 全球出货</text>
    <text x="0" y="22" font-family="'Courier New',monospace" font-size="13" fill="#3b82f6">Tesla 5万台 · Figure $390亿</text>
    <text x="0" y="44" font-family="'Courier New',monospace" font-size="13" fill="#94a3b8">单价差距 5-10倍</text>
  </g>

  <!-- Tags -->
  <g transform="translate(50, 248)">
    <rect x="0" y="0" width="72" height="24" rx="12" fill="#1e1e3a" stroke="#ef4444" stroke-width="0.8"/>
    <text x="36" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">智元</text>

    <rect x="80" y="0" width="72" height="24" rx="12" fill="#1e1e3a" stroke="#ef4444" stroke-width="0.8"/>
    <text x="116" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">宇树</text>

    <rect x="160" y="0" width="72" height="24" rx="12" fill="#1e1e3a" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="196" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">Tesla</text>

    <rect x="240" y="0" width="72" height="24" rx="12" fill="#1e1e3a" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="276" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">Figure</text>

    <rect x="320" y="0" width="82" height="24" rx="12" fill="#1e1e3a" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="361" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">产业链投资</text>
  </g>

  <!-- Divider -->
  <rect x="50" y="290" width="460" height="1" fill="#fff" opacity="0.06"/>
  <text x="50" y="315" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#4a4f70">中美路线对比 · 落地场景 · BOM拆解 · 投资机会</text>
  <text x="50" y="348" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#33385a">公众号 - 最新AI知识宇宙 | 2026.06</text>

  <!-- Year badge -->
  <g transform="translate(835, 30)">
    <rect x="0" y="0" width="40" height="28" rx="4" fill="none" stroke="url(#blue)" stroke-width="1.5"/>
    <text x="20" y="19" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#3b82f6" text-anchor="middle">26</text>
  </g>
</svg>
