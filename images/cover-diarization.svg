<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2a2a55" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="4" fill="url(#topbar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#topbar)"/>

  <!-- 左上角标签框 -->
  <rect x="48" y="40" width="236" height="34" rx="8" fill="#1d1d40" stroke="#76b900" stroke-width="1.5"/>
  <text x="66" y="63" font-size="16" fill="#bef264" font-weight="bold">AI 行业观察 · 语音分离</text>

  <!-- 右上角年份徽章 -->
  <circle cx="838" cy="58" r="26" fill="#1d1d40" stroke="#a78bfa" stroke-width="2"/>
  <text x="838" y="66" font-size="24" fill="#a78bfa" font-weight="bold" text-anchor="middle">26</text>

  <!-- 主标题 -->
  <text x="48" y="132" font-size="38" fill="#ffffff" font-weight="bold">开源说话人分离全景</text>
  <!-- 副标题 -->
  <text x="48" y="170" font-size="19" fill="url(#title)" font-weight="bold">Nemotron 3 登顶 VoiceArena · DER 14.72%</text>

  <!-- 三行关键亮点 -->
  <text x="48" y="212" font-size="14" fill="#a3e635">▪ 1 亿参数、最多 8 人、原生处理重叠语音</text>
  <text x="48" y="238" font-size="14" fill="#22d3ee">▪ 一个 checkpoint 覆盖 0.32s 到 30.4s 四档延迟</text>
  <text x="48" y="264" font-size="14" fill="#fb923c">▪ 对比 pyannote、DiariZen、3D-Speaker 选型</text>

  <!-- 标签栏 pill -->
  <g font-size="13">
    <rect x="48" y="292" width="96" height="28" rx="14" fill="none" stroke="#76b900" stroke-width="1.2"/>
    <text x="96" y="311" fill="#bef264" text-anchor="middle">Diarization</text>
    <rect x="154" y="292" width="90" height="28" rx="14" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="199" y="311" fill="#67e8f9" text-anchor="middle">Sortformer</text>
    <rect x="254" y="292" width="80" height="28" rx="14" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="294" y="311" fill="#c4b5fd" text-anchor="middle">pyannote</text>
    <rect x="344" y="292" width="80" height="28" rx="14" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="384" y="311" fill="#fcd34d" text-anchor="middle">DiariZen</text>
    <rect x="434" y="292" width="72" height="28" rx="14" fill="none" stroke="#f97316" stroke-width="1.2"/>
    <text x="470" y="311" fill="#fdba74" text-anchor="middle">FunASR</text>
  </g>

  <!-- 右侧概念示意：说话人时间轴 -->
  <g font-size="12" font-weight="bold">
    <text x="590" y="128" fill="#bef264">S0</text>
    <text x="590" y="170" fill="#67e8f9">S1</text>
    <text x="590" y="212" fill="#c4b5fd">S2</text>
  </g>
  <g stroke="#2f3566" stroke-width="1">
    <line x1="616" y1="124" x2="852" y2="124"/>
    <line x1="616" y1="166" x2="852" y2="166"/>
    <line x1="616" y1="208" x2="852" y2="208"/>
  </g>
  <rect x="620" y="114" width="70" height="20" rx="4" fill="#3f6212" stroke="#a3e635" stroke-width="1.5"/>
  <rect x="770" y="114" width="50" height="20" rx="4" fill="#3f6212" stroke="#a3e635" stroke-width="1.5"/>
  <rect x="672" y="156" width="88" height="20" rx="4" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="744" y="198" width="100" height="20" rx="4" fill="#3b2a6b" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- 重叠区 -->
  <rect x="672" y="104" width="18" height="82" fill="#f97316" opacity="0.18"/>
  <rect x="744" y="146" width="16" height="82" fill="#f97316" opacity="0.18"/>
  <text x="720" y="252" font-size="12" fill="#fdba74" text-anchor="middle">橙色 = 重叠语音</text>
  <text x="852" y="252" font-size="12" fill="#8892b0" text-anchor="end">10ms / 帧</text>

  <!-- 底部分隔线 + 章节提示 + 水印 -->
  <line x1="48" y1="342" x2="852" y2="342" stroke="#2a2a55" stroke-width="1"/>
  <text x="48" y="366" font-size="13" fill="#8892b0">技术路线 · 榜单解读 · 开源全景 · 场景选型</text>
  <text x="852" y="366" font-size="12" fill="#5a6382" text-anchor="end">AI 行业观察</text>
</svg>
