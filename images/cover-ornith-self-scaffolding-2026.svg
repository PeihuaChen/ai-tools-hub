<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridp" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#3b3b6b" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#gridp)"/>
  <rect width="900" height="383" fill="url(#grid)"/>

  <!-- top / bottom accent bars -->
  <rect x="0" y="0" width="300" height="4" fill="#22d3ee"/>
  <rect x="300" y="0" width="300" height="4" fill="#818cf8"/>
  <rect x="600" y="0" width="300" height="4" fill="#f472b6"/>
  <rect x="0" y="379" width="450" height="4" fill="#34d399"/>
  <rect x="450" y="379" width="450" height="4" fill="#818cf8"/>

  <!-- tag box -->
  <rect x="48" y="40" width="280" height="34" rx="6" fill="#1e1e44" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1"/>
  <text x="64" y="62" font-size="15" fill="#a5b4fc" font-weight="600">AI 行业观察 · 开源编程模型</text>

  <!-- year badge -->
  <circle cx="838" cy="58" r="26" fill="#1e1e44" stroke="#f472b6" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="838" y="65" font-size="22" fill="#f9a8d4" font-weight="700" text-anchor="middle">26</text>

  <!-- main title -->
  <text x="48" y="138" font-size="31" fill="#ffffff" font-weight="800">35B 干翻 397B？</text>
  <text x="48" y="178" font-size="31" fill="#ffffff" font-weight="800">Ornith-1.0 的惊人跑分背后</text>
  <text x="48" y="214" font-size="19" font-weight="700" fill="url(#sub)">是真突破，还是又一次 benchmaxxing</text>

  <!-- highlight lines -->
  <text x="48" y="252" font-size="13" fill="#34d399">▸ 自搭脚手架（Self-Scaffolding）：让模型自己设计工作流</text>
  <text x="48" y="274" font-size="13" fill="#22d3ee">▸ SWE-Bench 82.4 / Terminal-Bench 77.5，对标 Claude Opus</text>
  <text x="48" y="296" font-size="13" fill="#f9a8d4">▸ 横向对比 Qwen3.5 · Gemma4 · DeepSeek V4 · GLM 5.2 · GPT-5.5</text>

  <!-- pills -->
  <g font-size="12" font-weight="600">
    <rect x="48" y="316" width="86" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="91" y="333" fill="#67e8f9" text-anchor="middle">Ornith-1.0</text>
    <rect x="142" y="316" width="104" height="26" rx="13" fill="none" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="194" y="333" fill="#a5b4fc" text-anchor="middle">Agentic Coding</text>
    <rect x="254" y="316" width="78" height="26" rx="13" fill="none" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="293" y="333" fill="#6ee7b7" text-anchor="middle">SWE-Bench</text>
    <rect x="340" y="316" width="64" height="26" rx="13" fill="none" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="372" y="333" fill="#f9a8d4" text-anchor="middle">MIT 开源</text>
  </g>

  <!-- right concept diagram: self-scaffolding loop -->
  <g transform="translate(648,118)" opacity="0.92">
    <rect x="0" y="0" width="120" height="40" rx="8" fill="#1e1e44" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="60" y="25" font-size="13" fill="#67e8f9" text-anchor="middle" font-weight="600">脚手架</text>
    <rect x="0" y="96" width="120" height="40" rx="8" fill="#1e1e44" stroke="#f472b6" stroke-opacity="0.7"/>
    <text x="60" y="121" font-size="13" fill="#f9a8d4" text-anchor="middle" font-weight="600">解题方案</text>
    <!-- down arrow -->
    <line x1="60" y1="40" x2="60" y2="92" stroke="#818cf8" stroke-width="2"/>
    <path d="M60 96 l-5 -8 h10 z" fill="#818cf8"/>
    <!-- reward loop arrow back up -->
    <path d="M120 116 C 175 116, 175 20, 120 20" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M120 20 l9 -4 v8 z" fill="#34d399"/>
    <text x="150" y="72" font-size="11" fill="#6ee7b7" transform="rotate(90 150 72)" text-anchor="middle">奖励回传</text>
  </g>

  <!-- divider + footer -->
  <line x1="48" y1="356" x2="852" y2="356" stroke="#3b3b6b" stroke-opacity="0.5" stroke-width="1"/>
  <text x="48" y="372" font-size="11" fill="#8888aa">技术拆解 · 跑分对齐 · benchmaxxing 争议 · 选型建议</text>
  <text x="852" y="372" font-size="11" fill="#666688" text-anchor="end">公众号：AI工具箱</text>
</svg>
