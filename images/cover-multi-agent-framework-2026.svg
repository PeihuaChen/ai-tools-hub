<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a1e"/><stop offset="1" stop-color="#161638"/></linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="botbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#10b981"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/></pattern>
  </defs>
  <rect width="900" height="383" rx="12" fill="url(#bg)"/>
  <rect width="900" height="383" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="381" rx="12" fill="none" stroke="#334155" stroke-width="2"/>
  <rect width="900" height="4" fill="url(#topbar)"/>
  <rect y="379" width="900" height="4" fill="url(#botbar)"/>

  <!-- tag box -->
  <rect x="40" y="34" width="230" height="30" rx="6" fill="#1e1e44" stroke="#06b6d4" stroke-opacity="0.6"/>
  <text x="56" y="54" fill="#67e8f9" font-size="14" font-weight="600">AI 开发平台 · 多智能体</text>

  <!-- year badge -->
  <circle cx="840" cy="50" r="26" fill="#1e1e44" stroke="#8b5cf6" stroke-opacity="0.7"/>
  <text x="840" y="58" fill="#c4b5fd" font-size="22" font-weight="700" text-anchor="middle">26</text>

  <!-- main title -->
  <text x="40" y="120" fill="#ffffff" font-size="29" font-weight="700">从单 Agent 到多 Agent</text>
  <text x="40" y="155" fill="url(#sub)" font-size="18" font-weight="600">2026 协作框架选型、架构模式与场景落地全景</text>

  <!-- highlights -->
  <text x="40" y="198" fill="#60a5fa" font-size="13">▸ LangGraph · CrewAI · OpenAI SDK · Google ADK · Microsoft AF</text>
  <text x="40" y="222" fill="#34d399" font-size="13">▸ 5 种编排模式：Pipeline / Supervisor / Swarm / Graph / 层级</text>
  <text x="40" y="246" fill="#f472b6" font-size="13">▸ 客服 · 研发 · 金融 · 营销 四大场景选型建议</text>

  <!-- concept: multi-agent nodes -->
  <g transform="translate(590,145)">
    <circle cx="60" cy="30" r="22" fill="#1e1e44" stroke="#60a5fa" stroke-width="2"/>
    <text x="60" y="35" fill="#93c5fd" font-size="11" text-anchor="middle">Plan</text>
    <circle cx="160" cy="0" r="22" fill="#1e1e44" stroke="#8b5cf6" stroke-width="2"/>
    <text x="160" y="5" fill="#c4b5fd" font-size="11" text-anchor="middle">Code</text>
    <circle cx="160" cy="60" r="22" fill="#1e1e44" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="65" fill="#6ee7b7" font-size="11" text-anchor="middle">Test</text>
    <circle cx="260" cy="30" r="22" fill="#1e1e44" stroke="#ec4899" stroke-width="2"/>
    <text x="260" y="35" fill="#f9a8d4" font-size="11" text-anchor="middle">Deploy</text>
    <line x1="82" y1="30" x2="138" y2="5" stroke="#475569" stroke-width="1.5"/>
    <line x1="82" y1="30" x2="138" y2="55" stroke="#475569" stroke-width="1.5"/>
    <line x1="182" y1="5" x2="238" y2="25" stroke="#475569" stroke-width="1.5"/>
    <line x1="182" y1="55" x2="238" y2="35" stroke="#475569" stroke-width="1.5"/>
    <path d="M155 22 C140 40 140 40 155 58" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- tag pills -->
  <g font-size="12">
    <rect x="40" y="296" width="80" height="26" rx="13" fill="none" stroke="#06b6d4" stroke-opacity="0.7"/>
    <text x="80" y="313" fill="#67e8f9" text-anchor="middle">LangGraph</text>
    <rect x="128" y="296" width="66" height="26" rx="13" fill="none" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <text x="161" y="313" fill="#c4b5fd" text-anchor="middle">CrewAI</text>
    <rect x="202" y="296" width="98" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-opacity="0.7"/>
    <text x="251" y="313" fill="#93c5fd" text-anchor="middle">OpenAI SDK</text>
    <rect x="308" y="296" width="58" height="26" rx="13" fill="none" stroke="#10b981" stroke-opacity="0.7"/>
    <text x="337" y="313" fill="#6ee7b7" text-anchor="middle">A2A</text>
    <rect x="374" y="296" width="56" height="26" rx="13" fill="none" stroke="#ec4899" stroke-opacity="0.7"/>
    <text x="402" y="313" fill="#f9a8d4" text-anchor="middle">MCP</text>
    <rect x="438" y="296" width="76" height="26" rx="13" fill="none" stroke="#f59e0b" stroke-opacity="0.7"/>
    <text x="476" y="313" fill="#fcd34d" text-anchor="middle">企业落地</text>
  </g>

  <!-- footer -->
  <line x1="40" y1="344" x2="860" y2="344" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="40" y="366" fill="#64748b" font-size="12">深度解析 · 九大章节 · 选型决策流程图</text>
  <text x="860" y="366" fill="#475569" font-size="12" text-anchor="end">AI Tools Hub</text>
</svg>
