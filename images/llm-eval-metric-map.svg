<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#ffffff"/><rect x="0" y="0" width="1200" height="630" fill="#f8fafc"/><text x="54" y="58" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700">一张图读懂：大模型评测的四层证据链</text><text x="54" y="86" fill="#4b5563" font-family="Microsoft YaHei, sans-serif" font-size="14">从“会答题”到“可上线”，每一层都解决不同的问题；不要把它们压成一个总分。</text>
<g font-family="Microsoft YaHei, sans-serif"><rect x="54" y="125" width="244" height="330" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><rect x="54" y="125" width="244" height="54" rx="12" fill="#dbeafe"/><text x="76" y="158" fill="#1d4ed8" font-size="18" font-weight="700">① 基础能力</text><text x="76" y="211" fill="#111827" font-size="15" font-weight="700">知识、数学、推理、多模态</text><text x="76" y="247" fill="#4b5563" font-size="13">MMLU / MMLU-Pro</text><text x="76" y="274" fill="#4b5563" font-size="13">GPQA / HLE / MMMU</text><text x="76" y="320" fill="#1d4ed8" font-size="13" font-weight="700">常用分数：正确率</text><text x="76" y="358" fill="#6b7280" font-size="12">回答：它会不会做题？</text><text x="76" y="385" fill="#6b7280" font-size="12">警惕：饱和、题库污染</text><rect x="76" y="409" width="199" height="25" rx="5" fill="#ffffff" stroke="#93c5fd"/><text x="88" y="427" fill="#1d4ed8" font-size="11">不能直接推断业务可靠性</text>
<rect x="330" y="125" width="244" height="330" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/><rect x="330" y="125" width="244" height="54" rx="12" fill="#ede9fe"/><text x="352" y="158" fill="#6d28d9" font-size="18" font-weight="700">② 任务交付</text><text x="352" y="211" fill="#111827" font-size="15" font-weight="700">代码与工具调用</text><text x="352" y="247" fill="#4b5563" font-size="13">SWE-bench / Terminal-Bench</text><text x="352" y="274" fill="#4b5563" font-size="13">WebArena / τ-bench</text><text x="352" y="320" fill="#6d28d9" font-size="13" font-weight="700">常用分数：任务成功率</text><text x="352" y="358" fill="#6b7280" font-size="12">回答：它能否完成端到端任务？</text><text x="352" y="385" fill="#6b7280" font-size="12">必报：工具、预算、Harness</text><rect x="352" y="409" width="199" height="25" rx="5" fill="#ffffff" stroke="#c4b5fd"/><text x="364" y="427" fill="#6d28d9" font-size="11">“模型分”不等于“系统分”</text>
<rect x="606" y="125" width="244" height="330" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><rect x="606" y="125" width="244" height="54" rx="12" fill="#cffafe"/><text x="628" y="158" fill="#0e7490" font-size="18" font-weight="700">③ 人类体验</text><text x="628" y="211" fill="#111827" font-size="15" font-weight="700">对话偏好与指令遵循</text><text x="628" y="247" fill="#4b5563" font-size="13">Arena / IFEval / FollowBench</text><text x="628" y="274" fill="#4b5563" font-size="13">人工盲评 / A/B 测试</text><text x="628" y="320" fill="#0e7490" font-size="13" font-weight="700">常用分数：偏好与合规率</text><text x="628" y="358" fill="#6b7280" font-size="12">回答：用户更愿意用它吗？</text><text x="628" y="385" fill="#6b7280" font-size="12">不等于：事实正确或安全</text><rect x="628" y="409" width="199" height="25" rx="5" fill="#ffffff" stroke="#67e8f9"/><text x="640" y="427" fill="#0e7490" font-size="11">需要目标用户的真实盲测</text>
<rect x="882" y="125" width="264" height="330" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><rect x="882" y="125" width="264" height="54" rx="12" fill="#dcfce7"/><text x="904" y="158" fill="#15803d" font-size="18" font-weight="700">④ 生产兑现</text><text x="904" y="211" fill="#111827" font-size="15" font-weight="700">质量、速度、成本、风险</text><text x="904" y="247" fill="#4b5563" font-size="13">黄金集 / P95 延迟 / $/成功任务</text><text x="904" y="274" fill="#4b5563" font-size="13">人工接管率 / 安全越权率</text><text x="904" y="320" fill="#15803d" font-size="13" font-weight="700">常用分数：业务 KPI</text><text x="904" y="358" fill="#6b7280" font-size="12">回答：它能稳定、划算地上线吗？</text><text x="904" y="385" fill="#6b7280" font-size="12">答案来自你自己的任务集</text><rect x="904" y="409" width="219" height="25" rx="5" fill="#ffffff" stroke="#86efac"/><text x="916" y="427" fill="#15803d" font-size="11">这是采购与上线的最终裁判</text></g>
<path d="M176 500H1024" fill="none" stroke="#94a3b8" stroke-width="2"/><path d="M1014 493L1028 500 1014 507" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="600" y="548" text-anchor="middle" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700">正确方法：先用公开榜单筛选，再用业务黄金集决策</text><text x="600" y="579" text-anchor="middle" fill="#6b7280" font-family="Microsoft YaHei, sans-serif" font-size="12">评测报告必须同时记录：模型快照、提示词、题集版本、工具/Harness、采样次数、token 与时间预算、计分规则</text>
</svg>