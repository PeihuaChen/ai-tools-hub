<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="28" y="24" width="1144" height="582" rx="14" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.5"/>
  <text x="62" y="72" fill="#111827" font-family="Microsoft YaHei,Arial" font-size="25" font-weight="700">Mini-SWE-Agent：Bash-first ReAct 循环与评测边界</text>
  <text x="62" y="101" fill="#4b5563" font-family="Microsoft YaHei,Arial" font-size="14">把模型置于相同的任务、终端与验证条件下，区分“模型能力”与“脚手架增益”</text>
  <g font-family="Microsoft YaHei,Arial"><rect x="65" y="154" width="190" height="132" rx="11" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="90" y="191" fill="#1d4ed8" font-size="19" font-weight="700">① Issue / 任务</text><text x="90" y="221" fill="#4b5563" font-size="13">问题描述</text><text x="90" y="245" fill="#4b5563" font-size="13">仓库与执行约束</text><text x="90" y="269" fill="#4b5563" font-size="13">初始工作目录</text>
  <rect x="352" y="154" width="215" height="132" rx="11" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/><text x="384" y="191" fill="#6d28d9" font-size="19" font-weight="700">② 模型推理</text><text x="384" y="221" fill="#4b5563" font-size="13">读取历史观察</text><text x="384" y="245" fill="#4b5563" font-size="13">形成下一步假设</text><text x="384" y="269" fill="#4b5563" font-size="13">输出可执行命令</text>
  <rect x="664" y="154" width="215" height="132" rx="11" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><text x="697" y="191" fill="#0e7490" font-size="19" font-weight="700">③ Bash 环境</text><text x="697" y="221" fill="#4b5563" font-size="13">搜索、阅读与编辑</text><text x="697" y="245" fill="#4b5563" font-size="13">运行测试 / 检查 diff</text><text x="697" y="269" fill="#4b5563" font-size="13">回传标准输出与错误</text>
  <rect x="976" y="154" width="160" height="132" rx="11" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="1002" y="191" fill="#15803d" font-size="19" font-weight="700">④ 验证</text><text x="1002" y="221" fill="#4b5563" font-size="13">目标测试</text><text x="1002" y="245" fill="#4b5563" font-size="13">补丁与结果</text><text x="1002" y="269" fill="#4b5563" font-size="13">独立判定</text></g>
  <g stroke="#94a3b8" stroke-width="2"><path d="M255 220H342"/><path d="M567 220H654"/><path d="M879 220H966"/><path d="M1056 300V344H460V296" fill="none" stroke-dasharray="4"/></g><g fill="#94a3b8"><path d="M337 215l10 5-10 5"/><path d="M649 215l10 5-10 5"/><path d="M961 215l10 5-10 5"/><path d="M455 301l5-10 5 10"/></g>
  <text x="619" y="331" fill="#6b7280" font-family="Microsoft YaHei,Arial" font-size="12">测试失败、命令输出与新观察进入下一轮推理</text>
  <line x1="65" y1="380" x2="1136" y2="380" stroke="#d9e2ec"/>
  <text x="65" y="422" fill="#111827" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700">同一套循环，回答两类不同问题</text>
  <rect x="65" y="449" width="498" height="118" rx="10" fill="#fff7ed" stroke="#b45309"/><text x="92" y="484" fill="#b45309" font-family="Microsoft YaHei,Arial" font-size="16" font-weight="700">研究 / 评测：模型能力有多强？</text><text x="92" y="514" fill="#4b5563" font-family="Microsoft YaHei,Arial" font-size="13">固定任务、模型、Bash 环境与预算，比较解决率、成本、耗时和轨迹。</text><text x="92" y="541" fill="#6b7280" font-family="Microsoft YaHei,Arial" font-size="12">Mini-SWE-Agent 作为基线，减少复杂 Agent 外壳带来的干扰。</text>
  <rect x="638" y="449" width="498" height="118" rx="10" fill="#fef2f2" stroke="#b91c1c"/><text x="665" y="484" fill="#b91c1c" font-family="Microsoft YaHei,Arial" font-size="16" font-weight="700">工程 / 生产：边界是否可控？</text><text x="665" y="514" fill="#4b5563" font-family="Microsoft YaHei,Arial" font-size="13">终端执行需结合容器、最小权限、网络限制、资源限额与人工 Review。</text><text x="665" y="541" fill="#6b7280" font-family="Microsoft YaHei,Arial" font-size="12">SWE-bench 高分不等于可直接获得生产系统操作权限。</text>
</svg>
