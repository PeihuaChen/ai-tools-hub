<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <rect width="1100" height="700" fill="#ffffff"/>

  <text x="40" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827">智能体训练环境生态：五层分工</text>
  <text x="40" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">「智能体训练环境」不是单一产品，而是五层叠加。Orchard 主要占「沙箱执行层」，并自带一部分训练栈。</text>

  <!-- Layer 5 top: task/benchmark environments -->
  <rect x="40" y="92" width="1020" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="58" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">第 5 层｜任务 / 评测环境（提供具体世界与可验证奖励）</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1d4ed8">
    <rect x="58" y="128" width="150" height="24" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="0.8"/><text x="133" y="144" text-anchor="middle">SWE-bench / SWE-Gym</text>
    <rect x="216" y="128" width="150" height="24" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="0.8"/><text x="291" y="144" text-anchor="middle">WebArena / WebVoyager</text>
    <rect x="374" y="128" width="150" height="24" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="0.8"/><text x="449" y="144" text-anchor="middle">OSWorld / AndroidWorld</text>
    <rect x="532" y="128" width="140" height="24" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="0.8"/><text x="602" y="144" text-anchor="middle">AppWorld / ToolBench</text>
    <rect x="680" y="128" width="160" height="24" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="0.8"/><text x="760" y="144" text-anchor="middle">TheAgentCompany</text>
    <rect x="848" y="128" width="120" height="24" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="0.8"/><text x="908" y="144" text-anchor="middle">Terminal-Bench</text>
  </g>
  <text x="58" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">Orchard 三个 recipe 的评测基准就来自这一层</text>

  <!-- Layer 4: Gym-style interface -->
  <rect x="40" y="200" width="1020" height="84" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="58" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">第 4 层｜Gym 式标准环境接口（env-agent 抽象层）</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0e7490">
    <rect x="58" y="236" width="130" height="24" rx="12" fill="#cffafe" stroke="#0e7490" stroke-width="0.8"/><text x="123" y="252" text-anchor="middle">GEM（Gym for Agents）</text>
    <rect x="196" y="236" width="180" height="24" rx="12" fill="#cffafe" stroke="#0e7490" stroke-width="0.8"/><text x="286" y="252" text-anchor="middle">OpenAI Gym / Gymnasium</text>
    <rect x="384" y="236" width="120" height="24" rx="12" fill="#cffafe" stroke="#0e7490" stroke-width="0.8"/><text x="444" y="252" text-anchor="middle">AgentGym（复旦）</text>
  </g>
  <text x="58" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">给 agent 定标准接口，对标经典 RL 的 Gym</text>

  <!-- Layer 3: agent layer / middle -->
  <rect x="40" y="296" width="1020" height="84" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="58" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d">第 3 层｜Agent 中间层（把多轮 rollout + 环境接到 trainer）</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#15803d">
    <rect x="58" y="332" width="150" height="24" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="0.8"/><text x="133" y="348" text-anchor="middle">SkyRL-Agent（Berkeley）</text>
    <rect x="216" y="332" width="90" height="24" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="0.8"/><text x="261" y="348" text-anchor="middle">rLLM</text>
    <rect x="314" y="332" width="80" height="24" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="0.8"/><text x="354" y="348" text-anchor="middle">ART</text>
    <rect x="402" y="332" width="100" height="24" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="0.8"/><text x="452" y="348" text-anchor="middle">prime-rl</text>
    <rect x="510" y="332" width="100" height="24" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="0.8"/><text x="560" y="348" text-anchor="middle">verifiers</text>
  </g>
  <text x="58" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">与 Orchard 的「recipe + harness 无关」定位最接近</text>

  <!-- Layer 2: RL trainer -->
  <rect x="40" y="392" width="1020" height="84" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="58" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309">第 2 层｜RL 训练框架（算法 / 分布式 / 接推理引擎）</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b45309">
    <rect x="58" y="428" width="140" height="24" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="0.8"/><text x="128" y="444" text-anchor="middle">verl（字节 HybridFlow）</text>
    <rect x="206" y="428" width="90" height="24" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="0.8"/><text x="251" y="444" text-anchor="middle">OpenRLHF</text>
    <rect x="304" y="428" width="150" height="24" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="0.8"/><text x="379" y="444" text-anchor="middle">slime（Orchard 采用）</text>
    <rect x="462" y="428" width="120" height="24" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="0.8"/><text x="522" y="444" text-anchor="middle">TRL（HuggingFace）</text>
    <rect x="590" y="428" width="140" height="24" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="0.8"/><text x="660" y="444" text-anchor="middle">OpenRL（Google GKE）</text>
  </g>
  <text x="58" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">负责 PPO / GRPO 等算法与分布式训练</text>

  <!-- Layer 1: sandbox execution (Orchard) -->
  <rect x="40" y="488" width="1020" height="118" rx="10" fill="#faf5ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="58" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9">第 1 层｜沙箱执行层（安全隔离地跑 agent 代码，大规模并发）★ Orchard Env 所在层</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11.5">
    <rect x="58" y="524" width="180" height="30" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="148" y="544" text-anchor="middle" font-weight="bold" fill="#6d28d9">Orchard Env（自托管）</text>
    <rect x="248" y="524" width="180" height="30" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/><text x="338" y="544" text-anchor="middle" fill="#6d28d9">SkyPilot Sandboxes（自托管）</text>
    <rect x="438" y="524" width="120" height="30" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/><text x="498" y="544" text-anchor="middle" fill="#6d28d9">E2B（托管云）</text>
    <rect x="568" y="524" width="120" height="30" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/><text x="628" y="544" text-anchor="middle" fill="#6d28d9">Modal（托管云）</text>
    <rect x="698" y="524" width="120" height="30" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/><text x="758" y="544" text-anchor="middle" fill="#6d28d9">Daytona（托管云）</text>
  </g>
  <text x="58" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#4b5563">自托管（K8s 原生，省钱可控）：Orchard Env · SkyPilot　｜　托管云（SDK 友好，按用量计费）：E2B · Modal · Daytona</text>
  <text x="58" y="596" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">Orchard 的差异化：把这一层抽成稳定服务，并让蒸馏 / RL / 评测三阶段、SWE / GUI / 助理三域复用同一套基础设施</text>

  <!-- side note -->
  <rect x="40" y="624" width="1020" height="56" rx="10" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.2"/>
  <text x="58" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827">要点：多数框架只解决其中一层，且各自捆绑「任务+trainer+评测」互不通用；</text>
  <text x="58" y="668" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4b5563">Orchard 的贡献是把最底层的「环境」单独做成稳定服务，让上面几层可以自由替换、彼此复用。</text>
</svg>
