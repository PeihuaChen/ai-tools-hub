<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560">
  <rect width="1160" height="560" fill="#ffffff"/>

  <text x="40" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="bold" fill="#111827">监管时间差：欧盟按下暂停键，保险监管已经开始查账</text>
  <text x="40" y="74" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4b5563">事故在加速兑现，而最核心的高风险义务被推迟了 16 个月</text>
  <line x1="40" y1="92" x2="1120" y2="92" stroke="#d9e2ec" stroke-width="1.5"/>

  <text x="40" y="132" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c">欧盟《AI 法案》：数字综合法案（2026-07-27 生效）调整后的时间表</text>

  <line x1="80" y1="196" x2="1100" y2="196" stroke="#94a3b8" stroke-width="2"/>

  <g font-family="Microsoft YaHei, sans-serif">
    <circle cx="190" cy="196" r="8" fill="#15803d"/>
    <line x1="190" y1="196" x2="190" y2="160" stroke="#15803d" stroke-width="1.2"/>
    <rect x="96" y="212" width="188" height="86" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.3"/>
    <text x="190" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">2026-08-02</text>
    <text x="112" y="234" font-size="13" font-weight="bold" fill="#15803d">已生效 · 未延期</text>
    <text x="112" y="254" font-size="11" fill="#4b5563">第 50 条透明度义务</text>
    <text x="112" y="272" font-size="11" fill="#4b5563">GPAI 处罚权限激活</text>
    <text x="112" y="290" font-size="11" fill="#4b5563">成员国市场监管职权</text>
  </g>

  <g font-family="Microsoft YaHei, sans-serif">
    <circle cx="450" cy="196" r="8" fill="#b45309"/>
    <line x1="450" y1="196" x2="450" y2="160" stroke="#b45309" stroke-width="1.2"/>
    <rect x="356" y="212" width="188" height="86" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
    <text x="450" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">2026-12</text>
    <text x="372" y="234" font-size="13" font-weight="bold" fill="#b45309">推迟至此</text>
    <text x="372" y="254" font-size="11" fill="#4b5563">提供者标识 AI 生成</text>
    <text x="372" y="272" font-size="11" fill="#4b5563">内容的义务</text>
    <text x="372" y="290" font-size="11" fill="#6b7280">原定更早生效</text>
  </g>

  <g font-family="Microsoft YaHei, sans-serif">
    <circle cx="720" cy="196" r="8" fill="#b91c1c"/>
    <line x1="720" y1="196" x2="720" y2="160" stroke="#b91c1c" stroke-width="1.2"/>
    <rect x="626" y="212" width="188" height="86" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
    <text x="720" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">2027-12-02</text>
    <text x="642" y="234" font-size="13" font-weight="bold" fill="#b91c1c">延后 16 个月</text>
    <text x="642" y="254" font-size="11" fill="#4b5563">附件三独立高风险系统</text>
    <text x="642" y="272" font-size="11" fill="#4b5563">招聘 · 信贷 · 教育</text>
    <text x="642" y="290" font-size="11" fill="#4b5563">部分保险核保场景</text>
  </g>

  <g font-family="Microsoft YaHei, sans-serif">
    <circle cx="990" cy="196" r="8" fill="#6d28d9"/>
    <line x1="990" y1="196" x2="990" y2="160" stroke="#6d28d9" stroke-width="1.2"/>
    <rect x="896" y="212" width="188" height="86" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.3"/>
    <text x="990" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">2028-08-02</text>
    <text x="912" y="234" font-size="13" font-weight="bold" fill="#6d28d9">延后更久</text>
    <text x="912" y="254" font-size="11" fill="#4b5563">附件一嵌入式高风险 AI</text>
    <text x="912" y="272" font-size="11" fill="#4b5563">医疗器械 · 机械 · 玩具</text>
    <text x="912" y="290" font-size="11" fill="#6b7280">此前投放者除外</text>
  </g>

  <rect x="626" y="166" width="458" height="0" fill="none"/>
  <path d="M 720 320 L 720 334 L 990 334 L 990 320" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4"/>
  <text x="855" y="352" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">系统性合规义务集中落在 2027-2028，而事故正在 2026 年发生</text>

  <line x1="40" y1="378" x2="1120" y2="378" stroke="#d9e2ec" stroke-width="1.5"/>

  <text x="40" y="410" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#0e7490">对照：美国保险监管（NAIC 示范公告体系）已进入实操检查</text>

  <rect x="40" y="426" width="345" height="112" rx="10" fill="#f8fafc" stroke="#0e7490" stroke-width="1.3"/>
  <text x="64" y="452" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">核心原则</text>
  <text x="64" y="476" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#4b5563">由 AI 作出或支持的、影响消费者的</text>
  <text x="64" y="496" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#4b5563">决策，须遵守全部适用保险法规</text>
  <text x="64" y="520" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">含不公平交易行为与不公平歧视条款</text>

  <rect x="405" y="426" width="345" height="112" rx="10" fill="#f8fafc" stroke="#0e7490" stroke-width="1.3"/>
  <text x="429" y="452" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">2026 年 7 月起检查官在问</text>
  <text x="429" y="476" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#4b5563">能否证明部署前做过测试</text>
  <text x="429" y="496" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#4b5563">部署后是否持续监控</text>
  <text x="429" y="516" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#4b5563">责任人是否有权停用系统</text>

  <rect x="770" y="426" width="350" height="112" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="794" y="452" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">对企业的实际含义</text>
  <text x="794" y="476" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#4b5563">监管不问模型多准，问你能否</text>
  <text x="794" y="496" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#4b5563">拿出完整证据链</text>
  <text x="794" y="520" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#1d4ed8">可观测性 = 合规证据基础设施</text>
</svg>
