<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f7fa"/></linearGradient><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="700" fill="#ffffff"/><rect width="1200" height="700" fill="url(#paper)"/>
<text x="60" y="56" font-family="Microsoft YaHei,Arial" font-size="25" font-weight="700" fill="#111827">AUGURY：1B 小模型如何在农业场景做到“不编造事实”</text>
<text x="60" y="86" font-family="Microsoft YaHei,Arial" font-size="14" fill="#4b5563">以杂草物种反推土壤状况的开源离线管线；模型只负责把已核验的知识讲成人话</text>

<g font-family="Microsoft YaHei,Arial"><rect x="60" y="120" width="250" height="96" rx="10" fill="#f1f5f9" stroke="#d9e2ec" stroke-width="1.5"/><text x="84" y="152" font-size="15" font-weight="700" fill="#111827">输入 A · 照片</text><text x="84" y="178" font-size="13" fill="#4b5563">田间杂草拍照</text><text x="84" y="200" font-size="11" fill="#6b7280">手机即可完成，无需联网</text>
<rect x="60" y="240" width="250" height="96" rx="10" fill="#f1f5f9" stroke="#d9e2ec" stroke-width="1.5"/><text x="84" y="272" font-size="15" font-weight="700" fill="#111827">输入 B · 文字</text><text x="84" y="298" font-size="13" fill="#4b5563">“蒲公英说明土壤怎么了？”</text><text x="84" y="320" font-size="11" fill="#6b7280">支持多物种与地区限定</text></g>

<g font-family="Microsoft YaHei,Arial"><rect x="380" y="120" width="290" height="216" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="404" y="152" font-size="17" font-weight="700" fill="#1d4ed8">第 1 层 · 感知</text><text x="404" y="180" font-size="13" fill="#374151">DINOv2 向量 + FAISS 近邻检索</text><text x="404" y="205" font-size="13" fill="#374151">11.1 万张图片图库比对</text><text x="404" y="230" font-size="13" fill="#374151">澳洲 188 种杂草：</text><text x="404" y="253" font-size="13" font-weight="700" fill="#1d4ed8">top-1 80.9% / top-3 88.3%</text><text x="404" y="284" font-size="12" fill="#6b7280">用检索而非分类：新增物种只加图片</text><text x="404" y="306" font-size="12" fill="#6b7280">和数据库记录，编码器无需重训</text>
<rect x="380" y="240" width="0" height="0"/></g>

<g font-family="Microsoft YaHei,Arial"><rect x="740" y="120" width="290" height="216" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="764" y="152" font-size="17" font-weight="700" fill="#15803d">第 2 层 · 事实</text><text x="764" y="180" font-size="13" fill="#374151">确定性物种数据库</text><text x="764" y="205" font-size="13" font-weight="700" fill="#15803d">2,230 个物种 × 地区</text><text x="764" y="230" font-size="13" fill="#374151">板结 / 积水 / pH / 盐分 / 养分</text><text x="764" y="261" font-size="12" fill="#6b7280">来源含 Ellenberg (1991) 等公开资料</text><text x="764" y="283" font-size="12" font-weight="700" fill="#15803d">关键：pH 值由数据库给出</text><text x="764" y="305" font-size="12" fill="#6b7280">模型从不自己生成这些数值</text></g>

<g font-family="Microsoft YaHei,Arial"><rect x="380" y="386" width="650" height="150" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="404" y="418" font-size="17" font-weight="700" fill="#b45309">第 3 层 · 表达（唯一的模型层）</text><text x="404" y="448" font-size="13" fill="#374151">MiniCPM5-1B + LoRA 微调（r16/α32，3 epoch，13,627 条数据库生成样本）</text><text x="404" y="473" font-size="13" fill="#374151">GGUF Q4_K_M 量化后约 660MB，经 llama.cpp 可在手机离线运行</text><text x="404" y="498" font-size="13" fill="#374151">16 核笔记本上单次回答约 6-12 秒</text><text x="404" y="522" font-size="12" fill="#6b7280">职责被严格限定：只把上游给定的事实组织成可读的解释，并拒绝给出管理建议</text></g>

<g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"><path d="M310 168H372"/><path d="M310 288H340V228H372" stroke-dasharray="4"/><path d="M670 228H732"/><path d="M885 336V378"/><path d="M525 336V378"/></g>
<text x="700" y="366" font-family="Microsoft YaHei,Arial" font-size="11" fill="#6b7280">物种 + 指标事实向下传递</text>

<rect x="60" y="386" width="250" height="150" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/><text x="84" y="418" font-family="Microsoft YaHei,Arial" font-size="15" font-weight="700" fill="#6d28d9">边界设计</text><text x="84" y="447" font-family="Microsoft YaHei,Arial" font-size="12" fill="#374151">只给土壤指标</text><text x="84" y="471" font-family="Microsoft YaHei,Arial" font-size="12" fill="#374151">不给施肥用药建议</text><text x="84" y="495" font-family="Microsoft YaHei,Arial" font-size="12" fill="#374151">Apache-2.0 开源</text><text x="84" y="519" font-family="Microsoft YaHei,Arial" font-size="12" fill="#374151">全流程无需云端</text>

<rect x="60" y="576" width="970" height="70" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="84" y="606" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#b91c1c">成熟度提示</text><text x="84" y="632" font-family="Microsoft YaHei,Arial" font-size="12.5" fill="#374151">截至 2026 年 8 月，文字链路已可用，照片识别链路的索引仍在建设中；这是早期开源项目，不是已验证产量收益的商用产品。</text>
<text x="1140" y="676" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="11" fill="#6b7280">资料来源：AUGURY 开源仓库 · 2026-08</text>
</svg>