<text x="72" y="474" fill="#6b7280" font-size="30">标准 forward</text>

<path d="M356 350H378" stroke="#94a3b8" stroke-width="3"/><path d="M370 342L382 350L370 358" fill="none" stroke="#94a3b8" stroke-width="3"/>

