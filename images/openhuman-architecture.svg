<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">OpenHuman 架构概览</text>
  <text x="600" y="70" text-anchor="middle" fill="#888" font-size="13">桌面优先 · 本地记忆 · 118+ 集成 · 智能压缩</text>

  <!-- Left: Data Sources -->
  <rect x="30" y="100" width="200" height="420" rx="10" fill="rgba(52,152,219,0.08)" stroke="#3498db" stroke-width="1"/>
  <text x="130" y="125" text-anchor="middle" fill="#3498db" font-size="13" font-weight="700">📥 数据源（118+ OAuth）</text>

  <rect x="50" y="145" width="160" height="30" rx="6" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="0.5"/>
  <text x="130" y="165" text-anchor="middle" fill="#7ec8e3" font-size="11">📧 Gmail</text>

  <rect x="50" y="185" width="160" height="30" rx="6" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="0.5"/>
  <text x="130" y="205" text-anchor="middle" fill="#7ec8e3" font-size="11">📝 Notion</text>

  <rect x="50" y="225" width="160" height="30" rx="6" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="0.5"/>
  <text x="130" y="245" text-anchor="middle" fill="#7ec8e3" font-size="11">💻 GitHub</text>

  <rect x="50" y="265" width="160" height="30" rx="6" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="0.5"/>
  <text x="130" y="285" text-anchor="middle" fill="#7ec8e3" font-size="11">💬 Slack</text>

  <rect x="50" y="305" width="160" height="30" rx="6" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="0.5"/>
  <text x="130" y="325" text-anchor="middle" fill="#7ec8e3" font-size="11">📅 Calendar</text>

  <rect x="50" y="345" width="160" height="30" rx="6" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="0.5"/>
  <text x="130" y="365" text-anchor="middle" fill="#7ec8e3" font-size="11">📁 Google Drive</text>

  <rect x="50" y="385" width="160" height="30" rx="6" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="0.5"/>
  <text x="130" y="405" text-anchor="middle" fill="#7ec8e3" font-size="11">🔧 Jira / Linear</text>

  <rect x="50" y="425" width="160" height="30" rx="6" fill="rgba(52,152,219,0.12)" stroke="#3498db" stroke-width="0.5" stroke-dasharray="3"/>
  <text x="130" y="445" text-anchor="middle" fill="#5a9" font-size="11">+ 110 更多...</text>

  <!-- Auto-fetch label -->
  <rect x="50" y="475" width="160" height="25" rx="12" fill="rgba(46,204,113,0.2)" stroke="#2ecc71" stroke-width="1"/>
  <text x="130" y="492" text-anchor="middle" fill="#2ecc71" font-size="10" font-weight="600">🔄 每 20 分钟自动同步</text>

  <!-- Arrow: Sources → Memory -->
  <path d="M230 310 L290 310" stroke="#3498db" stroke-width="2" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3498db"/></marker></defs>

  <!-- Center: Memory Tree -->
  <rect x="300" y="100" width="280" height="420" rx="10" fill="rgba(155,89,182,0.08)" stroke="#9b59b6" stroke-width="1"/>
  <text x="440" y="125" text-anchor="middle" fill="#9b59b6" font-size="13" font-weight="700">🧠 Memory Tree</text>

  <!-- Pipeline -->
  <text x="320" y="155" fill="#aaa" font-size="10">规范化 → 分块(≤3k token) → 评分 → 摘要树</text>

  <!-- Three trees -->
  <rect x="320" y="170" width="240" height="60" rx="6" fill="rgba(155,89,182,0.12)" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="340" y="190" fill="#bb8fce" font-size="11" font-weight="600">Source Tree</text>
  <text x="340" y="210" fill="#888" font-size="10">每个数据源一棵（Gmail树、Notion树...）</text>

  <rect x="320" y="240" width="240" height="60" rx="6" fill="rgba(155,89,182,0.12)" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="340" y="260" fill="#bb8fce" font-size="11" font-weight="600">Topic Tree</text>
  <text x="340" y="280" fill="#888" font-size="10">按高热度实体聚合</text>

  <rect x="320" y="310" width="240" height="60" rx="6" fill="rgba(155,89,182,0.12)" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="340" y="330" fill="#bb8fce" font-size="11" font-weight="600">Global Tree</text>
  <text x="340" y="350" fill="#888" font-size="10">每天一个节点，全局视图</text>

  <!-- Storage -->
  <rect x="320" y="385" width="115" height="45" rx="6" fill="rgba(243,156,18,0.12)" stroke="#f39c12" stroke-width="0.5"/>
  <text x="377" y="405" text-anchor="middle" fill="#f39c12" font-size="10" font-weight="600">SQLite</text>
  <text x="377" y="420" text-anchor="middle" fill="#888" font-size="9">本地存储</text>

  <rect x="445" y="385" width="115" height="45" rx="6" fill="rgba(243,156,18,0.12)" stroke="#f39c12" stroke-width="0.5"/>
  <text x="502" y="405" text-anchor="middle" fill="#f39c12" font-size="10" font-weight="600">Obsidian .md</text>
  <text x="502" y="420" text-anchor="middle" fill="#888" font-size="9">可浏览编辑</text>

  <rect x="320" y="445" width="240" height="30" rx="6" fill="rgba(46,204,113,0.12)" stroke="#2ecc71" stroke-width="0.5"/>
  <text x="440" y="465" text-anchor="middle" fill="#2ecc71" font-size="10">🔒 数据本地加密，始终属于你</text>

  <!-- Arrow: Memory → TokenJuice -->
  <path d="M580 310 L630 310" stroke="#9b59b6" stroke-width="2" marker-end="url(#a2)"/>
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9b59b6"/></marker></defs>

  <!-- TokenJuice -->
  <rect x="640" y="240" width="160" height="140" rx="10" fill="rgba(46,204,113,0.08)" stroke="#2ecc71" stroke-width="1"/>
  <text x="720" y="270" text-anchor="middle" fill="#2ecc71" font-size="12" font-weight="700">⚡ TokenJuice</text>
  <text x="720" y="295" text-anchor="middle" fill="#888" font-size="10">HTML → Markdown</text>
  <text x="720" y="315" text-anchor="middle" fill="#888" font-size="10">长URL缩短</text>
  <text x="720" y="335" text-anchor="middle" fill="#888" font-size="10">去重 + 摘要</text>
  <text x="720" y="360" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="600">↓ 80% token</text>

  <!-- Arrow: TokenJuice → LLM -->
  <path d="M800 310 L850 310" stroke="#2ecc71" stroke-width="2" marker-end="url(#a3)"/>
  <defs><marker id="a3" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2ecc71"/></marker></defs>

  <!-- Right: LLM + Tools + UI -->
  <rect x="860" y="100" width="310" height="420" rx="10" fill="rgba(231,76,60,0.06)" stroke="#e74c3c" stroke-width="1"/>
  <text x="1015" y="125" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="700">🤖 Agent 运行时</text>

  <!-- Model routing -->
  <rect x="880" y="145" width="270" height="55" rx="6" fill="rgba(231,76,60,0.1)" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="1015" y="165" text-anchor="middle" fill="#e74c3c" font-size="11" font-weight="600">模型智能路由</text>
  <text x="1015" y="185" text-anchor="middle" fill="#888" font-size="10">推理型 | 快速型 | 视觉型 · 一个订阅全包</text>

  <!-- Native tools -->
  <rect x="880" y="210" width="130" height="35" rx="6" fill="rgba(52,152,219,0.12)" stroke="#3498db" stroke-width="0.5"/>
  <text x="945" y="232" text-anchor="middle" fill="#7ec8e3" font-size="10">🔍 Web搜索</text>

  <rect x="1020" y="210" width="130" height="35" rx="6" fill="rgba(52,152,219,0.12)" stroke="#3498db" stroke-width="0.5"/>
  <text x="1085" y="232" text-anchor="middle" fill="#7ec8e3" font-size="10">🌐 网页抓取</text>

  <rect x="880" y="255" width="130" height="35" rx="6" fill="rgba(52,152,219,0.12)" stroke="#3498db" stroke-width="0.5"/>
  <text x="945" y="277" text-anchor="middle" fill="#7ec8e3" font-size="10">💻 代码工具集</text>

  <rect x="1020" y="255" width="130" height="35" rx="6" fill="rgba(52,152,219,0.12)" stroke="#3498db" stroke-width="0.5"/>
  <text x="1085" y="277" text-anchor="middle" fill="#7ec8e3" font-size="10">🎙️ 原生语音</text>

  <!-- Desktop UI -->
  <rect x="880" y="310" width="270" height="90" rx="6" fill="rgba(155,89,182,0.1)" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="1015" y="335" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="600">🖥️ 桌面 UI（Tauri v2）</text>
  <text x="1015" y="358" text-anchor="middle" fill="#888" font-size="10">桌面宠物 · 口型同步 · Google Meet 参与</text>
  <text x="1015" y="378" text-anchor="middle" fill="#888" font-size="10">macOS / Windows / Linux</text>

  <!-- agentmemory bridge -->
  <rect x="880" y="415" width="270" height="45" rx="6" fill="rgba(243,156,18,0.1)" stroke="#f39c12" stroke-width="0.5"/>
  <text x="1015" y="435" text-anchor="middle" fill="#f39c12" font-size="10" font-weight="600">🔗 agentmemory 后端</text>
  <text x="1015" y="452" text-anchor="middle" fill="#888" font-size="9">共享记忆：Claude Code / Cursor / Codex / OpenCode</text>

  <!-- Bottom bar -->
  <rect x="0" y="555" width="1200" height="75" fill="rgba(0,0,0,0.5)"/>
  <text x="200" y="590" text-anchor="middle" fill="#3498db" font-size="22" font-weight="800">23k+ ⭐</text>
  <text x="200" y="612" text-anchor="middle" fill="#888" font-size="10">GitHub Stars (3个月)</text>
  <text x="450" y="590" text-anchor="middle" fill="#2ecc71" font-size="22" font-weight="800">118+</text>
  <text x="450" y="612" text-anchor="middle" fill="#888" font-size="10">OAuth 集成</text>
  <text x="700" y="590" text-anchor="middle" fill="#9b59b6" font-size="22" font-weight="800">20 min</text>
  <text x="700" y="612" text-anchor="middle" fill="#888" font-size="10">上下文建立时间</text>
  <text x="950" y="590" text-anchor="middle" fill="#f39c12" font-size="22" font-weight="800">-80%</text>
  <text x="950" y="612" text-anchor="middle" fill="#888" font-size="10">Token 成本降低</text>
</svg>