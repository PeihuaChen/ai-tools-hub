<svg width="1080" height="780" viewBox="0 0 1080 780" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="780" fill="#f7f8fa"/>

  <text x="540" y="78" font-size="52" font-weight="bold" fill="#111827" text-anchor="middle">Langflow 三层能力结构</text>

  <!-- Layer 1: canvas -->
  <rect x="60" y="130" width="960" height="150" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="90" y="188" font-size="42" font-weight="bold" fill="#1d4ed8">① 可视化画布层</text>
  <text x="90" y="238" font-size="32" fill="#4b5563">拖拽连线搭 flow ＋ 任意节点写 Python 扩展</text>

  <!-- arrow 1 -->
  <line x1="540" y1="282" x2="540" y2="328" stroke="#94a3b8" stroke-width="3"/>
  <path d="M534 320 L540 330 L546 320 Z" fill="#94a3b8"/>

  <!-- Layer 2: flow as tool -->
  <rect x="60" y="330" width="960" height="150" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="90" y="388" font-size="42" font-weight="bold" fill="#6d28d9">② flow 即工具</text>
  <text x="90" y="438" font-size="32" fill="#4b5563">每条 flow 自动暴露成 API 与 MCP Server</text>

  <!-- arrow 2 -->
  <line x1="540" y1="482" x2="540" y2="528" stroke="#94a3b8" stroke-width="3"/>
  <path d="M534 520 L540 530 L546 520 Z" fill="#94a3b8"/>

  <!-- Layer 3: deployment -->
  <rect x="60" y="530" width="960" height="210" rx="16" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="90" y="586" font-size="42" font-weight="bold" fill="#0e7490">③ 两种部署形态</text>

  <!-- card A -->
  <rect x="90" y="598" width="438" height="124" rx="14" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
  <text x="118" y="646" font-size="34" font-weight="bold" fill="#111827">开发实例</text>
  <text x="118" y="697" font-size="30" fill="#6b7280">带可视化编辑器，用来搭调</text>

  <!-- card B -->
  <rect x="552" y="598" width="438" height="124" rx="14" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
  <text x="580" y="646" font-size="34" font-weight="bold" fill="#111827">生产 runtime</text>
  <text x="580" y="697" font-size="30" fill="#6b7280">无头仅跑 API，稳定优先</text>
</svg>
