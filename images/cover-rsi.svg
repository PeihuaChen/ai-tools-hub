<svg width="900" height="383" viewBox="0 0 900 383" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="0.5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#2a2a55" stroke-width="1" opacity="0.35">
    <line x1="0" y1="64" x2="900" y2="64"/>
    <line x1="0" y1="128" x2="900" y2="128"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="256" x2="900" y2="256"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="750" y1="0" x2="750" y2="383"/>
  </g>

  <!-- top/bottom bars -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topbar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#topbar)"/>

  <!-- tag box -->
  <rect x="48" y="42" width="260" height="34" rx="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="64" y="65" font-size="16" fill="#fcd34d" font-weight="bold">AI 行业观察 · 前沿趋势</text>

  <!-- year badge -->
  <circle cx="838" cy="58" r="26" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="838" y="67" font-size="24" fill="#38bdf8" font-weight="bold" text-anchor="middle">26</text>

  <!-- title -->
  <text x="48" y="150" font-size="40" fill="#ffffff" font-weight="bold">RSI 递归自我改进</text>
  <text x="48" y="192" font-size="19" fill="url(#sub)" font-weight="bold">五级自主框架 · 国内外进展 · 落地边界</text>

  <!-- highlight lines -->
  <text x="48" y="240" font-size="13" fill="#fcd34d">◆ Anthropic：Claude 已写 80% 合并代码，人均产出 8 倍</text>
  <text x="48" y="266" font-size="13" fill="#93c5fd">◆ OpenAI：AI 日产 3 天研究量，冲刺 2028 自动研究员</text>
  <text x="48" y="292" font-size="13" fill="#86efac">◆ 中国 35 位学者：「最后一个由人类打造的 AI」路线图</text>

  <!-- right concept: recursive loop -->
  <g opacity="0.9">
    <circle cx="770" cy="150" r="46" fill="none" stroke="#4b4b7a" stroke-width="2"/>
    <path d="M 770 104 A 46 46 0 1 1 730 127" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="730,127 726,112 743,120" fill="#38bdf8"/>
    <circle cx="770" cy="150" r="16" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="770" y="156" font-size="15" fill="#fcd34d" font-weight="bold" text-anchor="middle">AI</text>
  </g>

  <!-- tags pills -->
  <g font-size="12">
    <rect x="48" y="316" width="70" height="26" rx="13" fill="none" stroke="#b45309" stroke-width="1.2"/>
    <text x="83" y="333" fill="#fcd34d" text-anchor="middle">RSI</text>
    <rect x="128" y="316" width="74" height="26" rx="13" fill="none" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="165" y="333" fill="#93c5fd" text-anchor="middle">OpenAI</text>
    <rect x="212" y="316" width="90" height="26" rx="13" fill="none" stroke="#0e7490" stroke-width="1.2"/>
    <text x="257" y="333" fill="#67e8f9" text-anchor="middle">Anthropic</text>
    <rect x="312" y="316" width="98" height="26" rx="13" fill="none" stroke="#15803d" stroke-width="1.2"/>
    <text x="361" y="333" fill="#86efac" text-anchor="middle">自我改进</text>
  </g>

  <!-- watermark -->
  <text x="852" y="336" font-size="12" fill="#4b4b7a" text-anchor="end">AI 行业观察</text>
</svg>
