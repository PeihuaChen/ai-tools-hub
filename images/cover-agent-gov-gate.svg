<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="covBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="50%" stop-color="#141432"/>
      <stop offset="100%" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="barA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="barB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#covBg)"/>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#barA)"/>
  <!-- Bottom gradient bar -->
  <rect x="0" y="379" width="900" height="4" fill="url(#barB)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="48" x2="900" y2="48"/><line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="144" x2="900" y2="144"/><line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="240" x2="900" y2="240"/><line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="0" y1="336" x2="900" y2="336"/>
    <line x1="60" y1="0" x2="60" y2="383"/><line x1="120" y1="0" x2="120" y2="383"/>
    <line x1="180" y1="0" x2="180" y2="383"/><line x1="240" y1="0" x2="240" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/><line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="420" y1="0" x2="420" y2="383"/><line x1="480" y1="0" x2="480" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/><line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="660" y1="0" x2="660" y2="383"/><line x1="720" y1="0" x2="720" y2="383"/>
    <line x1="780" y1="0" x2="780" y2="383"/><line x1="840" y1="0" x2="840" y2="383"/>
  </g>

  <!-- Top-left label box -->
  <rect x="40" y="28" width="230" height="34" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="51" font-size="15" font-weight="bold" fill="#93c5fd" text-anchor="middle">AI 行业观察 · Agent 治理</text>

  <!-- Year badge -->
  <rect x="812" y="28" width="52" height="34" rx="8" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="838" y="52" font-size="17" font-weight="bold" fill="#c4b5fd" text-anchor="middle">26</text>

  <!-- Main title -->
  <text x="40" y="128" font-size="44" font-weight="bold" fill="#ffffff">治理这道门</text>
  <text x="40" y="172" font-size="44" font-weight="bold" fill="#ffffff">Agent 才能上生产</text>

  <!-- Subtitle -->
  <text x="40" y="214" font-size="19" fill="url(#gateGrad)">2026 生产级 Agent 治理工具链为何集中爆发</text>

  <!-- Three highlight lines -->
  <text x="40" y="252" font-size="14" fill="#60a5fa">$9.15亿并购 Arize · WSO2 Agent Manager GA · LLM Gateway</text>
  <text x="40" y="276" font-size="14" fill="#f472b6">NIST 标准 · 中国智能体实施意见 · EU AI Act</text>
  <text x="40" y="300" font-size="14" fill="#34d399">四条战线 · 五层治理栈 · 分级治理选型</text>

  <!-- Tag pills -->
  <g>
    <rect x="40" y="318" width="76" height="24" rx="12" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="78" y="335" font-size="12" fill="#93c5fd" text-anchor="middle">MCP网关</text>

    <rect x="126" y="318" width="76" height="24" rx="12" fill="none" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="164" y="335" font-size="12" fill="#67e8f9" text-anchor="middle">运行时拦截</text>

    <rect x="212" y="318" width="76" height="24" rx="12" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="250" y="335" font-size="12" fill="#c4b5fd" text-anchor="middle">全轨迹审计</text>

    <rect x="298" y="318" width="76" height="24" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="336" y="335" font-size="12" fill="#fbbf24" text-anchor="middle">Agent身份</text>
  </g>

  <!-- Right: gate concept -->
  <g transform="translate(680, 155)">
    <!-- Gate pillars -->
    <rect x="-90" y="-50" width="16" height="130" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="74" y="-50" width="16" height="130" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Gate top bar -->
    <rect x="-98" y="-66" width="190" height="18" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <!-- Gate bars (closed gate) -->
    <rect x="-64" y="-30" width="136" height="10" rx="4" fill="#6366f1" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="-64" y="-8" width="136" height="10" rx="4" fill="#6366f1" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="-64" y="14" width="136" height="10" rx="4" fill="#6366f1" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="-64" y="36" width="136" height="10" rx="4" fill="#6366f1" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Lock -->
    <circle cx="4" cy="72" r="14" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M-4,72 L-4,64 A8,8 0 0 1 12,64 L12,72" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- Arrow from left approaching gate -->
    <line x1="-150" y1="72" x2="-110" y2="72" stroke="#34d399" stroke-width="3"/>
    <path d="M-118,64 L-106,72 L-118,80" fill="none" stroke="#34d399" stroke-width="3"/>
    <text x="-150" y="100" font-size="13" fill="#34d399">Agent 流量</text>
  </g>

  <!-- Bottom info -->
  <rect x="40" y="354" width="540" height="1" fill="#ffffff" opacity="0.08"/>
  <text x="40" y="372" font-size="12" fill="#64748b">四条战线 · 五层治理栈 · Gartner 分级治理 · 中美欧监管</text>
  <text x="700" y="372" font-size="12" fill="#475569" text-anchor="end">AI知识宇宙 | 2026.09</text>
</svg>
