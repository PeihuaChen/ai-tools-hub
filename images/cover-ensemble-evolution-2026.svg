<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="topbar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="topbar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="48" x2="900" y2="48"/>
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="0" y1="336" x2="900" y2="336"/>
    <line x1="60" y1="0" x2="60" y2="383"/>
    <line x1="120" y1="0" x2="120" y2="383"/>
    <line x1="180" y1="0" x2="180" y2="383"/>
    <line x1="240" y1="0" x2="240" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="420" y1="0" x2="420" y2="383"/>
    <line x1="480" y1="0" x2="480" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="660" y1="0" x2="660" y2="383"/>
    <line x1="720" y1="0" x2="720" y2="383"/>
    <line x1="780" y1="0" x2="780" y2="383"/>
    <line x1="840" y1="0" x2="840" y2="383"/>
  </g>

  <!-- top bar -->
  <rect x="0" y="0" width="300" height="4" fill="url(#topbar1)"/>
  <rect x="300" y="0" width="300" height="4" fill="url(#topbar2)"/>
  <rect x="600" y="0" width="300" height="4" fill="url(#topbar3)"/>
  <!-- bottom bar -->
  <rect x="0" y="379" width="300" height="4" fill="url(#topbar3)"/>
  <rect x="300" y="379" width="300" height="4" fill="url(#topbar2)"/>
  <rect x="600" y="379" width="300" height="4" fill="url(#topbar1)"/>

  <!-- label box -->
  <rect x="48" y="42" width="240" height="30" rx="6" fill="none" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="64" y="62" fill="#34d399" font-size="14" font-weight="600" letter-spacing="1">AI 行业观察 · 多模型集成</text>

  <!-- main title -->
  <text x="48" y="122" fill="#ffffff" font-size="28" font-weight="800">从随机森林到 Mixture-of-Agents</text>
  <text x="48" y="160" fill="url(#sub)" font-size="18" font-weight="700">多模型集成，从传统机器学习到大模型时代</text>

  <!-- highlight lines -->
  <text x="48" y="206" fill="#34d399" font-size="13" font-weight="600">▍ 传统集成：Bagging / Boosting / Stacking · 训练时组装，靠误差抵消</text>
  <text x="48" y="230" fill="#22d3ee" font-size="13" font-weight="600">▍ 大模型集成：Ensemble / Routing / Cascade / MoA · 推理时编排</text>
  <text x="48" y="254" fill="#f59e0b" font-size="13" font-weight="600">▍ $0.12 打败 $1.71 · 便宜模型组队，性价比曲线双领先</text>

  <!-- tags -->
  <g font-size="12" font-weight="600">
    <rect x="48" y="288" width="98" height="26" rx="13" fill="none" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="97" y="305" fill="#6ee7b7" text-anchor="middle">随机森林</text>
    <rect x="156" y="288" width="80" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="196" y="305" fill="#7dd3fc" text-anchor="middle">XGBoost</text>
    <rect x="246" y="288" width="120" height="26" rx="13" fill="none" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="306" y="305" fill="#c4b5fd" text-anchor="middle">Mixture-of-Agents</text>
    <rect x="376" y="288" width="72" height="26" rx="13" fill="none" stroke="#ec4899" stroke-opacity="0.5"/>
    <text x="412" y="305" fill="#f9a8d4" text-anchor="middle">模型路由</text>
    <rect x="458" y="288" width="60" height="26" rx="13" fill="none" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="488" y="305" fill="#fcd34d" text-anchor="middle">MoE</text>
  </g>

  <!-- year badge -->
  <circle cx="838" cy="58" r="26" fill="none" stroke="#a855f7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="838" y="67" fill="#c4b5fd" font-size="22" font-weight="800" text-anchor="middle">26</text>

  <!-- right concept: ensemble aggregation diagram -->
  <g transform="translate(648,120)">
    <!-- base models (left column) -->
    <rect x="0" y="10" width="46" height="30" rx="6" fill="none" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="23" y="30" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">M1</text>
    <rect x="0" y="70" width="46" height="30" rx="6" fill="none" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="23" y="90" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">M2</text>
    <rect x="0" y="130" width="46" height="30" rx="6" fill="none" stroke="#ec4899" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="23" y="150" fill="#f9a8d4" font-size="12" font-weight="700" text-anchor="middle">M3</text>

    <!-- connecting lines -->
    <g stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5" fill="none">
      <path d="M46 25 C 90 25, 100 85, 140 85"/>
      <path d="M46 85 L 140 85"/>
      <path d="M46 145 C 90 145, 100 85, 140 85"/>
    </g>

    <!-- aggregator node -->
    <circle cx="164" cy="85" r="24" fill="none" stroke="#a855f7" stroke-opacity="0.8" stroke-width="2"/>
    <text x="164" y="82" fill="#c4b5fd" font-size="11" font-weight="700" text-anchor="middle">聚合</text>
    <text x="164" y="96" fill="#c4b5fd" font-size="11" font-weight="700" text-anchor="middle">/路由</text>

    <!-- output arrow -->
    <path d="M188 85 L 214 85" stroke="#f59e0b" stroke-opacity="0.8" stroke-width="2" fill="none"/>
    <path d="M208 80 L 214 85 L 208 90" stroke="#f59e0b" stroke-opacity="0.8" stroke-width="2" fill="none"/>
  </g>

  <!-- divider -->
  <line x1="48" y1="340" x2="852" y2="340" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <!-- footer -->
  <text x="48" y="362" fill="#64748b" font-size="12">集成学习 · 三大流派 · LLM 路由级联 · MoA · 选型建议</text>
  <text x="852" y="362" fill="#475569" font-size="12" text-anchor="end" font-weight="600">公众号 · AI行业观察</text>
</svg>
