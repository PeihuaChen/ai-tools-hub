<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7971e"/>
      <stop offset="100%" stop-color="#ffd200"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f260"/>
      <stop offset="100%" stop-color="#0575e6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="383"/>
    <line x1="60" y1="0" x2="60" y2="383"/>
    <line x1="120" y1="0" x2="120" y2="383"/>
    <line x1="180" y1="0" x2="180" y2="383"/>
    <line x1="240" y1="0" x2="240" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="420" y1="0" x2="420" y2="383"/>
    <line x1="480" y1="0" x2="480" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="660" y1="0" x2="660" y2="383"/>
    <line x1="720" y1="0" x2="720" y2="383"/>
    <line x1="780" y1="0" x2="780" y2="383"/>
    <line x1="840" y1="0" x2="840" y2="383"/>
    <line x1="900" y1="0" x2="900" y2="383"/>
    <line x1="0" y1="0" x2="900" y2="0"/>
    <line x1="0" y1="48" x2="900" y2="48"/>
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="0" y1="336" x2="900" y2="336"/>
    <line x1="0" y1="383" x2="900" y2="383"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="750" cy="60" r="180" fill="none" stroke="#00d2ff" stroke-width="0.5" opacity="0.08"/>
  <circle cx="750" cy="60" r="130" fill="none" stroke="#00d2ff" stroke-width="0.5" opacity="0.12"/>
  <circle cx="750" cy="60" r="80" fill="none" stroke="#00d2ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Floating code brackets decoration -->
  <g opacity="0.06" fill="none" stroke="#00d2ff" stroke-width="2">
    <text x="780" y="280" font-family="monospace" font-size="120" fill="#00d2ff" opacity="0.06">&lt;/&gt;</text>
  </g>

  <!-- Decorative dots pattern (matrix-like) -->
  <g fill="#00d2ff" opacity="0.04">
    <circle cx="50" cy="50" r="2"/>
    <circle cx="150" cy="120" r="1.5"/>
    <circle cx="250" cy="40" r="2"/>
    <circle cx="350" cy="160" r="1.5"/>
    <circle cx="450" cy="70" r="2"/>
    <circle cx="550" cy="130" r="1.5"/>
    <circle cx="650" cy="50" r="2"/>
    <circle cx="100" cy="280" r="1.5"/>
    <circle cx="200" cy="330" r="2"/>
    <circle cx="300" cy="250" r="1.5"/>
    <circle cx="400" cy="340" r="2"/>
    <circle cx="500" cy="270" r="1.5"/>
    <circle cx="600" cy="350" r="2"/>
    <circle cx="700" cy="290" r="1.5"/>
    <circle cx="800" cy="330" r="2"/>
    <circle cx="850" cy="200" r="1.5"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="900" height="4" fill="url(#accent)"/>

  <!-- Logo/badge area - top left -->
  <g transform="translate(35, 22)">
    <rect x="0" y="0" width="120" height="28" rx="4" fill="url(#logoGrad)" opacity="0.9"/>
    <text x="60" y="19" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">AI 工具评测</text>
  </g>

  <!-- Year badge -->
  <g transform="translate(835, 22)">
    <rect x="0" y="0" width="40" height="28" rx="4" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="20" y="19" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#00d2ff" text-anchor="middle">26</text>
  </g>

  <!-- Main title -->
  <text x="45" y="165" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="2">
    <tspan x="45" dy="0">2026 最全闭源 AI 编程工具横评</tspan>
  </text>

  <!-- Subtitle / product names -->
  <text x="45" y="215" font-family="'Courier New', 'Consolas', monospace" font-weight="700" font-size="18" fill="url(#accent)" letter-spacing="1">
    <tspan x="45" dy="0">Claude Code  ·  Cursor  ·  Copilot  ·  Codex  ·  Windsurf</tspan>
  </text>

  <!-- Bottom accent tagline -->
  <rect x="45" y="245" width="390" height="32" rx="16" fill="url(#accent)" opacity="0.15"/>
  <text x="240" y="266" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#00d2ff" text-anchor="middle" letter-spacing="1">深度测试 · 横向对比 · 选型指南</text>

  <!-- VS decoration -->
  <text x="720" y="200" font-family="'Courier New', monospace" font-weight="900" font-size="80" fill="#ffffff" opacity="0.04">VS</text>

  <!-- Bottom bar -->
  <rect x="0" y="379" width="900" height="4" fill="url(#accent)"/>

  <!-- Read count decoration -->
  <g transform="translate(45, 350)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#666" letter-spacing="1">#AI编程工具  #开发效率  #2026</text>
  </g>

  <!-- Bottom-right small decoration -->
  <g transform="translate(700, 355)" opacity="0.3">
    <text x="0" y="0" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#00d2ff">公众号 - 最新AI知识宇宙</text>
  </g>
</svg>
