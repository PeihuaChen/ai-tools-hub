<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1180" viewBox="0 0 1080 1180">
<rect x="0" y="0" width="1080" height="1180" fill="#f7f8fa"/>
<text x="540" y="84" text-anchor="middle" fill="#111827" font-size="56" font-weight="700">超过 1,024 步：分块外推</text>

<!-- 第 1 次 -->
<text x="48" y="160" fill="#4b5563" font-size="32" font-weight="700">第 1 次前向</text>
<rect x="48" y="180" width="620" height="140" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="358" y="232" text-anchor="middle" fill="#1d4ed8" font-size="40" font-weight="700">历史上下文</text>
<text x="358" y="288" text-anchor="middle" fill="#1d4ed8" font-size="32">最长 32,768 步</text>
<rect x="692" y="180" width="340" height="140" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<text x="862" y="232" text-anchor="middle" fill="#6d28d9" font-size="40" font-weight="700">预测块 1</text>
<text x="862" y="288" text-anchor="middle" fill="#6d28d9" font-size="32">1,024 步</text>

<!-- 回填箭头 1 -->
<path d="M862 320 V348 H548 V398" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8"/>
<polygon points="536,396 560,396 548,410" fill="#94a3b8"/>
<text x="705" y="392" text-anchor="middle" fill="#0e7490" font-size="32" font-weight="700">中位数回填</text>

<!-- 第 2 次 -->
<text x="48" y="390" fill="#4b5563" font-size="32" font-weight="700">第 2 次前向</text>
<rect x="48" y="410" width="368" height="140" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="232" y="492" text-anchor="middle" fill="#1d4ed8" font-size="32" font-weight="700">历史</text>
<rect x="428" y="410" width="240" height="140" rx="14" fill="#ecfeff" stroke="#0e7490" stroke-width="2" stroke-dasharray="8"/>
<text x="548" y="492" text-anchor="middle" fill="#0e7490" font-size="32" font-weight="700">块 1 中位数</text>
<rect x="692" y="410" width="340" height="140" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<text x="862" y="462" text-anchor="middle" fill="#6d28d9" font-size="40" font-weight="700">预测块 2</text>
<text x="862" y="518" text-anchor="middle" fill="#6d28d9" font-size="32">再预测 1,024 步</text>

<!-- 回填箭头 2 -->
<path d="M862 550 V578 H581 V628" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8"/>
<polygon points="569,626 593,626 581,640" fill="#94a3b8"/>
<text x="721" y="622" text-anchor="middle" fill="#0e7490" font-size="32" font-weight="700">中位数回填</text>

<!-- 第 3 次 -->
<text x="48" y="620" fill="#4b5563" font-size="32" font-weight="700">第 3 次前向</text>
<rect x="48" y="640" width="248" height="140" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="172" y="722" text-anchor="middle" fill="#1d4ed8" font-size="32" font-weight="700">历史</text>
<rect x="308" y="640" width="174" height="140" rx="14" fill="#ecfeff" stroke="#0e7490" stroke-width="2" stroke-dasharray="8"/>
<text x="395" y="722" text-anchor="middle" fill="#0e7490" font-size="32" font-weight="700">块 1</text>
<rect x="494" y="640" width="174" height="140" rx="14" fill="#ecfeff" stroke="#0e7490" stroke-width="2" stroke-dasharray="8"/>
<text x="581" y="722" text-anchor="middle" fill="#0e7490" font-size="32" font-weight="700">块 2</text>
<rect x="692" y="640" width="340" height="140" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<text x="862" y="692" text-anchor="middle" fill="#6d28d9" font-size="40" font-weight="700">预测块 3</text>
<text x="862" y="748" text-anchor="middle" fill="#6d28d9" font-size="32">依此类推</text>

<!-- 结论 -->
<rect x="48" y="830" width="984" height="90" rx="14" fill="#f1f5f9" stroke="#d9e2ec" stroke-width="2"/>
<text x="76" y="887" fill="#111827" font-size="32">第 1 块只依赖真实历史</text>
<rect x="48" y="940" width="984" height="90" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="76" y="997" fill="#b91c1c" font-size="32">后续块依赖前面的中位数，误差会累积</text>
<rect x="48" y="1050" width="984" height="90" rx="14" fill="#f1f5f9" stroke="#d9e2ec" stroke-width="2"/>
<text x="76" y="1107" fill="#111827" font-size="32">总长超 32,768 步时，截掉最早的历史</text>
</svg>
