<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="48" x2="900" y2="48"/>
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="0" y1="336" x2="900" y2="336"/>
    <line x1="150" y1="0" x2="150" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="750" y1="0" x2="750" y2="383"/>
  </g>

  <rect x="0" y="0" width="900" height="4" fill="url(#topbar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#topbar)"/>

  <!-- right concept: candidates -> reranker funnel -> top results -->
  <g fill="#475569" fill-opacity="0.85">
    <rect x="618" y="108" width="70" height="14" rx="4"/>
    <rect x="618" y="134" width="58" height="14" rx="4"/>
    <rect x="618" y="160" width="70" height="14" rx="4"/>
    <rect x="618" y="186" width="52" height="14" rx="4"/>
    <rect x="618" y="212" width="66" height="14" rx="4"/>
    <rect x="618" y="238" width="60" height="14" rx="4"/>
    <rect x="618" y="264" width="70" height="14" rx="4"/>
  </g>
  <path d="M706 98 L 768 168 L 768 220 L 706 290 Z" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="737" y="200" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#67e8f9" text-anchor="middle">重排</text>
  <g stroke="#94a3b8" stroke-width="1.6" stroke-opacity="0.8" fill="none">
    <path d="M768 194 L 790 194"/>
  </g>
  <rect x="792" y="166" width="58" height="18" rx="5" fill="#34d399"/>
  <rect x="792" y="190" width="46" height="18" rx="5" fill="#22d3ee"/>
  <rect x="792" y="214" width="34" height="18" rx="5" fill="#a78bfa"/>

  <!-- license legend -->
  <circle cx="700" cy="313" r="5" fill="#34d399"/>
  <circle cx="760" cy="313" r="5" fill="#fbbf24"/>
  <circle cx="820" cy="313" r="5" fill="#f87171"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">
    <text x="711" y="317">可商用</text>
    <text x="771" y="317">需核对</text>
    <text x="831" y="317">非商用</text>
  </g>

  <!-- year badge -->
  <circle cx="852" cy="40" r="19" fill="#1e293b" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="852" y="46" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#22d3ee" text-anchor="middle">26</text>

  <!-- tag box -->
  <rect x="48" y="44" width="230" height="30" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="63" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#67e8f9">AI 选型指南 · 重排模型</text>

  <!-- title -->
  <text x="48" y="128" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#ffffff">开源 Rerank 模型选型</text>
  <text x="48" y="168" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="url(#sub)">精度、延迟、协议三笔账，谁该进你的 RAG</text>

  <!-- highlights -->
  <text x="48" y="210" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#67e8f9">▸ 同一批模型，四份评测给出四种排名</text>
  <text x="48" y="234" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#86efac">▸ 小模型能否追平 4B？看懂口径再决定</text>
  <text x="48" y="258" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#fca5a5">▸ 榜单靠前的 Jina、Zerank 不能直接商用</text>

  <!-- pills -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">
    <rect x="48" y="284" width="64" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="80" y="301" fill="#67e8f9" text-anchor="middle">Qwen3</text>
    <rect x="120" y="284" width="84" height="26" rx="13" fill="none" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="162" y="301" fill="#86efac" text-anchor="middle">Jina v3.5</text>
    <rect x="212" y="284" width="80" height="26" rx="13" fill="none" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="252" y="301" fill="#c4b5fd" text-anchor="middle">mxbai v2</text>
    <rect x="300" y="284" width="68" height="26" rx="13" fill="none" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="334" y="301" fill="#f9a8d4" text-anchor="middle">BGE v2</text>
    <rect x="376" y="284" width="84" height="26" rx="13" fill="none" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="418" y="301" fill="#fcd34d" text-anchor="middle">Nemotron</text>
    <rect x="468" y="284" width="52" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="494" y="301" fill="#67e8f9" text-anchor="middle">gte</text>
  </g>

  <!-- footer -->
  <line x1="48" y1="336" x2="852" y2="336" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="48" y="360" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#64748b">重排原理 · 候选模型 · 四份评测 · 延迟成本 · 协议 · 决策表 · 上线验证</text>
  <text x="852" y="360" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#475569" text-anchor="end">公众号 · AI 行业观察</text>
</svg>
