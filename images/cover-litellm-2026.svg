<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c2a8"/>
      <stop offset="0.5" stop-color="#3aa0ff"/>
      <stop offset="1" stop-color="#7b5be5"/>
    </linearGradient>
    <linearGradient id="botbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff9770"/>
      <stop offset="1" stop-color="#ff5470"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36d1dc"/>
      <stop offset="1" stop-color="#7b9bff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>
  <rect width="900" height="4" fill="url(#topbar)"/>
  <rect y="379" width="900" height="4" fill="url(#botbar)"/>

  <!-- 标签框 -->
  <rect x="44" y="42" width="236" height="32" rx="6" fill="#3aa0ff22" stroke="#3aa0ff" stroke-opacity="0.6"/>
  <text x="60" y="64" fill="#9ccaff" font-size="15" font-weight="600">AI 开发平台 · 开源网关调研</text>

  <!-- 主标题 -->
  <text x="44" y="134" fill="#ffffff" font-size="30" font-weight="700">LiteLLM 深度调研</text>
  <text x="44" y="174" fill="url(#sub)" font-size="18" font-weight="600">用一个开源网关统一 100+ 大模型的完整实战指南</text>

  <!-- 关键亮点 -->
  <text x="44" y="218" fill="#36d1dc" font-size="13" font-weight="500">• 一个 OpenAI 兼容端点，接管 100+ 供应商</text>
  <text x="44" y="242" fill="#ffd166" font-size="13" font-weight="500">• 虚拟Key · 预算管控 · 自动容灾 · 成本追踪</text>
  <text x="44" y="266" fill="#a78bfa" font-size="13" font-weight="500">• 架构 · 配置实操 · 可观测性 · 选型 · 短板</text>

  <!-- 标签栏 pill -->
  <g font-size="12" font-weight="500">
    <rect x="44" y="296" width="76" height="26" rx="13" fill="none" stroke="#36d1dc" stroke-opacity="0.55"/>
    <text x="58" y="313" fill="#8fe9f0">LiteLLM</text>
    <rect x="130" y="296" width="96" height="26" rx="13" fill="none" stroke="#3aa0ff" stroke-opacity="0.55"/>
    <text x="144" y="313" fill="#9ccaff">AI Gateway</text>
    <rect x="236" y="296" width="80" height="26" rx="13" fill="none" stroke="#7b5be5" stroke-opacity="0.55"/>
    <text x="250" y="313" fill="#c4b4ff">多模型路由</text>
    <rect x="326" y="296" width="68" height="26" rx="13" fill="none" stroke="#ffd166" stroke-opacity="0.55"/>
    <text x="340" y="313" fill="#ffe6a3">虚拟Key</text>
    <rect x="404" y="296" width="80" height="26" rx="13" fill="none" stroke="#ff9770" stroke-opacity="0.55"/>
    <text x="418" y="313" fill="#ffc3a3">成本追踪</text>
  </g>

  <!-- 年份徽章 -->
  <circle cx="824" cy="58" r="30" fill="none" stroke="#3aa0ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="824" y="67" fill="#9ccaff" font-size="26" font-weight="700" text-anchor="middle">26</text>

  <!-- 右侧示意图：网关收口多供应商 -->
  <g stroke-width="2" fill="none">
    <!-- 中心网关 -->
    <rect x="690" y="150" width="76" height="36" rx="7" fill="#3aa0ff33" stroke="#3aa0ff"/>
    <text x="728" y="173" fill="#9ccaff" font-size="12" text-anchor="middle" stroke="none">LiteLLM</text>
    <!-- 左侧应用 -->
    <rect x="600" y="151" width="54" height="34" rx="6" fill="#7b5be533" stroke="#7b5be5"/>
    <text x="627" y="173" fill="#c4b4ff" font-size="11" text-anchor="middle" stroke="none">App</text>
    <line x1="654" y1="168" x2="690" y2="168" stroke="#7b9bff" stroke-opacity="0.7"/>
    <!-- 右侧四个供应商 -->
    <rect x="800" y="104" width="58" height="26" rx="6" fill="#36d1dc22" stroke="#36d1dc"/>
    <text x="829" y="122" fill="#8fe9f0" font-size="10" text-anchor="middle" stroke="none">OpenAI</text>
    <rect x="800" y="140" width="58" height="26" rx="6" fill="#ffd16622" stroke="#ffd166"/>
    <text x="829" y="158" fill="#ffe6a3" font-size="10" text-anchor="middle" stroke="none">Claude</text>
    <rect x="800" y="176" width="58" height="26" rx="6" fill="#ff977022" stroke="#ff9770"/>
    <text x="829" y="194" fill="#ffc3a3" font-size="10" text-anchor="middle" stroke="none">DeepSeek</text>
    <rect x="800" y="212" width="58" height="26" rx="6" fill="#ff547022" stroke="#ff5470"/>
    <text x="829" y="230" fill="#ff9aa8" font-size="10" text-anchor="middle" stroke="none">Ollama</text>
    <line x1="766" y1="168" x2="800" y2="117" stroke="#36d1dc" stroke-opacity="0.55"/>
    <line x1="766" y1="168" x2="800" y2="153" stroke="#ffd166" stroke-opacity="0.55"/>
    <line x1="766" y1="168" x2="800" y2="189" stroke="#ff9770" stroke-opacity="0.55"/>
    <line x1="766" y1="168" x2="800" y2="225" stroke="#ff5470" stroke-opacity="0.55"/>
  </g>

  <!-- 底部分隔线 + 章节提示 + 水印 -->
  <line x1="44" y1="344" x2="856" y2="344" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="44" y="366" fill="#8a8aa8" font-size="12">是什么 · 核心能力 · 架构 · 选型对比 · 短板与适用场景</text>
  <text x="856" y="366" fill="#5a5a7a" font-size="12" text-anchor="end">AI工具箱</text>
</svg>
