<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="55%" stop-color="#161638"/>
      <stop offset="100%" stop-color="#0d0d25"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <g opacity="0.045" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="180" y1="0" x2="180" y2="383"/>
    <line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/>
    <line x1="720" y1="0" x2="720" y2="383"/>
  </g>

  <rect x="0" y="0" width="300" height="4" fill="url(#cyan)"/>
  <rect x="300" y="0" width="300" height="4" fill="url(#purple)"/>
  <rect x="600" y="0" width="300" height="4" fill="url(#orange)"/>
  <rect x="0" y="379" width="300" height="4" fill="url(#orange)"/>
  <rect x="300" y="379" width="300" height="4" fill="url(#purple)"/>
  <rect x="600" y="379" width="300" height="4" fill="url(#cyan)"/>

  <rect x="40" y="32" width="232" height="30" rx="15" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="56" y="52" font-size="14" fill="#67e8f9">AI 基础设施 · 本地推理</text>

  <text x="40" y="118" font-size="44" font-weight="bold" fill="#ffffff">三层分工</text>
  <text x="42" y="158" font-size="19" fill="#a5b4fc">125B 模型如何跑进 12GB 显卡</text>

  <circle cx="46" cy="203" r="4" fill="#22d3ee"/>
  <text x="60" y="209" font-size="14" fill="#cbd5e1">显存：注意力 + 热专家缓存</text>
  <circle cx="46" cy="233" r="4" fill="#a78bfa"/>
  <text x="60" y="239" font-size="14" fill="#cbd5e1">内存：24,576 个专家常驻</text>
  <circle cx="46" cy="263" r="4" fill="#fbbf24"/>
  <text x="60" y="269" font-size="14" fill="#cbd5e1">SSD：28.8GB 查表，不搬权重</text>

  <g>
    <rect x="40" y="300" width="66" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="56" y="318" font-size="12" fill="#94a3b8">MoE</text>
    <rect x="116" y="300" width="78" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="132" y="318" font-size="12" fill="#94a3b8">量化</text>
    <rect x="204" y="300" width="126" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="220" y="318" font-size="12" fill="#94a3b8">消费级硬件</text>
    <rect x="340" y="300" width="106" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="356" y="318" font-size="12" fill="#94a3b8">本地推理</text>
  </g>

  <text x="40" y="350" font-size="11" letter-spacing="1" fill="#64748b">显存 · 内存 · SSD 如何协同</text>
  <text x="742" y="350" font-size="11" fill="#475569">@AI 行业观察</text>

  <g>
    <text x="838" y="52" font-size="26" font-weight="bold" fill="#22d3ee" opacity="0.75">26</text>

    <rect x="612" y="76" width="248" height="52" rx="10" fill="#0e2338" stroke="url(#cyan)" stroke-width="1.4"/>
    <text x="628" y="99" font-size="14" font-weight="bold" fill="#67e8f9">GPU 显存</text>
    <text x="628" y="117" font-size="11" fill="#7dd3fc">12–24 GB · 热专家</text>

    <line x1="736" y1="130" x2="736" y2="150" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="4 3"/>
    <polygon points="736,156 732,146 740,146" fill="#22d3ee"/>

    <rect x="612" y="158" width="248" height="52" rx="10" fill="#1c1436" stroke="url(#purple)" stroke-width="1.4"/>
    <text x="628" y="181" font-size="14" font-weight="bold" fill="#c4b5fd">系统内存</text>
    <text x="628" y="199" font-size="11" fill="#a78bfa">32–64 GB · 全部专家</text>

    <line x1="736" y1="212" x2="736" y2="232" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="4 3"/>
    <polygon points="736,238 732,228 740,228" fill="#a78bfa"/>

    <rect x="612" y="240" width="248" height="52" rx="10" fill="#33230d" stroke="url(#orange)" stroke-width="1.4"/>
    <text x="628" y="263" font-size="14" font-weight="bold" fill="#fcd34d">NVMe SSD</text>
    <text x="628" y="281" font-size="11" fill="#fbbf24">28.8 GB · n-gram 表</text>
  </g>
