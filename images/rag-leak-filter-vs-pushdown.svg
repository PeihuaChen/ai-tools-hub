<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="pg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
    </linearGradient>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
    <marker id="a3r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>
  <rect width="1200" height="620" fill="url(#pg3)"/>

  <text x="40" y="42" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#111827">检索后过滤 vs 权限下推：越权文档到底走到了哪一步</text>
  <text x="40" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#4b5563">两种架构的用户体感一样，但越权数据的暴露面完全不同</text>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="30" y="96" width="560" height="500" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="54" y="128" font-size="17" font-weight="bold" fill="#b91c1c">✕ 检索后过滤（安全剧场）</text>
    <text x="54" y="152" font-size="12" fill="#4b5563">校验身份 → 全量检索 → 结果过滤 → 送 LLM</text>

    <rect x="54" y="176" width="140" height="52" rx="8" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.2"/>
    <text x="124" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">用户提问</text>
    <text x="124" y="217" text-anchor="middle" font-size="10" fill="#6b7280">身份已认证</text>

    <rect x="228" y="176" width="150" height="52" rx="8" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.2"/>
    <text x="303" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">向量检索 Top-10</text>
    <text x="303" y="217" text-anchor="middle" font-size="10" fill="#6b7280">共享索引，无权限条件</text>

    <rect x="412" y="176" width="150" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/>
    <text x="487" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">候选集 10 条</text>
    <text x="487" y="217" text-anchor="middle" font-size="10" fill="#b91c1c">其中 7 条用户无权访问</text>

    <line x1="194" y1="202" x2="224" y2="202" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a3)"/>
    <line x1="378" y1="202" x2="408" y2="202" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a3)"/>

    <line x1="487" y1="228" x2="487" y2="262" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#a3r)"/>
    <rect x="378" y="266" width="184" height="46" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
    <text x="470" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">应用层过滤（if 分支）</text>

    <line x1="470" y1="312" x2="470" y2="346" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a3)"/>
    <rect x="378" y="350" width="184" height="46" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
    <text x="470" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">剩 3 条 → LLM</text>

    <rect x="54" y="266" width="300" height="130" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="72" y="290" font-size="12" font-weight="bold" fill="#b91c1c">越权文档已经到过这些地方</text>
    <text x="72" y="314" font-size="11" fill="#4b5563">· 检索服务进程内存</text>
    <text x="72" y="334" font-size="11" fill="#4b5563">· 应用日志与 trace（若未脱敏）</text>
    <text x="72" y="354" font-size="11" fill="#4b5563">· APM / 监控采样</text>
    <text x="72" y="378" font-size="11" fill="#b91c1c">日志里记了一次，泄露就已发生</text>

    <rect x="54" y="418" width="508" height="158" rx="8" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.2"/>
    <text x="72" y="444" font-size="12" font-weight="bold" fill="#111827">三个结构性缺陷</text>
    <text x="72" y="470" font-size="11" fill="#4b5563">① 候选集已被污染，一处日志疏漏即泄露</text>
    <text x="72" y="492" font-size="11" fill="#4b5563">② 过滤逻辑在应用层，新增一个不走过滤的调试接口就失守</text>
    <text x="72" y="510" font-size="11" fill="#6b7280">　 Pinecone CVE-2024-41892 就是校验跑在返回之后</text>
    <text x="72" y="534" font-size="11" fill="#4b5563">③ Top-K 语义被破坏：10 取 3 导致回答质量下降</text>
    <text x="72" y="556" font-size="11" fill="#b91c1c">　 团队会调大 K 补质量，而调大 K = 更多越权文档进候选集</text>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="610" y="96" width="560" height="500" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="634" y="128" font-size="17" font-weight="bold" fill="#15803d">✓ 权限下推（检索即受限）</text>
    <text x="634" y="152" font-size="12" fill="#4b5563">校验身份 → 权限条件进入检索 → Top-K 天然合法</text>

    <rect x="634" y="176" width="140" height="52" rx="8" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.2"/>
    <text x="704" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">用户提问</text>
    <text x="704" y="217" text-anchor="middle" font-size="10" fill="#6b7280">身份已认证</text>

    <rect x="808" y="176" width="150" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="883" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">权限条件下推</text>
    <text x="883" y="217" text-anchor="middle" font-size="10" fill="#1d4ed8">RLS / 策略引擎 / ACL</text>

    <rect x="992" y="176" width="154" height="52" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.3"/>
    <text x="1069" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">候选集 10 条</text>
    <text x="1069" y="217" text-anchor="middle" font-size="10" fill="#15803d">全部合法，Top-K 完整</text>

    <line x1="774" y1="202" x2="804" y2="202" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a3)"/>
    <line x1="958" y1="202" x2="988" y2="202" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a3)"/>

    <line x1="1069" y1="228" x2="1069" y2="262" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a3)"/>
    <rect x="977" y="266" width="184" height="46" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
    <text x="1069" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">10 条 → LLM</text>

    <rect x="634" y="266" width="310" height="130" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="652" y="290" font-size="12" font-weight="bold" fill="#15803d">越权文档从未进入任何环节</text>
    <text x="652" y="314" font-size="11" fill="#4b5563">内存、日志、trace 里都不存在</text>
    <text x="652" y="336" font-size="11" fill="#4b5563">绕过它需要绕过数据库权限系统，</text>
    <text x="652" y="354" font-size="11" fill="#4b5563">而不是绕过某个 if 分支</text>
    <text x="652" y="378" font-size="11" fill="#15803d">安全与效果不再互相对抗</text>

    <rect x="634" y="418" width="512" height="158" rx="8" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.2"/>
    <text x="652" y="444" font-size="12" font-weight="bold" fill="#111827">三种落地路径</text>
    <text x="652" y="470" font-size="11" fill="#1d4ed8">① 数据库层强制：pgvector + Postgres RLS（最干净）</text>
    <text x="652" y="490" font-size="11" fill="#6b7280">　 代价：绑定 Postgres，超大规模需评估性能天花板</text>
    <text x="652" y="514" font-size="11" fill="#1d4ed8">② 外部策略引擎：Bedrock + Verified Permissions（Cedar）</text>
    <text x="652" y="534" font-size="11" fill="#6b7280">　 代价：多一次网络调用，策略引擎进关键路径</text>
    <text x="652" y="558" font-size="11" fill="#1d4ed8">③ ACL 镜像到向量元数据（需增量同步 + 漂移检测）</text>
  </g>
</svg>
