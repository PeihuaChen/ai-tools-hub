<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d44"/>
      <stop offset="100%" style="stop-color:#1f1f35"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#e67e22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Flow: Resume → AI → Optimized Resume -->

  <!-- Step 1: Original Resume (left) -->
  <rect x="60" y="180" width="220" height="280" rx="8" fill="url(#cardBg)" stroke="#555" stroke-width="1.5"/>
  <rect x="80" y="200" width="180" height="12" rx="2" fill="#666"/>
  <rect x="80" y="222" width="140" height="8" rx="2" fill="#444"/>
  <rect x="80" y="238" width="160" height="8" rx="2" fill="#444"/>
  <rect x="80" y="254" width="120" height="8" rx="2" fill="#444"/>
  <rect x="80" y="278" width="180" height="8" rx="2" fill="#444"/>
  <rect x="80" y="294" width="150" height="8" rx="2" fill="#444"/>
  <rect x="80" y="310" width="170" height="8" rx="2" fill="#444"/>
  <rect x="80" y="334" width="180" height="8" rx="2" fill="#444"/>
  <rect x="80" y="350" width="130" height="8" rx="2" fill="#444"/>
  <rect x="80" y="366" width="160" height="8" rx="2" fill="#444"/>
  <rect x="80" y="390" width="100" height="8" rx="2" fill="#444"/>
  <rect x="80" y="406" width="140" height="8" rx="2" fill="#444"/>
  <!-- Red X marks (problems) -->
  <text x="250" y="240" fill="#e74c3c" font-size="16" font-weight="bold">✗</text>
  <text x="250" y="300" fill="#e74c3c" font-size="16" font-weight="bold">✗</text>
  <text x="250" y="360" fill="#e74c3c" font-size="16" font-weight="bold">✗</text>
  <!-- Label -->
  <text x="170" y="490" text-anchor="middle" fill="#e74c3c" font-size="14" font-weight="600">❌ 原始简历</text>
  <text x="170" y="510" text-anchor="middle" fill="#888" font-size="11">无数据、无重点、模板化</text>

  <!-- Arrow 1 -->
  <path d="M300 320 L380 320" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#arrow1)"/>
  <defs><marker id="arrow1" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#4a90d9"/></marker></defs>

  <!-- Step 2: AI Processing (center) -->
  <rect x="390" y="160" width="420" height="320" rx="12" fill="rgba(74,144,217,0.08)" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- AI Brain icon -->
  <circle cx="600" cy="220" r="35" fill="rgba(74,144,217,0.15)" stroke="#4a90d9" stroke-width="2"/>
  <text x="600" y="230" text-anchor="middle" fill="#4a90d9" font-size="30">🤖</text>

  <text x="600" y="280" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="700">AI 智能优化</text>

  <!-- AI tools listed -->
  <rect x="420" y="300" width="90" height="28" rx="14" fill="rgba(46,204,113,0.15)" stroke="#2ecc71" stroke-width="1"/>
  <text x="465" y="318" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="600">豆包</text>

  <rect x="520" y="300" width="100" height="28" rx="14" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="1"/>
  <text x="570" y="318" text-anchor="middle" fill="#3498db" font-size="11" font-weight="600">DeepSeek</text>

  <rect x="630" y="300" width="80" height="28" rx="14" fill="rgba(155,89,182,0.15)" stroke="#9b59b6" stroke-width="1"/>
  <text x="670" y="318" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="600">Kimi</text>

  <rect x="720" y="300" width="70" height="28" rx="14" fill="rgba(243,156,18,0.15)" stroke="#f39c12" stroke-width="1"/>
  <text x="755" y="318" text-anchor="middle" fill="#f39c12" font-size="11" font-weight="600">元宝</text>

  <!-- Processing steps -->
  <text x="440" y="365" fill="#aaa" font-size="12">① 关键词匹配 JD</text>
  <text x="440" y="390" fill="#aaa" font-size="12">② STAR法则改写经历</text>
  <text x="440" y="415" fill="#aaa" font-size="12">③ 量化成果数据</text>
  <text x="440" y="440" fill="#aaa" font-size="12">④ ATS格式优化</text>

  <!-- Checkmarks -->
  <text x="420" y="365" fill="#2ecc71" font-size="12">✓</text>
  <text x="420" y="390" fill="#2ecc71" font-size="12">✓</text>
  <text x="420" y="415" fill="#2ecc71" font-size="12">✓</text>
  <text x="420" y="440" fill="#2ecc71" font-size="12">✓</text>

  <!-- Arrow 2 -->
  <path d="M820 320 L900 320" stroke="#2ecc71" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <defs><marker id="arrow2" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#2ecc71"/></marker></defs>

  <!-- Step 3: Optimized Resume (right) -->
  <rect x="920" y="180" width="220" height="280" rx="8" fill="url(#cardBg)" stroke="#2ecc71" stroke-width="2"/>
  <rect x="940" y="200" width="180" height="12" rx="2" fill="#2ecc71" opacity="0.8"/>
  <rect x="940" y="222" width="140" height="8" rx="2" fill="#4a90d9" opacity="0.6"/>
  <rect x="940" y="238" width="170" height="8" rx="2" fill="#4a90d9" opacity="0.6"/>
  <rect x="940" y="254" width="155" height="8" rx="2" fill="#4a90d9" opacity="0.6"/>
  <rect x="940" y="278" width="180" height="8" rx="2" fill="#4a90d9" opacity="0.5"/>
  <rect x="940" y="294" width="160" height="8" rx="2" fill="#4a90d9" opacity="0.5"/>
  <rect x="940" y="310" width="175" height="8" rx="2" fill="#4a90d9" opacity="0.5"/>
  <rect x="940" y="334" width="180" height="8" rx="2" fill="#4a90d9" opacity="0.4"/>
  <rect x="940" y="350" width="145" height="8" rx="2" fill="#4a90d9" opacity="0.4"/>
  <rect x="940" y="366" width="165" height="8" rx="2" fill="#4a90d9" opacity="0.4"/>
  <rect x="940" y="390" width="120" height="8" rx="2" fill="#4a90d9" opacity="0.3"/>
  <rect x="940" y="406" width="150" height="8" rx="2" fill="#4a90d9" opacity="0.3"/>
  <!-- Green checkmarks -->
  <text x="1110" y="240" fill="#2ecc71" font-size="16" font-weight="bold">✓</text>
  <text x="1110" y="300" fill="#2ecc71" font-size="16" font-weight="bold">✓</text>
  <text x="1110" y="360" fill="#2ecc71" font-size="16" font-weight="bold">✓</text>
  <!-- Label -->
  <text x="1030" y="490" text-anchor="middle" fill="#2ecc71" font-size="14" font-weight="600">✅ 优化后简历</text>
  <text x="1030" y="510" text-anchor="middle" fill="#888" font-size="11">有数据、有重点、匹配JD</text>

  <!-- Stats bar at bottom -->
  <rect x="0" y="555" width="1200" height="75" fill="rgba(0,0,0,0.5)"/>
  <rect x="0" y="553" width="1200" height="2" fill="#4a90d9" opacity="0.4"/>

  <!-- Stats -->
  <text x="150" y="590" text-anchor="middle" fill="#2ecc71" font-size="28" font-weight="800">+325%</text>
  <text x="150" y="612" text-anchor="middle" fill="#888" font-size="11">面试邀约提升</text>

  <text x="400" y="590" text-anchor="middle" fill="#3498db" font-size="28" font-weight="800">6秒</text>
  <text x="400" y="612" text-anchor="middle" fill="#888" font-size="11">HR平均阅读时间</text>

  <text x="650" y="590" text-anchor="middle" fill="#f39c12" font-size="28" font-weight="800">80%+</text>
  <text x="650" y="612" text-anchor="middle" fill="#888" font-size="11">JD关键词匹配率</text>

  <text x="900" y="590" text-anchor="middle" fill="#9b59b6" font-size="28" font-weight="800">¥0</text>
  <text x="900" y="612" text-anchor="middle" fill="#888" font-size="11">工具成本（免费可用）</text>

  <text x="1100" y="590" text-anchor="middle" fill="#e74c3c" font-size="28" font-weight="800">30min</text>
  <text x="1100" y="612" text-anchor="middle" fill="#888" font-size="11">优化耗时</text>

  <!-- Title overlay -->
  <text x="600" y="80" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800">新时代打工人 AI 简历优化指南</text>
  <text x="600" y="120" text-anchor="middle" fill="#aaa" font-size="16">用免费工具让你的面试率翻倍 · 2026实战版</text>

  <!-- Badge -->
  <rect x="60" y="60" width="120" height="26" rx="13" fill="rgba(243,156,18,0.2)" stroke="#f39c12" stroke-width="1"/>
  <text x="120" y="78" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="600">AI知识宇宙</text>
</svg>