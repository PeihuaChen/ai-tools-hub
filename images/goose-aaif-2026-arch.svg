<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900">
  <rect width="1080" height="900" fill="#f7f8fa"/>

  <text x="540" y="76" text-anchor="middle" font-size="58" font-weight="700" fill="#111827">Goose 四层架构（简版）</text>
  <text x="540" y="134" text-anchor="middle" font-size="38" fill="#4b5563">三种入口，一套 Rust 内核，模型自由替换</text>

  <!-- layer 1: interaction -->
  <g>
    <rect x="40" y="180" width="1000" height="140" rx="16" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
    <rect x="40" y="180" width="200" height="140" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="140" y="258" text-anchor="middle" font-size="40" font-weight="700" fill="#1d4ed8">交互层</text>
    <text x="272" y="240" font-size="34" font-weight="700" fill="#111827">桌面App · CLI · API</text>
    <text x="272" y="286" font-size="32" fill="#4b5563">还可经 ACP 接入 VS Code、JetBrains</text>
  </g>

  <path d="M540 326 L554 346 L526 346 Z" fill="#94a3b8"/>

  <!-- layer 2: core -->
  <g>
    <rect x="40" y="352" width="1000" height="140" rx="16" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
    <rect x="40" y="352" width="200" height="140" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
    <text x="140" y="430" text-anchor="middle" font-size="40" font-weight="700" fill="#6d28d9">核心层</text>
    <text x="272" y="412" font-size="34" font-weight="700" fill="#111827">Agent 编排器</text>
    <text x="272" y="458" font-size="32" fill="#4b5563">会话、工具执行、权限、子代理并行</text>
  </g>

  <path d="M540 498 L554 518 L526 518 Z" fill="#94a3b8"/>

  <!-- layer 3: capability -->
  <g>
    <rect x="40" y="524" width="1000" height="140" rx="16" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
    <rect x="40" y="524" width="200" height="140" rx="16" fill="#f0fdf4" stroke="#0e7490" stroke-width="2"/>
    <text x="140" y="602" text-anchor="middle" font-size="40" font-weight="700" fill="#0e7490">能力层</text>
    <text x="272" y="584" font-size="34" font-weight="700" fill="#111827">MCP 扩展 70+ · Recipes</text>
    <text x="272" y="630" font-size="32" fill="#4b5563">权限模式、提示注入检测、沙箱</text>
  </g>

  <path d="M540 670 L554 690 L526 690 Z" fill="#94a3b8"/>

  <!-- layer 4: model -->
  <g>
    <rect x="40" y="696" width="1000" height="140" rx="16" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
    <rect x="40" y="696" width="200" height="140" rx="16" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="140" y="774" text-anchor="middle" font-size="40" font-weight="700" fill="#b45309">模型层</text>
    <text x="272" y="756" font-size="34" font-weight="700" fill="#111827">Provider 注册表 15+</text>
    <text x="272" y="802" font-size="32" fill="#4b5563">云端任选，或 Ollama 完全本地跑</text>
  </g>

  <text x="540" y="876" text-anchor="middle" font-size="32" fill="#6b7280">桌面端与 CLI 共享同一内核，headless 模式可进 CI/CD</text>
</svg>
