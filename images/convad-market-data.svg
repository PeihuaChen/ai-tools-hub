<svg width="1080" height="600" viewBox="0 0 1080 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="600" fill="#f7f8fa"/>

  <text x="540" y="72" font-size="52" font-weight="bold" fill="#111827" text-anchor="middle">关键市场数据一览</text>
  <text x="540" y="118" font-size="30" fill="#6b7280" text-anchor="middle">数据来源见文末 · 口径不同仅供参考</text>

  <!-- Card 1: conversational advertising revenue -->
  <rect x="48" y="170" width="312" height="300" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="76" y="234" font-size="40" font-weight="bold" fill="#111827">对话式广告</text>
  <line x1="76" y1="256" x2="332" y2="256" stroke="#bfdbfe" stroke-width="2"/>
  <text x="76" y="342" font-size="64" font-weight="bold" fill="#1d4ed8">$220亿</text>
  <text x="76" y="398" font-size="32" fill="#4b5563">2033 年收入预测</text>
  <text x="76" y="444" font-size="32" fill="#4b5563">2025 年仅 20 亿</text>

  <!-- Card 2: agentic commerce CAGR -->
  <rect x="384" y="170" width="312" height="300" rx="16" fill="#ecfdf5" stroke="#15803d" stroke-width="2.5"/>
  <text x="412" y="234" font-size="40" font-weight="bold" fill="#111827">代理商务</text>
  <line x1="412" y1="256" x2="668" y2="256" stroke="#bbf7d0" stroke-width="2"/>
  <text x="412" y="342" font-size="64" font-weight="bold" fill="#15803d">44%</text>
  <text x="412" y="398" font-size="32" fill="#4b5563">年复合增长率</text>
  <text x="412" y="444" font-size="32" fill="#4b5563">2025 → 2032</text>

  <!-- Card 3: agentic shopping spend -->
  <rect x="720" y="170" width="312" height="300" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="748" y="234" font-size="40" font-weight="bold" fill="#111827">代理式购物</text>
  <line x1="748" y1="256" x2="1004" y2="256" stroke="#ddd6fe" stroke-width="2"/>
  <text x="748" y="342" font-size="60" font-weight="bold" fill="#6d28d9">$3850亿</text>
  <text x="748" y="398" font-size="32" fill="#4b5563">2030 美国规模</text>
  <text x="748" y="444" font-size="32" fill="#4b5563">约占线上零售一成</text>

  <text x="540" y="548" font-size="32" fill="#6b7280" text-anchor="middle">价值正从"广告展示位"，转向"AI 决策入口"</text>
</svg>
