<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
    </linearGradient>
    <marker id="wah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <rect width="1200" height="600" fill="url(#wbg)"/>

  <text x="600" y="46" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#111827" text-anchor="middle">WeKnora 的知识图谱：把实体图"降维"成 Chunk 图</text>
  <text x="600" y="74" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">图只用于向量检索之后的关系扩展召回，无社区聚类、无分层摘要</text>

  <!-- Left: entity graph -->
  <text x="280" y="120" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">① LLM 抽取实体关系</text>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="180" y1="200" x2="320" y2="180"/>
    <line x1="320" y1="180" x2="280" y2="300"/>
    <line x1="180" y1="200" x2="280" y2="300"/>
    <line x1="320" y1="180" x2="420" y2="250"/>
  </g>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600">
    <circle cx="180" cy="200" r="34" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="180" y="205" fill="#1d4ed8" text-anchor="middle">RAG</text>
    <circle cx="320" cy="180" r="34" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="320" y="185" fill="#1d4ed8" text-anchor="middle">向量检索</text>
    <circle cx="280" cy="300" r="34" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="280" y="305" fill="#1d4ed8" text-anchor="middle">LLM</text>
    <circle cx="420" cy="250" r="30" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="420" y="255" fill="#1d4ed8" text-anchor="middle">实体</text>
  </g>
  <text x="300" y="360" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">PMI + Strength 混合公式给关系打分</text>

  <!-- arrow -->
  <line x1="480" y1="250" x2="560" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#wah)"/>
  <text x="520" y="238" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#b45309" text-anchor="middle">投影</text>

  <!-- Right: chunk graph -->
  <text x="850" y="120" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">② 投影为文档块关系网络</text>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="700" y1="200" x2="850" y2="180"/>
    <line x1="850" y1="180" x2="820" y2="320"/>
    <line x1="700" y1="200" x2="820" y2="320"/>
    <line x1="850" y1="180" x2="1000" y2="230"/>
    <line x1="820" y1="320" x2="1000" y2="230" stroke-dasharray="5 4"/>
  </g>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600">
    <rect x="662" y="178" width="76" height="44" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="700" y="205" fill="#15803d" text-anchor="middle">Chunk A</text>
    <rect x="812" y="158" width="76" height="44" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="850" y="185" fill="#15803d" text-anchor="middle">Chunk B</text>
    <rect x="782" y="298" width="76" height="44" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="820" y="325" fill="#15803d" text-anchor="middle">Chunk C</text>
    <rect x="962" y="208" width="76" height="44" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="1000" y="235" fill="#15803d" text-anchor="middle">Chunk D</text>
  </g>
  <text x="850" y="380" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">实线=直接关联 · 虚线=二跳（权重 ×0.5 衰减）</text>

  <!-- bottom: retrieval flow -->
  <rect x="120" y="430" width="960" height="130" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="600" y="462" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0e7490" text-anchor="middle">③ 检索时：向量命中 → 顺 Chunk 图取关联块 → 一起返回给 LLM</text>
  <text x="600" y="492" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">图不是检索的核心，而是"召回增强"——补上向量检索漏掉的相关文档块</text>
  <text x="600" y="524" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle">与微软 GraphRAG 的关键差异：无 Leiden 社区聚类、无分层摘要、不支持真正的全局归纳</text>
  <text x="600" y="548" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">代价换来的是：低索引成本 + 工程可维护性，适合企业知识库落地</text>
</svg>
