<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760">
  <rect x="0" y="0" width="1080" height="760" fill="#f7f8fa"/>

  <text x="60" y="86" font-size="60" font-weight="bold" fill="#111827">三种脑操控路线，光赢在哪？</text>
  <text x="60" y="140" font-size="34" fill="#4b5563">同样是“调动神经元”，精度差别很大</text>

  <!-- card 1: 电刺激 -->
  <rect x="60" y="184" width="960" height="160" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <rect x="60" y="184" width="14" height="160" rx="7" fill="#b91c1c"/>
  <text x="104" y="236" font-size="42" font-weight="bold" fill="#b91c1c">电刺激（DBS）</text>
  <text x="104" y="286" font-size="33" fill="#111827">作用对象：该区域全部细胞</text>
  <text x="104" y="326" font-size="33" fill="#4b5563">短板：兴奋抑制一起“搅动”，无法分型</text>

  <!-- card 2: 电极 -->
  <rect x="60" y="368" width="960" height="160" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="60" y="368" width="14" height="160" rx="7" fill="#1d4ed8"/>
  <text x="104" y="420" font-size="42" font-weight="bold" fill="#1d4ed8">电极脑机接口</text>
  <text x="104" y="470" font-size="33" fill="#111827">强项：高时空分辨地“读”神经信号</text>
  <text x="104" y="510" font-size="33" fill="#4b5563">短板：“写”仍粗糙，难做细胞级调控</text>

  <!-- card 3: 光遗传 -->
  <rect x="60" y="552" width="960" height="160" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <rect x="60" y="552" width="14" height="160" rx="7" fill="#15803d"/>
  <text x="104" y="604" font-size="42" font-weight="bold" fill="#15803d">光遗传学（2026 诺奖）</text>
  <text x="104" y="654" font-size="33" fill="#111827">优势：只作用于特定细胞，毫秒级开关</text>
  <text x="104" y="694" font-size="33" fill="#4b5563">前提：需向神经元递送光敏蛋白基因</text>
</svg>
