<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="botbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>
  <rect width="900" height="4" fill="url(#topbar)"/>
  <rect y="379" width="900" height="4" fill="url(#botbar)"/>

  <!-- label box -->
  <rect x="48" y="42" width="250" height="30" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#818cf8" stroke-width="1"/>
  <text x="63" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#c7d2fe">AI 工程实践 · 数据合规</text>

  <!-- year badge -->
  <circle cx="838" cy="58" r="26" fill="#a855f7" fill-opacity="0.16" stroke="#c084fc" stroke-width="1.5"/>
  <text x="838" y="65" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e9d5ff">26</text>

  <!-- title -->
  <text x="48" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="bold" fill="#ffffff">给大模型加一道隐私闸门</text>
  <text x="48" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="bold" fill="url(#sub)">Presidio + LiteLLM 实战 PII 脱敏指南</text>

  <!-- highlights -->
  <text x="48" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#67e8f9">▸ 三种检测路线：规则 · NER · 上下文增强</text>
  <text x="48" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fca5a5">▸ Presidio 深度解析 + 云DLP/Nightfall/Skyflow 横评</text>
  <text x="48" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fcd34d">▸ LiteLLM 网关落地：MASK/BLOCK · 阈值 · 可逆还原</text>

  <!-- concept shield diagram (right) -->
  <g transform="translate(690,150)" opacity="0.9">
    <path d="M60 0 L120 22 V70 C120 108 92 132 60 148 C28 132 0 108 0 70 V22 Z" fill="#6366f1" fill-opacity="0.12" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="40" y="58" width="40" height="34" rx="5" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M48 58 V48 a12 12 0 0 1 24 0 V58" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="60" cy="74" r="4" fill="#67e8f9"/>
    <rect x="58" y="76" width="4" height="10" rx="2" fill="#67e8f9"/>
  </g>

  <!-- tags -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12">
    <rect x="48" y="310" width="76" height="26" rx="13" fill="none" stroke="#67e8f9" stroke-width="1"/>
    <text x="86" y="327" text-anchor="middle" fill="#a5f3fc">Presidio</text>
    <rect x="132" y="310" width="72" height="26" rx="13" fill="none" stroke="#c084fc" stroke-width="1"/>
    <text x="168" y="327" text-anchor="middle" fill="#e9d5ff">LiteLLM</text>
    <rect x="212" y="310" width="64" height="26" rx="13" fill="none" stroke="#fca5a5" stroke-width="1"/>
    <text x="244" y="327" text-anchor="middle" fill="#fecaca">PIPL</text>
    <rect x="284" y="310" width="80" height="26" rx="13" fill="none" stroke="#fcd34d" stroke-width="1"/>
    <text x="324" y="327" text-anchor="middle" fill="#fde68a">AI Gateway</text>
    <rect x="372" y="310" width="76" height="26" rx="13" fill="none" stroke="#86efac" stroke-width="1"/>
    <text x="410" y="327" text-anchor="middle" fill="#bbf7d0">PII 脱敏</text>
  </g>

  <!-- footer -->
  <line x1="48" y1="352" x2="852" y2="352" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="48" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">数据不出境 · 一处配置全模型生效 · 从入口到日志的纵深防御</text>
  <text x="852" y="370" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">AI 行业观察</text>
</svg>
