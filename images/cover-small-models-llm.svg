<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="33%" stop-color="#06b6d4"/>
      <stop offset="66%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bottom-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="33%" stop-color="#10b981"/>
      <stop offset="66%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="subtitle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#bg-grad)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="383"/>
    <line x1="200" y1="0" x2="200" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="400" y1="0" x2="400" y2="383"/>
    <line x1="500" y1="0" x2="500" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="700" y1="0" x2="700" y2="383"/>
    <line x1="800" y1="0" x2="800" y2="383"/>
  </g>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#top-bar)"/>

  <!-- Bottom gradient bar -->
  <rect x="0" y="379" width="900" height="4" fill="url(#bottom-bar)"/>

  <!-- Top-left label -->
  <rect x="28" y="24" width="240" height="28" rx="4" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.8"/>
  <text x="40" y="43" font-family="sans-serif" font-size="12" fill="#06b6d4" opacity="0.9">AI 工程实践 · 模型选型</text>

  <!-- Year badge top-right -->
  <rect x="840" y="20" width="40" height="40" rx="6" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.7"/>
  <text x="860" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#a78bfa" text-anchor="middle">26</text>

  <!-- Main title -->
  <text x="40" y="105" font-family="sans-serif" font-size="29" font-weight="bold" fill="#ffffff">大模型时代的专用小模型图鉴</text>
  <!-- Subtitle -->
  <text x="40" y="140" font-family="sans-serif" font-size="18" fill="url(#subtitle-grad)">从对抗到共生：BERT、XGBoost 与 LLM 的分工进化</text>

  <!-- Highlights -->
  <text x="40" y="180" font-family="sans-serif" font-size="12.5" fill="#34d399">◆ 微调 BERT 成本比 LLM 低 1-2 个数量级，分类精度持平或更优</text>
  <text x="40" y="202" font-family="sans-serif" font-size="12.5" fill="#fbbf24">◆ XGBoost 风控延迟 1-5ms vs LLM 100-1000ms — 实时决策的唯一选择</text>
  <text x="40" y="224" font-family="sans-serif" font-size="12.5" fill="#a78bfa">◆ Gartner 预测 2027 年专用小模型使用量将是 LLM 的 3 倍以上</text>

  <!-- Right side: conceptual diagram -->
  <!-- Small models cluster -->
  <rect x="640" y="100" width="80" height="30" rx="6" fill="none" stroke="#10b981" stroke-width="1.2"/>
  <text x="680" y="119" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">XGBoost</text>

  <rect x="740" y="100" width="70" height="30" rx="6" fill="none" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="775" y="119" font-family="sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">BERT</text>

  <rect x="640" y="145" width="60" height="30" rx="6" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="670" y="164" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">CRF</text>

  <rect x="715" y="145" width="95" height="30" rx="6" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="762" y="164" font-family="sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">DeepFM</text>

  <!-- Arrow: collaboration -->
  <line x1="720" y1="190" x2="720" y2="210" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3"/>
  <polygon points="715,210 725,210 720,218" fill="#4ade80"/>

  <!-- LLM box -->
  <rect x="665" y="220" width="110" height="36" rx="8" fill="none" stroke="#f472b6" stroke-width="1.5"/>
  <text x="720" y="243" font-family="sans-serif" font-size="12" fill="#f472b6" text-anchor="middle">LLM (GPT/Claude)</text>

  <!-- Collaboration label -->
  <text x="720" y="275" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">标注 · 蒸馏 · 路由</text>

  <!-- Tags -->
  <rect x="40" y="290" width="56" height="22" rx="11" fill="none" stroke="#6366f1" stroke-width="1"/>
  <text x="68" y="305" font-family="sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">BERT</text>

  <rect x="106" y="290" width="72" height="22" rx="11" fill="none" stroke="#6366f1" stroke-width="1"/>
  <text x="142" y="305" font-family="sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">XGBoost</text>

  <rect x="188" y="290" width="72" height="22" rx="11" fill="none" stroke="#6366f1" stroke-width="1"/>
  <text x="224" y="305" font-family="sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">模型选型</text>

  <rect x="270" y="290" width="80" height="22" rx="11" fill="none" stroke="#6366f1" stroke-width="1"/>
  <text x="310" y="305" font-family="sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">大小协作</text>

  <rect x="360" y="290" width="72" height="22" rx="11" fill="none" stroke="#6366f1" stroke-width="1"/>
  <text x="396" y="305" font-family="sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">工程实践</text>

  <rect x="442" y="290" width="72" height="22" rx="11" fill="none" stroke="#6366f1" stroke-width="1"/>
  <text x="478" y="305" font-family="sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">监督学习</text>

  <!-- Divider line -->
  <line x1="40" y1="330" x2="860" y2="330" stroke="#2d2d5e" stroke-width="0.8"/>

  <!-- Bottom: chapter hints -->
  <text x="40" y="352" font-family="sans-serif" font-size="10" fill="#64748b">5大护城河 → 学术实证 → 6大不可替代场景 → 新共生范式 → 选型决策树</text>

  <!-- Watermark -->
  <text x="860" y="368" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="end">xiaoi.ai</text>
</svg>
