<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="50%" stop-color="#161638"/>
      <stop offset="100%" stop-color="#0d0d25"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/><line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="180" y1="0" x2="180" y2="383"/><line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/><line x1="720" y1="0" x2="720" y2="383"/>
  </g>

  <!-- Top / bottom accent -->
  <rect x="0" y="0" width="300" height="4" fill="url(#blue)"/>
  <rect x="300" y="0" width="300" height="4" fill="url(#green)"/>
  <rect x="600" y="0" width="300" height="4" fill="url(#red)"/>
  <rect x="0" y="379" width="300" height="4" fill="url(#blue)"/>
  <rect x="300" y="379" width="300" height="4" fill="url(#green)"/>
  <rect x="600" y="379" width="300" height="4" fill="url(#red)"/>

  <!-- Right: open vs missing -->
  <g transform="translate(590, 70)">
    <rect x="0" y="0" width="230" height="200" rx="12" fill="#1e1e3a" stroke="url(#blue)" stroke-width="2.5"/>
    <text x="63" y="30" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">已开源</text>
    <text x="167" y="30" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="bold" fill="#fb7185" text-anchor="middle">需自建</text>

    <rect x="14" y="44" width="98" height="40" rx="6" fill="#0f2a22" stroke="#10b981" stroke-width="1.5"/>
    <text x="63" y="69" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">Prefill</text>
    <rect x="14" y="88" width="98" height="40" rx="6" fill="#0f2a22" stroke="#10b981" stroke-width="1.5"/>
    <text x="63" y="113" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">Decode</text>
    <rect x="14" y="132" width="98" height="40" rx="6" fill="#0f2a22" stroke="#10b981" stroke-width="1.5"/>
    <text x="63" y="157" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">recipe</text>

    <rect x="118" y="44" width="98" height="40" rx="6" fill="#2a1018" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="167" y="69" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#fecdd3" text-anchor="middle">KV 缓存</text>
    <rect x="118" y="88" width="98" height="40" rx="6" fill="#2a1018" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="167" y="113" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#fecdd3" text-anchor="middle">负载均衡</text>
    <rect x="118" y="132" width="98" height="40" rx="6" fill="#2a1018" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="167" y="157" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#fecdd3" text-anchor="middle">P/D 编排</text>
  </g>

  <!-- Tag -->
  <g transform="translate(50, 28)">
    <rect x="0" y="0" width="210" height="30" rx="4" fill="#1a1020" stroke="url(#blue)" stroke-width="1"/>
    <text x="105" y="20" font-family="'Courier New','Microsoft YaHei',monospace" font-weight="bold" font-size="14" fill="#22d3ee" text-anchor="middle">AI 行业观察 · 推理引擎</text>
  </g>

  <text x="50" y="108" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="bold" fill="#ffffff">DeepInfer 开源了</text>
  <text x="50" y="148" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="bold" fill="url(#blue)">普通团队用得起吗</text>

  <!-- Key highlights -->
  <g transform="translate(50, 178)">
    <text x="0" y="0" font-family="'Microsoft YaHei','Courier New',monospace" font-size="13" fill="#22d3ee">只认 B200 / 昇腾 950 · 仅支持 V4.1-Flash</text>
    <text x="0" y="22" font-family="'Microsoft YaHei','Courier New',monospace" font-size="13" fill="#fb7185">不含 KV 缓存 · 分离编排 · 负载均衡</text>
    <text x="0" y="44" font-family="'Microsoft YaHei','Courier New',monospace" font-size="13" fill="#34d399">最小高效部署 128 卡 · 月租约 55 万美元</text>
  </g>

  <!-- Tags -->
  <g transform="translate(50, 248)">
    <rect x="0" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="34" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">DeepSeek</text>

    <rect x="76" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#10b981" stroke-width="0.8"/>
    <text x="110" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">Apache 2.0</text>

    <rect x="152" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="186" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fda4af" text-anchor="middle">硬件门槛</text>

    <rect x="228" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="262" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fde047" text-anchor="middle">成本账</text>

    <rect x="304" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="338" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">替代路线</text>
  </g>

  <!-- Divider -->
  <rect x="50" y="290" width="460" height="1" fill="#fff" opacity="0.06"/>
  <text x="50" y="315" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#4a4f70">引擎规格 · 硬件门槛 · 缺失组件 · 自建成本 · 四条替代路线</text>
  <text x="50" y="348" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#33385a">公众号 - 最新AI知识宇宙 | 2026.10</text>

  <!-- Year badge -->
  <g transform="translate(835, 30)">
    <rect x="0" y="0" width="40" height="28" rx="4" fill="none" stroke="url(#blue)" stroke-width="1.5"/>
    <text x="20" y="19" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#22d3ee" text-anchor="middle">26</text>
  </g>
</svg>
