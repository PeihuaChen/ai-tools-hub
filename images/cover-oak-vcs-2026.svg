<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a1e"/><stop offset="1" stop-color="#161638"/></linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#84cc16"/><stop offset="0.5" stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="botbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="0.5" stop-color="#84cc16"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3e635"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/></pattern>
  </defs>
  <rect width="900" height="383" rx="12" fill="url(#bg)"/>
  <rect width="900" height="383" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="381" rx="12" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="0" width="900" height="4" fill="url(#topbar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#botbar)"/>

  <!-- tag box -->
  <rect x="40" y="34" width="240" height="30" rx="6" fill="#16201a" stroke="#84cc16" stroke-opacity="0.6"/>
  <text x="56" y="54" fill="#a3e635" font-size="14" font-weight="600">AI 开发平台 · 版本控制</text>

  <!-- year badge -->
  <circle cx="840" cy="50" r="26" fill="#16201a" stroke="#10b981" stroke-opacity="0.7"/>
  <text x="840" y="58" fill="#34d399" font-size="22" font-weight="700" text-anchor="middle">26</text>

  <!-- main title -->
  <text x="40" y="116" fill="#ffffff" font-size="27" font-weight="700">Git 不是为 Agent 设计的</text>
  <text x="40" y="150" fill="url(#sub)" font-size="17" font-weight="600">开源新秀 Oak 如何用 95% 的提速挑战版本控制霸主</text>

  <!-- highlights -->
  <text x="40" y="194" fill="#a3e635" font-size="13">▸ Rust 内核 · BLAKE3 内容寻址 · 内容定义分块</text>
  <text x="40" y="218" fill="#34d399" font-size="13">▸ 惰性挂载 · 无消息检查点 · 每任务独立 mount</text>
  <text x="40" y="242" fill="#22d3ee" font-size="13">▸ 快照 5 万文件 29.7s → 1.4s（−95%）· 可导回 Git</text>

  <!-- concept: oak tree / branch graph -->
  <g transform="translate(640,150)" stroke-linecap="round">
    <line x1="100" y1="120" x2="100" y2="40" stroke="#10b981" stroke-width="3"/>
    <line x1="100" y1="70" x2="60" y2="40" stroke="#84cc16" stroke-width="2.5"/>
    <line x1="100" y1="60" x2="140" y2="30" stroke="#22d3ee" stroke-width="2.5"/>
    <line x1="100" y1="85" x2="135" y2="65" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="100" cy="40" r="6" fill="#10b981"/>
    <circle cx="60" cy="40" r="5" fill="#84cc16"/>
    <circle cx="140" cy="30" r="5" fill="#22d3ee"/>
    <circle cx="135" cy="65" r="5" fill="#f59e0b"/>
    <circle cx="100" cy="120" r="6" fill="#94a3b8"/>
    <text x="100" y="142" fill="#64748b" font-size="11" text-anchor="middle">branch-per-session</text>
  </g>

  <!-- tag pills -->
  <g font-size="12">
    <rect x="40" y="296" width="50" height="26" rx="13" fill="none" stroke="#84cc16" stroke-opacity="0.7"/>
    <text x="65" y="313" fill="#a3e635" text-anchor="middle">Oak</text>
    <rect x="98" y="296" width="68" height="26" rx="13" fill="none" stroke="#10b981" stroke-opacity="0.7"/>
    <text x="132" y="313" fill="#34d399" text-anchor="middle">BLAKE3</text>
    <rect x="174" y="296" width="72" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="210" y="313" fill="#67e8f9" text-anchor="middle">惰性挂载</text>
    <rect x="254" y="296" width="56" height="26" rx="13" fill="none" stroke="#f59e0b" stroke-opacity="0.7"/>
    <text x="282" y="313" fill="#fcd34d" text-anchor="middle">Rust</text>
    <rect x="318" y="296" width="80" height="26" rx="13" fill="none" stroke="#84cc16" stroke-opacity="0.7"/>
    <text x="358" y="313" fill="#a3e635" text-anchor="middle">Git 替代</text>
  </g>

  <!-- footer -->
  <line x1="40" y1="344" x2="860" y2="344" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="40" y="366" fill="#64748b" font-size="12">深度解析 · 九大章节 · Oak vs Git 全方位对比</text>
  <text x="860" y="366" fill="#475569" font-size="12" text-anchor="end">AI Tools Hub</text>
</svg>
