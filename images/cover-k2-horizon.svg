<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#334155" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="url(#grid)" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="750" y1="0" x2="750" y2="383"/>
  </g>

  <!-- top / bottom color bars -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topbar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#topbar)"/>

  <!-- right side: fleet-of-sizes concept (stacked bars) -->
  <g transform="translate(650,70)" opacity="0.9">
    <rect x="0" y="150" width="30" height="20" rx="3" fill="#22d3ee" opacity="0.75"/>
    <rect x="38" y="120" width="30" height="50" rx="3" fill="#38bdf8" opacity="0.75"/>
    <rect x="76" y="86" width="30" height="84" rx="3" fill="#6366f1" opacity="0.8"/>
    <rect x="114" y="60" width="30" height="110" rx="3" fill="#8b5cf6" opacity="0.85"/>
    <rect x="152" y="34" width="30" height="136" rx="3" fill="#a855f7" opacity="0.9"/>
    <rect x="190" y="6" width="30" height="164" rx="3" fill="#c084fc" opacity="0.95"/>
    <text x="0" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">0.9B → 375B · 六模型舰队</text>
  </g>

  <!-- year badge -->
  <g transform="translate(828,26)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e9d5ff">26</text>
  </g>

  <!-- tag box (>=200px) -->
  <g transform="translate(40,34)">
    <rect x="0" y="0" width="266" height="30" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="18" cy="15" r="4" fill="#22d3ee"/>
    <text x="32" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c7d2fe">AI 行业观察 · 完全开源</text>
  </g>

  <!-- main title -->
  <text x="40" y="118" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">不只是开放权重：K2 Horizon</text>
  <text x="40" y="156" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">把训练全过程全掀了</text>

  <!-- subtitle -->
  <text x="40" y="190" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="600" fill="url(#sub)">MBZUAI / IFM · 史上最大规模的 fully open 发布</text>

  <!-- 3 highlight lines -->
  <text x="40" y="224" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#5eead4">▸ 六模型舰队：从手表 0.9B 到企业旗舰 375B-A23B</text>
  <text x="40" y="246" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#93c5fd">▸ 权重 + 数据 + 代码 + 中间检查点 + 日志全开</text>
  <text x="40" y="268" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#d8b4fe">▸ MoVA 稀疏注意力 · Uno 无损 3× 提速</text>

  <!-- tag pills -->
  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="11">
    <g transform="translate(40,288)">
      <rect x="0" y="0" width="88" height="24" rx="12" fill="none" stroke="#22d3ee" stroke-width="1"/>
      <text x="44" y="16" text-anchor="middle" fill="#a5f3fc">K2 Horizon</text>
    </g>
    <g transform="translate(136,288)">
      <rect x="0" y="0" width="52" height="24" rx="12" fill="none" stroke="#818cf8" stroke-width="1"/>
      <text x="26" y="16" text-anchor="middle" fill="#c7d2fe">MoVA</text>
    </g>
    <g transform="translate(196,288)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="none" stroke="#c084fc" stroke-width="1"/>
      <text x="35" y="16" text-anchor="middle" fill="#e9d5ff">完全开源</text>
    </g>
    <g transform="translate(274,288)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="none" stroke="#fbbf24" stroke-width="1"/>
      <text x="35" y="16" text-anchor="middle" fill="#fde68a">阿联酋AI</text>
    </g>
    <g transform="translate(352,288)">
      <rect x="0" y="0" width="88" height="24" rx="12" fill="none" stroke="#34d399" stroke-width="1"/>
      <text x="44" y="16" text-anchor="middle" fill="#a7f3d0">Apache 2.0</text>
    </g>
  </g>

  <!-- divider + footer -->
  <line x1="40" y1="336" x2="860" y2="336" stroke="#334155" stroke-width="1"/>
  <text x="40" y="360" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#64748b">从 open weights 到 open science · 六尺寸性能账 · reward hacking 审计</text>
  <text x="860" y="360" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#475569">AI 行业观察</text>
</svg>
