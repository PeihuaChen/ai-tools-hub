  <rect x="0" y="379" width="900" height="4" fill="url(#botbar)"/>

  <rect x="48" y="38" width="248" height="28" rx="5" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-opacity="0.55" stroke-width="1"/>
