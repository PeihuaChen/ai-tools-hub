  <circle cx="852" cy="48" r="21" fill="none" stroke="#ff4d9d" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="852" y="55" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="bold" fill="#ff8fbb">26</text>

  <line x1="48" y1="316" x2="852" y2="316" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <text x="48" y="345" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#7d8aa5">协议兼容 · 组件可换 · 成本拐点 · Smart Turn 投机回滚 · 中文栈落地 · 性能数据核对</text>
  <text x="852" y="345" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11.5" fill="#5d6a85">公众号：AI 界的小学生</text>
