    <text x="734" y="169" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#b6adff">STT  语音转文字</text>
    <path d="M734 181 L734 197" stroke="#5566aa" stroke-width="1.5"/>
    <path d="M730 192 L734 198 L738 192" fill="none" stroke="#5566aa" stroke-width="1.5"/>

    <rect x="636" y="198" width="196" height="34" rx="6" fill="#ff4d9d" fill-opacity="0.13" stroke="#ff4d9d" stroke-opacity="0.6"/>
    <text x="734" y="220" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#ffa3c8">LLM  语言模型</text>
    <path d="M734 232 L734 248" stroke="#5566aa" stroke-width="1.5"/>
    <path d="M730 243 L734 249 L738 243" fill="none" stroke="#5566aa" stroke-width="1.5"/>

    <rect x="636" y="249" width="196" height="34" rx="6" fill="#ffb020" fill-opacity="0.13" stroke="#ffb020" stroke-opacity="0.6"/>
    <text x="734" y="271" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#ffd28a">TTS  语音合成</text>
