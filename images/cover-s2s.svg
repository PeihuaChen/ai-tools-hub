<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="55%" stop-color="#101030"/>
      <stop offset="100%" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="34%" stop-color="#7b6cff"/>
      <stop offset="67%" stop-color="#ff4d9d"/>
      <stop offset="100%" stop-color="#ffb020"/>
    </linearGradient>
    <linearGradient id="botbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb020"/>
