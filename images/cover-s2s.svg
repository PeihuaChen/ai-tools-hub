  <text x="48" y="112" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="31" font-weight="bold" fill="#ffffff">自建语音 Agent 实战指南</text>
  <text x="48" y="150" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="bold" fill="url(#subt)">speech-to-speech：从部署到中文适配</text>

  <text x="48" y="192" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#8ce8ff">VAD → STT → LLM → TTS 四段级联，兼容 OpenAI Realtime 协议</text>
  <text x="48" y="215" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#ffa8d0">RTX 4090 单流实测：首音 152ms，RTF 5.56（附数据核对）</text>
  <text x="48" y="238" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#ffd27a">中文栈：Paraformer + vLLM/Qwen3 + Qwen3-TTS / CosyVoice 3</text>

  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11.5">
