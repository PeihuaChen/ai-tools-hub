<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="60%" stop-color="#101030"/>
      <stop offset="100%" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="35%" stop-color="#7c5cff"/>
      <stop offset="70%" stop-color="#ff5fa2"/>
      <stop offset="100%" stop-color="#ffb03a"/>
    </linearGradient>
    <linearGradient id="barBot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb03a"/>
      <stop offset="50%" stop-color="#ff5fa2"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="55%" stop-color="#8b7cff"/>
      <stop offset="100%" stop-color="#ff7fb8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 L0 0 0 36" fill="none" stroke="#2a2a5c" stroke-width="0.7" opacity="0.5"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>
  <ellipse cx="735" cy="185" rx="215" ry="175" fill="url(#glow)"/>

  <rect x="0" y="0" width="900" height="4" fill="url(#barTop)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#barBot)"/>

  <!-- 标签框 -->
  <rect x="44" y="34" width="248" height="30" rx="6" fill="#00d4ff" fill-opacity="0.10" stroke="#00d4ff" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="60" y="54" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#5fe0ff" letter-spacing="0.5">AI 行业观察 · 推理时计算</text>

  <!-- 年份徽章 -->
  <circle cx="832" cy="49" r="23" fill="#7c5cff" fill-opacity="0.14" stroke="#8b7cff" stroke-opacity="0.6" stroke-width="1.3"/>
  <text x="832" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#b3a6ff">26</text>

  <!-- 主标题 -->
  <text x="46" y="126" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="31" font-weight="bold" fill="#ffffff">不重训也能变强</text>
  <text x="46" y="164" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="bold" fill="url(#subGrad)">推理时计算与模型自我学习的 2026 全景</text>

  <!-- 分隔短线 -->
  <rect x="46" y="182" width="58" height="2.5" rx="1.2" fill="#ff5fa2" opacity="0.85"/>

  <!-- 三行亮点 -->
  <text x="46" y="216" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" fill="#7de3ff">▸ Recirculation 冻结权重：Gemma3 困惑度 −23%，GSM8k +21%</text>
  <text x="46" y="242" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" fill="#b3a6ff">▸ 32B 靠 TTC 在 SWE-bench Verified 达 46%，反超 671B</text>
  <text x="46" y="268" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" fill="#ff9ec4">▸ 坏消息：记忆整合效用先升后降，会跌破无记忆基线</text>

  <!-- 标签 pill -->
  <g font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5">
    <rect x="46" y="288" width="86" height="24" rx="12" fill="none" stroke="#00d4ff" stroke-opacity="0.5" stroke-width="1"/>
    <text x="89" y="304" text-anchor="middle" fill="#8fe8ff">Test-Time</text>
    <rect x="140" y="288" width="66" height="24" rx="12" fill="none" stroke="#7c5cff" stroke-opacity="0.5" stroke-width="1"/>
    <text x="173" y="304" text-anchor="middle" fill="#c0b5ff">TTT</text>
    <rect x="214" y="288" width="76" height="24" rx="12" fill="none" stroke="#ff5fa2" stroke-opacity="0.5" stroke-width="1"/>
    <text x="252" y="304" text-anchor="middle" fill="#ffb0d0">SEAL</text>
    <rect x="298" y="288" width="66" height="24" rx="12" fill="none" stroke="#ffb03a" stroke-opacity="0.5" stroke-width="1"/>
    <text x="331" y="304" text-anchor="middle" fill="#ffd08f">ACE</text>
    <rect x="372" y="288" width="94" height="24" rx="12" fill="none" stroke="#3ddc97" stroke-opacity="0.5" stroke-width="1"/>
    <text x="419" y="304" text-anchor="middle" fill="#8ff0c4">Dreaming</text>
  </g>

  <!-- 右侧概念图：五条轴汇聚 -->
  <g transform="translate(600,96)">
    <rect x="0" y="0" width="252" height="184" rx="10" fill="#0e0e2a" fill-opacity="0.55" stroke="#3a3a70" stroke-width="1"/>

    <!-- 中心模型块 -->
    <rect x="96" y="74" width="60" height="36" rx="6" fill="#7c5cff" fill-opacity="0.20" stroke="#8b7cff" stroke-width="1.3"/>
    <text x="126" y="97" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8bdff">LLM</text>

    <!-- 五条轴 -->
    <line x1="26" y1="28" x2="94" y2="80" stroke="#00d4ff" stroke-width="1.4" opacity="0.75"/>
    <circle cx="22" cy="26" r="5" fill="#00d4ff" fill-opacity="0.55"/>
    <text x="32" y="22" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="9.5" fill="#7de3ff">延长思考</text>

    <line x1="26" y1="92" x2="94" y2="92" stroke="#3ddc97" stroke-width="1.4" opacity="0.75"/>
    <circle cx="22" cy="92" r="5" fill="#3ddc97" fill-opacity="0.55"/>
    <text x="32" y="86" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="9.5" fill="#8ff0c4">并行采样</text>

    <line x1="26" y1="156" x2="94" y2="104" stroke="#ffb03a" stroke-width="1.4" opacity="0.75"/>
    <circle cx="22" cy="158" r="5" fill="#ffb03a" fill-opacity="0.55"/>
    <text x="32" y="170" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="9.5" fill="#ffd08f">潜空间深度</text>

    <line x1="158" y1="80" x2="226" y2="28" stroke="#ff5fa2" stroke-width="1.4" opacity="0.75"/>
    <circle cx="230" cy="26" r="5" fill="#ff5fa2" fill-opacity="0.55"/>
    <text x="222" y="22" text-anchor="end" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="9.5" fill="#ffb0d0">权重更新</text>

    <line x1="158" y1="104" x2="226" y2="156" stroke="#5fa8ff" stroke-width="1.4" opacity="0.75"/>
    <circle cx="230" cy="158" r="5" fill="#5fa8ff" fill-opacity="0.55"/>
    <text x="222" y="170" text-anchor="end" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="9.5" fill="#a8ccff">记忆演化</text>

    <!-- 循环箭头暗示 recirculation -->
    <path d="M126 68 C 150 56, 172 76, 158 92" fill="none" stroke="#8b7cff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8"/>
    <path d="M156 88 L159 93 L153 94 Z" fill="#8b7cff" opacity="0.9"/>
  </g>

  <!-- 底部 -->
  <line x1="46" y1="336" x2="854" y2="336" stroke="#33336a" stroke-width="1"/>
  <text x="46" y="360" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#7a7aa8">五条轴 · 一个调度层 · 一份失效清单 · 一张选型判断表</text>
  <text x="854" y="360" text-anchor="end" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#5c5c8a">公众号：AI 行业观察</text>
</svg>
