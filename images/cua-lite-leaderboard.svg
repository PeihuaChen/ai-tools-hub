  <g>
    <rect x="330" y="142" width="651" height="22" rx="4" fill="#1d4ed8"/>
    <rect x="330" y="175" width="416" height="22" rx="4" fill="#15803d"/>
    <rect x="330" y="208" width="385" height="22" rx="4" fill="#b45309"/>
    <rect x="330" y="241" width="343" height="22" rx="4" fill="#15803d"/>
    <rect x="330" y="274" width="322" height="22" rx="4" fill="#15803d"/>
