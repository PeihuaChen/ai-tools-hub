  <rect x="48" y="598" width="1104" height="46" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="66" y="618" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#b45309">注意：8B 的 EvoCUA（42.8）压过 32B 的 Qwen3-VL（35.8）和 9B 的 Qwen3.5（38.1）——这条赛道上「专门训过」比「参数更大」更值钱。</text>
  <text x="66" y="637" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#6b7280">数据来源：CUA-Lite 项目主页 Leaderboard（2026-07-18 快照）。榜单分数全部由 CUA-Lite 团队自行跑出，非第三方独立复现。</text>
