    <rect x="330" y="373" width="265" height="22" rx="4" fill="#6d28d9"/>
    <rect x="330" y="406" width="262" height="22" rx="4" fill="#15803d"/>
    <rect x="330" y="439" width="185" height="22" rx="4" fill="#15803d"/>
    <rect x="330" y="472" width="135" height="22" rx="4" fill="#0e7490"/>
    <rect x="330" y="505" width="132" height="22" rx="4" fill="#6d28d9"/>
    <rect x="330" y="538" width="96" height="22" rx="4" fill="#15803d"/>
