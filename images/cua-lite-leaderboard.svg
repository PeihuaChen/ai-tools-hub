  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold">
    <text x="989" y="158" fill="#1d4ed8">72.3</text>
    <text x="754" y="191" fill="#15803d">46.2</text>
    <text x="723" y="224" fill="#b45309">42.8</text>
    <text x="681" y="257" fill="#15803d">38.1</text>
