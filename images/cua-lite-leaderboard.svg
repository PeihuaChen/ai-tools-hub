  <!-- 人类基线：画在柱条之后，避免被 gpt-5.5 的柱条边缘盖住 -->
  <path d="M981 134V570" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="975" y="588" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#b91c1c">人类基线 72.36%</text>

