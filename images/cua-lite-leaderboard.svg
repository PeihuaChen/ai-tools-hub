    <text x="690" y="124">40</text>
    <text x="870" y="124">60</text>
    <text x="1050" y="124">80</text>
  </g>

  <!-- 模型名 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#4b5563" text-anchor="end">
    <text x="320" y="158">gpt-5.5</text>
    <text x="320" y="191">Qwen3.5-27B</text>
    <text x="320" y="224">EvoCUA-8B（美团）</text>
    <text x="320" y="257">Qwen3.5-9B</text>
    <text x="320" y="290">Qwen3-VL-32B-Instruct</text>
    <text x="320" y="323">Qwen3-VL-8B-Instruct</text>
