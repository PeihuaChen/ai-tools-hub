<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <rect width="1200" height="660" fill="#ffffff"/>

  <text x="48" y="42" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="23" font-weight="bold" fill="#111827">CUA-Lite 自跑的 OSWorld 榜单：一个闭源模型，和它后面的中国开源权重</text>
  <text x="48" y="68" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#4b5563">13 个 agent · 325 个任务 · 成功率（%）· 榜单日期 2026-07-18</text>

  <!-- 图例：独占一行，避免与标题同基线重叠 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#4b5563">
    <rect x="48" y="82" width="14" height="14" rx="3" fill="#1d4ed8"/>
    <text x="70" y="93">闭源 API</text>
    <rect x="148" y="82" width="14" height="14" rx="3" fill="#15803d"/>
    <text x="170" y="93">阿里 Qwen</text>
    <rect x="256" y="82" width="14" height="14" rx="3" fill="#b45309"/>
    <text x="278" y="93">美团 EvoCUA</text>
    <rect x="384" y="82" width="14" height="14" rx="3" fill="#6d28d9"/>
    <text x="406" y="93">字节 UI-TARS</text>
    <rect x="516" y="82" width="14" height="14" rx="3" fill="#0e7490"/>
    <text x="538" y="93">OpenGVLab ScaleCUA</text>
  </g>

  <!-- 网格线与横轴刻度 -->
  <g stroke="#d9e2ec" stroke-width="1">
    <path d="M330 134V570M510 134V570M690 134V570M870 134V570M1050 134V570"/>
  </g>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">
