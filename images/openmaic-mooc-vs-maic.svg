<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680">
  <rect width="1080" height="680" fill="#f7f8fa"/>

  <!-- main title -->
  <text x="540" y="70" fill="#111827" font-size="60" font-weight="bold" text-anchor="middle">范式反转：MOOC → MAIC</text>

  <!-- divider -->
  <line x1="540" y1="120" x2="540" y2="640" stroke="#d9e2ec" stroke-width="2" stroke-dasharray="8"/>

  <!-- ===== LEFT: MOOC ===== -->
  <text x="270" y="170" fill="#b45309" font-size="46" font-weight="bold" text-anchor="middle">MOOC</text>
  <text x="270" y="215" fill="#6b7280" font-size="34" text-anchor="middle">1 个视频 → N 个学生</text>

  <!-- video box -->
  <rect x="170" y="250" width="200" height="110" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2.5"/>
  <text x="270" y="300" fill="#b45309" font-size="36" font-weight="bold" text-anchor="middle">录播视频</text>
  <text x="270" y="340" fill="#92400e" font-size="30" text-anchor="middle">单向广播</text>

  <!-- arrows down -->
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="200" y1="360" x2="150" y2="440"/>
    <line x1="240" y1="360" x2="215" y2="440"/>
    <line x1="290" y1="360" x2="325" y2="440"/>
    <line x1="330" y1="360" x2="390" y2="440"/>
  </g>

  <!-- students row -->
  <g>
    <circle cx="140" cy="480" r="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="140" y="493" font-size="34" text-anchor="middle">🧑</text>
    <circle cx="215" cy="480" r="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="215" y="493" font-size="34" text-anchor="middle">🧑</text>
    <circle cx="325" cy="480" r="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="325" y="493" font-size="34" text-anchor="middle">🧑</text>
    <circle cx="400" cy="480" r="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="400" y="493" font-size="34" text-anchor="middle">🧑</text>
  </g>
  <text x="270" y="580" fill="#4b5563" font-size="32" text-anchor="middle">千人一面</text>
  <text x="270" y="620" fill="#4b5563" font-size="32" text-anchor="middle">不能提问 · 无法调整</text>

  <!-- ===== RIGHT: MAIC ===== -->
  <text x="810" y="170" fill="#1d4ed8" font-size="46" font-weight="bold" text-anchor="middle">MAIC</text>
  <text x="810" y="215" fill="#6b7280" font-size="34" text-anchor="middle">N 个智能体 → 1 个学生</text>

  <!-- agents around student -->
  <g>
    <rect x="640" y="270" width="150" height="66" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="715" y="313" fill="#1d4ed8" font-size="30" font-weight="bold" text-anchor="middle">AI 老师</text>

    <rect x="830" y="270" width="150" height="66" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="905" y="313" fill="#15803d" font-size="30" font-weight="bold" text-anchor="middle">AI 同学</text>

    <rect x="640" y="500" width="150" height="66" rx="12" fill="#faf5ff" stroke="#6d28d9" stroke-width="2"/>
    <text x="715" y="543" fill="#6d28d9" font-size="30" font-weight="bold" text-anchor="middle">调度器</text>

    <rect x="830" y="500" width="150" height="66" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <text x="905" y="543" fill="#0e7490" font-size="30" font-weight="bold" text-anchor="middle">分析师</text>

    <!-- center student -->
    <circle cx="810" cy="418" r="52" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="3"/>
    <text x="810" y="432" font-size="46" text-anchor="middle">🎓</text>

    <!-- lines to center -->
    <g stroke="#94a3b8" stroke-width="2.5">
      <line x1="740" y1="336" x2="785" y2="380"/>
      <line x1="880" y1="336" x2="835" y2="380"/>
      <line x1="740" y1="500" x2="785" y2="456"/>
      <line x1="880" y1="500" x2="835" y2="456"/>
    </g>
  </g>
  <text x="810" y="620" fill="#4b5563" font-size="32" text-anchor="middle">因材施教 · 实时互动</text>
</svg>
