<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560">
  <rect width="1160" height="560" fill="#ffffff"/>

  <text x="40" y="44" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="24" font-weight="bold" fill="#111827">两条容易被误读的曲线：记忆效用与上下文腐烂</text>
  <text x="40" y="70" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#4b5563">共同点是都不给报错信号——你看到的是悄悄错掉的答案，而不是异常日志</text>

  <!-- 左图：记忆效用先升后降 -->
  <rect x="40" y="94" width="536" height="360" rx="12" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.3"/>
  <text x="64" y="124" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="16" font-weight="bold" fill="#111827">记忆整合的效用：先升后降</text>
  <text x="64" y="146" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" fill="#6b7280">即使源自确实有用的经验，整合结果也常常是错的</text>

  <!-- 坐标轴 -->
  <line x1="96" y1="400" x2="546" y2="400" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="96" y1="176" x2="96" y2="400" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="546" y="422" text-anchor="end" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#4b5563">整合轮次 →</text>
  <text x="66" y="186" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#4b5563">记忆效用</text>

  <!-- 基线 -->
  <line x1="96" y1="316" x2="546" y2="316" stroke="#b45309" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="540" y="308" text-anchor="end" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" font-weight="bold" fill="#b45309">无记忆基线</text>

  <!-- 曲线 -->
  <path d="M110 320 C 170 250, 210 212, 262 208 C 320 204, 356 250, 400 300 C 444 348, 486 376, 536 386" fill="none" stroke="#b91c1c" stroke-width="2.6"/>

  <!-- 上升区域标注 -->
  <rect x="112" y="196" width="150" height="120" fill="#15803d" fill-opacity="0.07"/>
  <text x="128" y="238" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" font-weight="bold" fill="#15803d">① 上升期</text>
  <text x="128" y="256" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#15803d">上线决策通常</text>
  <text x="128" y="272" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#15803d">在这里做出</text>

  <!-- 峰值点 -->
  <circle cx="262" cy="208" r="5.5" fill="#15803d"/>
  <text x="272" y="200" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" font-weight="bold" fill="#15803d">峰值</text>

  <!-- 下降区域 -->
  <rect x="262" y="196" width="274" height="120" fill="#b91c1c" fill-opacity="0.05"/>
  <text x="336" y="238" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">② 退化期</text>
  <text x="336" y="256" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#b91c1c">发生在你已经不</text>
  <text x="336" y="272" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#b91c1c">再盯着它的时候</text>

  <!-- 跌破基线点 -->
  <circle cx="400" cy="300" r="5" fill="#b45309"/>
  <line x1="400" y1="300" x2="430" y2="264" stroke="#b45309" stroke-width="1.1"/>
  <text x="434" y="262" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" font-weight="bold" fill="#b45309">跌破基线</text>

  <!-- 跌破区域 -->
  <rect x="400" y="316" width="136" height="72" fill="#b91c1c" fill-opacity="0.10"/>
  <text x="468" y="352" text-anchor="middle" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">③ 比不用记忆</text>
  <text x="468" y="370" text-anchor="middle" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">还要差</text>

  <rect x="64" y="418" width="488" height="24" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
  <text x="78" y="435" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#b91c1c">陷阱：早期观测到的提升，会让你放心把长期自我整合交给它</text>

  <!-- 右图：context rot 是斜坡不是悬崖 -->
  <rect x="600" y="94" width="520" height="360" rx="12" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.3"/>
  <text x="624" y="124" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="16" font-weight="bold" fill="#111827">上下文腐烂：斜坡，不是悬崖</text>
  <text x="624" y="146" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" fill="#6b7280">测试的 18 个前沿模型全部随 token 数增长持续掉准确率</text>

  <line x1="656" y1="400" x2="1092" y2="400" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="656" y1="176" x2="656" y2="400" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="1092" y="422" text-anchor="end" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#4b5563">输入 token 数 →</text>
  <text x="626" y="186" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#4b5563">准确率</text>

  <!-- 标称上限竖线 -->
  <line x1="1032" y1="176" x2="1032" y2="400" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1026" y="192" text-anchor="end" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#6b7280">标称窗口上限</text>

  <!-- 误解：悬崖 -->
  <path d="M668 204 L1030 204 L1032 380" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="760" y="198" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">常见误解：到上限才崩（悬崖）</text>

  <!-- 现实：斜坡 -->
  <path d="M668 208 C 760 232, 860 276, 1000 344 C 1030 358, 1050 366, 1080 376" fill="none" stroke="#b91c1c" stroke-width="2.8"/>
  <circle cx="668" cy="208" r="5" fill="#b91c1c"/>
  <text x="678" y="246" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">从第一个 token</text>
  <text x="678" y="262" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">就开始下滑</text>

  <text x="880" y="308" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">现实：斜坡</text>

  <!-- 位置效应数据块 -->
  <rect x="676" y="330" width="196" height="58" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="690" y="350" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#4b5563">仅改变信息在窗口中的位置</text>
  <text x="690" y="374" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#b91c1c">98.1% → 64.1%</text>

  <rect x="624" y="418" width="472" height="24" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
  <text x="638" y="435" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#b91c1c">症状：丢掉具体规范、精确定义变模糊近似、逐渐偏离既定操作约束</text>

  <!-- 底部对策 -->
  <rect x="40" y="472" width="1080" height="56" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="62" y="494" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">三条对策</text>
  <text x="150" y="494" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" fill="#1d4ed8">① 记忆整合加人工审核关口　② 持续监控记忆效用，而不是只看上线时的提升　③ 给上下文设硬预算</text>
  <text x="150" y="514" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#4b5563">Anthropic 在 Dreaming 里保留「审核后再落地」选项、Claude Code 专门做子 agent 修 20+ 会话后的记忆退化，都是对这个现实的承认。</text>

  <text x="40" y="550" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">数据来源：arXiv 2605.12978（记忆效用曲线）、Chroma context rot 研究、位置效应测量。曲线为趋势示意，非原始实验数据点。</text>
</svg>
