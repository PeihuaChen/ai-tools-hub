<svg width="1080" height="760" viewBox="0 0 1080 760" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="760" fill="#f7f8fa"/>

  <!-- title -->
  <text x="60" y="76" font-size="44" font-weight="bold" fill="#111827">LangGraph 状态图：状态贯穿全程</text>

  <!-- loop / conditional edge arch (C back to B) -->
  <path d="M786 180 C 786 110, 540 110, 540 180" fill="none" stroke="#0e7490" stroke-width="3" stroke-dasharray="8"/>
  <path d="M540 180 l-10 -16 l20 0 z" fill="#0e7490"/>
  <text x="663" y="108" font-size="30" fill="#0e7490" text-anchor="middle" font-weight="bold">条件边（循环）</text>

  <!-- START -->
  <circle cx="104" cy="235" r="44" fill="#eef2ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="104" y="245" font-size="30" fill="#6d28d9" text-anchor="middle" font-weight="bold">开始</text>

  <!-- Node A -->
  <rect x="194" y="180" width="200" height="110" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="294" y="228" font-size="34" font-weight="bold" fill="#1d4ed8" text-anchor="middle">节点 A</text>
  <text x="294" y="268" font-size="30" fill="#4b5563" text-anchor="middle">模型调用</text>

  <!-- Node B -->
  <rect x="440" y="180" width="200" height="110" rx="14" fill="#ecfeff" stroke="#0e7490" stroke-width="2.5"/>
  <text x="540" y="228" font-size="34" font-weight="bold" fill="#0e7490" text-anchor="middle">节点 B</text>
  <text x="540" y="268" font-size="30" fill="#4b5563" text-anchor="middle">工具调用</text>

  <!-- Node C -->
  <rect x="686" y="180" width="200" height="110" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="786" y="228" font-size="34" font-weight="bold" fill="#15803d" text-anchor="middle">节点 C</text>
  <text x="786" y="268" font-size="30" fill="#4b5563" text-anchor="middle">结果判断</text>

  <!-- END -->
  <circle cx="976" cy="235" r="44" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="976" y="245" font-size="30" fill="#b91c1c" text-anchor="middle" font-weight="bold">结束</text>

  <!-- horizontal edges -->
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="148" y1="235" x2="188" y2="235"/>
    <line x1="394" y1="235" x2="434" y2="235"/>
    <line x1="640" y1="235" x2="680" y2="235"/>
    <line x1="886" y1="235" x2="926" y2="235"/>
  </g>
  <g fill="#94a3b8">
    <path d="M188 235 l-14 -8 l0 16 z"/>
    <path d="M434 235 l-14 -8 l0 16 z"/>
    <path d="M680 235 l-14 -8 l0 16 z"/>
    <path d="M926 235 l-14 -8 l0 16 z"/>
  </g>

  <!-- arrows from nodes down into state bus -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6">
    <line x1="294" y1="290" x2="294" y2="398"/>
    <line x1="540" y1="290" x2="540" y2="398"/>
    <line x1="786" y1="290" x2="786" y2="398"/>
  </g>
  <text x="620" y="345" font-size="30" fill="#6b7280">读 / 写</text>

  <!-- state bus -->
  <rect x="60" y="400" width="960" height="100" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="540" y="462" font-size="34" font-weight="bold" fill="#1d4ed8" text-anchor="middle">State 共享状态：每个节点都读它、改它</text>

  <!-- arrow bus to checkpoint -->
  <line x1="540" y1="500" x2="540" y2="556" stroke="#94a3b8" stroke-width="3"/>
  <path d="M540 556 l-8 -14 l16 0 z" fill="#94a3b8"/>

  <!-- checkpointer box -->
  <rect x="60" y="560" width="960" height="140" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="540" y="618" font-size="34" font-weight="bold" fill="#15803d" text-anchor="middle">Checkpointer 检查点：每一步存下状态快照</text>
  <text x="540" y="666" font-size="32" fill="#4b5563" text-anchor="middle">支撑 人机协同 · 时间旅行 · 容错恢复 · 对话记忆</text>
</svg>
