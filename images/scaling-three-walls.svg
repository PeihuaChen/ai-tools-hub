<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="w-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#9d174d"/></linearGradient>
    <pattern id="g2" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
  </defs>
  <rect width="860" height="360" rx="12" fill="url(#w-bg)"/>
  <rect width="860" height="360" rx="12" fill="url(#g2)"/>
  <rect x="1" y="1" width="858" height="358" rx="12" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="430" y="44" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Scaling Law 撞的不是一堵墙，而是三堵</text>
  <text x="430" y="72" fill="#94a3b8" font-size="14" text-anchor="middle">每一条突破路线，本质上都是在绕开或推倒其中某一堵</text>

  <!-- wall 1 -->
  <g transform="translate(70,110)">
    <rect width="210" height="190" rx="10" fill="url(#w1)" opacity="0.18" stroke="#3b82f6" stroke-opacity="0.6"/>
    <rect x="24" y="-2" width="162" height="34" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="105" y="21" fill="#93c5fd" font-size="17" font-weight="700" text-anchor="middle">数据墙</text>
    <text x="105" y="70" fill="#cbd5e1" font-size="13" text-anchor="middle">高质量人类文本</text>
    <text x="105" y="92" fill="#cbd5e1" font-size="13" text-anchor="middle">正在被榨干</text>
    <text x="105" y="128" fill="#60a5fa" font-size="12" text-anchor="middle">优质 token 有限</text>
    <text x="105" y="150" fill="#60a5fa" font-size="12" text-anchor="middle">胃口却指数增长</text>
    <text x="105" y="180" fill="#64748b" font-size="11" text-anchor="middle">→ 合成数据 / RL</text>
  </g>

  <!-- wall 2 -->
  <g transform="translate(325,110)">
    <rect width="210" height="190" rx="10" fill="url(#w2)" opacity="0.18" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <rect x="14" y="-2" width="182" height="34" rx="6" fill="#1e293b" stroke="#8b5cf6"/>
    <text x="105" y="21" fill="#c4b5fd" font-size="17" font-weight="700" text-anchor="middle">算力 / 经济墙</text>
    <text x="105" y="70" fill="#cbd5e1" font-size="13" text-anchor="middle">单次训练上亿美元</text>
    <text x="105" y="92" fill="#cbd5e1" font-size="13" text-anchor="middle">边际收益递减</text>
    <text x="105" y="128" fill="#a78bfa" font-size="12" text-anchor="middle">loss 每降一点</text>
    <text x="105" y="150" fill="#a78bfa" font-size="12" text-anchor="middle">算力却要翻倍</text>
    <text x="105" y="180" fill="#64748b" font-size="11" text-anchor="middle">→ 新架构 / 效率</text>
  </g>

  <!-- wall 3 -->
  <g transform="translate(580,110)">
    <rect width="210" height="190" rx="10" fill="url(#w3)" opacity="0.18" stroke="#ec4899" stroke-opacity="0.6"/>
    <rect x="24" y="-2" width="162" height="34" rx="6" fill="#1e293b" stroke="#ec4899"/>
    <text x="105" y="21" fill="#f9a8d4" font-size="17" font-weight="700" text-anchor="middle">能力墙</text>
    <text x="105" y="70" fill="#cbd5e1" font-size="13" text-anchor="middle">loss 连续下降</text>
    <text x="105" y="92" fill="#cbd5e1" font-size="13" text-anchor="middle">能力却台阶式解锁</text>
    <text x="105" y="128" fill="#f472b6" font-size="12" text-anchor="middle">推理 / 规划 / 可靠性</text>
    <text x="105" y="150" fill="#f472b6" font-size="12" text-anchor="middle">未必跟得上</text>
    <text x="105" y="180" fill="#64748b" font-size="11" text-anchor="middle">→ 推理时计算 / Agent</text>
  </g>
</svg>
