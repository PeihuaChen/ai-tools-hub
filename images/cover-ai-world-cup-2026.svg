<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d2a8"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="botbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#2a2a5a" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>
  <rect width="900" height="4" fill="url(#topbar)"/>
  <rect y="379" width="900" height="4" fill="url(#botbar)"/>

  <!-- top-left tag box -->
  <rect x="40" y="34" width="248" height="30" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.3" opacity="0.85"/>
  <text x="56" y="54" fill="#9fd0ff" font-size="14" font-weight="600">AI 行业观察 · 体育科技</text>

  <!-- year badge -->
  <circle cx="845" cy="50" r="24" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
  <text x="845" y="58" fill="#d8b4fe" font-size="20" font-weight="700" text-anchor="middle">26</text>

  <!-- main title -->
  <text x="40" y="132" fill="#ffffff" font-size="31" font-weight="700">大模型走进绿茵场</text>
  <text x="40" y="172" fill="url(#sub)" font-size="19" font-weight="600">2026世界杯背后的 AI 全景与体育智能化的下一站</text>

  <!-- highlights -->
  <text x="40" y="214" fill="#34d399" font-size="13">▸ 70秒→25秒：AI 半自动越位与直达裁判耳麦的实时判罚</text>
  <text x="40" y="238" fill="#60a5fa" font-size="13">▸ 3D 虚拟形象 · AI 个性化转播 · 生成式实时集锦</text>
  <text x="40" y="262" fill="#f59e0b" font-size="13">▸ 从工具到 Agent、世界模型，与绕不开的信任难题</text>

  <!-- tag pills -->
  <g font-size="12">
    <rect x="40" y="292" width="96" height="26" rx="13" fill="none" stroke="#3b82f6" opacity="0.75"/>
    <text x="88" y="309" fill="#bcd6ff" text-anchor="middle">半自动越位</text>
    <rect x="146" y="292" width="84" height="26" rx="13" fill="none" stroke="#34d399" opacity="0.75"/>
    <text x="188" y="309" fill="#a7f3d0" text-anchor="middle">智能转播</text>
    <rect x="240" y="292" width="84" height="26" rx="13" fill="none" stroke="#a855f7" opacity="0.75"/>
    <text x="282" y="309" fill="#e9d5ff" text-anchor="middle">大模型预测</text>
    <rect x="334" y="292" width="96" height="26" rx="13" fill="none" stroke="#f59e0b" opacity="0.75"/>
    <text x="382" y="309" fill="#fcd9a3" text-anchor="middle">体育智能化</text>
  </g>

  <!-- right concept graphic: pitch + AI nodes -->
  <g opacity="0.9">
    <rect x="600" y="120" width="250" height="150" rx="8" fill="none" stroke="#2dd4bf" stroke-width="1.4" opacity="0.6"/>
    <line x1="725" y1="120" x2="725" y2="270" stroke="#2dd4bf" stroke-width="1" opacity="0.45"/>
    <circle cx="725" cy="195" r="24" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.45"/>
    <!-- offside line -->
    <line x1="668" y1="120" x2="668" y2="270" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.85"/>
    <!-- nodes -->
    <circle cx="640" cy="160" r="5" fill="#34d399"/>
    <circle cx="690" cy="150" r="5" fill="#60a5fa"/>
    <circle cx="780" cy="175" r="5" fill="#a855f7"/>
    <circle cx="700" cy="230" r="5" fill="#f59e0b"/>
    <circle cx="800" cy="235" r="5" fill="#34d399"/>
    <line x1="640" y1="160" x2="690" y2="150" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
    <line x1="690" y1="150" x2="780" y2="175" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
    <line x1="700" y1="230" x2="780" y2="175" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
    <line x1="700" y1="230" x2="800" y2="235" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
    <!-- smart ball -->
    <circle cx="668" cy="195" r="9" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>
    <circle cx="668" cy="195" r="2.5" fill="#ef4444"/>
  </g>

  <!-- footer -->
  <line x1="40" y1="344" x2="860" y2="344" stroke="#2a2a5a" stroke-width="1"/>
  <text x="40" y="366" fill="#6b7299" font-size="12">赛场 · 转播 · 球队 · 商业：AI 重构足球的四个维度</text>
  <text x="860" y="366" fill="#6b7299" font-size="12" text-anchor="end">公众号：AI工具observer</text>
</svg>
