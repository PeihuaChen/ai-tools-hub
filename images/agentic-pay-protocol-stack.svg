<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <rect width="1200" height="660" fill="#ffffff"/>

  <text x="600" y="42" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">美国智能体支付协议分层（2026）</text>
  <text x="600" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">六套协议覆盖购买生命周期的不同切片，互补而非竞争；生产部署通常组合 2-3 个</text>

  <!-- Layer 1: discovery / commerce -->
  <rect x="60" y="100" width="1080" height="118" rx="12" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.5"/>
  <text x="84" y="130" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">① 商务层 · 发现与结账</text>
  <text x="84" y="152" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b7280">谁的商品被 AI 看见、购物车与订单怎么流转</text>

  <rect x="470" y="118" width="200" height="82" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="570" y="146" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">ACP</text>
  <text x="570" y="168" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#1d4ed8" text-anchor="middle">OpenAI + Stripe</text>
  <text x="570" y="187" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">结账流程标准</text>

  <rect x="700" y="118" width="200" height="82" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="800" y="146" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0e7490" text-anchor="middle">UCP</text>
  <text x="800" y="168" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#0e7490" text-anchor="middle">Google</text>
  <text x="800" y="187" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">商品可发现性</text>

  <rect x="930" y="118" width="190" height="82" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4"/>
  <text x="1025" y="152" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">商务层仍在洗牌</text>
  <text x="1025" y="174" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">建议双适配、不站队</text>

  <!-- Layer 2: authorization -->
  <rect x="60" y="242" width="1080" height="130" rx="12" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.5"/>
  <text x="84" y="272" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#6d28d9">② 授权层 · 身份与意图取证</text>
  <text x="84" y="294" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b7280">证明「某个真实用户</text>
  <text x="84" y="312" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b7280">授权了这笔具体交易」</text>
  <text x="84" y="340" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b45309">整层已去厂商化</text>

  <rect x="360" y="262" width="250" height="92" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="485" y="290" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">AP2</text>
  <text x="485" y="311" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6d28d9" text-anchor="middle">Google → FIDO Alliance</text>
  <text x="485" y="331" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">加密签名 mandate 授权链</text>
  <text x="485" y="348" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">2026-04-28 捐赠</text>

  <rect x="640" y="262" width="230" height="92" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="755" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Visa TAP</text>
  <text x="755" y="311" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#1d4ed8" text-anchor="middle">→ Intelligent Commerce</text>
  <text x="755" y="331" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">可信 Agent 身份凭证</text>

  <rect x="900" y="262" width="220" height="92" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="1010" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Agent Pay</text>
  <text x="1010" y="311" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">Mastercard</text>
  <text x="1010" y="331" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Agentic Token + 注册代理</text>

  <!-- Layer 3: tool layer -->
  <rect x="60" y="396" width="1080" height="104" rx="12" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.5"/>
  <text x="84" y="426" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#15803d">③ 工具层 · Agent 能力底座</text>
  <text x="84" y="448" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b7280">几乎所有商务协议都跑在这一层上</text>

  <rect x="470" y="412" width="230" height="72" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="585" y="440" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#15803d" text-anchor="middle">MCP</text>
  <text x="585" y="462" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#15803d" text-anchor="middle">Anthropic → Linux Foundation</text>
  <text x="585" y="478" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">2025-12-09 进 AAIF</text>

  <rect x="730" y="412" width="230" height="72" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="845" y="440" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#15803d" text-anchor="middle">A2A</text>
  <text x="845" y="462" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#15803d" text-anchor="middle">Google</text>
  <text x="845" y="478" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">Agent 间协作</text>

  <!-- Layer 4: settlement -->
  <rect x="60" y="524" width="1080" height="104" rx="12" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.5"/>
  <text x="84" y="554" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c">④ 清结算层 · 钱真正流动的地方</text>
  <text x="84" y="576" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b7280">卡网络处理消费零售，链上轨道处理机器微额</text>

  <rect x="560" y="540" width="240" height="72" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="680" y="568" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">卡网络清算</text>
  <text x="680" y="590" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Visa · Mastercard · 收单机构</text>

  <rect x="830" y="540" width="290" height="72" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="975" y="566" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">x402 · USDC on Base</text>
  <text x="975" y="586" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">单笔均值约 0.3 美元，主用于 API 与算力</text>
  <text x="975" y="603" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">2026-07-14 捐给 Linux Foundation</text>

  <!-- connecting arrows -->
  <g stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4" fill="none">
    <line x1="290" y1="218" x2="290" y2="242"/>
    <line x1="290" y1="372" x2="290" y2="396"/>
    <line x1="290" y1="500" x2="290" y2="524"/>
  </g>
  <g fill="#94a3b8">
    <path d="M290 242 l-5 -9 l10 0 z"/>
    <path d="M290 396 l-5 -9 l10 0 z"/>
    <path d="M290 524 l-5 -9 l10 0 z"/>
  </g>
  <text x="304" y="234" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#6b7280">下沉调用</text>
  <text x="304" y="388" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#6b7280">下沉调用</text>
  <text x="304" y="516" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#6b7280">下沉调用</text>

  <text x="1140" y="648" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="end">数据来源：Google Cloud、Stripe、OpenAI、Coinbase、Eco 协议对比（2026）</text>
</svg>
