<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027"/>
      <stop offset="50%" style="stop-color:#203a43"/>
      <stop offset="100%" style="stop-color:#2c5364"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7971e"/>
      <stop offset="100%" style="stop-color:#ffd200"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#coverBg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="100" y1="0" x2="100" y2="383" stroke="#fff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="383" stroke="#fff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="383" stroke="#fff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="383" stroke="#fff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="383" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="383" stroke="#fff" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="383" stroke="#fff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="383" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="900" y2="320" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Decorative glow -->
  <circle cx="700" cy="100" r="150" fill="#667eea" opacity="0.05"/>
  <circle cx="200" cy="350" r="100" fill="#f7971e" opacity="0.04"/>

  <!-- Right side: Agent network visualization -->
  <!-- Central hub -->
  <circle cx="680" cy="191" r="35" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <text x="680" y="186" font-family="Arial, sans-serif" font-size="11" fill="#ffd200" text-anchor="middle">1600</text>
  <text x="680" y="202" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#f0c040" text-anchor="middle">Agents</text>

  <!-- Orbiting agent dots -->
  <circle cx="620" cy="130" r="8" fill="#667eea" opacity="0.8"/>
  <circle cx="750" cy="140" r="6" fill="#4facfe" opacity="0.7"/>
  <circle cx="770" cy="210" r="7" fill="#f093fb" opacity="0.7"/>
  <circle cx="740" cy="270" r="8" fill="#00b894" opacity="0.8"/>
  <circle cx="650" cy="280" r="6" fill="#ff6b35" opacity="0.7"/>
  <circle cx="590" cy="220" r="7" fill="#a8b4ff" opacity="0.7"/>
  <circle cx="600" cy="160" r="5" fill="#ffd200" opacity="0.6"/>
  <circle cx="760" cy="170" r="5" fill="#f5576c" opacity="0.6"/>
  <circle cx="620" cy="250" r="6" fill="#667eea" opacity="0.6"/>
  <circle cx="730" cy="100" r="5" fill="#4facfe" opacity="0.5"/>
  <circle cx="800" cy="250" r="5" fill="#00f2fe" opacity="0.5"/>
  <circle cx="570" cy="190" r="4" fill="#ffd200" opacity="0.5"/>

  <!-- Connection lines to hub -->
  <g stroke="#fff" stroke-width="0.5" opacity="0.15">
    <line x1="680" y1="191" x2="620" y2="130"/>
    <line x1="680" y1="191" x2="750" y2="140"/>
    <line x1="680" y1="191" x2="770" y2="210"/>
    <line x1="680" y1="191" x2="740" y2="270"/>
    <line x1="680" y1="191" x2="650" y2="280"/>
    <line x1="680" y1="191" x2="590" y2="220"/>
    <line x1="680" y1="191" x2="600" y2="160"/>
    <line x1="680" y1="191" x2="760" y2="170"/>
    <line x1="680" y1="191" x2="620" y2="250"/>
    <line x1="680" y1="191" x2="730" y2="100"/>
    <line x1="680" y1="191" x2="800" y2="250"/>
    <line x1="680" y1="191" x2="570" y2="190"/>
  </g>

  <!-- Left side: Title -->
  <text x="55" y="95" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">企业AI Agent</text>
  <text x="55" y="145" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="bold" fill="url(#goldGrad)">部署实战</text>

  <!-- Subtitle -->
  <text x="55" y="190" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#8ab4c8">从 0 到 1600 个 Agent 的落地路径</text>

  <!-- Stage indicators -->
  <g transform="translate(55, 220)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="80" height="28" rx="14" fill="#667eea" opacity="0.25"/>
    <text x="40" y="18" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#a8b4ff" text-anchor="middle">1→10</text>

    <!-- Arrow -->
    <text x="90" y="18" font-family="Arial" font-size="12" fill="#506070">→</text>

    <!-- Stage 2 -->
    <rect x="105" y="0" width="80" height="28" rx="14" fill="#4facfe" opacity="0.25"/>
    <text x="145" y="18" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#7fc4ff" text-anchor="middle">10→100</text>

    <!-- Arrow -->
    <text x="195" y="18" font-family="Arial" font-size="12" fill="#506070">→</text>

    <!-- Stage 3 -->
    <rect x="210" y="0" width="90" height="28" rx="14" fill="#f7971e" opacity="0.25"/>
    <text x="255" y="18" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#ffc060" text-anchor="middle">100→500</text>

    <!-- Arrow -->
    <text x="310" y="18" font-family="Arial" font-size="12" fill="#506070">→</text>

    <!-- Stage 4 -->
    <rect x="325" y="0" width="100" height="28" rx="14" fill="#f5576c" opacity="0.25"/>
    <text x="375" y="18" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#ff8090" text-anchor="middle">500→1600+</text>
  </g>

  <!-- Key data points -->
  <rect x="55" y="275" width="430" height="1" fill="#fff" opacity="0.08"/>

  <text x="55" y="305" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#6a8a9a">📊 IBM调查 · KPMG案例 · Gartner预测 · 成本模型 · 避坑指南</text>

  <!-- Bottom brand -->
  <text x="55" y="345" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#405060">AI知识宇宙 | 2026.06</text>

  <!-- Warning badge -->
  <rect x="55" y="355" width="180" height="20" rx="10" fill="#f5576c" opacity="0.2"/>
  <text x="145" y="369" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#ff8090" text-anchor="middle">⚠️ 40%项目将被取消 — Gartner</text>
</svg>
