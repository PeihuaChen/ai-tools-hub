<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="goalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a88a"/>
    </linearGradient>
    <linearGradient id="planGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="actGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="observeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="verifyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="stopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="loopArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
    <marker id="arrowWhite" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#ffffff" fill-opacity="0.6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowLoop" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">Loop Engineering 典型执行流程</text>
  <text x="450" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.4">Goal → Plan → Act → Observe → Verify → [Loop or Stop]</text>

  <!-- ========== MAIN FLOW ========== -->

  <!-- Step 1: Human defines Goal -->
  <rect x="50" y="90" width="160" height="64" rx="8" fill="#0a0a1e" stroke="url(#goalGrad)" stroke-width="2"/>
  <text x="130" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00d4aa" text-anchor="middle">① 定义目标 Goal</text>
  <text x="130" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.6">可测试的完成条件</text>
  <text x="130" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" opacity="0.4">"所有测试通过 + 覆盖率>80%"</text>

  <!-- Arrow 1→2 -->
  <line x1="210" y1="122" x2="268" y2="122" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Step 2: Plan -->
  <rect x="276" y="90" width="160" height="64" rx="8" fill="#0a0a1e" stroke="url(#planGrad)" stroke-width="2"/>
  <text x="356" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#06b6d4" text-anchor="middle">② 规划 Plan</text>
  <text x="356" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.6">LLM 推理下一步动作</text>
  <text x="356" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" opacity="0.4">分析状态 → 选择工具 → 生成参数</text>

  <!-- Arrow 2→3 -->
  <line x1="436" y1="122" x2="494" y2="122" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Step 3: Act -->
  <rect x="502" y="90" width="160" height="64" rx="8" fill="#0a0a1e" stroke="url(#actGrad)" stroke-width="2"/>
  <text x="582" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">③ 执行 Act</text>
  <text x="582" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.6">调用工具执行动作</text>
  <text x="582" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" opacity="0.4">写代码 / 运行命令 / 调 API</text>

  <!-- Arrow 3→4 -->
  <line x1="662" y1="122" x2="720" y2="122" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Step 4: Observe -->
  <rect x="728" y="90" width="146" height="64" rx="8" fill="#0a0a1e" stroke="url(#observeGrad)" stroke-width="2"/>
  <text x="801" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">④ 观察 Observe</text>
  <text x="801" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.6">收集真实信号</text>
  <text x="801" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" opacity="0.4">编译结果 / 测试输出 / 错误日志</text>

  <!-- Arrow 4→5 (down) -->
  <line x1="801" y1="154" x2="801" y2="196" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Step 5: Verify (decision diamond shape using rect with rotation) -->
  <rect x="718" y="204" width="166" height="64" rx="8" fill="#0a0a1e" stroke="url(#verifyGrad)" stroke-width="2"/>
  <text x="801" y="229" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ef4444" text-anchor="middle">⑤ 验证 Verify</text>
  <text x="801" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.6">是否达成目标？</text>
  <text x="801" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" opacity="0.4">规则检查 / Judge LLM / 确定性断言</text>

  <!-- ========== DECISION BRANCHES ========== -->

  <!-- Branch: YES → Stop (down-right) -->
  <line x1="801" y1="268" x2="801" y2="320" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="816" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#10b981">通过 ✓</text>

  <!-- Stop box -->
  <rect x="728" y="328" width="146" height="56" rx="8" fill="#0a0a1e" stroke="url(#stopGrad)" stroke-width="2"/>
  <text x="801" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">⑥ 输出结果</text>
  <text x="801" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.6">任务完成，交付产物</text>

  <!-- Branch: NO → Loop back to Plan (left arrow) -->
  <path d="M 718 236 L 620 236 L 620 180 L 356 180 L 356 154" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrowLoop)"/>
  <text x="540" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#f59e0b">未通过 ✗ → 重新规划</text>

  <!-- ========== STOP CONDITIONS (bottom left) ========== -->
  <rect x="50" y="200" width="300" height="185" rx="8" fill="#0a0a1e" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text x="70" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ef4444">⚠ 停止条件（任一触发即终止循环）</text>

  <circle cx="75" cy="252" r="4" fill="#ef4444" opacity="0.7"/>
  <text x="88" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" opacity="0.7">迭代次数上限（如 max_iterations = 10）</text>

  <circle cx="75" cy="278" r="4" fill="#f59e0b" opacity="0.7"/>
  <text x="88" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Token 预算耗尽（如 budget = 50K tokens）</text>

  <circle cx="75" cy="304" r="4" fill="#7c3aed" opacity="0.7"/>
  <text x="88" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" opacity="0.7">无进展检测（连续 3 轮输出无变化）</text>

  <circle cx="75" cy="330" r="4" fill="#06b6d4" opacity="0.7"/>
  <text x="88" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" opacity="0.7">人工中断（Human-in-the-Loop 拒绝）</text>

  <circle cx="75" cy="356" r="4" fill="#10b981" opacity="0.7"/>
  <text x="88" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff" opacity="0.7">目标达成（Verifier 判定通过）</text>

  <!-- ========== OBSERVABILITY LAYER (bottom) ========== -->
  <rect x="50" y="420" width="824" height="76" rx="8" fill="#0a0a1e" stroke="#00d4aa" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="70" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#00d4aa" opacity="0.8">🔍 可观测层（Observability Layer）</text>
  <text x="70" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff" opacity="0.5">每一轮循环的 Thought → Action → Observation 全链路记录，用于调试、评测和成本审计</text>
  <text x="70" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">国外：Langfuse / Datadog Bits　｜　国内：Coze Loop（扣子罗盘）/ 阿里云 AgentLoop / Dify Trace</text>

  <!-- ========== LEGEND ========== -->
  <rect x="400" y="320" width="260" height="72" rx="6" fill="#0a0a1e" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="415" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff" opacity="0.5">图例：</text>
  <line x1="415" y1="355" x2="445" y2="355" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="452" y="359" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" opacity="0.5">顺序执行</text>
  <line x1="520" y1="355" x2="550" y2="355" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="557" y="359" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" opacity="0.5">循环回退</text>
  <line x1="415" y1="377" x2="445" y2="377" stroke="#10b981" stroke-width="2"/>
  <text x="452" y="381" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" opacity="0.5">验证通过</text>
  <rect x="520" y="370" width="50" height="14" rx="3" fill="none" stroke="#00d4aa" stroke-opacity="0.3" stroke-dasharray="4 2" stroke-width="1"/>
  <text x="577" y="381" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" opacity="0.5">可观测层</text>
</svg>