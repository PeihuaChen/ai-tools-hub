<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1040" viewBox="0 0 1080 1040">
  <rect width="1080" height="1040" fill="#f7f8fa"/>

  <text x="48" y="92" font-size="56" font-weight="bold" fill="#111827">凭证不进沙箱，出口才替换</text>
  <text x="48" y="178" font-size="34" fill="#4b5563">占位符发往授权端点，才换成真实凭证</text>

  <!-- agent in sandbox -->
  <rect x="48" y="214" width="984" height="170" rx="16" fill="#f8fafc" stroke="#d9e2ec" stroke-width="2"/>
  <text x="76" y="276" font-size="40" font-weight="bold" fill="#111827">沙箱内：Agent</text>
  <text x="76" y="336" font-size="32" fill="#4b5563">只持有占位符，看不到真实密钥</text>

  <!-- arrow agent -> supervisor -->
  <g stroke="#94a3b8" stroke-width="3" fill="#94a3b8">
    <line x1="540" y1="384" x2="540" y2="438"/>
    <polygon points="528,436 552,436 540,454" stroke="none"/>
  </g>

  <!-- supervisor outside sandbox -->
  <rect x="48" y="454" width="984" height="210" rx="16" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="76" y="516" font-size="40" font-weight="bold" fill="#0e7490">沙箱外：Supervisor</text>
  <text x="77" y="576" font-size="32" fill="#4b5563">第一关：网络策略放行该端点</text>
  <text x="77" y="626" font-size="32" fill="#4b5563">第二关：凭证已绑定该端点</text>

  <!-- arrows supervisor -> endpoints -->
  <g stroke="#94a3b8" stroke-width="3" fill="#94a3b8">
    <line x1="288" y1="664" x2="288" y2="726"/>
    <polygon points="276,724 300,724 288,744" stroke="none"/>
    <line x1="792" y1="664" x2="792" y2="726"/>
    <polygon points="780,724 804,724 792,744" stroke="none"/>
  </g>

  <!-- allowed endpoint -->
  <rect x="48" y="744" width="480" height="260" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="76" y="806" font-size="40" font-weight="bold" fill="#15803d">授权端点</text>
  <text x="76" y="866" font-size="32" fill="#4b5563">api.github.com</text>
  <text x="76" y="916" font-size="32" fill="#4b5563">占位符换成真实凭证</text>
  <text x="76" y="966" font-size="32" font-weight="bold" fill="#15803d">请求放行</text>

  <!-- blocked endpoint -->
  <rect x="552" y="744" width="480" height="260" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="580" y="806" font-size="40" font-weight="bold" fill="#b91c1c">其他地址</text>
  <text x="580" y="866" font-size="32" fill="#4b5563">如 attacker.example</text>
  <text x="580" y="916" font-size="32" fill="#4b5563">占位符不会被替换</text>
  <text x="580" y="966" font-size="32" font-weight="bold" fill="#b91c1c">请求被拒绝</text>
</svg>
