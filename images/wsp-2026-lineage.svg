  <text x="418" y="424" fill="#4b5563" font-size="32">反思后改指令</text>
  <text x="418" y="466" fill="#4b5563" font-size="32">不只看标量</text>

  <rect x="732" y="230" width="300" height="256" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
