<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#pbg)"/>

  <text x="60" y="46" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="24" font-weight="bold" fill="#111827">speech-to-speech 管道架构：四段级联，每段可换</text>
  <text x="60" y="72" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#4b5563">四个组件各跑在独立线程，用队列连接；对外只暴露一个 OpenAI Realtime 兼容的 WebSocket 端点</text>

  <!-- 接口层 -->
  <rect x="60" y="96" width="300" height="58" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="210" y="120" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">任意 OpenAI Realtime 客户端</text>
  <text x="210" y="140" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#4b5563">浏览器 / 手机 / Reachy Mini 机器人</text>

  <path d="M360 125 L455 125" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M449 121 L456 125 L449 129" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="458" y="96" width="366" height="58" rx="10" fill="#f0f9ff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="641" y="120" text-anchor="middle" font-family="'Consolas',monospace" font-size="14" font-weight="bold" fill="#0e7490">ws://host:8765/v1/realtime</text>
  <text x="641" y="140" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#4b5563">WebSocket / WebRTC · 改个 base_url 即可迁移</text>

  <rect x="860" y="96" width="280" height="58" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1000" y="120" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">Silero VAD v5 + Smart Turn v3.2</text>
  <text x="1000" y="140" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#4b5563">轮次切分与语义端点检测</text>

  <line x1="60" y1="176" x2="1140" y2="176" stroke="#d9e2ec" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- 四段管道 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif">
    <rect x="60" y="200" width="245" height="64" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="182" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#6d28d9">① VAD</text>
    <text x="182" y="250" text-anchor="middle" font-size="12" fill="#4b5563">检测说话边界与轮次</text>

    <rect x="345" y="200" width="245" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="467" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">② STT</text>
    <text x="467" y="250" text-anchor="middle" font-size="12" fill="#4b5563">转写用户这一轮的话</text>

    <rect x="630" y="200" width="245" height="64" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="752" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#b91c1c">③ LLM</text>
    <text x="752" y="250" text-anchor="middle" font-size="12" fill="#4b5563">流式生成文本与工具调用</text>

    <rect x="915" y="200" width="225" height="64" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="1027" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#b45309">④ TTS</text>
    <text x="1027" y="250" text-anchor="middle" font-size="12" fill="#4b5563">合成音频并流式回传</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M305 232 L340 232"/><path d="M334 228 L341 232 L334 236"/>
    <path d="M590 232 L625 232"/><path d="M619 228 L626 232 L619 236"/>
    <path d="M875 232 L910 232"/><path d="M869 228 L876 232 L869 236"/>
  </g>
  <text x="322" y="288" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10.5" fill="#6b7280">队列</text>
  <text x="607" y="288" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10.5" fill="#6b7280">队列</text>
  <text x="892" y="288" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10.5" fill="#6b7280">队列</text>

  <!-- 可选后端 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif">
    <rect x="60" y="300" width="245" height="196" rx="10" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.2"/>
    <text x="76" y="322" font-size="11.5" font-weight="bold" fill="#6b7280">可选后端</text>
    <text x="76" y="348" font-size="12.5" fill="#6d28d9">● Silero VAD v5（内置默认）</text>
    <text x="76" y="372" font-size="12.5" fill="#111827">● Smart Turn v3.2（默认开）</text>
    <text x="76" y="396" font-size="12.5" fill="#4b5563">● DeepFilterNet 降噪（可选）</text>
    <text x="76" y="428" font-size="11" fill="#b45309">依赖冲突：DeepFilterNet 要</text>
    <text x="76" y="446" font-size="11" fill="#b45309">numpy&lt;2，Pocket TTS 要 numpy&gt;=2</text>
    <text x="76" y="464" font-size="11" fill="#b45309">二者不能共存</text>

    <rect x="345" y="300" width="245" height="196" rx="10" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.2"/>
    <text x="361" y="322" font-size="11.5" font-weight="bold" fill="#6b7280">可选后端</text>
    <text x="361" y="348" font-size="12.5" fill="#1d4ed8">● Parakeet TDT（默认，25 欧语）</text>
    <text x="361" y="372" font-size="12.5" fill="#111827">● Whisper / Faster-Whisper</text>
    <text x="361" y="396" font-size="12.5" fill="#111827">● Whisper-MLX（Apple Silicon）</text>
    <text x="361" y="420" font-size="12.5" fill="#15803d">● Paraformer（FunASR，中文）</text>
    <text x="361" y="444" font-size="12.5" fill="#4b5563">● none（音频直送 LLM）</text>
    <text x="361" y="476" font-size="11" fill="#b45309">默认不支持中文，中文需显式切换</text>

    <rect x="630" y="300" width="245" height="196" rx="10" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.2"/>
    <text x="646" y="322" font-size="11.5" font-weight="bold" fill="#6b7280">可选后端</text>
    <text x="646" y="348" font-size="12.5" fill="#b91c1c">● OpenAI 兼容 API（默认）</text>
    <text x="646" y="372" font-size="12.5" fill="#15803d">● vLLM 自托管</text>
    <text x="646" y="396" font-size="12.5" fill="#15803d">● llama.cpp 自托管</text>
    <text x="646" y="420" font-size="12.5" fill="#111827">● transformers（进程内）</text>
    <text x="646" y="444" font-size="12.5" fill="#111827">● mlx-lm（Apple Silicon）</text>
    <text x="646" y="476" font-size="11" fill="#b45309">默认走远程 gpt-5.4-mini，非全本地</text>

    <rect x="915" y="300" width="225" height="196" rx="10" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.2"/>
    <text x="931" y="322" font-size="11.5" font-weight="bold" fill="#6b7280">可选后端</text>
    <text x="931" y="348" font-size="12.5" fill="#b45309">● Qwen3-TTS（默认，多语言）</text>
    <text x="931" y="372" font-size="12.5" fill="#111827">● Kokoro-82M</text>
    <text x="931" y="396" font-size="12.5" fill="#111827">● Pocket TTS（声音克隆）</text>
    <text x="931" y="420" font-size="12.5" fill="#111827">● ChatTTS（中英）</text>
    <text x="931" y="444" font-size="12.5" fill="#111827">● MMS TTS</text>
    <text x="931" y="476" font-size="11" fill="#b91c1c">CosyVoice 不在内置列表，需自写</text>
  </g>

  <!-- 底部默认栈 -->
  <rect x="60" y="518" width="1080" height="76" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="80" y="544" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">开箱默认栈</text>
  <text x="80" y="568" font-family="'Consolas',monospace" font-size="12.5" fill="#111827">Silero VAD v5  +  Smart Turn v3.2  →  Parakeet TDT 0.6B v3  →  gpt-5.4-mini（远程）  →  Qwen3-TTS 12Hz 1.7B（GGML）</text>
  <text x="80" y="586" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#6b7280">三条命令即可跑通：pip install speech-to-speech → export OPENAI_API_KEY=... → speech-to-speech serve</text>
</svg>
