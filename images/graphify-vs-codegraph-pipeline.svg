  <text x="222" y="634" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#991b1b">消耗模型 token 的环节</text>
  <rect x="400" y="622" width="14" height="14" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="422" y="634" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1e40af">确定性解析</text>
  <text x="1160" y="634" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">数据来源：两项目官方 README / BENCHMARKS.md / issue，2026-07-28</text>
