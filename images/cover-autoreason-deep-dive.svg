<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#4a90d9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4a90d9;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c8e0ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#4a90d9" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#4a90d9" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#4a90d9" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#4a90d9" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#4a90d9" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#4a90d9" stroke-width="1"/>
  </g>

  <!-- Decorative circles (abstract nodes) -->
  <circle cx="150" cy="200" r="60" fill="none" stroke="#2ecc71" stroke-width="2" opacity="0.3"/>
  <circle cx="150" cy="200" r="8" fill="#2ecc71" opacity="0.7"/>
  <text x="150" y="205" text-anchor="middle" fill="#2ecc71" font-size="14" font-weight="bold" opacity="0.9">A</text>

  <circle cx="150" cy="400" r="60" fill="none" stroke="#f39c12" stroke-width="2" opacity="0.3"/>
  <circle cx="150" cy="400" r="8" fill="#f39c12" opacity="0.7"/>
  <text x="150" y="405" text-anchor="middle" fill="#f39c12" font-size="14" font-weight="bold" opacity="0.9">B</text>

  <circle cx="300" cy="300" r="60" fill="none" stroke="#9b59b6" stroke-width="2" opacity="0.3"/>
  <circle cx="300" cy="300" r="8" fill="#9b59b6" opacity="0.7"/>
  <text x="300" y="305" text-anchor="middle" fill="#9b59b6" font-size="14" font-weight="bold" opacity="0.9">AB</text>

  <!-- Connecting lines -->
  <line x1="200" y1="220" x2="260" y2="280" stroke="#2ecc71" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,3"/>
  <line x1="200" y1="380" x2="260" y2="320" stroke="#f39c12" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,3"/>

  <!-- Judge panel icon (right side) -->
  <circle cx="1050" cy="300" r="80" fill="none" stroke="#4a90d9" stroke-width="2" opacity="0.3"/>
  <text x="1050" y="290" text-anchor="middle" fill="#4a90d9" font-size="40" opacity="0.8">⚖️</text>
  <text x="1050" y="330" text-anchor="middle" fill="#6bb5ff" font-size="12" opacity="0.7">BORDA COUNT</text>

  <!-- Arrow from AB to Judge -->
  <path d="M360 300 Q600 300 970 300" fill="none" stroke="#4a90d9" stroke-width="1.5" opacity="0.3" stroke-dasharray="6,4"/>

  <!-- Convergence indicator -->
  <rect x="1000" y="420" width="100" height="30" rx="15" fill="#2ecc71" opacity="0.2" stroke="#2ecc71" stroke-width="1"/>
  <text x="1050" y="440" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="bold">CONVERGE</text>

  <!-- Top decorative line -->
  <rect x="80" y="80" width="400" height="2" fill="url(#glowLine)" opacity="0.6"/>

  <!-- Nous Research badge -->
  <rect x="80" y="100" width="180" height="28" rx="14" fill="rgba(74,144,217,0.15)" stroke="#4a90d9" stroke-width="1" opacity="0.8"/>
  <text x="170" y="119" text-anchor="middle" fill="#6bb5ff" font-size="13" font-weight="600">NOUS RESEARCH</text>

  <!-- Main title -->
  <text x="600" y="220" text-anchor="middle" fill="url(#titleGrad)" font-size="52" font-weight="800" filter="url(#glow)">Autoreason</text>
  <text x="600" y="290" text-anchor="middle" fill="#e0e0e0" font-size="28" font-weight="300">Self-Refinement That Knows</text>
  <text x="600" y="335" text-anchor="middle" fill="#e0e0e0" font-size="28" font-weight="300">When to Stop</text>

  <!-- Chinese subtitle -->
  <text x="600" y="400" text-anchor="middle" fill="#f39c12" font-size="22" font-weight="600">自我精炼终于学会了「适可而止」</text>

  <!-- Key insight box -->
  <rect x="380" y="430" width="440" height="50" rx="8" fill="rgba(46,204,113,0.1)" stroke="#2ecc71" stroke-width="1" opacity="0.8"/>
  <text x="600" y="452" text-anchor="middle" fill="#2ecc71" font-size="13">🏆 Haiku 3.5 + Autoreason = 42/42 完美 Borda 分数</text>
  <text x="600" y="470" text-anchor="middle" fill="#888" font-size="11">标准精炼方法在同一模型上反而退化至低于单次生成</text>

  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="rgba(0,0,0,0.4)"/>
  <rect x="0" y="558" width="1200" height="2" fill="url(#glowLine)" opacity="0.5"/>

  <!-- Bottom text -->
  <text x="80" y="598" fill="#888" font-size="14">AI知识宇宙 · 论文深度解读</text>
  <text x="1120" y="598" text-anchor="end" fill="#666" font-size="13">2026.05.26</text>

  <!-- Tags -->
  <rect x="400" y="580" width="80" height="24" rx="12" fill="rgba(74,144,217,0.2)" stroke="#4a90d9" stroke-width="0.5"/>
  <text x="440" y="596" text-anchor="middle" fill="#6bb5ff" font-size="11">AI Agent</text>

  <rect x="500" y="580" width="100" height="24" rx="12" fill="rgba(243,156,18,0.2)" stroke="#f39c12" stroke-width="0.5"/>
  <text x="550" y="596" text-anchor="middle" fill="#f39c12" font-size="11">论文解读</text>

  <rect x="620" y="580" width="120" height="24" rx="12" fill="rgba(155,89,182,0.2)" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="680" y="596" text-anchor="middle" fill="#9b59b6" font-size="11">Hermes Agent</text>
</svg>