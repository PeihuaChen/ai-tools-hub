<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="33%" stop-color="#7c3aed"/>
      <stop offset="66%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bottomBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="33%" stop-color="#f472b6"/>
      <stop offset="66%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="383"/>
    <line x1="200" y1="0" x2="200" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="400" y1="0" x2="400" y2="383"/>
    <line x1="500" y1="0" x2="500" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="700" y1="0" x2="700" y2="383"/>
    <line x1="800" y1="0" x2="800" y2="383"/>
  </g>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topBar)"/>

  <!-- Bottom gradient bar -->
  <rect x="0" y="379" width="900" height="4" fill="url(#bottomBar)"/>

  <!-- Top-left label box -->
  <rect x="28" y="22" width="240" height="26" rx="4" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
  <text x="40" y="40" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.9">AI 工具生态 · Agent-native CLI</text>

  <!-- Year badge top-right -->
  <rect x="840" y="20" width="40" height="40" rx="6" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
  <text x="860" y="47" font-family="monospace" font-size="18" fill="#fbbf24" text-anchor="middle" font-weight="bold" opacity="0.8">26</text>

  <!-- Main title -->
  <text x="40" y="100" font-family="system-ui, sans-serif" font-size="29" fill="#ffffff" font-weight="bold">当软件的下一代用户是 AI</text>
  <text x="40" y="140" font-family="system-ui, sans-serif" font-size="18" fill="url(#subtitleGrad)">CLI-Anything 与 Agent 工具市场的未来</text>

  <!-- Key highlights -->
  <text x="40" y="180" font-family="monospace" font-size="12" fill="#4ade80">▸ 45.2K Star | 4个月 | 40+ 专业软件一键 Agent 化</text>
  <text x="40" y="202" font-family="monospace" font-size="12" fill="#fbbf24">▸ 7 阶段自动流水线：源码分析 → CLI 生成 → 测试 → 发布</text>
  <text x="40" y="224" font-family="monospace" font-size="12" fill="#f472b6">▸ CLI-Hub 生态市场 + SKILL.md 自动发现 + 多 Agent 平台兼容</text>

  <!-- Right side: conceptual diagram -->
  <!-- Software boxes -->
  <rect x="620" y="90" width="80" height="30" rx="4" fill="none" stroke="#6366f1" stroke-width="1.2"/>
  <text x="660" y="110" font-family="monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">Blender</text>

  <rect x="720" y="90" width="80" height="30" rx="4" fill="none" stroke="#6366f1" stroke-width="1.2"/>
  <text x="760" y="110" font-family="monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">GIMP</text>

  <rect x="620" y="130" width="80" height="30" rx="4" fill="none" stroke="#6366f1" stroke-width="1.2"/>
  <text x="660" y="150" font-family="monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">LibreOffice</text>

  <rect x="720" y="130" width="80" height="30" rx="4" fill="none" stroke="#6366f1" stroke-width="1.2"/>
  <text x="760" y="150" font-family="monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">OBS</text>

  <!-- Arrow down -->
  <line x1="700" y1="168" x2="700" y2="185" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="700" y="182" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">CLI-Anything</text>

  <!-- CLI output box -->
  <rect x="640" y="195" width="120" height="32" rx="4" fill="#1e1b4b" stroke="#00d4ff" stroke-width="1.2"/>
  <text x="700" y="215" font-family="monospace" font-size="10" fill="#00d4ff" text-anchor="middle">Agent-native CLI</text>

  <!-- Arrow down to Agent -->
  <line x1="700" y1="230" x2="700" y2="248" stroke="#00d4ff" stroke-width="1.2"/>

  <!-- Agent box -->
  <rect x="650" y="250" width="100" height="30" rx="14" fill="none" stroke="#4ade80" stroke-width="1.2"/>
  <text x="700" y="270" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">🤖 AI Agent</text>

  <!-- Tag pills -->
  <rect x="40" y="260" width="75" height="22" rx="11" fill="none" stroke="#6366f1" stroke-width="1"/>
  <text x="77" y="275" font-family="monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">CLI-Hub</text>

  <rect x="125" y="260" width="80" height="22" rx="11" fill="none" stroke="#7c3aed" stroke-width="1"/>
  <text x="165" y="275" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">SKILL.md</text>

  <rect x="215" y="260" width="90" height="22" rx="11" fill="none" stroke="#f472b6" stroke-width="1"/>
  <text x="260" y="275" font-family="monospace" font-size="10" fill="#f9a8d4" text-anchor="middle">Claude Code</text>

  <rect x="315" y="260" width="72" height="22" rx="11" fill="none" stroke="#fbbf24" stroke-width="1"/>
  <text x="351" y="275" font-family="monospace" font-size="10" fill="#fde68a" text-anchor="middle">OpenClaw</text>

  <rect x="397" y="260" width="60" height="22" rx="11" fill="none" stroke="#4ade80" stroke-width="1"/>
  <text x="427" y="275" font-family="monospace" font-size="10" fill="#86efac" text-anchor="middle">Codex</text>

  <rect x="467" y="260" width="70" height="22" rx="11" fill="none" stroke="#00d4ff" stroke-width="1"/>
  <text x="502" y="275" font-family="monospace" font-size="10" fill="#67e8f9" text-anchor="middle">HKUDS</text>

  <!-- Separator line -->
  <line x1="40" y1="305" x2="860" y2="305" stroke="#ffffff" stroke-width="0.3" opacity="0.3"/>

  <!-- Bottom section hints -->
  <text x="40" y="330" font-family="monospace" font-size="11" fill="#94a3b8">目录 ▸ Agent操控软件困局 / 7阶段流水线 / CLI-Hub生态 / CLI vs MCP / 场景全览</text>

  <!-- Watermark -->
  <text x="40" y="360" font-family="monospace" font-size="10" fill="#475569" opacity="0.5">virxact.com · AI 工具生态深度观察</text>
</svg>
