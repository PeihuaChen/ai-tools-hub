<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="50%" stop-color="#161638"/>
      <stop offset="100%" stop-color="#0d0d25"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/><line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="180" y1="0" x2="180" y2="383"/><line x1="360" y1="0" x2="360" y2="383"/>
    <line x1="540" y1="0" x2="540" y2="383"/><line x1="720" y1="0" x2="720" y2="383"/>
  </g>

  <!-- Top / bottom accent -->
  <rect x="0" y="0" width="300" height="4" fill="url(#cyan)"/>
  <rect x="300" y="0" width="300" height="4" fill="url(#pink)"/>
  <rect x="600" y="0" width="300" height="4" fill="url(#amber)"/>
  <rect x="0" y="379" width="300" height="4" fill="url(#cyan)"/>
  <rect x="300" y="379" width="300" height="4" fill="url(#pink)"/>
  <rect x="600" y="379" width="300" height="4" fill="url(#amber)"/>

  <!-- Right: directed script lines + waveform -->
  <g transform="translate(590, 70)">
    <rect x="0" y="0" width="230" height="200" rx="12" fill="#1e1e3a" stroke="url(#cyan)" stroke-width="2.5"/>

    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="194" height="32" rx="6" fill="#1a1a2e"/>
      <circle cx="18" cy="16" r="7" fill="#22d3ee"/>
      <text x="34" y="20" font-family="'Courier New',monospace" font-size="12" fill="#e2e8f0">[breathless]</text>
    </g>
    <g transform="translate(18, 58)">
      <rect x="0" y="0" width="194" height="32" rx="6" fill="#1a1a2e"/>
      <circle cx="18" cy="16" r="7" fill="#ec4899"/>
      <text x="34" y="20" font-family="'Courier New',monospace" font-size="12" fill="#e2e8f0">&lt;whisper&gt;…&lt;/whisper&gt;</text>
    </g>
    <g transform="translate(18, 98)">
      <rect x="0" y="0" width="194" height="32" rx="6" fill="#1a1a2e"/>
      <circle cx="18" cy="16" r="7" fill="#f59e0b"/>
      <text x="34" y="20" font-family="'Courier New',monospace" font-size="12" fill="#e2e8f0">[shaky breath]</text>
    </g>

    <!-- Waveform -->
    <g transform="translate(18, 142)" stroke-width="4" stroke-linecap="round">
      <g stroke="#22d3ee">
        <line x1="4" y1="14" x2="4" y2="26"/><line x1="16" y1="8" x2="16" y2="32"/><line x1="28" y1="4" x2="28" y2="36"/>
        <line x1="40" y1="10" x2="40" y2="30"/><line x1="52" y1="6" x2="52" y2="34"/>
      </g>
      <g stroke="#ec4899">
        <line x1="70" y1="16" x2="70" y2="24"/><line x1="82" y1="14" x2="82" y2="26"/><line x1="94" y1="17" x2="94" y2="23"/>
        <line x1="106" y1="15" x2="106" y2="25"/><line x1="118" y1="17" x2="118" y2="23"/>
      </g>
      <g stroke="#f59e0b">
        <line x1="136" y1="10" x2="136" y2="30"/><line x1="148" y1="4" x2="148" y2="36"/><line x1="160" y1="12" x2="160" y2="28"/>
        <line x1="172" y1="7" x2="172" y2="33"/><line x1="184" y1="14" x2="184" y2="26"/>
      </g>
    </g>
  </g>

  <!-- Tag -->
  <g transform="translate(50, 28)">
    <rect x="0" y="0" width="210" height="30" rx="4" fill="#1a1020" stroke="url(#cyan)" stroke-width="1"/>
    <text x="105" y="20" font-family="'Courier New','Microsoft YaHei',monospace" font-weight="bold" font-size="14" fill="#22d3ee" text-anchor="middle">AI 行业观察 · 语音合成</text>
  </g>

  <text x="50" y="108" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="bold" fill="#ffffff">Drama 3 按词调情绪</text>
  <text x="50" y="148" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="bold" fill="url(#cyan)">发音榜第一 · 商用线 50 万美元</text>

  <!-- Key highlights -->
  <g transform="translate(50, 178)">
    <text x="0" y="0" font-family="'Microsoft YaHei','Courier New',monospace" font-size="13" fill="#22d3ee">35B MoE · 每 token 仅激活 3B · 83 种语言</text>
    <text x="0" y="22" font-family="'Microsoft YaHei','Courier New',monospace" font-size="13" fill="#ec4899">方括号写导演指令 · 成对标签限定到词</text>
    <text x="0" y="44" font-family="'Microsoft YaHei','Courier New',monospace" font-size="13" fill="#f59e0b">年收入低于 50 万美元可免费商用</text>
  </g>

  <!-- Tags -->
  <g transform="translate(50, 248)">
    <rect x="0" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#22d3ee" stroke-width="0.8"/>
    <text x="34" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#a5f3fc" text-anchor="middle">开放权重</text>

    <rect x="76" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#ec4899" stroke-width="0.8"/>
    <text x="110" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#f9a8d4" text-anchor="middle">词级控制</text>

    <rect x="152" y="0" width="76" height="24" rx="12" fill="#1e1e3a" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="190" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">16 角色同台</text>

    <rect x="236" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="270" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#fde047" text-anchor="middle">发音榜首</text>

    <rect x="312" y="0" width="68" height="24" rx="12" fill="#1e1e3a" stroke="#10b981" stroke-width="0.8"/>
    <text x="346" y="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">本地部署</text>
  </g>

  <!-- Divider -->
  <rect x="50" y="290" width="460" height="1" fill="#fff" opacity="0.06"/>
  <text x="50" y="315" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#4a4f70">指令写法 · 榜单解读 · 许可边界 · 部署门槛 · 落地场景</text>
  <text x="50" y="348" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10" fill="#33385a">公众号 - 最新AI知识宇宙 | 2026.10</text>

  <!-- Year badge -->
  <g transform="translate(835, 30)">
    <rect x="0" y="0" width="40" height="28" rx="4" fill="none" stroke="url(#cyan)" stroke-width="1.5"/>
    <text x="20" y="19" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#22d3ee" text-anchor="middle">26</text>
  </g>
</svg>
