  <text x="726" y="514" text-anchor="middle" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" fill="#0e7490">离线整合（空闲期）</text>
  <text x="726" y="542" text-anchor="middle" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#6b7280">轴五代价在此（长期漂移风险）</text>

  <rect x="820" y="494" width="280" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="836" y="513" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">唯一不给报错信号的一条</text>
  <text x="836" y="533" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#b91c1c">轴五的退化是静默的，必须做效用监控</text>

  <line x1="40" y1="596" x2="1120" y2="596" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="620" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">注：数字分别来自 Recirculation（arXiv 2608.17981）、ACE（ICLR 2026）、TT-SI（ACL 2026 Findings）、TTT for Few-Shot Learning（ICML 2025）、Multi-Agent Reasoning（arXiv 2605.01566）。</text>
  <text x="40" y="640" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">跨论文比较受评测设置影响，仅作量级参考。</text>
