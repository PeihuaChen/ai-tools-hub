  <line x1="424" y1="509" x2="466" y2="509" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M464 505 L472 509 L464 513 Z" fill="#94a3b8"/>

  <rect x="476" y="494" width="128" height="30" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
