  <text x="540" y="542" text-anchor="middle" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#6b7280">轴四代价在此（需回滚方案）</text>

  <line x1="604" y1="509" x2="646" y2="509" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4"/>
  <path d="M644 505 L652 509 L644 513 Z" fill="#94a3b8"/>

