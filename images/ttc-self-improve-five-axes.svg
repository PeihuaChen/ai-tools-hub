  <text x="188" y="542" text-anchor="middle" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#6b7280">轴三代价在此（一次性）</text>

  <line x1="244" y1="509" x2="286" y2="509" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M284 505 L292 509 L284 513 Z" fill="#94a3b8"/>

