<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="botbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="383" rx="12" fill="url(#bg)"/>
  <rect width="900" height="383" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="381" rx="12" fill="none" stroke="#334155" stroke-width="2"/>
  <rect width="900" height="4" fill="url(#topbar)"/>
  <rect y="379" width="900" height="4" fill="url(#botbar)"/>

  <!-- tag box -->
  <rect x="40" y="34" width="248" height="30" rx="6" fill="#1e1e44" stroke="#8b5cf6" stroke-opacity="0.6"/>
  <text x="56" y="54" fill="#c4b5fd" font-size="14" font-weight="600">AI 行业观察 · Scaling Law</text>

  <!-- year badge -->
  <circle cx="840" cy="50" r="26" fill="#1e1e44" stroke="#ec4899" stroke-opacity="0.7"/>
  <text x="840" y="58" fill="#f9a8d4" font-size="22" font-weight="700" text-anchor="middle">26</text>

  <!-- main title -->
  <text x="40" y="125" fill="#ffffff" font-size="31" font-weight="700">从 Scaling Law 瓶颈到 ASI</text>
  <text x="40" y="162" fill="url(#sub)" font-size="18" font-weight="600">五种突破路线的有效性与未来展望</text>

  <!-- highlights -->
  <text x="40" y="205" fill="#60a5fa" font-size="13">▸ 预训练撞墙 · 三堵墙：数据 / 算力 / 能力</text>
  <text x="40" y="229" fill="#34d399" font-size="13">▸ 推理时计算 · RL 扩展 · 合成数据</text>
  <text x="40" y="253" fill="#f472b6" font-size="13">▸ 新架构 / 持续学习 · 多智能体涌现 → AGI</text>

  <!-- concept diagram: scaling curve flattening -->
  <g transform="translate(560,180)">
    <line x1="0" y1="120" x2="300" y2="120" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="120" x2="0" y2="0" stroke="#475569" stroke-width="1.5"/>
    <path d="M0 118 C 60 60, 110 30, 170 26 C 220 23, 260 22, 300 21" fill="none" stroke="url(#curve)" stroke-width="3"/>
    <circle cx="170" cy="26" r="4" fill="#ec4899"/>
    <path d="M170 26 q 50 -40 110 -50" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="5 4"/>
    <circle cx="280" cy="-24" r="4" fill="#22d3ee"/>
    <text x="120" y="-2" fill="#94a3b8" font-size="11">瓶颈点</text>
    <text x="200" y="-30" fill="#22d3ee" font-size="11">新轴线</text>
  </g>

  <!-- tag pills -->
  <g font-size="12">
    <rect x="40" y="296" width="86" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-opacity="0.7"/>
    <text x="83" y="313" fill="#93c5fd" text-anchor="middle">推理时计算</text>
    <rect x="134" y="296" width="64" height="26" rx="13" fill="none" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <text x="166" y="313" fill="#c4b5fd" text-anchor="middle">RL扩展</text>
    <rect x="206" y="296" width="76" height="26" rx="13" fill="none" stroke="#10b981" stroke-opacity="0.7"/>
    <text x="244" y="313" fill="#6ee7b7" text-anchor="middle">合成数据</text>
    <rect x="290" y="296" width="88" height="26" rx="13" fill="none" stroke="#ec4899" stroke-opacity="0.7"/>
    <text x="334" y="313" fill="#f9a8d4" text-anchor="middle">Agentic AI</text>
    <rect x="386" y="296" width="64" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="418" y="313" fill="#67e8f9" text-anchor="middle">AGI/ASI</text>
  </g>

  <!-- footer -->
  <line x1="40" y1="344" x2="860" y2="344" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="40" y="366" fill="#64748b" font-size="12">深度解析 · 八大章节 · 一张清醒的判断地图</text>
  <text x="860" y="366" fill="#475569" font-size="12" text-anchor="end">AI Tools Hub</text>
</svg>
