<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920">
  <!-- 满幅不透明浅底 -->
  <rect width="1080" height="920" fill="#f7f8fa"/>

  <!-- 主标题 -->
  <text x="48" y="80" font-size="56" font-weight="bold" fill="#111827">CrewAI 两层抽象</text>
  <text x="48" y="132" font-size="34" fill="#4b5563">自主协作的 Crews + 确定性编排的 Flows</text>

  <!-- ============ 上层：Crews ============ -->
  <rect x="48" y="176" width="984" height="264" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="82" y="234" font-size="44" font-weight="bold" fill="#1d4ed8">Crews · 自主协作</text>
  <text x="82" y="282" font-size="32" fill="#4b5563">给角色和工具，让智能体自己商量着把活干完</text>

  <!-- 三个 Agent 卡片：列宽计算 -->
  <!-- 可用宽 = 984 - 2*40 = 904；列间距 32；列宽 = (904 - 2*32)/3 = 280 -->
  <!-- 第一列 x = 48+40 = 88；第二列 = 88+280+32 = 400；第三列 = 400+280+32 = 712 -->
  <g>
    <rect x="88" y="320" width="280" height="96" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
    <text x="116" y="366" font-size="34" font-weight="bold" fill="#1d4ed8">分析师</text>
    <text x="116" y="402" font-size="30" fill="#4b5563">调研 + 搜索工具</text>
  </g>
  <g>
    <rect x="400" y="320" width="280" height="96" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
    <text x="428" y="366" font-size="34" font-weight="bold" fill="#1d4ed8">撰稿人</text>
    <text x="428" y="402" font-size="30" fill="#4b5563">写作 + 读文件</text>
  </g>
  <g>
    <rect x="712" y="320" width="280" height="96" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
    <text x="740" y="366" font-size="34" font-weight="bold" fill="#1d4ed8">审校员</text>
    <text x="740" y="402" font-size="30" fill="#4b5563">校对 + 调 API</text>
  </g>

  <!-- 连接线 上层到下层 -->
  <line x1="540" y1="440" x2="540" y2="500" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8"/>
  <text x="560" y="478" font-size="30" fill="#6b7280">可嵌入</text>

  <!-- ============ 下层：Flows ============ -->
  <rect x="48" y="500" width="984" height="300" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="82" y="558" font-size="44" font-weight="bold" fill="#15803d">Flows · 确定性编排</text>
  <text x="82" y="606" font-size="32" fill="#4b5563">事件驱动，状态显式传递，可暂停可恢复</text>

  <!-- 四个步骤块 用箭头串 -->
  <!-- 可用宽 = 984-2*40 = 904；四块间三箭头，块宽 190，间隙 = (904-4*190)/3 = 48 -->
  <!-- x: 88, 88+190+48=326, 326+190+48=564, 564+190+48=802 -->
  <g>
    <rect x="88" y="648" width="190" height="112" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.8"/>
    <text x="183" y="700" font-size="32" font-weight="bold" fill="#15803d" text-anchor="middle">触发</text>
    <text x="183" y="738" font-size="30" fill="#4b5563" text-anchor="middle">事件启动</text>
  </g>
  <path d="M282 704 L322 704" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="326" y="648" width="190" height="112" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.8"/>
    <text x="421" y="700" font-size="32" font-weight="bold" fill="#15803d" text-anchor="middle">调 Crew</text>
    <text x="421" y="738" font-size="30" fill="#4b5563" text-anchor="middle">自主环节</text>
  </g>
  <path d="M520 704 L560 704" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="564" y="648" width="190" height="112" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.8"/>
    <text x="659" y="700" font-size="32" font-weight="bold" fill="#15803d" text-anchor="middle">人工介入</text>
    <text x="659" y="738" font-size="30" fill="#4b5563" text-anchor="middle">按需确认</text>
  </g>
  <path d="M758 704 L798 704" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="802" y="648" width="190" height="112" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.8"/>
    <text x="897" y="700" font-size="32" font-weight="bold" fill="#15803d" text-anchor="middle">输出</text>
    <text x="897" y="738" font-size="30" fill="#4b5563" text-anchor="middle">写回状态</text>
  </g>

  <!-- 底部执行模式提示 -->
  <text x="48" y="866" font-size="30" fill="#b45309">默认用顺序模式：便宜、可预测、好调试</text>
  <text x="48" y="906" font-size="30" fill="#b91c1c">分层模式每次委派多绕 Manager 一趟，成本翻倍</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
