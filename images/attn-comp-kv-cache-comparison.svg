<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="1100" height="560" fill="#ffffff"/>
<text x="40" y="42" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700">KV Cache 相对体量示意：MHA / GQA / MQA / MLA</text>
<text x="40" y="68" fill="#4b5563" font-family="Microsoft YaHei, sans-serif" font-size="13">以 MHA 为基线（100%），数值为量级示意，实际压缩比随分组比例与潜空间维度变化</text>

<g font-family="Microsoft YaHei, sans-serif">
<!-- baseline grid -->
<line x1="120" y1="480" x2="1020" y2="480" stroke="#d9e2ec" stroke-width="1.5"/>
<line x1="120" y1="120" x2="120" y2="480" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="105" y="125" text-anchor="end" fill="#9ca3af" font-size="11">100%</text>
<text x="105" y="305" text-anchor="end" fill="#9ca3af" font-size="11">50%</text>
<text x="105" y="480" text-anchor="end" fill="#9ca3af" font-size="11">0%</text>
<line x1="120" y1="300" x2="1020" y2="300" stroke="#eef2f7" stroke-width="1"/>

<!-- MHA bar 100% -->
<rect x="190" y="120" width="130" height="360" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="255" y="105" text-anchor="middle" fill="#1d4ed8" font-size="16" font-weight="700">100%</text>
<text x="255" y="510" text-anchor="middle" fill="#111827" font-size="14" font-weight="700">MHA</text>
<text x="255" y="528" text-anchor="middle" fill="#6b7280" font-size="10">每头独立 K/V</text>

<!-- GQA 8:1 -> 12.5% -->
<rect x="400" y="435" width="130" height="45" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="465" y="420" text-anchor="middle" fill="#1d4ed8" font-size="16" font-weight="700">~12-25%</text>
<text x="465" y="510" text-anchor="middle" fill="#111827" font-size="14" font-weight="700">GQA</text>
<text x="465" y="528" text-anchor="middle" fill="#6b7280" font-size="10">8:1 ~ 4:1 分组比例</text>

<!-- MQA -> ~3% -->
<rect x="610" y="468" width="130" height="12" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="675" y="453" text-anchor="middle" fill="#15803d" font-size="16" font-weight="700">~3%</text>
<text x="675" y="510" text-anchor="middle" fill="#111827" font-size="14" font-weight="700">MQA</text>
<text x="675" y="528" text-anchor="middle" fill="#6b7280" font-size="10">单一共享 KV 头</text>

<!-- MLA -> ~10%, note quality retained -->
<rect x="820" y="444" width="130" height="36" rx="6" fill="#fdf4ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="885" y="429" text-anchor="middle" fill="#6d28d9" font-size="16" font-weight="700">~10%</text>
<text x="885" y="510" text-anchor="middle" fill="#111827" font-size="14" font-weight="700">MLA</text>
<text x="885" y="528" text-anchor="middle" fill="#6b7280" font-size="10">低秩潜空间压缩</text>
</g>

<rect x="820" y="140" width="200" height="46" rx="8" fill="#fdf4ff" stroke="#6d28d9" stroke-width="1"/>
<text x="920" y="160" text-anchor="middle" fill="#6d28d9" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="700">DeepSeek-V2 消融：</text>
<text x="920" y="177" text-anchor="middle" fill="#6d28d9" font-family="Microsoft YaHei, sans-serif" font-size="11">同压缩比下质量优于 GQA</text>
<path d="M885 186 L885 300" fill="none" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4"/>

<text x="1020" y="550" text-anchor="end" fill="#9ca3af" font-family="Arial" font-size="10">图示为量级示意，非精确测量值</text>
</svg>
