<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="vbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0000"/>
      <stop offset="50%" style="stop-color:#2d0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff416c"/>
      <stop offset="100%" style="stop-color:#ff4b2b"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f260"/>
      <stop offset="100%" style="stop-color:#0575e6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#vbBg)"/>

  <!-- Code rain effect (right side) -->
  <g opacity="0.06" font-family="Courier New, monospace" font-size="11" fill="#00ff60">
    <text x="580" y="30">if auth == nil {</text>
    <text x="620" y="55">return true</text>
    <text x="590" y="80">} // TODO: fix</text>
    <text x="640" y="105">db.password=""</text>
    <text x="600" y="130">cors: "*"</text>
    <text x="650" y="155">admin: true</text>
    <text x="610" y="180">key = "sk-..."</text>
    <text x="570" y="205">export PORT=80</text>
    <text x="630" y="230">npm i fak-pkg</text>
    <text x="590" y="255">chmod 777 /</text>
    <text x="640" y="280">token.expose()</text>
    <text x="600" y="305">// no validate</text>
    <text x="560" y="330">ssl: false</text>
    <text x="620" y="355">debug: true</text>
  </g>

  <!-- Glitch/crack lines -->
  <g stroke="url(#dangerGrad)" stroke-width="1.5" opacity="0.3">
    <line x1="500" y1="0" x2="520" y2="60"/>
    <line x1="520" y1="60" x2="510" y2="120"/>
    <line x1="510" y1="120" x2="530" y2="180"/>
    <line x1="530" y1="180" x2="515" y2="240"/>
    <line x1="515" y1="240" x2="535" y2="300"/>
    <line x1="535" y1="300" x2="525" y2="383"/>
  </g>

  <!-- Warning glow -->
  <circle cx="750" cy="100" r="80" fill="#ff416c" opacity="0.04"/>
  <circle cx="650" cy="300" r="60" fill="#ff4b2b" opacity="0.03"/>

  <!-- Left side: Title -->
  <text x="50" y="80" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Vibe Coding的</text>
  <text x="50" y="125" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="url(#dangerGrad)">隐藏代价</text>

  <!-- Three shocking stats -->
  <g transform="translate(50, 155)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="145" height="50" rx="6" fill="#ff416c" opacity="0.12"/>
    <text x="72" y="22" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#ff6b6b" text-anchor="middle">2000+</text>
    <text x="72" y="40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#ff9090" text-anchor="middle">裸奔应用</text>

    <!-- Stat 2 -->
    <rect x="155" y="0" width="145" height="50" rx="6" fill="#ff4b2b" opacity="0.12"/>
    <text x="227" y="22" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#ff6b6b" text-anchor="middle">630万</text>
    <text x="227" y="40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#ff9090" text-anchor="middle">丢失订单</text>

    <!-- Stat 3 -->
    <rect x="310" y="0" width="145" height="50" rx="6" fill="#ff416c" opacity="0.12"/>
    <text x="382" y="22" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#ff6b6b" text-anchor="middle">322%</text>
    <text x="382" y="40" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#ff9090" text-anchor="middle">权限漏洞↑</text>
  </g>

  <!-- Subtitle -->
  <text x="50" y="245" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#8a7070">62%的AI生成代码存在漏洞 · 密钥泄露概率是人工的2倍</text>

  <!-- Tags -->
  <g transform="translate(50, 265)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#2d0a0a" stroke="#ff416c" stroke-width="0.8"/>
    <text x="45" y="16" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#ff8080" text-anchor="middle">Vibe Slop</text>

    <rect x="100" y="0" width="110" height="24" rx="12" fill="#2d0a0a" stroke="#ff416c" stroke-width="0.8"/>
    <text x="155" y="16" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#ff8080" text-anchor="middle">Slopsquatting</text>

    <rect x="220" y="0" width="90" height="24" rx="12" fill="#2d0a0a" stroke="#ff416c" stroke-width="0.8"/>
    <text x="265" y="16" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#ff8080" text-anchor="middle">安全门控</text>

    <rect x="320" y="0" width="90" height="24" rx="12" fill="#2d0a0a" stroke="#ff416c" stroke-width="0.8"/>
    <text x="365" y="16" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#ff8080" text-anchor="middle">双轨策略</text>
  </g>

  <!-- Bottom -->
  <rect x="50" y="315" width="410" height="1" fill="#fff" opacity="0.06"/>
  <text x="50" y="340" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#605050">案例拆解 · 数据全景 · 结构性成因 · 解决方案</text>
  <text x="50" y="365" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#404040">AI知识宇宙 | 2026.06</text>

  <!-- Right side: Broken shield icon -->
  <g transform="translate(740, 220)">
    <path d="M0,-50 L40,-33 L40,15 C40,43 20,60 0,68 C-20,60 -40,43 -40,15 L-40,-33 Z" fill="none" stroke="#ff416c" stroke-width="2" opacity="0.6"/>
    <!-- Crack through shield -->
    <path d="M-5,-40 L3,-20 L-3,0 L5,20 L-2,40" fill="none" stroke="#ff4b2b" stroke-width="2.5" opacity="0.8"/>
    <!-- X mark -->
    <line x1="-12" y1="-8" x2="12" y2="8" stroke="#ff6b6b" stroke-width="3" opacity="0.7"/>
    <line x1="12" y1="-8" x2="-12" y2="8" stroke="#ff6b6b" stroke-width="3" opacity="0.7"/>
  </g>
</svg>
