<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880">
  <rect width="1080" height="880" fill="#ffffff"/>

  <text x="40" y="76" font-size="56" font-weight="bold" fill="#111827">同传进入 3 秒时代</text>
  <text x="40" y="130" font-size="34" fill="#4b5563">语音到语音延迟对比：端到端模型把商用同传从约 10 秒压到 3 秒内</text>

  <rect x="512" y="176" width="56" height="520" fill="#15803d" fill-opacity="0.10"/>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="512" y1="200" x2="512" y2="696"/>
    <line x1="624" y1="200" x2="624" y2="696"/>
    <line x1="736" y1="200" x2="736" y2="696"/>
    <line x1="848" y1="200" x2="848" y2="696"/>
    <line x1="960" y1="200" x2="960" y2="696"/>
  </g>

  <line x1="512" y1="176" x2="512" y2="696" stroke="#15803d" stroke-width="2" stroke-dasharray="8"/>
  <line x1="568" y1="176" x2="568" y2="696" stroke="#15803d" stroke-width="2" stroke-dasharray="8"/>
  <text x="540" y="166" font-size="30" fill="#15803d" text-anchor="middle">人类同传 2-3 秒</text>

  <g>
    <text x="40" y="256" font-size="32" fill="#374151">传统级联商用同传</text>
    <rect x="400" y="224" width="560" height="56" rx="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
    <text x="944" y="262" font-size="32" font-weight="bold" fill="#374151" text-anchor="end">约 10 秒</text>
  </g>

  <g>
    <text x="40" y="378" font-size="32" fill="#374151">字节 Seed 同传 2.0</text>
    <rect x="400" y="346" width="142" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="558" y="384" font-size="32" font-weight="bold" fill="#1d4ed8">2.5 秒</text>
  </g>

  <g>
    <text x="40" y="500" font-size="32" fill="#374151">阿里 Qwen 同传</text>
    <rect x="400" y="468" width="157" height="56" rx="8" fill="#cffafe" stroke="#0e7490" stroke-width="2"/>
    <text x="573" y="506" font-size="32" font-weight="bold" fill="#0e7490">2.8 秒</text>
  </g>

  <g>
    <text x="40" y="622" font-size="32" fill="#374151">谷歌 Gemini 同传</text>
    <rect x="400" y="590" width="168" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="584" y="628" font-size="32" font-weight="bold" fill="#6d28d9">3.0 秒</text>
  </g>

  <line x1="400" y1="696" x2="960" y2="696" stroke="#94a3b8" stroke-width="2"/>
  <g font-size="30" fill="#6b7280" text-anchor="middle">
    <text x="400" y="736">0</text>
    <text x="512" y="736">2</text>
    <text x="624" y="736">4</text>
    <text x="736" y="736">6</text>
    <text x="848" y="736">8</text>
    <text x="958" y="736">10 秒</text>
  </g>

  <text x="40" y="810" font-size="30" fill="#6b7280">数据来源：各厂商官方技术报告与第三方语音翻译基准（2026 年）</text>
</svg>
