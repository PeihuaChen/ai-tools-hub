<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 820" width="1080" height="820">
  <rect width="1080" height="820" fill="#ffffff"/>

  <text x="60" y="70" font-size="58" font-weight="bold" fill="#111827">四档模式：精度与吞吐怎么摆</text>
  <text x="60" y="120" font-size="32" fill="#4b5563">横轴吞吐（页/秒），纵轴 OmniParseBench 得分；越靠右上越理想</text>

  <!-- Plot area -->
  <rect x="150" y="180" width="820" height="500" fill="#f8fafc" stroke="#d9e2ec" stroke-width="2"/>

  <!-- Grid horizontal -->
  <line x1="150" y1="305" x2="970" y2="305" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="150" y1="430" x2="970" y2="430" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="150" y1="555" x2="970" y2="555" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="150" y1="680" x2="970" y2="680" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Y axis labels: 90 at y=230, 70 at y=430, 50 at y=630 -->
  <text x="135" y="238" font-size="30" fill="#6b7280" text-anchor="end">90</text>
  <text x="135" y="363" font-size="30" fill="#6b7280" text-anchor="end">80</text>
  <text x="135" y="488" font-size="30" fill="#6b7280" text-anchor="end">70</text>
  <text x="135" y="613" font-size="30" fill="#6b7280" text-anchor="end">60</text>
  <text x="135" y="680" font-size="30" fill="#6b7280" text-anchor="end">50</text>
  <text x="60" y="440" font-size="30" font-weight="bold" fill="#4b5563">得分</text>

  <!-- X axis labels: 0 at x=150, 60 at x=970 -->
  <text x="150" y="712" font-size="30" fill="#6b7280" text-anchor="middle">0</text>
  <text x="287" y="712" font-size="30" fill="#6b7280" text-anchor="middle">10</text>
  <text x="423" y="712" font-size="30" fill="#6b7280" text-anchor="middle">20</text>
  <text x="560" y="712" font-size="30" fill="#6b7280" text-anchor="middle">30</text>
  <text x="697" y="712" font-size="30" fill="#6b7280" text-anchor="middle">40</text>
  <text x="833" y="712" font-size="30" fill="#6b7280" text-anchor="middle">50</text>
  <text x="970" y="712" font-size="30" fill="#6b7280" text-anchor="middle">60</text>
  <text x="560" y="760" font-size="30" font-weight="bold" fill="#4b5563" text-anchor="middle">吞吐（页 / 秒）</text>

  <!-- point mapping: score 90->230, 50->680 ; per point 11.25px. throughput 0->150, 60->970 ; per pg/s 13.67px -->
  <!-- vllm: 85.9, 4.5 -> x=150+61.5=211, y=230+(90-85.9)*11.25=276 -->
  <circle cx="215" cy="276" r="14" fill="#b91c1c"/>
  <text x="240" y="270" font-size="30" font-weight="bold" fill="#b91c1c">vllm 85.9 / 4.5</text>

  <!-- balanced: 80.5, 16.9 -> x=150+231=381, y=230+(90-80.5)*11.25=337 -->
  <circle cx="381" cy="337" r="14" fill="#1d4ed8"/>
  <text x="405" y="330" font-size="30" font-weight="bold" fill="#1d4ed8">balanced 80.5 / 16.9</text>

  <!-- fast: 71.0, 23.6 -> x=150+323=473, y=230+(90-71)*11.25=444 -->
  <circle cx="473" cy="444" r="14" fill="#15803d"/>
  <text x="497" y="437" font-size="30" font-weight="bold" fill="#15803d">fast 71.0 / 23.6</text>

  <!-- no_ocr: 40.8, 57.0 -> x=150+779=929, y=230+(90-40.8)*11.25=784 -> clamp into plot -->
  <circle cx="915" cy="655" r="14" fill="#b45309"/>
  <text x="640" y="622" font-size="30" font-weight="bold" fill="#b45309">no_ocr 40.8 / 57.0</text>
  <line x1="830" y1="630" x2="903" y2="650" stroke="#b45309" stroke-width="2" stroke-dasharray="4"/>

  <!-- docling ref: 67.5, 2.1 -> x=179, y=230+22.5*11.25=483 -->
  <circle cx="179" cy="483" r="10" fill="#6b7280" stroke-dasharray="4"/>
  <text x="200" y="520" font-size="28" fill="#6b7280">docling 67.5 / 2.1</text>

  <!-- Legend note -->
  <rect x="150" y="788" width="820" height="24" fill="#f7f8fa"/>
  <text x="160" y="806" font-size="24" fill="#6b7280">注：得分口径为 OmniParseBench；速度来自单主机持续并发测试，非单流延迟</text>
</svg>
