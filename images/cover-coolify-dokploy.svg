<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0a1e"/><stop offset="1" stop-color="#161638"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#22c55e"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#475569" stroke-opacity=".22"/></pattern></defs><rect width="900" height="383" fill="url(#bg)"/><rect width="900" height="383" fill="url(#grid)"/><rect width="300" height="4" fill="#38bdf8"/><rect x="300" width="300" height="4" fill="#a78bfa"/><rect x="600" width="300" height="4" fill="#22c55e"/><rect y="379" width="300" height="4" fill="#f59e0b"/><rect x="300" y="379" width="300" height="4" fill="#38bdf8"/><rect x="600" y="379" width="300" height="4" fill="#a78bfa"/><rect x="42" y="35" width="250" height="32" rx="6" fill="#172554" stroke="#38bdf8"/><text x="58" y="57" fill="#bae6fd" font-size="13" font-weight="700">开源基础设施 · PaaS 横评</text><rect x="813" y="31" width="46" height="46" rx="23" fill="#201c4b" stroke="#a78bfa" stroke-width="2"/><text x="836" y="62" text-anchor="middle" fill="#ddd6fe" font-size="25" font-weight="700">26</text><text x="42" y="122" fill="#ffffff" font-size="30" font-weight="700">Coolify 还是 Dokploy？</text><text x="42" y="157" fill="url(#accent)" font-size="18" font-weight="700">内存、功能与安全对比</text><circle cx="57" cy="194" r="4" fill="#38bdf8"/><text x="72" y="199" fill="#cbd5e1" font-size="13">65.5k 对 38.2k Star，都是一条命令安装</text><circle cx="57" cy="221" r="4" fill="#a78bfa"/><text x="72" y="226" fill="#cbd5e1" font-size="13">Dokploy 更轻，Coolify 模板与架构支持更广</text><circle cx="57" cy="248" r="4" fill="#f59e0b"/><text x="72" y="253" fill="#cbd5e1" font-size="13">两边都出现过低权限账号到 root 的 RCE</text><g font-size="11" font-weight="700"><rect x="42" y="285" width="