<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="pb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#15193a"/></linearGradient>
    <pattern id="pg" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
  </defs>
  <rect width="860" height="320" rx="12" fill="url(#pb)"/>
  <rect width="860" height="320" rx="12" fill="url(#pg)"/>
  <rect x="1" y="1" width="858" height="318" rx="12" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="430" y="36" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">五种多智能体编排模式</text>
  <text x="430" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">从左到右复杂度递增 · 实际生产往往混合使用</text>

  <!-- Pattern 1: Pipeline -->
  <g transform="translate(28,90)">
    <rect width="140" height="190" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="70" y="26" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">Pipeline</text>
    <text x="70" y="46" fill="#64748b" font-size="11" text-anchor="middle">顺序流水线</text>
    <circle cx="70" cy="80" r="14" fill="none" stroke="#3b82f6" stroke-width="1.5"/><text x="70" y="84" fill="#93c5fd" font-size="10" text-anchor="middle">A</text>
    <line x1="70" y1="94" x2="70" y2="106" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="70" cy="120" r="14" fill="none" stroke="#3b82f6" stroke-width="1.5"/><text x="70" y="124" fill="#93c5fd" font-size="10" text-anchor="middle">B</text>
    <line x1="70" y1="134" x2="70" y2="146" stroke="#475569" stroke-width="1.5"/>
    <circle cx="70" cy="160" r="14" fill="none" stroke="#3b82f6" stroke-width="1.5"/><text x="70" y="164" fill="#93c5fd" font-size="10" text-anchor="middle">C</text>
    <text x="70" y="186" fill="#475569" font-size="10" text-anchor="middle">A→B→C</text>
  </g>

  <!-- Pattern 2: Fan-out -->
  <g transform="translate(192,90)">
    <rect width="140" height="190" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-opacity="0.5"/>
    <text x="70" y="26" fill="#c4b5fd" font-size="13" font-weight="700" text-anchor="middle">Fan-out</text>
    <text x="70" y="46" fill="#64748b" font-size="11" text-anchor="middle">并行扇出</text>
    <circle cx="70" cy="80" r="14" fill="none" stroke="#8b5cf6" stroke-width="1.5"/><text x="70" y="84" fill="#c4b5fd" font-size="10" text-anchor="middle">D</text>
    <line x1="56" y1="92" x2="35" y2="110" stroke="#475569" stroke-width="1.5"/>
    <line x1="70" y1="94" x2="70" y2="110" stroke="#475569" stroke-width="1.5"/>
    <line x1="84" y1="92" x2="105" y2="110" stroke="#475569" stroke-width="1.5"/>
    <circle cx="35" cy="124" r="12" fill="none" stroke="#8b5cf6" stroke-width="1.2"/><text x="35" y="128" fill="#c4b5fd" font-size="9" text-anchor="middle">A</text>
    <circle cx="70" cy="124" r="12" fill="none" stroke="#8b5cf6" stroke-width="1.2"/><text x="70" y="128" fill="#c4b5fd" font-size="9" text-anchor="middle">B</text>
    <circle cx="105" cy="124" r="12" fill="none" stroke="#8b5cf6" stroke-width="1.2"/><text x="105" y="128" fill="#c4b5fd" font-size="9" text-anchor="middle">C</text>
    <line x1="35" y1="136" x2="70" y2="152" stroke="#475569" stroke-width="1.2"/>
    <line x1="70" y1="136" x2="70" y2="152" stroke="#475569" stroke-width="1.2"/>
    <line x1="105" y1="136" x2="70" y2="152" stroke="#475569" stroke-width="1.2"/>
    <circle cx="70" cy="164" r="12" fill="none" stroke="#8b5cf6" stroke-width="1.5"/><text x="70" y="168" fill="#c4b5fd" font-size="9" text-anchor="middle">∑</text>
    <text x="70" y="186" fill="#475569" font-size="10" text-anchor="middle">分发→并行→聚合</text>
  </g>

  <!-- Pattern 3: Supervisor -->
  <g transform="translate(356,90)">
    <rect width="140" height="190" rx="10" fill="#1e293b" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="70" y="26" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">Supervisor</text>
    <text x="70" y="46" fill="#64748b" font-size="11" text-anchor="middle">监督者模式</text>
    <circle cx="70" cy="85" r="18" fill="none" stroke="#10b981" stroke-width="2"/><text x="70" y="90" fill="#6ee7b7" font-size="11" text-anchor="middle">S</text>
    <line x1="55" y1="100" x2="35" y2="130" stroke="#475569" stroke-width="1.5"/>
    <line x1="85" y1="100" x2="105" y2="130" stroke="#475569" stroke-width="1.5"/>
    <circle cx="35" cy="144" r="14" fill="none" stroke="#10b981" stroke-width="1.2"/><text x="35" y="148" fill="#6ee7b7" font-size="10" text-anchor="middle">W1</text>
    <circle cx="105" cy="144" r="14" fill="none" stroke="#10b981" stroke-width="1.2"/><text x="105" y="148" fill="#6ee7b7" font-size="10" text-anchor="middle">W2</text>
    <text x="70" y="186" fill="#475569" font-size="10" text-anchor="middle">分配→执行→汇报</text>
  </g>

  <!-- Pattern 4: State Graph -->
  <g transform="translate(520,90)">
    <rect width="140" height="190" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="70" y="26" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">状态图</text>
    <text x="70" y="46" fill="#64748b" font-size="11" text-anchor="middle">Stateful Graph</text>
    <circle cx="40" cy="90" r="14" fill="none" stroke="#f59e0b" stroke-width="1.5"/><text x="40" y="94" fill="#fcd34d" font-size="9" text-anchor="middle">Plan</text>
    <circle cx="100" cy="90" r="14" fill="none" stroke="#f59e0b" stroke-width="1.5"/><text x="100" y="94" fill="#fcd34d" font-size="9" text-anchor="middle">Exec</text>
    <circle cx="100" cy="150" r="14" fill="none" stroke="#f59e0b" stroke-width="1.5"/><text x="100" y="154" fill="#fcd34d" font-size="9" text-anchor="middle">Eval</text>
    <line x1="54" y1="90" x2="86" y2="90" stroke="#475569" stroke-width="1.5"/>
    <line x1="100" y1="104" x2="100" y2="136" stroke="#475569" stroke-width="1.5"/>
    <path d="M86 150 C60 150 50 120 54 96" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="70" y="186" fill="#475569" font-size="10" text-anchor="middle">条件 + 循环</text>
  </g>

  <!-- Pattern 5: Swarm -->
  <g transform="translate(684,90)">
    <rect width="140" height="190" rx="10" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.5"/>
    <text x="70" y="26" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">Swarm</text>
    <text x="70" y="46" fill="#64748b" font-size="11" text-anchor="middle">群体 P2P</text>
    <circle cx="40" cy="95" r="14" fill="none" stroke="#ec4899" stroke-width="1.2"/><text x="40" y="99" fill="#f9a8d4" font-size="9" text-anchor="middle">A</text>
    <circle cx="100" cy="95" r="14" fill="none" stroke="#ec4899" stroke-width="1.2"/><text x="100" y="99" fill="#f9a8d4" font-size="9" text-anchor="middle">B</text>
    <circle cx="40" cy="150" r="14" fill="none" stroke="#ec4899" stroke-width="1.2"/><text x="40" y="154" fill="#f9a8d4" font-size="9" text-anchor="middle">C</text>
    <circle cx="100" cy="150" r="14" fill="none" stroke="#ec4899" stroke-width="1.2"/><text x="100" y="154" fill="#f9a8d4" font-size="9" text-anchor="middle">D</text>
    <line x1="54" y1="95" x2="86" y2="95" stroke="#475569" stroke-width="1"/>
    <line x1="54" y1="150" x2="86" y2="150" stroke="#475569" stroke-width="1"/>
    <line x1="40" y1="109" x2="40" y2="136" stroke="#475569" stroke-width="1"/>
    <line x1="100" y1="109" x2="100" y2="136" stroke="#475569" stroke-width="1"/>
    <line x1="52" y1="103" x2="88" y2="142" stroke="#475569" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="70" y="186" fill="#475569" font-size="10" text-anchor="middle">对等 · 无中心</text>
  </g>

  <text x="430" y="308" fill="#64748b" font-size="12" text-anchor="middle">Pipeline 适合线性任务 | Supervisor 适合动态路由 | Graph 适合循环修复 | Swarm 适合开放探索</text>
</svg>
