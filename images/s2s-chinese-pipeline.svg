<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="40" y="40" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="23" font-weight="bold" fill="#111827">中文场景怎么配：默认栈必须换掉 STT</text>
  <text x="40" y="66" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" fill="#4b5563">默认的 Parakeet TDT 只覆盖 25 种欧洲语言，压根不支持中文；而 Whisper 在中文上的字错率是 FunASR 系的两倍以上</text>

  <!-- CER 对比 -->
  <text x="40" y="102" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#111827">中文字错率 CER 与吞吐（FunASR 官方 benchmark：184 个长音频 / 192 分钟，越低越好）</text>

  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5">
    <text x="248" y="146" text-anchor="end" fill="#111827">SenseVoice-Small</text>
    <rect x="260" y="130" width="219" height="24" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
    <text x="489" y="147" font-size="12.5" font-weight="bold" fill="#15803d">7.81%</text>
    <text x="556" y="147" font-size="11.5" fill="#6b7280">GPU 170x · CPU 17x realtime</text>

    <text x="248" y="186" text-anchor="end" fill="#111827">Fun-ASR-Nano + vLLM</text>
    <rect x="260" y="170" width="230" height="24" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
    <text x="500" y="187" font-size="12.5" font-weight="bold" fill="#15803d">8.20%</text>
    <text x="567" y="187" font-size="11.5" fill="#6b7280">GPU 340x realtime（最快）</text>

    <text x="248" y="226" text-anchor="end" fill="#111827">Paraformer-Large</text>
    <rect x="260" y="210" width="285" height="24" rx="4" fill="#e0f2fe" stroke="#0e7490" stroke-width="1.3"/>
    <text x="555" y="227" font-size="12.5" font-weight="bold" fill="#0e7490">10.18%</text>
    <text x="628" y="227" font-size="11.5" fill="#6b7280">GPU 120x · CPU 15x · 有流式版</text>

    <text x="248" y="266" text-anchor="end" fill="#111827">Whisper-large-v3</text>
    <rect x="260" y="250" width="561" height="24" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/>
    <text x="831" y="267" font-size="12.5" font-weight="bold" fill="#b91c1c">20.02%</text>
    <text x="904" y="267" font-size="11.5" fill="#6b7280">GPU 13x · CPU 不可行</text>

    <text x="248" y="306" text-anchor="end" fill="#111827">Whisper-large-v3-turbo</text>
    <rect x="260" y="290" width="608" height="24" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/>
    <text x="878" y="307" font-size="12.5" font-weight="bold" fill="#b91c1c">21.71%</text>
    <text x="951" y="307" font-size="11.5" fill="#6b7280">GPU 46x · CPU 不可行</text>

    <text x="248" y="346" text-anchor="end" fill="#b91c1c">Parakeet TDT（默认）</text>
    <rect x="260" y="330" width="608" height="24" rx="4" fill="#f8fafc" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="4"/>
    <text x="276" y="347" font-size="12" fill="#b91c1c">不支持中文 — 仅 25 种欧洲语言，中文场景必须显式切换</text>
  </g>

  <line x1="40" y1="376" x2="1160" y2="376" stroke="#d9e2ec" stroke-width="1.5"/>

  <!-- 两档方案 -->
  <rect x="40" y="398" width="545" height="278" rx="12" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="40" y="398" width="545" height="38" rx="12" fill="#eff6ff"/>
  <text x="60" y="424" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#1d4ed8">档位一：开箱档（零代码，纯 flag 配置）</text>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5">
    <text x="60" y="462" font-weight="bold" fill="#6d28d9">VAD</text>
    <text x="112" y="462" fill="#111827">Silero v5 + Smart Turn v3.2（含中文，共 23 语言）</text>
    <text x="60" y="490" font-weight="bold" fill="#0e7490">STT</text>
    <text x="112" y="490" fill="#111827">Paraformer-zh，内置支持</text>
    <text x="112" y="510" font-family="'Consolas',monospace" font-size="11" fill="#4b5563">pip install "speech-to-speech[paraformer]"</text>
    <text x="112" y="528" font-family="'Consolas',monospace" font-size="11" fill="#4b5563">--stt paraformer --language zh</text>
    <text x="60" y="556" font-weight="bold" fill="#b91c1c">LLM</text>
    <text x="112" y="556" fill="#111827">vLLM 自托管 Qwen3 系列</text>
    <text x="112" y="576" font-family="'Consolas',monospace" font-size="11" fill="#4b5563">--llm_backend chat-completions</text>
    <text x="112" y="594" font-family="'Consolas',monospace" font-size="11" fill="#4b5563">--responses_api_base_url http://localhost:8000/v1</text>
    <text x="60" y="622" font-weight="bold" fill="#b45309">TTS</text>
    <text x="112" y="622" fill="#111827">Qwen3-TTS，内置默认，多语言</text>
    <text x="112" y="642" font-family="'Consolas',monospace" font-size="11" fill="#4b5563">--tts qwen3 --qwen3_tts_language auto</text>
  </g>
  <text x="60" y="666" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11.5" fill="#15803d">适合：通用普通话客服、助手；先跑通再优化</text>

  <rect x="615" y="398" width="545" height="278" rx="12" fill="#f8fafc" stroke="#b45309" stroke-width="1.5"/>
  <rect x="615" y="398" width="545" height="38" rx="12" fill="#fffbeb"/>
  <text x="635" y="424" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#b45309">档位二：方言 / 音色档（需自研改造）</text>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5">
    <text x="635" y="462" font-weight="bold" fill="#0e7490">STT</text>
    <text x="687" y="462" fill="#111827">Fun-ASR-Nano（方言/口音）或 SenseVoice（带情绪）</text>
    <text x="635" y="490" font-weight="bold" fill="#b45309">TTS</text>
    <text x="687" y="490" fill="#111827">Fun-CosyVoice3-0.5B-2512</text>
    <text x="687" y="512" fill="#4b5563">· 9 语言 + 18 种以上中文方言（粤/闽南/川/东北…）</text>
    <text x="687" y="532" fill="#4b5563">· 双向流式，延迟低至 150ms</text>
    <text x="687" y="552" fill="#4b5563">· test-zh CER 1.21%，RL 版 0.81%（人类 1.26%）</text>
    <text x="687" y="572" fill="#4b5563">· 支持拼音 / CMU 音素发音修复</text>
  </g>
  <rect x="635" y="588" width="505" height="72" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="651" y="610" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">两个必须知道的代价</text>
  <text x="651" y="630" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11.5" fill="#111827">① CosyVoice 不在内置后端列表，要自己写 TTS handler</text>
  <text x="651" y="650" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11.5" fill="#111827">② 它本身是 0.5B LLM 架构，和主 LLM 抢显存和算力</text>
</svg>
