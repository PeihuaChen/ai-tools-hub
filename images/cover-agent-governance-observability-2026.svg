<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="covBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#1a2040"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff416c"/>
      <stop offset="100%" style="stop-color:#ff4b2b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#4facfe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#covBg)"/>

  <!-- Subtle circuit pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5" fill="none">
    <path d="M600,50 L650,50 L650,100 L700,100"/>
    <path d="M620,80 L620,130 L680,130 L680,160"/>
    <path d="M700,60 L750,60 L750,120"/>
    <path d="M640,150 L640,200 L700,200 L700,240"/>
    <path d="M720,170 L780,170 L780,220"/>
    <path d="M660,230 L660,280 L720,280"/>
    <path d="M740,250 L800,250 L800,300"/>
    <path d="M580,120 L580,180 L620,180"/>
    <path d="M760,130 L820,130 L820,190"/>
    <path d="M690,270 L750,270 L750,320"/>
    <circle cx="650" cy="50" r="3"/>
    <circle cx="700" cy="100" r="3"/>
    <circle cx="620" cy="130" r="3"/>
    <circle cx="680" cy="160" r="3"/>
    <circle cx="750" cy="120" r="3"/>
    <circle cx="700" cy="200" r="3"/>
    <circle cx="780" cy="220" r="3"/>
    <circle cx="720" cy="280" r="3"/>
    <circle cx="800" cy="300" r="3"/>
    <circle cx="820" cy="190" r="3"/>
  </g>

  <!-- Right side: Shield icon with eye (observability) -->
  <g transform="translate(680, 130)">
    <!-- Shield shape -->
    <path d="M0,-60 L50,-40 L50,20 C50,55 25,75 0,85 C-25,75 -50,55 -50,20 L-50,-40 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" opacity="0.8"/>
    <!-- Inner eye icon -->
    <ellipse cx="0" cy="5" rx="22" ry="14" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="5" r="8" fill="none" stroke="#667eea" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="5" r="3" fill="#4facfe" opacity="0.9"/>
  </g>

  <!-- Warning indicators around shield -->
  <g opacity="0.6">
    <circle cx="610" cy="100" r="4" fill="#ff416c"/>
    <circle cx="750" cy="90" r="3" fill="#ff4b2b"/>
    <circle cx="770" cy="200" r="4" fill="#ff416c"/>
    <circle cx="600" cy="210" r="3" fill="#ff4b2b"/>
    <circle cx="730" cy="260" r="3" fill="#ff416c"/>
  </g>

  <!-- Pulse rings around warning dots -->
  <circle cx="610" cy="100" r="10" fill="none" stroke="#ff416c" stroke-width="0.5" opacity="0.3"/>
  <circle cx="770" cy="200" r="12" fill="none" stroke="#ff4b2b" stroke-width="0.5" opacity="0.3"/>

  <!-- Left side: Title -->
  <text x="55" y="90" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">AI Agent治理</text>
  <text x="55" y="135" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">与可观测性</text>

  <!-- Subtitle with warning color -->
  <text x="55" y="185" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="url(#warnGrad)">企业落地的隐藏成本</text>

  <!-- Key stats -->
  <g transform="translate(55, 215)">
    <rect x="0" y="0" width="155" height="32" rx="6" fill="#ff416c" opacity="0.15"/>
    <text x="12" y="21" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#ff8090">⚠️ 40%项目将被取消</text>

    <rect x="170" y="0" width="170" height="32" rx="6" fill="#667eea" opacity="0.15"/>
    <text x="182" y="21" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#a8b4ff">💰 TCO超支2.4倍</text>

    <rect x="355" y="0" width="155" height="32" rx="6" fill="#4facfe" opacity="0.15"/>
    <text x="367" y="21" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#7fc4ff">🔍 仅12%进入生产</text>
  </g>

  <!-- Four pillars -->
  <g transform="translate(55, 275)">
    <rect x="0" y="0" width="80" height="26" rx="13" fill="#2d1b4e" stroke="#667eea" stroke-width="1"/>
    <text x="40" y="17" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#a8b4ff" text-anchor="middle">追踪</text>

    <rect x="90" y="0" width="80" height="26" rx="13" fill="#2d1b4e" stroke="#4facfe" stroke-width="1"/>
    <text x="130" y="17" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#7fc4ff" text-anchor="middle">评估</text>

    <rect x="180" y="0" width="80" height="26" rx="13" fill="#2d1b4e" stroke="#ff416c" stroke-width="1"/>
    <text x="220" y="17" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#ff8090" text-anchor="middle">护栏</text>

    <rect x="270" y="0" width="100" height="26" rx="13" fill="#2d1b4e" stroke="#00b894" stroke-width="1"/>
    <text x="320" y="17" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#60e8c0" text-anchor="middle">成本归因</text>
  </g>

  <!-- Bottom info -->
  <rect x="55" y="320" width="460" height="1" fill="#fff" opacity="0.06"/>
  <text x="55" y="345" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#506070">Gartner预测 · 可观测性技术栈 · 成本模型 · 国内合规框架</text>
  <text x="55" y="368" font-family="Arial, Microsoft YaHei, sans-serif" font-size="10" fill="#404060">AI知识宇宙 | 2026.06</text>
</svg>
