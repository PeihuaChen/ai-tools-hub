<svg width="1080" height="700" viewBox="0 0 1080 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="700" fill="#f7f8fa"/>

  <text x="540" y="86" font-size="60" fill="#111827" font-weight="bold" text-anchor="middle">三步定速计划：只有第一步真正落地</text>
  <text x="540" y="146" font-size="34" fill="#4b5563" text-anchor="middle">阿莫迪《我们必须为前沿定速》方案的实际进展</text>

  <!-- card 1 -->
  <rect x="40" y="200" width="320" height="360" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="64" y="256" font-size="40" fill="#15803d" font-weight="bold">第一步</text>
  <rect x="64" y="278" width="132" height="46" rx="23" fill="#15803d"/>
  <text x="130" y="311" font-size="30" fill="#ffffff" font-weight="bold" text-anchor="middle">已落地</text>
  <text x="64" y="382" font-size="34" fill="#111827" font-weight="bold">第三方评估员</text>
  <text x="64" y="426" font-size="34" fill="#111827" font-weight="bold">常驻实验室</text>
  <text x="64" y="478" font-size="32" fill="#4b5563">已引入评估机构</text>
  <text x="64" y="520" font-size="32" fill="#4b5563">员工级访问权限</text>

  <!-- card 2 -->
  <rect x="380" y="200" width="320" height="360" rx="16" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="404" y="256" font-size="40" fill="#b45309" font-weight="bold">第二步</text>
  <rect x="404" y="278" width="132" height="46" rx="23" fill="#b45309"/>
  <text x="470" y="311" font-size="30" fill="#ffffff" font-weight="bold" text-anchor="middle">被堵住</text>
  <text x="404" y="382" font-size="34" fill="#111827" font-weight="bold">实验室协调</text>
  <text x="404" y="426" font-size="34" fill="#111827" font-weight="bold">共同定速</text>
  <text x="404" y="478" font-size="32" fill="#4b5563">需反垄断豁免</text>
  <text x="404" y="520" font-size="32" fill="#4b5563">白宫明确拒绝</text>

  <!-- card 3 -->
  <rect x="720" y="200" width="320" height="360" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="744" y="256" font-size="40" fill="#b91c1c" font-weight="bold">第三步</text>
  <rect x="744" y="278" width="132" height="46" rx="23" fill="#b91c1c"/>
  <text x="810" y="311" font-size="30" fill="#ffffff" font-weight="bold" text-anchor="middle">零进展</text>
  <text x="744" y="382" font-size="34" fill="#111827" font-weight="bold">全球对华</text>
  <text x="744" y="426" font-size="34" fill="#111827" font-weight="bold">可验证协调</text>
  <text x="744" y="478" font-size="32" fill="#4b5563">窄议题起步合作</text>
  <text x="744" y="520" font-size="32" fill="#4b5563">中方未回应此倡议</text>

  <line x1="360" y1="380" x2="380" y2="380" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="380,380 370,374 370,386" fill="#94a3b8"/>
  <line x1="700" y1="380" x2="720" y2="380" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="720,380 710,374 710,386" fill="#94a3b8"/>

  <rect x="40" y="596" width="1000" height="72" rx="12" fill="#eef2f7" stroke="#d9e2ec" stroke-width="2"/>
  <text x="540" y="642" font-size="32" fill="#1d4ed8" font-weight="bold" text-anchor="middle">三步中只有第一步单方面可执行，后两步都要别人点头</text>
</svg>
