<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="barBot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0 L0 0 0 45" fill="none" stroke="#2a2a55" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>
  <rect width="900" height="4" fill="url(#barTop)"/>
  <rect y="379" width="900" height="4" fill="url(#barBot)"/>

  <rect x="48" y="30" width="224" height="28" rx="6" fill="#1b1b45" stroke="#4f46a8" stroke-width="1.5"/>
  <text x="62" y="49" font-size="13" fill="#a5b4fc">AI 行业观察 · 决策模型</text>

  <circle cx="846" cy="44" r="21" fill="#1b1b45" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="846" y="51" font-size="19" font-weight="bold" fill="#f59e0b" text-anchor="middle">26</text>

  <text x="48" y="112" font-size="31" font-weight="bold" fill="#ffffff">决策模型怎么选</text>
  <text x="48" y="146" font-size="18" font-weight="bold" fill="url(#sub)">Clef vs Perplexity decider vs Jev</text>

  <text x="48" y="188" font-size="13" fill="#22d3ee">每百万输入 token：$0.24 / $0.042 / $0.02</text>
  <text x="48" y="212" font-size="13" fill="#fbbf24">Cloudflare 榜单 Clef 第一，JevBench 综合第 78</text>
  <text x="48" y="236" font-size="13" fill="#c4b5fd">智能分最高的是 Perplexity v1.1（75.7）</text>

  <g font-size="12">
    <rect x="48" y="260" width="72" height="26" rx="13" fill="none" stroke="#4f46a8" stroke-width="1.2"/>
    <text x="84" y="277" fill="#a5b4fc" text-anchor="middle">决策模型</text>
    <rect x="128" y="260" width="56" height="26" rx="13" fill="none" stroke="#0e7490" stroke-width="1.2"/>
    <text x="156" y="277" fill="#67e8f9" text-anchor="middle">Clef</text>
    <rect x="192" y="260" width="108" height="26" rx="13" fill="none" stroke="#b45309" stroke-width="1.2"/>
    <text x="246" y="277" fill="#fbbf24" text-anchor="middle">pplx decider</text>
    <rect x="308" y="260" width="48" height="26" rx="13" fill="none" stroke="#6d28d9" stroke-width="1.2"/>
    <text x="332" y="277" fill="#c4b5fd" text-anchor="middle">Jev</text>
    <rect x="364" y="260" width="56" height="26" rx="13" fill="none" stroke="#15803d" stroke-width="1.2"/>
    <text x="392" y="277" fill="#6ee7b7" text-anchor="middle">选型</text>
  </g>

  <g>
    <rect x="556" y="96" width="296" height="198" rx="14" fill="#15153a" stroke="#4f46a8" stroke-width="1.5"/>
    <text x="576" y="126" font-size="14" font-weight="bold" fill="#a5b4fc">每百万输入 token（美元）</text>

    <text x="576" y="162" font-size="13" fill="#67e8f9">Clef</text>
    <rect x="620" y="150" width="120" height="14" rx="4" fill="#22d3ee"/>
    <text x="748" y="162" font-size="13" fill="#67e8f9">$0.24</text>

    <text x="576" y="198" font-size="13" fill="#c4b5fd">Jev</text>
    <rect x="620" y="186" width="21" height="14" rx="4" fill="#a5b4fc"/>
    <text x="649" y="198" font-size="13" fill="#c4b5fd">$0.042</text>

    <text x="576" y="234" font-size="13" fill="#fbbf24">pplx</text>
    <rect x="620" y="222" width="10" height="14" rx="4" fill="#f59e0b"/>
    <text x="638" y="234" font-size="13" fill="#fbbf24">$0.02</text>

    <line x1="576" y1="248" x2="832" y2="248" stroke="#2f2f60" stroke-width="1"/>
    <text x="576" y="270" font-size="12" fill="#9ca3d4">pplx v1.1 比 Clef 便宜 12 倍</text>
  </g>

  <line x1="48" y1="316" x2="852" y2="316" stroke="#2f2f60" stroke-width="1.5"/>
  <text x="48" y="345" font-size="12" fill="#9ca3d4">两个榜单怎么读 · 第三方实测 · 价格与延迟 · 四种场景选型</text>
  <text x="852" y="345" font-size="11" fill="#5b5b8f" text-anchor="end">VXI AI 行业观察</text>
</svg>
