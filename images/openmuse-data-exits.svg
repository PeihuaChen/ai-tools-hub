<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1136" viewBox="0 0 1080 1136">
  <rect width="1080" height="1136" fill="#f7f8fa"/>

  <text x="48" y="100" fill="#111827" font-size="60" font-weight="700">数据出口地图</text>
  <text x="48" y="166" fill="#4b5563" font-size="34">自托管不等于数据不出门</text>

  <!-- center -->
  <rect x="48" y="206" width="984" height="154" rx="14" fill="#f8fafc" stroke="#d9e2ec" stroke-width="2"/>
  <text x="76" y="266" fill="#111827" font-size="44" font-weight="700">OpenMuse API 服务器</text>
  <text x="76" y="332" fill="#4b5563" font-size="32">所有出站都从这里发出</text>

  <!-- spine -->
  <line x1="540" y1="360" x2="540" y2="1040" stroke="#94a3b8" stroke-width="3"/>

  <!-- row 1 -->
  <rect x="48" y="392" width="480" height="200" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="76" y="450" fill="#111827" font-size="40" font-weight="700">模型厂商</text>
  <text x="76" y="510" fill="#4b5563" font-size="32">对话与任务上下文</text>
  <text x="76" y="558" fill="#1d4ed8" font-size="32" font-weight="700">必选，密钥只在服务器</text>

  <rect x="552" y="392" width="480" height="200" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="580" y="450" fill="#111827" font-size="40" font-weight="700">Intelligence 服务</text>
  <text x="580" y="510" fill="#4b5563" font-size="32">CopilotKit 的对话存储</text>
  <text x="580" y="558" fill="#1d4ed8" font-size="32" font-weight="700">必选，不属于 MIT 授权</text>

  <!-- row 2 -->
  <rect x="48" y="616" width="480" height="200" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="76" y="674" fill="#111827" font-size="40" font-weight="700">Parallel 搜索</text>
  <text x="76" y="734" fill="#4b5563" font-size="32">发送模型生成的查询</text>
  <text x="76" y="782" fill="#b45309" font-size="32" font-weight="700">默认开启，可关闭</text>

  <rect x="552" y="616" width="480" height="200" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="580" y="674" fill="#111827" font-size="40" font-weight="700">PostHog 遥测</text>
  <text x="580" y="734" fill="#4b5563" font-size="32">SDK 运行遥测</text>
  <text x="580" y="782" fill="#b45309" font-size="32" font-weight="700">默认全量，可退出</text>

  <!-- row 3 -->
  <rect x="48" y="840" width="480" height="200" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="76" y="898" fill="#111827" font-size="40" font-weight="700">Google 邮件与日历</text>
  <text x="76" y="958" fill="#4b5563" font-size="32">OAuth 读写，令牌加密存放</text>
  <text x="76" y="1006" fill="#15803d" font-size="32" font-weight="700">发信和改日程要先审批</text>

  <rect x="552" y="840" width="480" height="200" rx="14" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="580" y="898" fill="#111827" font-size="40" font-weight="700">公网网页</text>
  <text x="580" y="958" fill="#4b5563" font-size="32">浏览器 Worker 去读页面</text>
  <text x="580" y="1006" fill="#0e7490" font-size="32" font-weight="700">仅 80/443，应用层校验</text>

  <!-- legend -->
  <text x="48" y="1100" fill="#1d4ed8" font-size="32" font-weight="700">蓝：必选</text>
  <text x="240" y="1100" fill="#b45309" font-size="32" font-weight="700">橙：默认开启</text>
  <text x="500" y="1100" fill="#15803d" font-size="32" font-weight="700">绿青：按需</text>
</svg>
