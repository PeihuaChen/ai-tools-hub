<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>

  <!-- top / bottom color bars -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topbar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#topbar)"/>

  <!-- top-left tag box -->
  <rect x="44" y="42" width="248" height="30" rx="6" fill="none" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.4"/>
  <text x="60" y="62" font-size="14" fill="#7dd3fc" letter-spacing="0.5">AI 行业观察 · 落地交付</text>

  <!-- year badge -->
  <circle cx="838" cy="58" r="26" fill="none" stroke="url(#ring)" stroke-width="2.2"/>
  <text x="838" y="66" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle">26</text>

  <!-- main title -->
  <text x="46" y="128" font-size="31" font-weight="700" fill="#ffffff">95% 的 AI 试点失败之后</text>
  <text x="46" y="168" font-size="29" font-weight="700" fill="#ffffff">巨头用"人肉交付"破局</text>

  <!-- subtitle -->
  <text x="46" y="205" font-size="18" font-weight="600" fill="url(#sub)">微软 · 亚马逊 · OpenAI · Anthropic 的 FDE 豪赌</text>

  <!-- three highlight lines -->
  <text x="46" y="242" font-size="13" fill="#93c5fd">▸ 一个月内 130 亿美元砸向"驻场工程师"军团</text>
  <text x="46" y="266" font-size="13" fill="#c4b5fd">▸ FDE 岗位同比暴涨 729%，抄的是 Palantir 十年作业</text>
  <text x="46" y="290" font-size="13" fill="#fdba74">▸ 服务 : 软件 = 6 : 1，中小厂商还剩什么机会？</text>

  <!-- concept diagram right: vendor -> team -> client -->
  <g opacity="0.92">
    <rect x="648" y="150" width="70" height="40" rx="7" fill="none" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="683" y="175" font-size="12" fill="#93c5fd" text-anchor="middle">大厂</text>

    <line x1="718" y1="170" x2="762" y2="170" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="787" cy="170" r="24" fill="none" stroke="#8b5cf6" stroke-width="1.8"/>
    <text x="787" y="167" font-size="11" fill="#c4b5fd" text-anchor="middle">FDE</text>
    <text x="787" y="180" font-size="9" fill="#a78bfa" text-anchor="middle">驻场</text>

    <line x1="811" y1="170" x2="828" y2="170" stroke="#f97316" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="828" y="150" width="42" height="40" rx="7" fill="none" stroke="#f97316" stroke-width="1.6"/>
    <text x="849" y="167" font-size="10" fill="#fdba74" text-anchor="middle">客户</text>
    <text x="849" y="181" font-size="10" fill="#fdba74" text-anchor="middle">现场</text>
  </g>

  <!-- tag pills -->
  <g font-size="12">
    <rect x="46" y="312" width="72" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-opacity="0.55"/>
    <text x="82" y="329" fill="#bfdbfe" text-anchor="middle">FDE</text>
    <rect x="126" y="312" width="88" height="26" rx="13" fill="none" stroke="#8b5cf6" stroke-opacity="0.55"/>
    <text x="170" y="329" fill="#ddd6fe" text-anchor="middle">前沿部署</text>
    <rect x="222" y="312" width="88" height="26" rx="13" fill="none" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="266" y="329" fill="#fed7aa" text-anchor="middle">AI 落地</text>
    <rect x="318" y="312" width="100" height="26" rx="13" fill="none" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="368" y="329" fill="#bae6fd" text-anchor="middle">企业服务</text>
    <rect x="426" y="312" width="88" height="26" rx="13" fill="none" stroke="#22c55e" stroke-opacity="0.55"/>
    <text x="470" y="329" fill="#bbf7d0" text-anchor="middle">中小厂商</text>
  </g>

  <!-- footer -->
  <line x1="46" y1="352" x2="854" y2="352" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text x="46" y="370" font-size="11" fill="#64748b">从"卖模型"到"陪跑落地"：AI 商业化的第三阶段</text>
  <text x="854" y="370" font-size="11" fill="#475569" text-anchor="end">公众号 · AI 行业观察</text>
</svg>
