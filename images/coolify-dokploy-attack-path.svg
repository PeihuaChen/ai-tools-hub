<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900"><rect width="1080" height="900" fill="#f7f8fa"/><text x="48" y="82" fill="#111827" font-size="60" font-weight="700">低权限到 root：共同的风险路径</text><text x="48" y="136" fill="#4b5563" font-size="32">控制面要代用户执行 shell，漏掉一处转义就可能越过容器边界</text><g><rect x="48" y="220" width="220" height="180" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="158" y="280" text-anchor="middle" fill="#1d4ed8" font-size="38" font-weight="700">低权限</text><text x="158" y="336" text-anchor="middle" fill="#4b5563" font-size="32">账号或令牌</text><path d="M278 310H300" stroke="#94a3b8" stroke-width="3"/><path d="M292 302L304 310L292 318" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="316" y="220" width="220" height="180" rx="16" fill="#fefce8" stroke="#b45309" stroke-width="2"/><text x="426" y="280" text-anchor="middle" fill="#b45309" font-size="38" font-weight="700">元字符</text><text x="426" y="326" text-anchor="middle" fill="#4b5563" font-size="32">分支、卷名</text><text x="426" y="370" text-anchor="middle" fill="#4b5563" font-size="32">或路径</text><path d="M546 310H568" stroke="#94a3b8" stroke-width="3"/><path d="M560 302L572 310L560 318" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="584" y="220" width="220" height="180" rx="16" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="694" y="280" text-anchor="middle" fill="#b45309" font-size="38" font-weight="700">拼接</text><text x="694" y="336" text-anchor="middle" fill="#4b5563" font-size="32">shell 命令</text><path d="M814 310H836" stroke="#94a3b8" stroke-width="3"/><path d="M828 302L840 310L828 318" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="852" y="220" width="180" height="180" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="942" y="280" text-anchor="middle" fill="#b91c1c" font-size="38" font-weight="700">root</text><text x="942" y="336" text-anchor="middle" fill="#4b5563" font-size="32">宿主机</text></g><rect x="48" y="480" width="472" height="250" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="80" y="545" fill="#1d4ed8" font-size="42" font-weight="700">Coolify 出现过</text><text x="80" y="603" fill="#4b5563" font-size="32">备份、Git、卷名、</text><text x="80" y="655" fill="#4b5563" font-size="32">Compose、终端 WebSocket</text><rect x="560" y="480" width="472" height="250" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="592" y="545" fill="#15803d" font-size="42" font-weight="700">Dokploy 出现过</text><text x="592" y="603" fill="#4b5563" font-size="32">分支名、SSH、</text><text x="592" y="655" fill="#4b5563" font-size="32">Traefik 文件接口</text><rect x="48" y="790" width="984" height="66" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="540" y="834" text-anchor="middle" fill="#b91c1c" font-size="32" font-weight="700">面板不要裸奔公网，部署权限按 root 级别授权</text></svg>