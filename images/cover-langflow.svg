<svg width="900" height="383" viewBox="0 0 900 383" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#2a2a55" stroke-width="1" opacity="0.35">
    <line x1="0" y1="64" x2="900" y2="64"/>
    <line x1="0" y1="128" x2="900" y2="128"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="256" x2="900" y2="256"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="750" y1="0" x2="750" y2="383"/>
  </g>

  <!-- top/bottom bars -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topbar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#topbar)"/>

  <!-- tag box -->
  <rect x="48" y="42" width="250" height="34" rx="6" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="64" y="65" font-size="16" fill="#c4b5fd" font-weight="bold">AI 行业观察 · 开源平台</text>

  <!-- year badge -->
  <circle cx="838" cy="58" r="26" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="838" y="67" font-size="24" fill="#38bdf8" font-weight="bold" text-anchor="middle">26</text>

  <!-- title -->
  <text x="48" y="150" font-size="40" fill="#ffffff" font-weight="bold">Langflow 全解析</text>
  <text x="48" y="192" font-size="20" fill="url(#sub)" font-weight="bold">能力 · 应用场景 · 生产与安全代价</text>

  <!-- highlight lines -->
  <text x="48" y="240" font-size="14" fill="#a78bfa">◆ 15 万 Star，从两天 6000 行代码到并入 IBM watsonx</text>
  <text x="48" y="266" font-size="14" fill="#38bdf8">◆ flow 即 API/MCP 工具，可视化 + 全代码双模式</text>
  <text x="48" y="292" font-size="14" fill="#f87171">◆ 一个 CVSS 9.8 漏洞，让公网实例被批量入侵</text>

  <!-- right concept: node graph -->
  <g opacity="0.9">
    <circle cx="690" cy="150" r="14" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="770" cy="120" r="14" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="770" cy="185" r="14" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="845" cy="150" r="14" fill="none" stroke="#34d399" stroke-width="2"/>
    <line x1="704" y1="150" x2="756" y2="123" stroke="#4b4b7a" stroke-width="2"/>
    <line x1="704" y1="150" x2="756" y2="182" stroke="#4b4b7a" stroke-width="2"/>
    <line x1="784" y1="120" x2="831" y2="147" stroke="#4b4b7a" stroke-width="2"/>
    <line x1="784" y1="185" x2="831" y2="153" stroke="#4b4b7a" stroke-width="2"/>
  </g>

  <!-- tags pills -->
  <g font-size="12">
    <rect x="48" y="316" width="86" height="26" rx="13" fill="none" stroke="#6d28d9" stroke-width="1.2"/>
    <text x="91" y="333" fill="#c4b5fd" text-anchor="middle">AI Agent</text>
    <rect x="144" y="316" width="70" height="26" rx="13" fill="none" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="179" y="333" fill="#93c5fd" text-anchor="middle">低代码</text>
    <rect x="224" y="316" width="60" height="26" rx="13" fill="none" stroke="#0e7490" stroke-width="1.2"/>
    <text x="254" y="333" fill="#67e8f9" text-anchor="middle">RAG</text>
    <rect x="294" y="316" width="60" height="26" rx="13" fill="none" stroke="#15803d" stroke-width="1.2"/>
    <text x="324" y="333" fill="#86efac" text-anchor="middle">MCP</text>
  </g>

  <!-- watermark -->
  <text x="852" y="336" font-size="12" fill="#4b4b7a" text-anchor="end">AI 行业观察</text>
</svg>
