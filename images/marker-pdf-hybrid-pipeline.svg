<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" width="1080" height="860">
  <rect width="1080" height="860" fill="#ffffff"/>

  <text x="60" y="76" font-size="58" font-weight="bold" fill="#111827">Marker 混合流水线：按页智能路由</text>
  <text x="60" y="128" font-size="34" fill="#4b5563">先判断页面质量与复杂度，再决定用 CPU 小模型还是 GPU VLM</text>

  <!-- Input -->
  <rect x="60" y="176" width="220" height="96" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="222" font-size="40" font-weight="bold" fill="#1d4ed8" text-anchor="middle">文档输入</text>
  <text x="170" y="256" font-size="30" fill="#4b5563" text-anchor="middle">PDF · 图片 · Office</text>

  <!-- Step 1 -->
  <rect x="360" y="176" width="250" height="96" rx="16" fill="#f0fdfa" stroke="#0e7490" stroke-width="2"/>
  <text x="485" y="222" font-size="38" font-weight="bold" fill="#0e7490" text-anchor="middle">pdftext 提取</text>
  <text x="485" y="256" font-size="30" fill="#4b5563" text-anchor="middle">校验文本层质量</text>

  <!-- Step 2 -->
  <rect x="690" y="176" width="330" height="96" rx="16" fill="#f0fdfa" stroke="#0e7490" stroke-width="2"/>
  <text x="855" y="222" font-size="38" font-weight="bold" fill="#0e7490" text-anchor="middle">布局与阅读顺序</text>
  <text x="855" y="256" font-size="30" fill="#4b5563" text-anchor="middle">判断每页复杂度</text>

  <line x1="280" y1="224" x2="360" y2="224" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="360,224 350,218 350,230" fill="#94a3b8"/>
  <line x1="610" y1="224" x2="690" y2="224" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="690,224 680,218 680,230" fill="#94a3b8"/>

  <!-- Decision label -->
  <text x="60" y="330" font-size="34" fill="#6b7280">分流：干净页走左侧，复杂页走右侧</text>

  <!-- Branch CPU -->
  <rect x="60" y="364" width="470" height="200" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <rect x="84" y="388" width="150" height="34" rx="10" fill="#15803d"/>
  <text x="159" y="413" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">CPU 路径</text>
  <text x="84" y="462" font-size="34" font-weight="bold" fill="#15803d">Indra ONNX 小模型</text>
  <text x="84" y="504" font-size="30" fill="#4b5563">干净印刷体正文</text>
  <text x="84" y="540" font-size="30" fill="#4b5563">数字表格 · 阅读顺序</text>

  <!-- Branch GPU -->
  <rect x="550" y="364" width="470" height="200" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <rect x="574" y="388" width="150" height="34" rx="10" fill="#b91c1c"/>
  <text x="649" y="413" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU 路径</text>
  <text x="574" y="462" font-size="34" font-weight="bold" fill="#b91c1c">Surya 2.5 VLM</text>
  <text x="574" y="504" font-size="30" fill="#4b5563">公式 · 复杂表格 · CJK</text>
  <text x="574" y="540" font-size="30" fill="#4b5563">扫描件 · 乱码页</text>

  <line x1="800" y1="272" x2="800" y2="330" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8"/>
  <line x1="800" y1="330" x2="785" y2="364" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8"/>
  <line x1="480" y1="272" x2="480" y2="330" stroke="#15803d" stroke-width="3" stroke-dasharray="8"/>
  <line x1="480" y1="330" x2="295" y2="364" stroke="#15803d" stroke-width="3" stroke-dasharray="8"/>

  <!-- LLM optional -->
  <rect x="60" y="604" width="960" height="90" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="90" y="644" font-size="34" font-weight="bold" fill="#6d28d9">可选：--use_llm 二次修正</text>
  <text x="90" y="680" font-size="30" fill="#4b5563">跨页表格合并 · 行内公式 · 表单取值（Gemini / Claude / Ollama 等）</text>

  <line x1="295" y1="564" x2="295" y2="604" stroke="#6d28d9" stroke-width="3" stroke-dasharray="8"/>
  <line x1="785" y1="564" x2="785" y2="604" stroke="#6d28d9" stroke-width="3" stroke-dasharray="8"/>

  <!-- Output -->
  <rect x="60" y="730" width="960" height="90" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="90" y="770" font-size="34" font-weight="bold" fill="#1d4ed8">输出：Markdown · JSON · HTML · Chunks</text>
  <text x="90" y="806" font-size="30" fill="#4b5563">合并 block 并做全文后处理，元数据含目录与每页统计</text>

  <line x1="540" y1="694" x2="540" y2="730" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="540,730 530,720 550,720" fill="#1d4ed8"/>
</svg>
