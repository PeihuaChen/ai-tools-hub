<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" width="1080" height="860">
  <rect width="1080" height="860" fill="#ffffff"/>

  <text x="50" y="76" font-size="58" font-weight="bold" fill="#111827">Marker 混合流水线：按页智能路由</text>
  <text x="50" y="128" font-size="34" fill="#4b5563">先判断页面质量与复杂度，再决定用 CPU 小模型还是 GPU VLM</text>

  <!-- Input -->
  <rect x="50" y="176" width="302" height="96" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="201" y="222" font-size="40" font-weight="bold" fill="#1d4ed8" text-anchor="middle">文档输入</text>
  <text x="201" y="256" font-size="30" fill="#4b5563" text-anchor="middle">PDF · 图片 · Office</text>

  <!-- Step 1 -->
  <rect x="396" y="176" width="276" height="96" rx="16" fill="#f0fdfa" stroke="#0e7490" stroke-width="2"/>
  <text x="534" y="222" font-size="38" font-weight="bold" fill="#0e7490" text-anchor="middle">pdftext 提取</text>
  <text x="534" y="256" font-size="30" fill="#4b5563" text-anchor="middle">校验文本层质量</text>

  <!-- Step 2 -->
  <rect x="716" y="176" width="314" height="96" rx="16" fill="#f0fdfa" stroke="#0e7490" stroke-width="2"/>
  <text x="873" y="222" font-size="38" font-weight="bold" fill="#0e7490" text-anchor="middle">布局与阅读顺序</text>
  <text x="873" y="256" font-size="30" fill="#4b5563" text-anchor="middle">判断每页复杂度</text>

  <line x1="352" y1="224" x2="386" y2="224" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="396,224 386,218 386,230" fill="#94a3b8"/>
  <line x1="672" y1="224" x2="706" y2="224" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="716,224 706,218 706,230" fill="#94a3b8"/>

  <!-- Branch CPU -->
  <rect x="50" y="364" width="470" height="200" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <rect x="74" y="386" width="180" height="40" rx="10" fill="#15803d"/>
  <text x="164" y="417" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">CPU 路径</text>
  <text x="74" y="466" font-size="34" font-weight="bold" fill="#15803d">Indra ONNX 小模型</text>
  <text x="74" y="506" font-size="30" fill="#4b5563">干净印刷体正文</text>
  <text x="74" y="542" font-size="30" fill="#4b5563">数字表格 · 阅读顺序</text>

  <!-- Branch GPU -->
  <rect x="560" y="364" width="470" height="200" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <rect x="584" y="386" width="180" height="40" rx="10" fill="#b91c1c"/>
  <text x="674" y="417" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU 路径</text>
  <text x="584" y="466" font-size="34" font-weight="bold" fill="#b91c1c">Surya 2.5 VLM</text>
  <text x="584" y="506" font-size="30" fill="#4b5563">公式 · 复杂表格 · CJK</text>
  <text x="584" y="542" font-size="30" fill="#4b5563">扫描件 · 乱码页</text>

  <!-- 分流虚线：直角折线绕开文字，旁注短标签 -->
  <polyline points="534,272 534,302 285,302 285,364" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="8"/>
  <polyline points="873,272 873,302 795,302 795,364" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8"/>
  <text x="303" y="345" font-size="30" fill="#15803d">干净页</text>
  <text x="777" y="345" font-size="30" fill="#b91c1c" text-anchor="end">复杂页</text>

  <!-- LLM optional -->
  <rect x="50" y="604" width="980" height="90" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="80" y="644" font-size="34" font-weight="bold" fill="#6d28d9">可选：--use_llm 二次修正</text>
  <text x="80" y="680" font-size="30" fill="#4b5563">跨页表格合并 · 行内公式 · 表单取值（Gemini/Claude/Ollama 等）</text>

  <line x1="285" y1="564" x2="285" y2="604" stroke="#6d28d9" stroke-width="3" stroke-dasharray="8"/>
  <line x1="795" y1="564" x2="795" y2="604" stroke="#6d28d9" stroke-width="3" stroke-dasharray="8"/>

  <!-- Output -->
  <rect x="50" y="730" width="980" height="90" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80" y="770" font-size="34" font-weight="bold" fill="#1d4ed8">输出：Markdown · JSON · HTML · Chunks</text>
  <text x="80" y="806" font-size="30" fill="#4b5563">合并 block 并做全文后处理，元数据含目录与每页统计</text>

  <line x1="540" y1="694" x2="540" y2="730" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="540,730 530,720 550,720" fill="#1d4ed8"/>
</svg>
