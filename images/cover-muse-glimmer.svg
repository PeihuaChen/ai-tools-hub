<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="55%" stop-color="#7c9cff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0 L0 0 0 45" fill="none" stroke="#2a2a55" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>

  <!-- top bar -->
  <rect x="0" y="0" width="300" height="4" fill="#4fc3f7"/>
  <rect x="300" y="0" width="300" height="4" fill="#7c9cff"/>
  <rect x="600" y="0" width="300" height="4" fill="#c084fc"/>
  <!-- bottom bar -->
  <rect x="0" y="379" width="360" height="4" fill="#c084fc"/>
  <rect x="360" y="379" width="270" height="4" fill="#f59e0b"/>
  <rect x="630" y="379" width="270" height="4" fill="#4fc3f7"/>

  <!-- tag box -->
  <rect x="46" y="34" width="238" height="28" rx="6" fill="none" stroke="#4fc3f7" stroke-width="1.4"/>
  <text x="60" y="53" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#4fc3f7">AI 行业观察 · 开源模型战局</text>

  <!-- year badge -->
  <circle cx="836" cy="48" r="24" fill="none" stroke="#c084fc" stroke-width="1.6"/>
  <text x="836" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#c084fc">26</text>

  <!-- title -->
  <text x="46" y="112" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">扎克伯格公开为“蒸馏”辩护</text>
  <text x="46" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold" fill="url(#sub)">Meta 开源 30B Agent 模型背后的三场战争</text>

  <!-- highlights -->
  <text x="46" y="188" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#4fc3f7">▸ Llama 4 之后首个开放权重：Muse Glimmer 30B，Apache 2.0</text>
  <text x="46" y="212" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#7dd3a0">▸ 16.76GB 主文件塞进 24GB 显卡，DFlash 投机解码提速 3.1×</text>
  <text x="46" y="236" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#f0b45f">▸ MCP Atlas 75.5 领先，OSWorld 65.9 落后 Qwen 9.7 分</text>

  <!-- pills -->
  <g font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">
    <rect x="46" y="262" width="88" height="26" rx="13" fill="none" stroke="#4fc3f7" stroke-width="1.2"/>
    <text x="90" y="279" text-anchor="middle" fill="#9fe3ff">Muse Glimmer</text>

    <rect x="144" y="262" width="76" height="26" rx="13" fill="none" stroke="#7c9cff" stroke-width="1.2"/>
    <text x="182" y="279" text-anchor="middle" fill="#bcc9ff">开放权重</text>

    <rect x="230" y="262" width="76" height="26" rx="13" fill="none" stroke="#7dd3a0" stroke-width="1.2"/>
    <text x="268" y="279" text-anchor="middle" fill="#a9e8c4">本地 Agent</text>

    <rect x="316" y="262" width="64" height="26" rx="13" fill="none" stroke="#f0b45f" stroke-width="1.2"/>
    <text x="348" y="279" text-anchor="middle" fill="#f7d3a0">模型蒸馏</text>

    <rect x="390" y="262" width="64" height="26" rx="13" fill="none" stroke="#c084fc" stroke-width="1.2"/>
    <text x="422" y="279" text-anchor="middle" fill="#ddb8ff">投机解码</text>
  </g>

  <!-- right concept diagram: teacher -> student -> device -->
  <g>
    <rect x="612" y="104" width="120" height="40" rx="8" fill="none" stroke="#c084fc" stroke-width="1.4"/>
    <text x="672" y="129" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#ddb8ff">Muse Spark 教师</text>

    <line x1="672" y1="144" x2="672" y2="178" stroke="#7c9cff" stroke-width="1.4" stroke-dasharray="4"/>
    <path d="M666 172 L672 180 L678 172 Z" fill="#7c9cff"/>
    <text x="686" y="166" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#7c9cff">蒸馏</text>

    <rect x="612" y="180" width="120" height="40" rx="8" fill="none" stroke="#4fc3f7" stroke-width="1.6"/>
    <text x="672" y="205" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#9fe3ff">Glimmer 30B</text>

    <line x1="672" y1="220" x2="672" y2="252" stroke="#7dd3a0" stroke-width="1.4" stroke-dasharray="4"/>
    <path d="M666 246 L672 254 L678 246 Z" fill="#7dd3a0"/>
    <text x="686" y="242" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#7dd3a0">4-bit</text>

    <rect x="612" y="254" width="120" height="40" rx="8" fill="none" stroke="#7dd3a0" stroke-width="1.4"/>
    <text x="672" y="279" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a9e8c4">24GB 单卡本地</text>

    <rect x="762" y="180" width="86" height="40" rx="8" fill="none" stroke="#f0b45f" stroke-width="1.2"/>
    <text x="805" y="197" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#f7d3a0">DFlash</text>
    <text x="805" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f7d3a0">3.1×</text>
    <line x1="732" y1="200" x2="760" y2="200" stroke="#f0b45f" stroke-width="1.2"/>
  </g>

  <!-- divider + footer -->
  <line x1="46" y1="312" x2="854" y2="312" stroke="#2f2f5e" stroke-width="1"/>
  <text x="46" y="338" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8a8ab5">架构与显存账 · 基准方法论的硬伤 · 蒸馏合法性与 6000 亿美元的悬念</text>
  <text x="854" y="338" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#5f5f8c">公众号：AI 行业观察</text>
</svg>
