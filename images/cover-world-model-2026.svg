<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1e"/>
      <stop offset="100%" style="stop-color:#161638"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="33%" style="stop-color:#8b5cf6"/>
      <stop offset="66%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="bottomBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="33%" style="stop-color:#ec4899"/>
      <stop offset="66%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e1e4a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)" opacity="0.4"/>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#topBar)"/>
  <!-- Bottom gradient bar -->
  <rect x="0" y="379" width="900" height="4" fill="url(#bottomBar)"/>

  <!-- Top-left label box -->
  <rect x="30" y="24" width="240" height="28" rx="4" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.8"/>
  <text x="42" y="43" font-family="sans-serif" font-size="12" fill="#a78bfa" font-weight="500">AI 前沿洞察 · World Model</text>

  <!-- Year badge top-right -->
  <rect x="838" y="20" width="40" height="40" rx="6" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
  <text x="846" y="47" font-family="sans-serif" font-size="18" fill="#f59e0b" font-weight="bold">26</text>

  <!-- Main title -->
  <text x="30" y="100" font-family="sans-serif" font-size="29" fill="#ffffff" font-weight="bold">世界模型 2026 全景</text>
  <text x="30" y="138" font-family="sans-serif" font-size="29" fill="#ffffff" font-weight="bold">从 30 亿美元豪赌到四大技术路线深度拆解</text>

  <!-- Subtitle -->
  <text x="30" y="172" font-family="sans-serif" font-size="17" fill="url(#subtitleGrad)">LLM 之后，物理世界理解的下一场军备竞赛</text>

  <!-- Key highlights -->
  <text x="30" y="210" font-family="sans-serif" font-size="12.5" fill="#60a5fa">◆ 2026H1 融资 $30亿+ | AMI Labs $10.3亿种子轮（欧洲史上最大）</text>
  <text x="30" y="232" font-family="sans-serif" font-size="12.5" fill="#34d399">◆ 四大范式：自回归 / 扩散 / JEPA-潜空间 / 世界-动作耦合</text>
  <text x="30" y="254" font-family="sans-serif" font-size="12.5" fill="#fbbf24">◆ 核心玩家：AMI Labs / World Labs / DeepMind / NVIDIA / 小米 / 腾讯</text>

  <!-- Tags -->
  <rect x="30" y="280" width="68" height="22" rx="11" fill="none" stroke="#6366f1" stroke-width="1"/>
  <text x="44" y="295" font-family="sans-serif" font-size="10.5" fill="#a5b4fc">世界模型</text>

  <rect x="108" y="280" width="52" height="22" rx="11" fill="none" stroke="#8b5cf6" stroke-width="1"/>
  <text x="120" y="295" font-family="sans-serif" font-size="10.5" fill="#c4b5fd">JEPA</text>

  <rect x="170" y="280" width="62" height="22" rx="11" fill="none" stroke="#ec4899" stroke-width="1"/>
  <text x="181" y="295" font-family="sans-serif" font-size="10.5" fill="#f9a8d4">Genie 3</text>

  <rect x="242" y="280" width="68" height="22" rx="11" fill="none" stroke="#f59e0b" stroke-width="1"/>
  <text x="254" y="295" font-family="sans-serif" font-size="10.5" fill="#fde68a">自动驾驶</text>

  <rect x="320" y="280" width="58" height="22" rx="11" fill="none" stroke="#34d399" stroke-width="1"/>
  <text x="333" y="295" font-family="sans-serif" font-size="10.5" fill="#6ee7b7">物理AI</text>

  <rect x="388" y="280" width="46" height="22" rx="11" fill="none" stroke="#60a5fa" stroke-width="1"/>
  <text x="400" y="295" font-family="sans-serif" font-size="10.5" fill="#93c5fd">AGI</text>

  <!-- Right side: conceptual diagram -->
  <!-- World model loop diagram -->
  <circle cx="700" cy="140" r="45" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
  <circle cx="700" cy="140" r="30" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
  <text x="680" y="144" font-family="sans-serif" font-size="10" fill="#c4b5fd">State</text>

  <!-- Action arrow -->
  <line x1="745" y1="140" x2="800" y2="140" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
  <polygon points="800,136 808,140 800,144" fill="#f59e0b" opacity="0.7"/>
  <text x="755" y="130" font-family="sans-serif" font-size="9" fill="#fde68a">Action</text>

  <!-- Next state -->
  <circle cx="840" cy="140" r="20" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.6"/>
  <text x="827" y="144" font-family="sans-serif" font-size="9" fill="#f9a8d4">S(t+1)</text>

  <!-- Feedback loop -->
  <path d="M 840 160 Q 840 200 770 200 Q 700 200 700 185" fill="none" stroke="#34d399" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>
  <polygon points="697,185 700,177 703,185" fill="#34d399" opacity="0.5"/>
  <text x="745" y="215" font-family="sans-serif" font-size="9" fill="#6ee7b7">Predict</text>

  <!-- Four paradigm boxes -->
  <rect x="620" y="240" width="120" height="18" rx="3" fill="#1e1e4a" stroke="#6366f1" stroke-width="0.8"/>
  <text x="635" y="253" font-family="sans-serif" font-size="9" fill="#a5b4fc">Autoregressive</text>

  <rect x="750" y="240" width="120" height="18" rx="3" fill="#1e1e4a" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="780" y="253" font-family="sans-serif" font-size="9" fill="#c4b5fd">Diffusion</text>

  <rect x="620" y="266" width="120" height="18" rx="3" fill="#1e1e4a" stroke="#ec4899" stroke-width="0.8"/>
  <text x="647" y="279" font-family="sans-serif" font-size="9" fill="#f9a8d4">JEPA-Latent</text>

  <rect x="750" y="266" width="120" height="18" rx="3" fill="#1e1e4a" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="765" y="279" font-family="sans-serif" font-size="9" fill="#fde68a">World-Action</text>

  <!-- Bottom section -->
  <line x1="30" y="330" x2="870" y2="330" stroke="#2e2e5a" stroke-width="0.5"/>
  <text x="30" y="350" font-family="sans-serif" font-size="10.5" fill="#64748b">目录：定义与范式 → 四大技术路线 → 核心玩家 → 落地场景 → 未解难题 → 展望</text>

  <!-- Watermark -->
  <text x="30" y="372" font-family="sans-serif" font-size="9" fill="#4a5568" opacity="0.6">VXI · AI 前沿洞察</text>
</svg>
