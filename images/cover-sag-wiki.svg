<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#161638"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="0.34" stop-color="#22d3ee"/>
      <stop offset="0.68" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="4" fill="url(#bar)"/>
  <rect x="0" y="379" width="900" height="4" fill="url(#bar)"/>

  <rect x="40" y="28" width="250" height="30" rx="6" fill="#1e293b" stroke="#4f7cff" stroke-width="1"/>
  <text x="56" y="48" font-size="13" fill="#bfdbfe">AI 行业观察 · 本地知识库</text>

  <g>
    <rect x="808" y="24" width="62" height="62" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="839" y="68" font-size="30" font-weight="bold" fill="#e9d5ff" text-anchor="middle">26</text>
  </g>

  <text x="40" y="112" font-size="31" font-weight="bold" fill="#f8fafc">三条知识库路线</text>
  <text x="40" y="146" font-size="18" fill="url(#sub)">SAG-Wiki vs 向量 RAG vs LLM Wiki</text>

  <text x="40" y="184" font-size="13" fill="#8be9fd">14 MB 安装包 · 2.36 秒建索引</text>
  <text x="40" y="208" font-size="13" fill="#a7f3d0">Recall@10 86.62% · 建库零模型调用</text>
  <text x="40" y="232" font-size="13" fill="#fcd34d">引用点回原文 · 文件改了只增量更新</text>

  <g font-size="12">
    <rect x="40" y="258" width="58" height="26" rx="13" fill="#1e293b" stroke="#4f7cff" stroke-width="1"/>
    <text x="69" y="276" fill="#bfdbfe" text-anchor="middle">SAG2</text>
    <rect x="106" y="258" width="108" height="26" rx="13" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
    <text x="160" y="276" fill="#a5f3fc" text-anchor="middle">SQLite FTS5</text>
    <rect x="222" y="258" width="60" height="26" rx="13" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="252" y="276" fill="#e9d5ff" text-anchor="middle">BM25</text>
    <rect x="290" y="258" width="52" height="26" rx="13" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="316" y="276" fill="#fde68a" text-anchor="middle">Jev</text>
    <rect x="350" y="258" width="70" height="26" rx="13" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="385" y="276" fill="#a7f3d0" text-anchor="middle">可溯源</text>
    <rect x="428" y="258" width="88" height="26" rx="13" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
    <text x="472" y="276" fill="#fbcfe8" text-anchor="middle">Agent CLI</text>
  </g>

  <g>
    <rect x="560" y="96" width="300" height="192" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <line x1="710" y1="126" x2="710" y2="266" stroke="#94a3b8" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6"/>
    <text x="620" y="122" font-size="11" fill="#94a3b8" text-anchor="middle">建库阶段</text>
    <text x="790" y="122" font-size="11" fill="#94a3b8" text-anchor="middle">查询阶段</text>

    <text x="575" y="160" font-size="11" fill="#cbd5e1">向量 RAG</text>
    <line x1="655" y1="156" x2="845" y2="156" stroke="#475569" stroke-width="2"/>
    <circle cx="672" cy="156" r="7" fill="#4f7cff"/>

    <text x="575" y="205" font-size="11" fill="#cbd5e1">LLM Wiki</text>
    <line x1="655" y1="201" x2="845" y2="201" stroke="#475569" stroke-width="2"/>
    <circle cx="672" cy="201" r="7" fill="#a855f7"/>

    <text x="575" y="250" font-size="11" fill="#cbd5e1">SAG-Wiki</text>
    <line x1="655" y1="246" x2="845" y2="246" stroke="#475569" stroke-width="2"/>
    <circle cx="828" cy="246" r="7" fill="#22d3ee"/>

    <text x="710" y="278" font-size="11" fill="#64748b" text-anchor="middle">圆点 = 理解文档的时刻</text>
  </g>

  <line x1="40" y1="330" x2="860" y2="330" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
  <text x="40" y="354" font-size="12" fill="#94a3b8">路线对比 · 成本结构 · 溯源机制 · 选型边界</text>
  <text x="860" y="354" font-size="12" fill="#94a3b8" text-anchor="end">AI知识宇宙</text>
