<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#ffffff"/>

  <text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">K2 Horizon 六模型舰队：从边缘到企业</text>
  <text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#6b7280">同源架构 · 统一词表与接口 · 可在不同尺寸间平滑迁移（0.9B 用更小词表）</text>

  <!-- baseline arrow -->
  <line x1="60" y1="560" x2="1140" y2="560" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M1140 560 l-10 -5 l0 10 z" fill="#94a3b8"/>
  <text x="60" y="590" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">边缘 / 端侧</text>
  <text x="1140" y="590" text-anchor="end" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">本地 / 企业</text>

  <!-- Card template: 6 cards -->
  <!-- 0.9B -->
  <g transform="translate(60,110)">
    <rect x="0" y="330" width="160" height="110" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="80" y="365" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">0.9B</text>
    <text x="80" y="388" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#1e40af">Dense · 128K</text>
    <text x="80" y="410" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#4b5563">手表 / 眼镜</text>
    <text x="80" y="428" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280">极端受限设备</text>
  </g>

  <!-- 3.7B -->
  <g transform="translate(240,110)">
    <rect x="0" y="300" width="160" height="140" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
    <text x="80" y="335" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0e7490">3.7B</text>
    <text x="80" y="358" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#155e75">Dense · 512K</text>
    <text x="80" y="382" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#4b5563">手机端</text>
    <text x="80" y="402" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280">微调友好</text>
    <text x="80" y="424" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280">4B 以下推理最强</text>
  </g>

  <!-- 7B -->
  <g transform="translate(420,110)">
    <rect x="0" y="270" width="160" height="170" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="80" y="305" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d">7B</text>
    <text x="80" y="328" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#166534">Dense · 512K</text>
    <text x="80" y="352" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#4b5563">手机可跑</text>
    <text x="80" y="372" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280">软件工程 / 深度研究</text>
    <text x="80" y="394" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280">10B 以下最强</text>
    <text x="80" y="418" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#15803d" font-weight="600">SWE-bench 70.6</text>
  </g>

  <!-- 32B -->
  <g transform="translate(600,110)">
    <rect x="0" y="230" width="160" height="210" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
    <text x="80" y="265" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#b45309">32B</text>
    <text x="80" y="288" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#92400e">Dense · 512K</text>
    <text x="80" y="312" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#4b5563">本地工作站</text>
    <text x="80" y="332" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280">私有服务器</text>
    <text x="80" y="356" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280">40B 以下最强 dense</text>
  </g>

  <!-- 36B-A4B -->
  <g transform="translate(780,110)">
    <rect x="0" y="200" width="160" height="240" rx="10" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="80" y="235" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">36B-A4B</text>
    <text x="80" y="258" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#5b21b6">MoE + MoVA</text>
    <text x="80" y="280" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#4b5563">激活约 4B</text>
    <text x="80" y="302" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280">性能逼近 32B dense</text>
    <text x="80" y="324" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#6d28d9" font-weight="600">稀疏注意力新架构</text>
  </g>

  <!-- 375B-A23B -->
  <g transform="translate(960,110)">
    <rect x="0" y="150" width="180" height="290" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="90" y="185" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">375B-A23B</text>
    <text x="90" y="208" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#991b1b">MoE · 512K · 激活 23B</text>
    <text x="90" y="232" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="600">企业旗舰</text>
    <text x="90" y="254" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280">复杂推理 / 长程 agentic</text>
    <text x="90" y="276" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280">对标顶级开源 MoE</text>
    <text x="90" y="300" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#b91c1c" font-weight="600">GPQA 87.3 · TB2.1 70.2</text>
  </g>

  <!-- routing note -->
  <g transform="translate(60,600)">
    <rect x="0" y="0" width="1080" height="30" rx="8" fill="#f1f5f9" stroke="#d9e2ec" stroke-width="1"/>
    <text x="16" y="20" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">动态模型路由：在最小模型上原型，按任务成本无缝切换到旗舰 —— 不改架构、不改工作流</text>
  </g>
</svg>
