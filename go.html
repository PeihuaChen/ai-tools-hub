<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .loading {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .text { font-size: 18px; font-weight: 500; }
        .subtext { font-size: 14px; opacity: 0.8; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <div class="text">正在跳转到外部链接...</div>
        <div class="subtext">如果页面没有自动跳转，请<a href="#" id="manual-link" style="color: white; text-decoration: underline;">点击这里</a></div>
    </div>
    <script>
        // 获取 URL 参数
        const params = new URLSearchParams(window.location.search);
        const targetUrl = params.get('url');
        const platform = params.get('platform') || 'unknown';
        const article = params.get('article') || 'unknown';
        
        // 记录点击（可以发送到分析服务）
        if (window.localStorage) {
            const clicks = JSON.parse(localStorage.getItem('affiliate_clicks') || '[]');
            clicks.push({
                url: targetUrl,
                platform: platform,
                article: article,
                timestamp: new Date().toISOString()
            });
            localStorage.setItem('affiliate_clicks', JSON.stringify(clicks));
        }
        
        // 自动跳转
        if (targetUrl) {
            document.getElementById('manual-link').href = targetUrl;
            // 延迟 1 秒后跳转，让用户看到加载动画
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1000);
        } else {
            document.querySelector('.text').textContent = '错误：缺少目标 URL 参数';
            document.querySelector('.spinner').style.display = 'none';
        }
    </script>
</body>
</html>
